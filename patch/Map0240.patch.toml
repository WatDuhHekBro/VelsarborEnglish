[[dialogue]]
event = 122
page = 12
command = 34
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Ja natürlich.\. Kaum passiert 
etwas Böses jenseits der Grenze, ist 
es der farenische Adelsbund.
'''
patched = '''
\c[5]\n[5]\c[0]: Oh of course.\. As soon as
something bad happens across the
border, it's the Farenian Aristocracy.
'''

[[dialogue]]
event = 122
page = 12
command = 38
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Es scheint, als habe sich 
das Vertrauen zwischen uns 
Nachbarländern seit dem Krieg nicht 
merkbar verbessert.
'''
patched = '''
\c[5]\n[5]\c[0]: It seems that the trust
between us neighboring countries
hasn't improved noticeably since
the war.
'''

[[dialogue]]
event = 122
page = 12
command = 43
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Für das Protokoll:\. Ich weiß 
nichts von irgendeiner militärischen 
Organisation im Untergrund.\. Für wie 
verrückt halten die uns bitte?
'''
patched = '''
\c[5]\n[5]\c[0]: For the record,\. I don't know
anything about any underground
military organization.\. How
crazy do they think we are?
'''

[[dialogue]]
event = 122
page = 12
command = 47
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Der Krieg ist uns eine Lehre 
gewesen.\. Wir würden es nicht wagen, 
uns noch einmal mit Brigantia 
anzulegen.
'''
patched = '''
\c[5]\n[5]\c[0]: The war was a lesson to us.\.
We wouldn't dare to mess with
Brigantia again.
'''

[[dialogue]]
event = 122
page = 12
command = 56
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ist das so?\. Wir haben diese 
Truppe allerdings mit unseren 
eigenen Augen gesehen!\. Wir waren 
Gefangene von ihnen!
'''
patched = '''
\c[2]\n[2]\c[0]: Is that so?\. However, we saw
this group with our own eyes!\.
We were their prisoners!
'''

[[dialogue]]
event = 122
page = 12
command = 61
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Ja, das will ich auch nicht 
anzweifeln, aber der farenische 
Adelsbund weiß nichts davon.
'''
patched = '''
\c[5]\n[5]\c[0]: Yes, I don't want to doubt
that either, but the Farenian
Aristocracy knows nothing about it.
'''

[[dialogue]]
event = 122
page = 12
command = 65
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Ich halt es für eher 
denkbar, dass diese Truppe für 
Brigantia selber arbeitet.
'''
patched = '''
\c[5]\n[5]\c[0]: I think it'd be more likely
that this group works for Brigantia
itself.
'''

[[dialogue]]
event = 122
page = 12
command = 72
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Wie bitte?\. Was für einen Sinn 
soll das denn ergeben?
'''
patched = '''
\c[2]\n[2]\c[0]: Wait what?\. How does that make
sense?
'''

[[dialogue]]
event = 122
page = 12
command = 77
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Ganz einfach.\. Brigantia hat 
ja diese ach so demokratische 
Regierungsform, \.euren Rat. 
'''
patched = '''
\c[5]\n[5]\c[0]: It's simple really.\. Brigantia
has this oh so democratic form of
government,\. their council.
'''

[[dialogue]]
event = 122
page = 12
command = 82
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Nun, angenommen, wir haben 
ein paar Ratsmitglieder, die daran 
interessiert sind, noch etwas mehr 
von Korzojeno einzunehmen.
'''
patched = '''
\c[5]\n[5]\c[0]: And well, suppose we have a
few council members who are interested
in taking some more from Korzojeno.
'''

[[dialogue]]
event = 122
page = 12
command = 86
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Dann haben sie aber das 
Problem, das die Mehrheit der 
Ratsmitglieder eher für eine 
friedliche Koexistenz ist. 
'''
patched = '''
\c[5]\n[5]\c[0]: But then you have a problem.
The majority of the council members
are in support of a peaceful
coexistence.
'''

[[dialogue]]
event = 122
page = 12
command = 91
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Also wie bekommt man eine 
offizielle Erlaubnis in Korzojeno 
einzumarschieren und richtig 
abzustauben?\. Nun?
'''
patched = '''
\c[5]\n[5]\c[0]: So how do you get official
permission to march into Korzojeno
and snatch more of whatever's left?\.
Well?
'''

[[dialogue]]
event = 122
page = 12
command = 100
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: ... Man täuscht vor, dass 
Korzojeno eine Bedrohung darstellt, 
indem man so eine Truppe bildet...
'''
patched = '''
\c[1]\n[1]\c[0]: You pretend that Korzojeno
poses a threat by forming such a
force...
'''

[[dialogue]]
event = 122
page = 12
command = 105
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Richtig!\. Ein kluges Köpfchen 
haben wir hier.
'''
patched = '''
\c[5]\n[5]\c[0]: Bingo!\. This one's clever.
'''

[[dialogue]]
event = 122
page = 12
command = 109
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: W...\. Was zum Henker!\. Wieso 
sollte die Regierung so ein falsches 
Spiel treiben?
'''
patched = '''
\c[2]\n[2]\c[0]: W...\. What the hell!\. Why would
the government be involved in foul
play?
'''

[[dialogue]]
event = 122
page = 12
command = 113
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Oh, in den hohen Rängen gibt 
es viel falsches Spiel,\. glaubt mir 
das.
'''
patched = '''
\c[5]\n[5]\c[0]: Oh, there's a lot of foul play
in the upper echelon,\. trust me.
'''

[[dialogue]]
event = 122
page = 12
command = 117
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Aber wieso kommt dann bitte 
ein Ratsmitglied von Brigantia auf 
die Idee, uns wegen so einer Truppe 
einzusperren?
'''
patched = '''
\c[2]\n[2]\c[0]: But why then would a Brigantian
council member come up with the bright
idea of locking us up because of this
group?
'''

[[dialogue]]
event = 122
page = 12
command = 122
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Wenn das stimmt, was du 
sagst, ist es doch gut möglich, 
dass Herr Uroto selber in der
Sache verwickelt war!
'''
patched = '''
\c[2]\n[2]\c[0]: If what you say is true, it's
quite possible that Mr. Uroto himself
was involved in the conspiracy!
'''

[[dialogue]]
event = 122
page = 12
command = 128
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Nun, vielleicht habt ihr 
etwas gesehen, was die Sache 
auffliegen lassen würde. 
'''
patched = '''
\c[5]\n[5]\c[0]: Well, maybe you saw something
that would've compromised everything.
'''

[[dialogue]]
event = 122
page = 12
command = 131
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Irgendein Beleg, dass 
diese Truppe von Brigantia 
angeheuert ist...
'''
patched = '''
\c[5]\n[5]\c[0]: Perhaps some evidence that
this group was hired by Brigantia...
'''

[[dialogue]]
event = 122
page = 12
command = 141
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Wir haben keinen solchen 
Beleg!\. Wir haben gar nichts gesehen!\.
Nicht wahr, Kumpel?
'''
patched = '''
\c[2]\n[2]\c[0]: But we don't have that kind of
evidence!\. We didn't see anything!\.
Isn't that right Kento?
'''

[[dialogue]]
event = 122
page = 12
command = 149
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: ...Kumpel?
'''
patched = '''
\c[2]\n[2]\c[0]: Kento?
'''

[[dialogue]]
event = 122
page = 12
command = 151
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Nein...\. nicht wirklich.
'''
patched = '''
\c[1]\n[1]\c[0]: No...\. Not really.
'''

[[dialogue]]
event = 122
page = 12
command = 182
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Soko?\. Ist alles in Ordnung?
'''
patched = '''
\c[1]\n[1]\c[0]: Soko?\. Is everything ok?
'''

[[dialogue]]
event = 122
page = 12
command = 184
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Es geht schon... \.
W...\. Wer sind Sie?
'''
patched = '''
\c[13]\n[3]\c[0]: I'm okay...\. W...\. Who are you?
'''

[[dialogue]]
event = 122
page = 12
command = 189
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Moment...\. Ihr seid in 
derselben Zelle?!
'''
patched = '''
\c[2]\n[2]\c[0]: Wait...\. You're in the same
cell?!
'''

[[dialogue]]
event = 122
page = 12
command = 194
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Kyorta mein Name,\. Felcis 
Kyorta.\. Und mit welcher hübschen 
Dame hab ich hier die Ehre?
'''
patched = '''
\c[5]\n[5]\c[0]: Kiorta my name,\. Felcis Kiorta.\.
And who is the pretty lady that I have
the honor of being with here?
'''

[[dialogue]]
event = 122
page = 12
command = 201
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Noch einer von dieser Sorte...
'''
patched = '''
\c[13]\n[3]\c[0]: Another one of *those* people...
'''

[[dialogue]]
event = 122
page = 12
command = 205
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Von welcher Sorte reden Sie?
'''
patched = '''
\c[5]\n[5]\c[0]: What are "those" people you're
talking about?
'''

[[dialogue]]
event = 122
page = 12
command = 208
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ja, von welcher Sorte?\. Und 
hey,\. was war das eben mit den 
Formalitäten, Felcis?
'''
patched = '''
\c[2]\n[2]\c[0]: Yeah, what DO you mean by that?\.
And hey,\. where are your manners
anyway, Felcis?
'''

[[dialogue]]
event = 122
page = 12
command = 218
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Das kann ein langer Abend 
werden...
'''
patched = '''
\c[1]\n[1]\c[0]: It's gonna be a long night...
'''

[[dialogue]]
event = 122
page = 13
command = 28
original = '''
\c[10]Wächter:\c[0]\s[4] SOFORT ALLE RAUS AUS DEN FEDERN!\. DIE 
ARBEIT BEGINNT!
'''
patched = '''
\c[10]Guard\c[0]:\s[4] EVERYONE GET OUT OF YOUR FEATHERED BEDS
IMMEDIATELY!\. IT'S TIME TO WORK!
'''

[[dialogue]]
event = 122
page = 13
command = 36
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: ... Ah...\. Verdammt!\. Schon 
wieder raus?`
'''
patched = '''
\c[2]\n[2]\c[0]: ...Ugh...\. Damn!\. We have to get
up again?
'''

[[dialogue]]
event = 122
page = 13
command = 41
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: ...Von welchen "Federn" mag 
diese Wache bitte geredet haben? 
'''
patched = '''
\c[5]\n[5]\c[0]: What "feathers" is this guard
talking about?
'''

[[dialogue]]
event = 122
page = 13
command = 43
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Ich hab keine einzige Feder 
wahrgenommen...\. in diesem so 
genannten "Bett".
'''
patched = '''
\c[5]\n[5]\c[0]: I didn't notice a single
feather...\. in this so-called "bed".
'''

[[dialogue]]
event = 122
page = 13
command = 48
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: So...\. Aufstehen,\. jetzt,\. 
sofort.\. Und raus!
'''
patched = '''
\c[13]\n[3]\c[0]: Okay...\. Wake up,\. now,\.
immediately.\. And get up!
'''

[[dialogue]]
event = 122
page = 13
command = 56
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Ha,\. wieder geschafft.
'''
patched = '''
\c[13]\n[3]\c[0]: Ha,\. I did it again.
'''

[[dialogue]]
event = 122
page = 13
command = 67
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: K...\.Kumpel.\. Wir müssen raus.\.
Das gleiche wie vorher.
'''
patched = '''
\c[2]\n[2]\c[0]: K...\. Kento.\. We have to get up.\.
Same as before.
'''

[[dialogue]]
event = 122
page = 13
command = 70
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Gefängnis.\. Minenarbeit.
'''
patched = '''
\c[2]\n[2]\c[0]: Prison.\. Mining.
'''

[[dialogue]]
event = 122
page = 13
command = 77
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: \s[5]Och nee... 
'''
patched = '''
\c[1]\n[1]\c[0]: \s[5]Not again...
'''

[[dialogue]]
event = 122
page = 13
command = 115
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Würde es euch etwas 
ausmachen, wenn ich euch zur Mine 
begleite?\. Ich bin schließlich neu 
hier.
'''
patched = '''
\c[5]\n[5]\c[0]: Would it be alright if you
showed me the way to the mine?\.
After all, I'm new here.
'''

[[dialogue]]
event = 122
page = 13
command = 120
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Sicher kannst du mit uns 
kommen.\. Wir gehen ja sowieso alle 
denselben Weg.
'''
patched = '''
\c[13]\n[3]\c[0]: Sure, you can come with us.\.
We're all going the same way
regardless.
'''

[[dialogue]]
event = 122
page = 13
command = 124
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ja, meinetwegen...
'''
patched = '''
\c[2]\n[2]\c[0]: Yeah, for my own sake too...
'''

[[dialogue]]
event = 122
page = 13
command = 126
has_portrait = true
character = '''Cibon'''
original = '''
(\c[2]\n[2]\c[0]: Wah, eine Brille.)
'''
patched = '''
(\c[2]\n[2]\c[0]: Heh, glasses.)
'''

[[dialogue]]
event = 122
page = 13
command = 136
original = '''

Felcis tritt als Gast deiner Party bei.
'''
patched = '''

Felcis joins your party as a guest.
'''

[[dialogue]]
event = 122
page = 15
command = 53
original = '''
\c[10]Wächter\c[0]: Wag es nicht nochmal, so spät hier 
aufzukreuzen!\. Wenn wir sagen ihr sollt in die 
Zellen, dann tut ihr das auch und zwar sofort!
'''
patched = '''
\c[10]Guard\c[0]: Don't you dare show up so late again!\.
If we tell you to go to your cells, then you
do it immediately!
'''

[[dialogue]]
event = 122
page = 15
command = 64
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Du kommst etwas spät.
'''
patched = '''
\c[13]\n[3]\c[0]: You're a bit late.
'''

[[dialogue]]
event = 122
page = 15
command = 67
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Tja, ja. Dieses Gefängnis 
ist so groß und eine Zelle gleicht 
der anderen.\. Ich glaube, ich habe 
mich etwas verlaufen.
'''
patched = '''
\c[5]\n[5]\c[0]: Yeah yeah.\. This prison is so
big, I can't tell one cell from
another.\. I must've gotten lost
for a bit.
'''

[[dialogue]]
event = 122
page = 15
command = 83
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Nun, ich denke wir vier 
wissen bereits, was wir gemeinsam 
haben, oder?
'''
patched = '''
\c[5]\n[5]\c[0]: Well, I think the four of us
already know what we have in common,
right?
'''

[[dialogue]]
event = 122
page = 15
command = 88
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Was sollte ich mit dir 
gemeinsam haben?
'''
patched = '''
\c[2]\n[2]\c[0]: What do I have in common with
you?
'''

[[dialogue]]
event = 122
page = 15
command = 92
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Ich wüsste da etwas.
'''
patched = '''
\c[1]\n[1]\c[0]: I had a feeling you'd say that.
'''

[[dialogue]]
event = 122
page = 15
command = 98
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Ich rede von der Tatsache, 
dass wir vier hier alle zu Unrecht 
eingesperrt worden sind.
'''
patched = '''
\c[5]\n[5]\c[0]: I'm talking about the fact
that all four of us have been
wrongly locked up here.
'''

[[dialogue]]
event = 122
page = 15
command = 103
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Du glaubst also an unsere 
Unschuld?
'''
patched = '''
\c[13]\n[3]\c[0]: So you believe in our innocence?
'''

[[dialogue]]
event = 122
page = 15
command = 107
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Natürlich.\. Ihr vertraut mir 
doch wohl auch, oder?
'''
patched = '''
\c[5]\n[5]\c[0]: Of course.\. You trust me too,
don't you?
'''

[[dialogue]]
event = 122
page = 15
command = 113
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: ... Ja, natürlich.
'''
patched = '''
\c[13]\n[3]\c[0]: Yeah, of course we do.
'''

[[dialogue]]
event = 122
page = 15
command = 116
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Glauben hin oder her, worauf 
willst du hinaus?
'''
patched = '''
\c[2]\n[2]\c[0]: Regardless, what are you
getting at?
'''

[[dialogue]]
event = 122
page = 15
command = 120
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Wenn die werten Wächter uns 
nicht unserer Unschuld entsprechend 
behandeln wollen,\. denke ich,\. sollten 
wir dem nachhelfen.
'''
patched = '''
\c[5]\n[5]\c[0]: If those guards don't want to
treat us according to our innocence,\.
I think I have something that'd help
us.
'''

[[dialogue]]
event = 122
page = 15
command = 128
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Ich rede von einem 
Ausbruchsplan.
'''
patched = '''
\c[5]\n[5]\c[0]: I'm talking about an escape
plan.
'''

[[dialogue]]
event = 122
page = 15
command = 135
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: M...\.Meinst du das ernst?\. Wir 
sind hier immerhin in Helnovien.\. Du 
weißt doch, wie hier die 
Sicherheitsmaßnahmen sind.
'''
patched = '''
\c[13]\n[3]\c[0]: A...\. Are you serious?\. We're in
Helnovien after all.\. You know what
security measures we're up against.
'''

[[dialogue]]
event = 122
page = 15
command = 142
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Kommt bitte so nah ran wie 
möglich und redet leise.\. Wir wollen 
schließlich nicht gehört werden...
'''
patched = '''
\c[5]\n[5]\c[0]: Please come as close as
possible and speak quietly.\. We
don't want to be heard after all...
'''

[[dialogue]]
event = 122
page = 15
command = 154
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Ich kenne Helnovien, ich 
kenne dieses Gebäude sogar sehr gut. \.
Wie ihr wisst, war das hier ehemals 
Gebiet von Korzojeno.
'''
patched = '''
\c[5]\n[5]\c[0]: I know Helnovien, I know this
building all too well.\. As you know,
this was formerly in the territory
of Korzojeno.
'''

[[dialogue]]
event = 122
page = 15
command = 158
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Und das ehemalige Schloss 
von Helnovien steht schon ein gutes 
Stück länger als 10 Jahre.
'''
patched = '''
\c[5]\n[5]\c[0]: And the former castle of
Helnovien has been around for
much longer than 10 years.
'''

[[dialogue]]
event = 122
page = 15
command = 162
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Sogar die Zauberbarriere, 
die dieses Schloss so mächtig macht, 
kam noch von uns.
'''
patched = '''
\c[5]\n[5]\c[0]: Even the magic barrier that
makes this castle so powerful came
straight from us.
'''

[[dialogue]]
event = 122
page = 15
command = 166
has_portrait = true
character = '''Felcis'''
original = '''
