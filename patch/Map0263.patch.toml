[[dialogue]]
event = 79
page = 1
command = 2
original = '''
\c[10]Gefangener\c[0]: Hab ihr schon von dieser Pauamainer-
Untertage-Brüderschaft gehört?\. Das sind ganz 
gewöhnliche Gefangene, so wie ich und du!
'''
patched = '''
\c[10]Prisoner\c[0]: Have you heard of this underground
Pauamainer Brotherhood?\. They're ordinary
prisoners just like me and you!
'''

[[dialogue]]
event = 79
page = 1
command = 5
original = '''
\c[10]Gefangener\c[0]: Die Leute halten sich nur für etwas 
Besonderes, weil'se immer in den hintersten Ecken 
und dunkelsten Löschern nach Erz suchen, um eine 
möglichst große Menge zu schürfen.
'''
patched = '''
\c[10]Prisoner\c[0]: They only think they're special because
they always look for ore in the farthest corners
and darkest patches in order to mine as much as
possible.
'''

[[dialogue]]
event = 79
page = 1
command = 9
original = '''
\c[10]Gefangener\c[0]: Mit anderen Worten:\. Sie verhalten sich 
genauso, wie die Wachenhunde es wollen.\. Tsk.\. Als 
ob ich denen so'nen Gefallen tun würde.
'''
patched = '''
\c[10]Prisoner\c[0]: In other words,\. they're doing exactly
what these guards want them to do.\. Tsk.\. As if
I'd do them a favor.
'''

[[dialogue]]
event = 80
page = 1
command = 3
has_portrait = true
character = '''Kento'''
original = '''
(\c[1]\n[1]\c[0]: An der Stelle arbeitet 
