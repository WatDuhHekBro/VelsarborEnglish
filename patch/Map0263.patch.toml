'''

[[dialogue]]
event = 81
page = 2
command = 2
original = '''
\c[10]Wache\c[0]: Ab und zu findet man hier das ein oder 
andere Rüstungsteil oder andere brauchbare 
Gegenstände.\. In dem Fall informiert ihr uns 
darüber, verstanden? 
'''
patched = '''
\c[10]Guard\c[0]: Every now and then, you might find one or
two pieces of armor or other usable items.\. In that
case, make sure to let us know, you understand
that?!
'''

[[dialogue]]
event = 81
page = 2
command = 6
original = '''
\c[10]Wache\c[0]: Kommt ja nicht auf die Idee, das Ganze für 
euch zu behalten.\. Wir merken das, wenn ihr die 
Mine verlässt.
'''
patched = '''
\c[10]Guard\c[0]: And don't you even dare think of keeping
any of it for yourself!\. We notice that kind of
stuff when you leave the mine.
'''
