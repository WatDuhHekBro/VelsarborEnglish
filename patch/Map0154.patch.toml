'''

[[dialogue]]
event = 21
page = 1
command = 12
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: \s[3]Also...\^
'''
patched = '''
\c[2]\n[2]\c[0]: \s[3]So...\^
'''

[[dialogue]]
