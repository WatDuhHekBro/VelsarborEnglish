'''

[[dialogue]]
event = 30
page = 3
command = 68
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Ich hoffe du hast Recht.
'''
patched = '''
\c[13]\n[3]\c[0]: I hope you're right about that.
'''

[[dialogue]]
event = 30
page = 3
command = 77
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Hm...\. wo ist Cibon?
'''
patched = '''
\c[1]\n[1]\c[0]: Hm...\. Where's Cibon?
'''

[[dialogue]]
event = 30
page = 3
command = 79
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Er vertreibt seine Zeit 
