'''
patched = '''
\c[10]Father\c[0]: Now now... Please don't remember those
critters, sweetie.
'''

[[dialogue]]
event = 21
page = 1
command = 2
original = '''
\c[10]Händlerin\c[0]: Diese Monster in den nahe liegenden 
