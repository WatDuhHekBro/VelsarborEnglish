'''
patched = '''
\c[10]Girl\c[0]: Dad, why is the grass in the Corine Plateau
longer than anywhere else?
'''

[[dialogue]]
event = 19
page = 1
command = 8
original = '''
\c[10]Vater\c[0]: Uff...\. Gute Frage...\. Du kennst ja die 
Geschichte vom Courine Plateau.\. Vielleicht 
haben die Ereignisse den Ort verzaubert.\. Deshalb 
das lange Grass.
'''
patched = '''
\c[10]Father\c[0]: Hmm...\. Good question...\. You know the
story of the Corine Plateau.\. Perhaps those
events have enchanted the place.\. Hence the
long grass.
'''

[[dialogue]]
event = 19
page = 1
command = 12
original = '''
\c[10]Mädchen\c[0]: Und deshalb auch diese riesigen Insekten?
'''
patched = '''
\c[10]Girl\c[0]: And is that why there are these giant
insects?
'''

[[dialogue]]
event = 19
page = 1
command = 14
original = '''
\c[10]Vater\c[0]: Uh... erinnere mich bitte nicht an diese 
