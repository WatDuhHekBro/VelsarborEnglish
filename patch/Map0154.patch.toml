'''
patched = '''
\c[13]\n[3]\c[0]: No trace of the soldiers in the
forest,\. they can't be found.
'''

[[dialogue]]
event = 30
page = 3
command = 28
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: ...Anscheinend haben sie noch 
