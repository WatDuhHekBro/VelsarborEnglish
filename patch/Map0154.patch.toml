uns.\. Genieß du lieber den Abend, du 
musst dich nicht darum kümmern.
'''
patched = '''
\c[1]\n[1]\c[0]: Don't take it personally.\.
They just want a duel with us.\.
You'd rather enjoy the evening,
you don't have to worry about it.
'''

[[dialogue]]
event = 8
page = 3
command = 108
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Mach dir keine Sorgen, Soko.\. 
Die Typen sind lächerlich.\ Wir 
werden problemlos mit denen fertig!
'''
patched = '''
\c[2]\n[2]\c[0]: Don't worry, Soko.\. These guys
are ridiculous.\. We can handle them
easily!
'''

[[dialogue]]
event = 8
page = 3
command = 112
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]:  Wir sind dann weg.
'''
patched = '''
\c[1]\n[1]\c[0]: We'll be going then.
'''

[[dialogue]]
event = 8
page = 3
command = 121
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Schlaf du schön deinen Rausch 
aus!
'''
patched = '''
\c[2]\n[2]\c[0]: Sleep well with your
intoxication!
'''

[[dialogue]]
event = 8
page = 3
command = 125
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Rausch?\. Wovon redeste?
'''
# Funnily enough, this line shows Soko's portrait but includes Cibon's header by accident.
patched = '''
\c[13]\n[3]\c[0]: Intoxication?\. What're you
talkin' about?
'''

[[dialogue]]
event = 8
page = 7
command = 21
original = '''
\c[10]Hotelbesitzer\c[0]: Ah, sie müssen diese Soldaten sein. \.
Man hat mir bereit bescheid gegeben.\. Ihre Zimmer 
stehen bereit, ansonsten bedienen sie sich selber. \.
Gute Nacht.
'''
patched = '''
\c[10]Inn Owner\c[0]: Ah, those must be the soldiers they
were talking about.\. I've already been informed.\.
Your rooms are ready, and apart from that,
help yourself to whatever you need.\. Good night.
'''

[[dialogue]]
event = 8
page = 7
command = 38
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Also ich weiß nicht wie das 
bei euch ist, aber ich könnt' jetzt 
mit Sicherheit kein Auge zumachen...
'''
patched = '''
\c[2]\n[2]\c[0]: I don't know about you two,
but I certainly can't close my
eyes right now...
'''

[[dialogue]]
event = 8
page = 7
command = 43
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Stimmt schon, nach all der 
Aufregung...
'''
patched = '''
\c[13]\n[3]\c[0]: Yeah, after all that mayhem...
'''

[[dialogue]]
event = 8
page = 7
command = 46
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Lasst uns doch einfach etwas 
hinsetzen.
'''
patched = '''
\c[1]\n[1]\c[0]: Let's just sit down a bit.
'''

[[dialogue]]
event = 8
page = 7
command = 61
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Mensch, was ist bloß los mit 
diesem Land?\. Genehmigung von der 
Regierung.\. Was für ein Schwachsinn.
'''
patched = '''
\c[2]\n[2]\c[0]: Man, what's with this nation?\.
Government approval.\. Such bullshit.
'''

[[dialogue]]
event = 8
page = 7
command = 65
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Ich hab schon öfters gehört, 
dass es einige Verwaltungsprobleme 
mit den neuen Teilen Brigantias 
gibt.
'''
patched = '''
\c[13]\n[3]\c[0]: I've heard many times that
there are some administrative
problems with the newer parts
of Brigantia.
'''

[[dialogue]]
event = 8
page = 7
command = 71
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Früher war der Sitzpunkt der 
Herrscher dieser Gebiete in 
Domarkor,\. was eindeutig näher ist 
als Buronia.
'''
patched = '''
\c[13]\n[3]\c[0]: The rulers of these areas used
to be in Domarkor,\. which is clearly
closer than Buronia.
'''

[[dialogue]]
event = 8
page = 7
command = 75
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Brigantia fehlt es hier 
einfach an einer Hochburg, von der 
die Gebiete aus verwaltet werden 
können.
'''
patched = '''
\c[13]\n[3]\c[0]: Brigantia simply doesn't have
an outpost to manage these areas.
'''

[[dialogue]]
event = 8
page = 7
command = 83
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Aber wieso lassen sie den 
Grenzsoldaten nicht einfach etwas 
Eigeninitiative?
'''
patched = '''
\c[2]\n[2]\c[0]: But why can't they just give
the guards some initiative?
'''

[[dialogue]]
event = 8
page = 7
command = 87
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Ist das nicht klar?\.
Eigeninitiative führt schnell zu 
Selbstjustiz und unkontrollierbaren 
Verhalten.
'''
patched = '''
\c[13]\n[3]\c[0]: Isn't that clear?\. Personal
initiative quickly leads to
self-justification and
uncontrollable behavior.
'''

[[dialogue]]
event = 8
page = 7
command = 92
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: So entstehen schneller 
unnötige Konfliktsituationen als man 
denkt.
'''
patched = '''
\c[13]\n[3]\c[0]: This creates unnecessary
conflicts faster than you'd think.
'''

[[dialogue]]
event = 8
page = 7
command = 99
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: ...Ach was auch immer...
'''
patched = '''
\c[2]\n[2]\c[0]: Whatever...
'''

[[dialogue]]
event = 8
page = 7
command = 105
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Es macht doch eh keinen 
Unterschied, Cibon.\. Mit den 
Wachleuten alleine werden wir nicht 
weit kommen. 
'''
patched = '''
\c[1]\n[1]\c[0]: It makes no difference
anyways, Cibon.\. We won't get
very far with the guards of
this town alone.
'''

[[dialogue]]
event = 8
page = 7
command = 109
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Wir brauchen die Verstärkung.
'''
patched = '''
\c[1]\n[1]\c[0]: We need reinforcements.
'''

[[dialogue]]
event = 8
page = 7
command = 115
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: ... Kento...\. und du bist 
sicher, dass du nicht über die 
Gruppe erfahren hast? 
'''
patched = '''
\c[13]\n[3]\c[0]: Kento...\. Are you're really sure
you didn't find out about the group?
'''

[[dialogue]]
event = 8
page = 7
command = 118
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]:\s[2] Ich meine, du bist ja 
anscheinend viel durch ihr Gebäude 
ge...\.\.\^
'''
patched = '''
\c[13]\n[3]\c[0]: I mean, you apparently went
through their building a lot...\.\.\^
'''

[[dialogue]]
event = 8
page = 7
command = 123
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Ich sagte doch bereits, dass 
ich nichts weiß, oder?!\. Und nein, 
daran hat sich nichts geändert!
'''
patched = '''
\c[1]\n[1]\c[0]: I already said that I don't
know anything else, okay?!\. And no,
that isn't changing!
'''

[[dialogue]]
event = 8
page = 7
command = 131
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: ...Kumpel?
'''
patched = '''
\c[2]\n[2]\c[0]: Kento?
'''

[[dialogue]]
event = 8
page = 7
command = 133
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Ich geh schlafen.\. Weckt mich, 
wenn es Neuigkeiten gibt.
'''
patched = '''
\c[1]\n[1]\c[0]: I'm off to bed.\. Wake me up
when something's happening.
'''

[[dialogue]]
event = 8
page = 7
command = 147
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Was ist los mit ihm?
'''
patched = '''
\c[13]\n[3]\c[0]: What's with Kento all of
a sudden?
'''

[[dialogue]]
event = 8
page = 9
command = 18
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Soko, ich war eben bei den 
Grenzleuten.\. Wir werden heute Nacht 
einen Spähertrupp zu dem Stützpunkt 
leiten.
'''
patched = '''
\c[1]\n[1]\c[0]: Soko, I was just with the
guards.\. We'll be leading a scout
team to the base tonight.
'''

[[dialogue]]
event = 8
page = 9
command = 23
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Ein Spähertrupp?\. Noch diese 
Nacht?
'''
patched = '''
\c[13]\n[3]\c[0]: A scout team?\. Tonight?
'''

[[dialogue]]
event = 8
page = 9
command = 26
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Ja.\. So können wir diese 
Truppe überwachen und haben mehr 
Zeugen für ihre Existenz.
'''
patched = '''
\c[1]\n[1]\c[0]: Yes.\. So we can monitor this
force and have more witnesses to
their existence.
'''

[[dialogue]]
event = 8
page = 9
command = 30
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Das ist gut.\. Ich denke, das 
ist so ziemlich das Sinnvollste, 
was wir mit unserer Zeit anfangen 
können.
'''
patched = '''
\c[13]\n[3]\c[0]: That's good.\. I think that's
pretty much the most sensible
thing we can do with our time.
'''

[[dialogue]]
event = 8
page = 9
command = 34
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Herrn Uroto werden wir so aber 
nicht befreien können, nehme ich an.
'''
patched = '''
\c[13]\n[3]\c[0]: We won't be able to free Mr.
Uroto, I guess.
'''

[[dialogue]]
event = 8
page = 9
command = 41
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Höchstwahrscheinlich nicht. 
'''
patched = '''
\c[1]\n[1]\c[0]: Most likely not.
'''

[[dialogue]]
event = 8
page = 9
command = 42
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Wir können an Herrn Urotos 
Situation im Moment einfach nichts 
ändern, mach dir keinen zu großen 
Kopf darum.
'''
patched = '''
\c[1]\n[1]\c[0]: We just can't change anything
about Mr. Uroto's situation right
now, so don't worry too much
about it.
'''

[[dialogue]]
event = 8
page = 9
command = 48
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Ich kann nicht anders.\. Herrn 
Uroto zu beschützen war der Sinn 
unserer Mission - und wir haben 
versagt. 
'''
patched = '''
\c[13]\n[3]\c[0]: I can't help it.\. Protecting Mr.
Uroto was the sole purpose of our
mission - and we failed at it.
'''

[[dialogue]]
event = 8
page = 9
command = 53
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Das schlechte Gewissen wird 
bleiben, bis er wieder befreit 
wurde...
'''
patched = '''
\c[13]\n[3]\c[0]: This guilty conscience will
remain until we free him...
'''

[[dialogue]]
event = 8
page = 9
command = 57
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Ich finde, du verharrst dich 
zu sehr auf dieses Missionsziel.
'''
patched = '''
\c[1]\n[1]\c[0]: I think you got too attached
to the goal of this mission.
'''

[[dialogue]]
event = 8
page = 9
command = 60
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Jeder Soldat hat im Grunde zu 
jeder Zeit die Aufgabe, sein Land zu 
beschützen, und wir tun nichts 
anderes im Moment.
'''
patched = '''
\c[1]\n[1]\c[0]: Every soldier basically has
the job of protecting their country
at all times, and we're not doing
anything else at the moment.
'''

[[dialogue]]
event = 8
page = 9
command = 68
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Nein Kento...\. ich mag diese 
Denkweise nicht. \.Du magst Recht 
haben, dass jeder Soldat sein Land 
beschützen sollte.
'''
patched = '''
\c[13]\n[3]\c[0]: No Kento...\. I don't like this
way of thinking.\. You may be right
that every soldier should protect
their country.
'''

[[dialogue]]
event = 8
page = 9
command = 72
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Aber nicht jedem Soldaten 
steht das Recht zu, aus eigener Hand 
zu entscheiden, wie er dies tut.
'''
patched = '''
\c[13]\n[3]\c[0]: But not every soldier has the
right to decide for themselves how
they go about doing this.
'''

[[dialogue]]
event = 8
page = 9
command = 77
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Hm... Siehst du das nicht 
vielleicht etwas zu eng?
'''
patched = '''
\c[1]\n[1]\c[0]: Hm... Maybe you're following
these rules and regulations a bit
too closely?
'''

[[dialogue]]
event = 8
page = 9
command = 80
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Nein, das tu ich 
nicht! 
'''
patched = '''
\c[13]\n[3]\c[0]: No, I'm not!
'''

[[dialogue]]
event = 8
page = 9
command = 83
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Weißt du überhaupt, wieviele 
Bürgerkriege und Massaker in diesem 
Land geschehen sind, nur weil jemand 
diese Denkweise hatte?
'''
patched = '''
\c[13]\n[3]\c[0]: Do you even know how many civil
wars and massacres happened in this
nation just because someone had
this way of thinking?
'''

[[dialogue]]
event = 8
page = 9
command = 89
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Das sind die extremen Fälle.\.
Denkst du unsere Spionage würde zu 
einem Bürgerkrieg führen?
'''
patched = '''
\c[1]\n[1]\c[0]: Those are the extreme cases.\.
Do you think us scouting them out
will lead to another war?
'''

[[dialogue]]
event = 8
page = 9
command = 96
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Du verstehst es nicht!\. In 
einem Fall klappt es, im anderen 
hast du eine Katastrophe! 
'''
patched = '''
\c[13]\n[3]\c[0]: You don't understand anything!\.
In one case, it works fine, but in
the other, you have a disaster!
'''

[[dialogue]]
event = 8
page = 9
command = 99
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Es hängt ganz von der Person 
ab, die entscheidet. Man nennt das 
Selbstjustiz.
'''
patched = '''
\c[13]\n[3]\c[0]: It depends on the person who
makes the decision. This type of
thing is called vigilante justice.
'''

[[dialogue]]
event = 8
page = 9
command = 104
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Du übertreibst es... 
'''
patched = '''
\c[1]\n[1]\c[0]: You're overexaggerating...
'''

[[dialogue]]
event = 8
page = 9
command = 106
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Es gibt Entscheidungen, die 
wirklich offensichtlich genug sind, 
um auf so eine Bestätigung 
verzichten zu können.
'''
patched = '''
\c[1]\n[1]\c[0]: There are decisions that are
obvious enough to be able to do
without approval.
'''

[[dialogue]]
event = 8
page = 9
command = 111
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Das meinst du!\. Welche 
Entscheidung ist denn nun 
offensichtlich, welche nicht?! 
'''
patched = '''
\c[13]\n[3]\c[0]: What do you mean?!\. Which
decision is obvious and which isn't?!
'''

[[dialogue]]
event = 8
page = 9
command = 115
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Was du als offensichtlich 
ansiehst, mag vielleicht in etwa 
zutreffen!
'''
patched = '''
\c[13]\n[3]\c[0]: What you see as obvious may be
roughly true!
'''

[[dialogue]]
event = 8
page = 9
command = 119
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Aber was ist mit den 
Entscheidungen, die dieser Rotschopf 
aus dem Gefängnis getroffen hat?! 
'''
patched = '''
\c[13]\n[3]\c[0]: But what about those decisions
made by that redhead from prison?!
'''

[[dialogue]]
event = 8
page = 9
command = 123
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: War die "offensichtlich" 
korrekt!?\. Wer weiß?\. Vielleicht hat 
er das sogar geglaubt!
'''
patched = '''
\c[13]\n[3]\c[0]: Was it "obviously" correct?!\.
Who knows?\. Maybe he even believed
that!
'''

[[dialogue]]
event = 8
page = 9
command = 130
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Nein... ich glaube eher, er 
hat aus reinem Egoismus gehandelt.
'''
patched = '''
\c[1]\n[1]\c[0]: No... I think he acted out of
selfishness.
'''

[[dialogue]]
event = 8
page = 9
command = 135
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Soso!\. Und wieso wollen wir die 
Gruppe ausspionieren!?\. Wollen wir 
damit nicht unsere Schuldgefühle 
lindern?\. Ist das nicht egoistisch?
'''
patched = '''
\c[13]\n[3]\c[0]: Oh!\. And why do we want to scout
out this group?!\. Isn't it because we
want to get rid of our guilt?\. But
isn't that selfish in and of itself?
'''

[[dialogue]]
event = 8
page = 9
command = 145
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Also...
'''
patched = '''
\c[1]\n[1]\c[0]: Hey...
'''

[[dialogue]]
event = 8
page = 9
command = 147
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Worauf willst du überhaupt 
hinaus?\. Ich dachte du wärst mit der 
Aktion einverstanden.
'''
patched = '''
\c[1]\n[1]\c[0]: What are you getting at?\.
I thought you agreed to this.
'''

[[dialogue]]
event = 8
page = 9
command = 154
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Ähm...\. das bin ich auch... \.
Nein, es geht mir nur darum... \.
'''
patched = '''
\c[13]\n[3]\c[0]: Um...\. I am...\. No, it's just
about...
'''

[[dialogue]]
event = 8
page = 9
command = 157
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Du, und vor allem Cibon, ihr 
solltet mehr Respekt vor der 
Entscheidung von oben haben.
'''
patched = '''
\c[13]\n[3]\c[0]: You, and especially Cibon, you
two should have more respect for the
higher ups' decision.
'''

[[dialogue]]
event = 8
page = 9
command = 164
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: ... Ich werde drüber 
nachdenken...\. Du solltest heute 
möglichst früh schlafen gehen, die 
heutige Nacht wird hart.
'''
patched = '''
\c[1]\n[1]\c[0]: I'll think about it...\. You
should go to bed as early as possible
today, tonight will be a tough one.
'''

[[dialogue]]
event = 8
page = 9
command = 169
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Geht in Ordnung.\. Und bitte 
denkt wirklich darüber nach.
'''
patched = '''
\c[13]\n[3]\c[0]: Alright.\. And please, really do
think about it.
'''

[[dialogue]]
event = 8
page = 9
command = 172
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Ja, werde ich.
'''
patched = '''
\c[1]\n[1]\c[0]: Yeah, I will.
'''

[[dialogue]]
event = 8
page = 12
command = 13
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Bis du endlich wach? 
'''
patched = '''
\c[13]\n[3]\c[0]: Are you finally awake?
'''

[[dialogue]]
event = 8
page = 12
command = 15
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Ja, wir können los...
'''
patched = '''
\c[1]\n[1]\c[0]: Yeah, we can go...
'''

[[dialogue]]
event = 8
page = 12
command = 17
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Draußen ist schon wieder so 
ein miserables Wetter.\. Wird sicher 
keine schöne Tour werden...
'''
patched = '''
\c[13]\n[3]\c[0]: The weather outside is
miserable yet again.\. It won't
be a nice trip...
'''

[[dialogue]]
event = 9
page = 2
command = 15
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Hm... Ist schon erstaunlich, 
