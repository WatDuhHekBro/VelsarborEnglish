Adelsbund zusammen?
'''
patched = '''
\c[13]\n[3]\c[0]: What do you think this group
wants to achieve?\. Do you think they
might be working with the Farenian
Aristocracy?
'''

[[dialogue]]
event = 30
page = 3
command = 43
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Keine Ahnung,\. möglich ist es,\. 
die Frage ist nur wieso.
'''
patched = '''
\c[1]\n[1]\c[0]: No idea,\. it's possible,\.
but the question would be why.
'''

[[dialogue]]
event = 30
page = 3
command = 48
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Wahrscheinlich hat Korzojeno 
tatsächlich vor noch mal die Waffen 
gegen Brigantia zu erheben und formt 
