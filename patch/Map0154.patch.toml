'''

[[dialogue]]
event = 9
page = 2
command = 47
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Sehr merkwürdig....
'''
patched = '''
\c[13]\n[3]\c[0]: Strange...
'''

[[dialogue]]
event = 9
page = 2
command = 58
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Ich hoffe die Hilfe für Herrn 
