'''

[[dialogue]]
event = 30
page = 3
command = 53
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: ...Bitte nicht schon wieder 
ein Krieg...\. Wieso müssen 
ausgerechnet wir in diese Sache rein 
