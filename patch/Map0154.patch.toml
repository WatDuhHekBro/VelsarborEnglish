'''
patched = '''
Merc\c[10]hant\c[0]: These monsters in the nearby pine
forest are becoming increasingly dangerous.
Though many of them are said to be easy to
defeat with earth Signums.
'''

[[dialogue]]
event = 21
page = 1
command = 6
original = '''
\c[10]Händlerin\c[0]: Zu dumm, dass ich keinen Magier habe, 
