arrive here, those troops in the
forest will be all over the hills.
'''

[[dialogue]]
event = 184
page = 1
command = 92
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Naja, wenn sie so schnell 
