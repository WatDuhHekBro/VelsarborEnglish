[[dialogue]]
event = 104
page = 3
command = 24
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Da sind wir ja endlich.\.
Gencorin hieß diese Stadt, oder?
'''
patched = '''
\c[2]\n[2]\c[0]: We finally made it!\. This city
is called Gencorin, right?
'''

[[dialogue]]
event = 104
page = 3
command = 27
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Das ging insgesamt doch etwas 
schneller als erwartet,\. trotz der 
ganzen Ereignisse auf dem Weg.
'''
patched = '''
\c[13]\n[3]\c[0]: Overall, we got here a little
faster than expected,\. despite all
the events on the way.
'''

[[dialogue]]
event = 104
page = 3
command = 31
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ja!\. Das bedeutet heute Abend 
müssen wir nicht sofort ins Bett 
springen!\. Wir können die Gegend 
unsicher machen!
'''
patched = '''
\c[2]\n[2]\c[0]: Yes!\. That means tonight we
don't have to jump into bed right
away!\. We can live it up a little!
'''

[[dialogue]]
event = 104
page = 3
command = 36
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: In dem kleinen Ort hier? 
'''
patched = '''
\c[1]\n[1]\c[0]: In this little town here?
'''

[[dialogue]]
event = 104
page = 3
command = 44
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Für so nen kleinen Ort ist 
hier aber einiges los, oder Kumpel? 
'''
patched = '''
\c[2]\n[2]\c[0]: So what if there isn't a whole
lot going on for a small place like
this?
'''

[[dialogue]]
event = 104
page = 3
command = 47
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Und solange es eine Kneipe 
gibt,\. ist alles in Ordnung.\. Und so 
was MUSS es hier geben.
'''
patched = '''
\c[2]\n[2]\c[0]: And as long as there's a pub,
everything will be fine.\. And there
HAS to be.
'''

[[dialogue]]
event = 104
page = 3
command = 51
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Ihr habt doch nicht etwa vor, \.
euch hier zu betrinken, oder?
'''
patched = '''
\c[13]\n[3]\c[0]: You're not going to get drunk
here,\. are you?
'''

[[dialogue]]
event = 104
page = 3
command = 62
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Na, mach dir keine Sorgen, \.
wir werden es schon nicht 
übertreiben, Soko.
'''
patched = '''
\c[2]\n[2]\c[0]: Well, don't worry,\. we aren't
going to overdo it, Soko.
'''

[[dialogue]]
event = 104
page = 3
command = 67
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Und Kento sollte sowieso 
nicht soviel trinken, in seinem 
Zustand...\. Wir wissen nicht wie es 
auf ihn wirken könnte...
'''
patched = '''
\c[2]\n[2]\c[0]: And Kento shouldn't drink too
much anyway in his condition...\. We
don't know how it could affect him...
'''

[[dialogue]]
event = 104
page = 3
command = 73
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Ich denke mal nicht das es 
hier einen Arzt in der Nähe gibt.\. Da 
werden wir wohl erst in Domarkor 
fündig.
'''
patched = '''
\c[13]\n[3]\c[0]: I don't think there's a doctor
around here.\. We'll only find what
we're looking for in Domarkor.
'''

[[dialogue]]
event = 104
page = 3
command = 85
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Was zum...\.
Ihr wollt mich doch nicht 
ernsthaft zum Arzt schicken,\. oder?
'''
patched = '''
\c[1]\n[1]\c[0]: What the...\. You're not
thinking of sending me to
a doctor,\. are you?
'''

[[dialogue]]
event = 104
page = 3
command = 89
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Noch einmal zum aufschreiben:\.\.
Mir -\.\. geht -\.\. es -\.\. gut!
'''
patched = '''
\c[1]\n[1]\c[0]: I've said it before and I'll
say it again:\.\. I\.\. am\.\. completely\.\. fine!
'''

[[dialogue]]
event = 104
page = 3
command = 93
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Und jetzt ab zum Gasthof,\. ich 
bin hungrig.
'''
patched = '''
\c[1]\n[1]\c[0]: Now off to the inn,\. I'm
hungry.
'''

[[dialogue]]
event = 104
page = 3
command = 96
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Schon gut, Kumpel.
'''
patched = '''
\c[2]\n[2]\c[0]: Alright.
'''

[[dialogue]]
event = 104
page = 5
command = 14
has_portrait = true
character = '''Cibon'''
original = '''
(\c[2]\n[2]\c[0]: Mist, die Händler haben ihre 
Waren schon eingepackt.\. Ist es 
wirklich schon so spät?)
'''
patched = '''
(\c[2]\n[2]\c[0]: Crap, the traders already
packed up for the day.\. Is it
really that late?)
'''

[[dialogue]]
event = 104
page = 5
command = 25
has_portrait = true
character = '''Cibon'''
original = '''
(\c[2]\n[2]\c[0]:\s[3] Dabei hätte mich wirklich 
interessiert, was sie hier so an 
Waren anbieten.\. Naja, vielleicht 
morgen.)
'''
patched = '''
(\c[2]\n[2]\c[0]: I would've really been
interested in the goods they
offer here.\. Well, maybe
tomorrow.)
'''

[[dialogue]]
event = 104
page = 5
command = 33
has_portrait = true
character = '''Cibon'''
original = '''
(\c[2]\n[2]\c[0]:\s[3] Die Stadt ist doch eindeutig 
ruhiger gegen Abend.)
'''
patched = '''
(\c[2]\n[2]\c[0]: The city is clearly quieter
towards evening.)
'''

[[dialogue]]
event = 104
page = 5
command = 81
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Hey!!\. Welcher Idiot war das?!\.
'''
patched = '''
\c[2]\n[2]\c[0]: Hey!!\. Which idiot threw that
at me?!\.
'''

[[dialogue]]
event = 104
page = 5
command = 88
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Niemand zu sehen...
'''
patched = '''
\c[2]\n[2]\c[0]: Nobody in sight...
'''

[[dialogue]]
event = 104
page = 5
command = 96
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Oh... eine Nachricht...
'''
patched = '''
\c[2]\n[2]\c[0]: Oh... A message...
'''

[[dialogue]]
event = 104
page = 5
command = 108
has_portrait = true
character = '''Cibon'''
original = '''
(\c[2]\n[2]\c[0]: Nein, das gibt es nicht!\. Die 
Zinkar Brüder?)
'''
patched = '''
(\c[2]\n[2]\c[0]: No, you can't be serious!\.
The Zinkar Brothers?)
'''

[[dialogue]]
event = 104
page = 6
command = 14
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Wir sollen den Waldweg 
nordöstlich vom Dorf entlang gehen.
'''
patched = '''
\c[2]\n[2]\c[0]: We should go along the
forested path northeast of
the town.
'''

[[dialogue]]
event = 104
page = 6
command = 17
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Ich frag mich echt, wie sie 
es gemeistert haben, sich von der 
Gefangenschaft zu befreien...
'''
patched = '''
\c[1]\n[1]\c[0]: I really wonder how they
managed to free themselves from
imprisonment...
'''

[[dialogue]]
event = 104
page = 8
command = 8
has_portrait = true
character = '''Kento'''
original = '''
(\c[1]\n[1]\c[0]: Was ist bloß los mit dieser 
Frau?\. Sie ist einverstanden mit dem, 
was wir vorhaben,...\. und dann dieser 
Aufstand?\. Ich versteh es nicht.)
'''
patched = '''
(\c[1]\n[1]\c[0]: What's with her?\. She's okay
with what we're up to...\. and then
this all of a sudden?\. I don't get
it.)
'''

[[dialogue]]
event = 104
page = 8
command = 13
has_portrait = true
character = '''Kento'''
original = '''
(\c[1]\n[1]\c[0]: Wie auch immer...)
'''
patched = '''
(\c[1]\n[1]\c[0]: Anyways...)
'''

[[dialogue]]
event = 104
page = 8
command = 16
has_portrait = true
character = '''Kento'''
original = '''
(\c[1]\n[1]\c[0]: Ich sollte Cibon noch 
bescheid geben.)
'''
patched = '''
(\c[1]\n[1]\c[0]: I should let Cibon know.)
'''

[[dialogue]]
event = 104
page = 8
command = 20
has_portrait = true
character = '''Kento'''
original = '''
(\c[1]\n[1]\c[0]: Ich sollte jetzt noch die 
letzten Vorbereitungen treffen und 
dann ebenfalls schlafen gehen.)
'''
patched = '''
(\c[1]\n[1]\c[0]: I should now be making the
final preparations and then going
to sleep too.)
'''

[[dialogue]]
event = 117
page = 2
command = 4
original = '''
\c[10]Mann\c[0]: Oh, die Sonne geht schon unter.\. Oh ja, wenn 
die Nacht einbricht bekommt die Stadt wieder ihren 
ruhigen Charakter, den sie früher hatte...
'''
patched = '''
\c[10]Man\c[0]: Oh, the sun is already setting.\. Oh yeah,
when night falls, the city regains the
tranquility it used to have...
'''

[[dialogue]]
event = 117
page = 2
command = 10
original = '''
\c[10]Mann\c[0]: Diese Regenschauer gestern Abend war ganz 
schön heftig.\. Ich bin froh, dass es mittlerweile 
wieder aufgehört hat. \.Man kriegt hier kaum etwas 
gemacht, wenn es permanent von oben gießt.
'''
patched = '''
\c[10]Man\c[0]: That rain shower last night was pretty
heavy.\. I'm glad it stopped again.\. You can
hardly get anything done here if it's
constantly pouring from above.
'''

[[dialogue]]
event = 117
page = 2
command = 16
original = '''
\c[10]Mann\c[0]: Immer mehr Händler bauen hier ihre Stände 
auf.\. Ich denke es ist nur ne Frage der Zeit bis 
die Steuern dafür erhöht werden
'''
patched = '''
\c[10]Man\c[0]: More and more traders are setting up shop
here.\. I think it's only a matter of time
before taxes are raised.
'''

[[dialogue]]
event = 117
page = 2
command = 19
original = '''
\c[10]Mann\c[0]: Aber immerhin verdient die Stadt damit gutes 
Geld, sowohl der Norden als auch der Osten.
'''
patched = '''
\c[10]Man\c[0]: But at least the city earns good money with
it, both the north and the south.
'''

[[dialogue]]
event = 117
page = 2
command = 21
original = '''
\c[10]Mann\c[0]: Wer weiß, in Zukunft könnte hier vielleicht 
sogar eine Stadt der Größe von Nomerea oder gar 
Buronia stehen!
'''
patched = '''
\c[10]Man\c[0]: Who knows, in the future, this might even be
a city the size of Nomerea or even Buronia!
'''

[[dialogue]]
event = 120
page = 1
command = 2
original = '''
\c[10]Händler\c[0]: Wollt ihr weiches Fell haben? Diese Ware 
ist kaum zu vergleichen mit dem rauen Fell, das 
man sonst häufig findet. Sie ist um einiges 
seltener!
'''
patched = '''
\c[10]Trader\c[0]: Do you want to get soft fur? This product
can hardly be compared to the rough fur that
you'd otherwise often find. It's a lot rarer!
'''

[[dialogue]]
event = 141
page = 1
command = 2
original = '''
\c[10]Händler\c[0]: Probiert ein paar dieser süßen Flajo-
Früchte aus dem Süden!
'''
patched = '''
\c[10]Trader\c[0]: Try some of these sweet flajo fruits from
the south!
'''

[[dialogue]]
event = 142
page = 1
command = 2
original = '''
\c[10]Schmied\c[0]: Wenn ihr genug Panzerschalen und eine 
Silbermünze habt, kann ich euch einen Käferpanzer 
anfertigen.\. Dieses Stück schützt fast doppelt so 
gut wie der Bronzepanzer, glaubt mir!
'''
patched = '''
Blac\c[10]ksmith\c[0]: If you have enough armored shells and
a silver ingot, I can make you a beetle vest.\.
This piece protects almost twice as well as
bronze armor, trust me!
'''

[[dialogue]]
event = 143
page = 2
command = 2
original = '''
\c[10]Mann\c[0]: Ihr seid doch sicherlich den einem oder 
anderen Hornkäfer über dem Weg gelaufen, als ihr 
das Corine Plateau durchquert habt, nicht wahr?
'''
patched = '''
\c[10]Man\c[0]: You surely ran across one or the other
horned beetle when you crossed the Corine
Plateau, didn't you?
'''

[[dialogue]]
event = 143
page = 2
command = 5
original = '''
\c[10]Mann\c[0]: Wenn ihr sie besiegt, lassen sie 
Panzerschalen von wirklich hoher Qualität fallen.
Hier gibt es jemanden, der euch aus diesen eine 
wirklich stabile Rüstung macht.
'''
patched = '''
\c[10]Man\c[0]: If you defeat them, they drop really high
quality armored shells. There's someone here
who can make you some really sturdy armor
out of these.
'''

[[dialogue]]
event = 143
page = 2
command = 9
original = '''
\c[10]Mann\c[0]: Ich weiß, der Gedanke so etwas zu tragen ist 
etwas merkwürdig, aber der Schutz soll wirklich 
hervorragend sein.
'''
patched = '''
\c[10]Man\c[0]: I know the idea of wearing something like
this is a bit strange, but the defense should
really be excellent.
'''

[[dialogue]]
event = 145
page = 2
command = 3
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Wir sollten die Sache schnell 
hinter uns bringen und uns nicht 
ablenken lassen.
'''
patched = '''
\c[1]\n[1]\c[0]: We should get this over with
quickly and avoid getting distracted.
'''

[[dialogue]]
event = 145
page = 3
command = 8
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Verschlossen.\. Kein Wunder, 
bei der Uhrzeit.
'''
patched = '''
\c[1]\n[1]\c[0]: Locked.\. No wonder, considering
the time of day.
'''

[[dialogue]]
event = 146
page = 1
command = 3
original = '''
\c[10]Lisa\c[0]: Wie lang denn noch?\. Wann wird er endlich 
zurückkehren...\. Ich vermiss ihn so...
'''
patched = '''
\c[10]Lisa\c[0]: How much longer?\. When will he finally
return...\. I miss him so much...
'''

[[dialogue]]
event = 146
page = 1
command = 9
original = '''
\c[10]Blondes Mädchen\c[0]: Hachja...
'''
patched = '''
\c[10]Blonde Girl\c[0]: Argh...
'''

[[dialogue]]
event = 146
page = 1
command = 22
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Hallöchen, schönes Mädchen!\. 
Mein Name ist Cibon.\. Mit wem hab ich 
die Ehre?
'''
patched = '''
\c[2]\n[2]\c[0]: Hey there, beautiful girl!\. The
name's Cibon.\. And who do I have the
honor of being with today?
'''

[[dialogue]]
event = 146
page = 1
command = 27
original = '''
\c[10]Blondes Mädchen\c[0]: Eh...?\. Mein Name?\. Ehm...\. Lisa...
'''
patched = '''
\c[10]Blonde Girl\c[0]: Eh?\. My name?\. Ehm...\. Lisa...
'''

[[dialogue]]
event = 146
page = 1
command = 30
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Lisa,\. ein schöner Name!\. 
Erzähl mal, wie ist das Leben hier 
so in Gencorin?
'''
patched = '''
\c[2]\n[2]\c[0]: Lisa,\. a nice name!\. Tell me,
what's life like here in Gencorin?
'''

[[dialogue]]
event = 146
page = 1
command = 34
original = '''
\c[10]Lisa\c[0]: Falls das irgendeine Art von Anmache sein 
soll....\. Tut mir Leid,\. mein Herz ist bereits 
vergeben... 
'''
patched = '''
\c[10]Lisa\c[0]: If this is some kind of attempt at picking
me up...\. Sorry,\. I'm already taken...
'''

[[dialogue]]
event = 146
page = 1
command = 39
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Oh,\. ich verstehe...
'''
patched = '''
\c[2]\n[2]\c[0]: Oh,\. I see...
'''

[[dialogue]]
event = 146
page = 1
command = 53
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Ich sollte es vermeiden mit 
dir in Städten rum zulaufen.
'''
patched = '''
\c[1]\n[1]\c[0]: I should avoid running around
in cities with you.
'''

[[dialogue]]
event = 146
page = 1
command = 56
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Also wirklich, Cibon.\. Auf 
diese Art wirst du nie Erfolg haben.
'''
patched = '''
\c[13]\n[3]\c[0]: Really, Cibon.\. You'll never
succeed this way.
'''

[[dialogue]]
event = 146
page = 1
command = 60
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Wieso denn das?
'''
patched = '''
\c[2]\n[2]\c[0]: Why is that?
'''

[[dialogue]]
event = 146
page = 1
command = 62
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Du bist viel zu direkt.\. Ein 
richtiger Gentleman sollte nicht 
über eine Frau herfallen wie ein 
Raubtier über seine Beute.
'''
patched = '''
\c[13]\n[3]\c[0]: You're too direct.\. A real
gentleman shouldn't attack a
woman like a predator does
with its prey.
'''

[[dialogue]]
event = 146
page = 1
command = 67
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Soko, woher willst DU 
eigentlich wissen, wie ein Gentleman 
sich an eine Frau ran macht?\. Ich 
meine...\. aus eigener Erfahrung?
'''
patched = '''
\c[2]\n[2]\c[0]: Soko, how do YOU actually know
how gentlemen treat women?\. I mean...\.
from personal experience?
'''

[[dialogue]]
event = 146
