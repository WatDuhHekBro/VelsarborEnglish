has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Tse..!
'''
patched = '''
\c[13]\n[3]\c[0]: Tsk!
'''

[[dialogue]]
event = 146
page = 1
command = 93
has_portrait = true
character = '''Kento'''
original = '''
(\c[1]\n[1]\c[0]: Na endlich.\. Ich habe diese 
Situation schon seit Tagen kommen 
sehen.)
'''
patched = '''
(\c[1]\n[1]\c[0]: About time.\. I saw this coming
for several days nows.)
'''

[[dialogue]]
event = 149
page = 2
command = 2
original = '''
\c[10]Frau\c[0]: Ich kann mich noch erinnern, als am Ende des 
Krieges hier Not und Elend herrschte. \.
Ein Glück, dass sich das verbessert hat. 
'''
patched = '''
\c[10]Woman\c[0]: I can still remember when there was
hardship and poverty at the end of the war.\.
Luckily, that has improved.
'''

[[dialogue]]
event = 149
page = 2
command = 5
original = '''
\c[10]Frau\c[0]: Förster gibt es hier zwar immer weniger, \.
dafür kann man gutes Geld verdienen, wenn man mit 
den Reisenden handelt.
'''
patched = '''
\c[10]Woman\c[0]: There are fewer and fewer lumberjacks
around here,\. but you can earn good money by
trading with travellers.
'''

[[dialogue]]
event = 150
page = 1
command = 3
original = '''
\c[10]Mann\c[0]: Hm, die Stadt gefällt mir besser bei 
sonnigem Wetter.\. Aber man kann halt nicht alles 
haben.
'''
patched = '''
\c[10]Man\c[0]: Hm, I like the city better in sunny weather.\.
But you can't have everything.
'''

[[dialogue]]
event = 150
page = 1
command = 9
original = '''
\c[10]Mann\c[0]: Oh, hallo.\. Noch ein paar Reisende?\. Wohin 
soll's denn gehen?\. Domarkor?
'''
patched = '''
\c[10]Man\c[0]: Oh, hello.\. A few more travellers?\. Where are
you headed?\. Domarkor?
'''

[[dialogue]]
event = 150
page = 1
command = 14
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Ja, so ist es.\. Es scheint als 
ob hier viele Reisende durch diese 
Stadt kommen.
'''
patched = '''
\c[13]\n[3]\c[0]: Yep, that's right.\. Seems like
a lot of travellers come through
this city.
'''

[[dialogue]]
event = 150
page = 1
command = 18
original = '''
\c[10]Mann\c[0]: Ja, was soll man auch sonst erwarten?\. Hier 
ist schließlich die Grenze und durchreisen ist 
kein großes Problem...
'''
patched = '''
\c[10]Man\c[0]: Of course, what else can you expect?\. After
all, this is the border and travelling through
isn't a big problem...
'''

[[dialogue]]
event = 150
page = 1
command = 25
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Und deshalb auch all die 
Händler hier,\. nichtwahr?
'''
patched = '''
\c[2]\n[2]\c[0]: And that's why all the traders
here,\. aren't they?
'''

[[dialogue]]
event = 150
page = 1
command = 28
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Eines würde mich 
interessieren.\. Sind die Einwohner 
dieses Dorfes eigentlich aus 
Brigantia oder aus Korzojeno?
'''
patched = '''
\c[13]\n[3]\c[0]: One thing I'm curious about.\.
Are the residents of this town
actually from Brigantia or
Korzojeno?
'''

[[dialogue]]
event = 150
page = 1
command = 33
original = '''
\c[10]Mann\c[0]: Oh,\. nun ja,\. da hier die Grenze ist, sind wir 
aus Brigantia im Norden des Dorfes,\. während im 
Süden das korzojenische Volk wohnt. 
'''
patched = '''
\c[10]Man\c[0]: Oh,\. well,\. since this is the border,\. we're
from Brigantia in the north side of the town,
while the Korzojens live in the south side.
'''

[[dialogue]]
event = 150
page = 1
command = 36
original = '''
\c[10]Mann\c[0]: Aber die Grenzen sind nicht mehr so stark 
unterteilt, wie es früher einmal war.\. Als 
Bürger kann man hier ohne große Umstände beide 
Teile der Stadt betreten.
'''
patched = '''
\c[10]Man\c[0]: But the borders are no longer divided as
much as they used to be.\. As a citizen, you
can easily enter both parts of the city here.
'''

[[dialogue]]
event = 150
page = 1
command = 42
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Hier scheint ja alles 
ziemlich locker abzulaufen. 
'''
patched = '''
\c[2]\n[2]\c[0]: Everything seems to be going
pretty smoothly around here.
'''

[[dialogue]]
event = 150
page = 1
command = 45
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Aber was is' nun mit all den 
Räubern aus dem Corine-Plateau?\.
Kamen die nicht auch aus Gencorin?
'''
patched = '''
\c[2]\n[2]\c[0]: But what about all the robbers
from the Corine Plateau?\. Didn't they
come from Gencorin?
'''

[[dialogue]]
event = 150
page = 1
command = 49
original = '''
\c[10]Mann\c[0]: Ihr meint dieses Menschenpack im Norden?\. Ja, 
einige von denen waren hier sesshaft.\. Es waren 
hauptsächlich die Leute die hier in der Gegend 
Forstwirtschaft unternommen haben.
'''
patched = '''
\c[10]Man\c[0]: You mean this pack of people in the north?\.
Yes, some of them were settled here.\. It was
mainly the lumberjacks around here.
'''

[[dialogue]]
event = 150
page = 1
command = 53
original = '''
\c[10]Mann\c[0]: Nachdem Brigantia nun die Grenzen verschoben 
hat, wurden diese Leute nach Korzojeno verdrängt. \.
Da dort bereits mehr als genug Förster waren, 
bekamen sie nichts zu tun.
'''
patched = '''
\c[10]Man\c[0]: Now that Brigantia has moved the borders,
these people have been displaced from Korzojeno.\.
Since there were already more than enough
lumberjacks there, they got nothing better to do.
'''

[[dialogue]]
event = 150
page = 1
command = 57
original = '''
\c[10]Mann\c[0]: Während einige weiter ins Land reisten, um 
eine neue Bestimmung zu suchen, haben andere sich
stur gestellt und verteidigen deshalb bis heute 
"ihre alte Heimat".
'''
patched = '''
\c[10]Man\c[0]: While some travelled further to look for
a new destination, others stubbornly defended
themselves and are therefore still defending
"their old homeland".
'''

[[dialogue]]
event = 150
page = 1
command = 61
original = '''
\c[10]Mann\c[0]: Kommt nicht selten vor, dass diese Leute uns 
hier in Gencorin belästigen.\. Da in Nord-Gencorin 
brigantisches Volk lebt, halten sie uns für 
Feinde.
'''
patched = '''
\c[10]Man\c[0]: It isn't uncommon for these people to bother
us here in Gencorin.\. Since there are Brigantians
in North Gencorin, they think we're enemies.
'''

[[dialogue]]
event = 150
page = 1
command = 65
original = '''
\c[10]Mann\c[0]: Nun ja, wie auch immer...
'''
patched = '''
\c[10]Man\c[0]: Well, anyways...
'''

[[dialogue]]
event = 150
page = 1
command = 74
original = '''
\c[10]Mann\c[0]: Einen schönen Aufenthalt, wünsche ich.
'''
patched = '''
\c[10]Man\c[0]: Enjoy your stay here, I hope.
'''

[[dialogue]]
event = 151
page = 1
command = 2
original = '''
\c[10]Junge\c[0]: Hier kommen öfters Soldaten vorbei um sich 
Waffen und Rüstung zu kaufen.\. Sogar die Wachleute 
von unten schauen hier manchmal vorbei.
'''
patched = '''
\c[10]Boy\c[0]: Soldiers often come here to buy weapons and
armor.\. Even the guards from down south sometimes
drop by here.
'''

[[dialogue]]
event = 151
page = 1
command = 5
original = '''
\c[10]Junge\c[0]: Wenn ich älter bin, möchte ich auch Soldat 
werden! 
'''
patched = '''
\c[10]Boy\c[0]: When I'm older, I wanna be a soldier too!
'''

[[dialogue]]
event = 151
page = 1
command = 10
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Dafür wirst du aber weit nach 
Westen reisen müssen,\. Junge.
'''
patched = '''
\c[2]\n[2]\c[0]: You'll have to travel far to
the west for that,\. boy.
'''

[[dialogue]]
event = 151
page = 1
command = 13
original = '''
\c[10]Junge\c[0]: Ja, das ist blöd.\. Wieso kann man sich nicht 
hier zum Soldaten ausbilden lassen?
'''
patched = '''
\c[10]Boy\c[0]: Yeah, that's stupid.\. Why can't we just be
trained as a soldier here?
'''

[[dialogue]]
event = 152
page = 1
command = 2
original = '''
\c[10]Mädchen\c[0]: Ein Uchiko!\. 
Ich will's reiten,\. will's reiten! 
'''
patched = '''
\c[10]Girl\c[0]: An uchiko!\. I wanna ride it,\. I wanna ride
it!
'''

[[dialogue]]
event = 152
page = 1
command = 7
has_portrait = true
character = '''Cibon'''
original = '''
(\c[2]\n[2]\c[0]: So wird das arme Tier nie 
seine Ruhe kriegen...)
'''
patched = '''
(\c[2]\n[2]\c[0]: The poor animal will never be
able to rest like this...)
'''

[[dialogue]]
event = 153
page = 1
command = 3
original = '''
\c[10]Braunhaarige Frau\c[0]: An der Grenze scheint es 
momentan irgendwie etwas unruhig vorzugehen.\. Weißt 
du, was es damit auf sich hat?
'''
patched = '''
\c[10]Brown-Haired Woman\c[0]: The border seems to be
a little bit restless at the moment.\.
Do you know what all this is about?
'''

[[dialogue]]
event = 153
page = 1
command = 6
original = '''
\c[10]Blonde Frau\c[0]: Ich weiß es nicht genau, aber ich hab 
gehört dass mit etwas jenseits der Grenze zu tun 
hat....
'''
patched = '''
\c[10]Blonde Woman\c[0]: I don't know exactly, but I heard
that it has something to do with those soldiers
across the border...
'''

[[dialogue]]
event = 153
page = 1
command = 9
original = '''
\c[10]Braunhaarige Frau\c[0]:  Na so etwas.\. Können sich da 
nicht Soldaten aus Domarkor drum kümmern?
'''
patched = '''
\c[10]Brown-Haired Woman\c[0]: Something like that.\. Can't
soldiers from Domarkor take care of it?
'''

[[dialogue]]
event = 153
page = 1
command = 14
original = '''
\c[10]Braunhaarige Frau\c[0]: Hast du schon gehört?\. Die 
Diebe, die den Itemladen ausgeraubt hatten wurden 
doch tatsächlich von ein paar Soldaten geschnappt!
'''
patched = '''
\c[10]Brown-Haired Woman\c[0]: Have you heard?\. The thieves
who robbed the item shop were actually caught
by a few soldiers!
'''

[[dialogue]]
event = 153
page = 1
command = 18
original = '''
\c[10]Blonde Frau\c[0]: Sie wurden geschnappt?\. Und waren es 
die aus dem Corine Plateau?
'''
patched = '''
\c[10]Blonde Woman\c[0]: They were caught?\. And was it in the
Corine Plateau?
'''

[[dialogue]]
event = 153
page = 1
command = 20
original = '''
\c[10]Braunhaarige Frau\c[0]: Nein,\. angeblich nur 3 Diebe, 
die nichts mit den Räubern aus dem Norden zu tun 
haben. 
'''
patched = '''
\c[10]Brown-Haired Woman\c[0]: No,\. supposedly only three
thieves who have nothing to do with the
robbers from the north.
'''

[[dialogue]]
event = 153
page = 1
command = 24
original = '''
\c[10]Blonde Frau\c[0]: Naja, wenigstens ein Übel weniger.
'''
patched = '''
\c[10]Blonde Woman\c[0]: Well, at least one less evil in the
world.
'''

[[dialogue]]
event = 153
page = 1
command = 27
original = '''
\c[10]Braunhaarige Frau\c[0]: Hast du schon gehört?\. Vorletzte 
Nacht sollen ein paar Sachen aus dem 
Gemischtwarenladen gestohlen worden sein.
'''
patched = '''
\c[10]Brown-Haired Woman\c[0]: Have you heard?\. The night
before yesterday, a few items were said to
have been stolen from the general store.
'''

[[dialogue]]
event = 153
page = 1
command = 31
original = '''
\c[10]Blonde Frau\c[0]: Nein!\. Waren es schon wieder die 
Räuber aus dem Norden?
'''
patched = '''
\c[10]Blonde Woman\c[0]: No!\. Was it the robbers from the
north again?
'''

[[dialogue]]
event = 153
page = 1
command = 33
original = '''
\c[10]Braunhaarige Frau\c[0]: Kann sein.\. Andererseits...\.
Normalerweise hinterlassen die Räuber immer eine 
Verwüstung, wenn sie etwas stehlen.\. Das war 
diesmal nicht so.
'''
patched = '''
\c[10]Brown-Haired Woman\c[0]: Maybe.\. On the other hand...\.
Usually the robbers always leave a mess when
they steal something.\. This wasn't the case
this time.
'''

[[dialogue]]
event = 153
page = 1
command = 38
original = '''
\c[10]Blonde Frau\c[0]: Oh,\. das ist merkwürdig...
'''
patched = '''
\c[10]Blonde Woman\c[0]: Oh,\. that's strange...
'''

[[dialogue]]
event = 155
page = 1
command = 2
original = '''
\c[10]Händler\c[0]: Ich biete hier antike Silbertaler an. 
Unterschätzt niemals ihren Sammlerwert!
'''
patched = '''
\c[10]Trader\c[0]: I offer antique silver ingots here.
Never underestimate their collector's value!
'''

[[dialogue]]
event = 156
page = 2
command = 8
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Verschlossen.\. Kein Wunder, 
bei der Uhrzeit.
'''
