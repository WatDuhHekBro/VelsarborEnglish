'''
patched = '''
\c[1]\n[1]\c[0]: Corine Plateau,\. thieves.\.
Gencorin,\. thieves.\.
Mount Toras,\. expedition.
'''

[[dialogue]]
event = 184
page = 1
command = 149
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: ...Das ist was anderes.\.
