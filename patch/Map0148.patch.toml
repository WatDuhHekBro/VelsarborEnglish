'''

[[dialogue]]
event = 184
page = 1
command = 130
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ganz genau..
'''
patched = '''
\c[2]\n[2]\c[0]: Exactly.
'''

[[dialogue]]
event = 184
page = 1
command = 132
has_portrait = true
character = '''Kento'''
original = '''
