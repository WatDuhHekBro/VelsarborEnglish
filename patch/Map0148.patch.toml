'''

[[dialogue]]
event = 184
page = 1
command = 122
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Genau.
'''
patched = '''
\c[2]\n[2]\c[0]: Exactly.
'''

[[dialogue]]
event = 184
page = 1
command = 124
has_portrait = true
character = '''Kento'''
original = '''
