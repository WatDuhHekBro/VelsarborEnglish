'''
patched = '''
\c[1]\n[1]\c[0]: This makes the existence of
this force official and it's then
only a matter of time before
Brigantia takes care of it.
'''

[[dialogue]]
event = 184
page = 1
command = 101
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: ...Wahrscheinlich...\. Stimmt.\.
Vor allem wenn sie so einen Trottel 
wie diesen Sedric, oder wie der 
hieß, dabei haben.
'''
patched = '''
\c[2]\n[2]\c[0]: Probably...\. That's right.\.
Especially if you have an idiot
like that Sedric, or whatever
his name was.
'''

[[dialogue]]
event = 184
page = 1
command = 106
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Nein wirklich, so einen 
