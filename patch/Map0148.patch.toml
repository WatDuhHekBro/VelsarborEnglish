'''
patched = '''
\c[2]\n[2]\c[0]: Just to reap all the "glory"
and everything without contacting
the others.
'''

[[dialogue]]
event = 184
page = 1
command = 117
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: ...Ja, überstürzt und 
