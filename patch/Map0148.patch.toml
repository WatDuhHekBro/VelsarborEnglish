[[dialogue]]
event = 170
page = 1
command = 14
original = '''

ACHTUNG!
'''
patched = '''

ATTENTION!
'''

[[dialogue]]
event = 170
page = 1
command = 16
original = '''

Wenn du jetzt speicherst, kannst du nicht mehr vor 
dem anstehenden Boss-Kampf aufleveln.
'''
patched = '''

If you save now, you'll no longer be able to
level up before the upcoming boss fight.
'''

[[dialogue]]
event = 170
page = 1
command = 19
original = '''

Überleg es dir also gut oder verwende einen neuen 
Spielstand.
'''
patched = '''

So think carefully or use a different slot.
'''

[[dialogue]]
event = 170
page = 1
command = 36
original = '''

Dies ist ein \c[11]Speicherpunkt\c[0].
'''
patched = '''

This is a \c[11]save point\c[0].
'''

[[dialogue]]
event = 170
page = 1
command = 38
original = '''

Wenn man auf solch einen steht, kann man \c[11]den
Spielstand speichern\c[0].
'''
patched = '''

When you stand on one of these, you can
\c[11]save the game\c[0].
'''

[[dialogue]]
event = 170
page = 1
command = 41
original = '''

Öffne dazu das \c[11]Menu\c[0] mit \c[11]Esc\c[0] und wähle
dann \c[11]Speichern\c[0].
'''
patched = '''

To do this, open the \c[11]menu\c[0] using \c[11]Esc\c[0] and
then select \c[11]Save\c[0].
'''

[[dialogue]]
event = 170
page = 1
command = 44
original = '''

Auf der \c[11]Weltkarte\c[0] kann man übigens
immer speichern.
'''
patched = '''

Additionally, you can always save on
the \c[11]world map\c[0].
'''

[[dialogue]]
event = 184
page = 1
command = 5
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ha!\. Ich freu mich schon auf 
deren Gesichter, wenn diese hohlen 
Soldatenköpfe die Gefahr mit eigenen 
Augen sehen können!
'''
patched = '''
\c[2]\n[2]\c[0]: Ha!\. I'm looking forward to the
faces of those hollow soldiers when
they see what's coming to them!
'''

[[dialogue]]
event = 184
page = 1
command = 17
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Cibon, ich hab mit den 
Grenzleuten geredet und einen 
Vorschlag gemacht.
'''
patched = '''
\c[1]\n[1]\c[0]: Cibon, I talked to the guards
and made a suggestion.
'''

[[dialogue]]
event = 184
page = 1
command = 24
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Hö?\. Sag bloß du hast die zu 
etwas überreden können.
'''
patched = '''
\c[2]\n[2]\c[0]: Huh?\. Just say you persuaded
them to do something.
'''

[[dialogue]]
event = 184
page = 1
command = 27
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Ja, heute Nacht wollen sie 
einen kleinen Späher Trupp los 
senden, den wir zum Stützpunkt 
leiten werden.
'''
patched = '''
\c[1]\n[1]\c[0]: Yes, tonight they want to send
a small scout group that we will lead
to the base.
'''

[[dialogue]]
event = 184
page = 1
command = 31
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Auf diesem Wege können wir 
die Truppe wenigstens beobachten und 
mehr Zeugen sammeln.
'''
patched = '''
\c[1]\n[1]\c[0]: This way, we can at least
observe the troops and gather
more witnesses.
'''

[[dialogue]]
event = 184
page = 1
command = 35
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Okay, das ist wenigstens 
etwas. Und das dämliche Rumlungern 
hat endlich ein Ende!
'''
patched = '''
\c[2]\n[2]\c[0]: Okay, at least that's
something. And the stupid waiting
has finally come to an end!
'''

[[dialogue]]
event = 184
page = 1
command = 39
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Wir sollten uns noch etwas 
hinlegen, damit wir heute Nacht auch 
wach genug sind.
'''
patched = '''
\c[1]\n[1]\c[0]: We should rest a bit so that
we're awake enough tonight.
'''

[[dialogue]]
event = 184
page = 1
command = 43
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Joa, verstanden.\. Werd' ich 
später noch machen.
'''
patched = '''
\c[2]\n[2]\c[0]: Got it.\. I'll do that later.
'''

[[dialogue]]
event = 184
page = 1
command = 50
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Hm..\.. am besten sollten wir 
uns etwas auf diese Nacht 
vorbereiten, Heilgegenstände kaufen 
und Kram, du weißt schon.
'''
patched = '''
\c[2]\n[2]\c[0]: Hm...\. Best that we prepare for
tonight, buy healing items and
supplies, you know.
'''

[[dialogue]]
event = 184
page = 1
command = 54
has_portrait = true
character = '''Cibon'''
original = '''
