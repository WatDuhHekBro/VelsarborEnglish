[[dialogue]]
event = 3
page = 1
command = 2
original = '''
\c[10]Sekretärin\c[0]: Tut mir Leid, aber zurzeit findet hier 
eine wichtige Besprechung statt. Wir können 
deshalb persönlichen Anfragen im Moment 
nicht entgegenkommen. 
'''
patched = '''
\c[10]Secretary\c[0]: I'm sorry, but an important meeting is
currently taking place here. We are therefore
unable to accommodate personal inquiries
at the moment.
'''

[[dialogue]]
event = 3
page = 1
command = 9
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Was haben wir hier 
überhaupt im Bezirksposten 
verloren, Kumpel?
'''
patched = '''
\c[2]\n[2]\c[0]: Do we have anything to do
here in the district post?
'''

[[dialogue]]
event = 3
page = 1
command = 13
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Du könntest dir hier etwas 
Geld leihen um deine Schulden bei
mir zu zahlen,\. zum Beispiel.
'''
patched = '''
\c[1]\n[1]\c[0]: You could borrow some money
here to pay your debts to me,\.
for example.
'''

[[dialogue]]
event = 3
page = 1
command = 17
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ach, sei still!
'''
patched = '''
\c[2]\n[2]\c[0]: Oh, shut up!
'''

[[dialogue]]
event = 6
page = 1
command = 24
original = '''
\c[10]Türsteher\c[0]:Tut mir Leid. Derzeit wird hier eine 
wichtige Besprechung abgehalten. Sie dürfen den 
Raum nicht betreten.
'''
patched = '''
\c[10]Bouncer\c[0]: I'm sorry. An important meeting is
currently being held here. You are not
authorized to enter the room.
'''

