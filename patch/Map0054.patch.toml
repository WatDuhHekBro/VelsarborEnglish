[[dialogue]]
event = 8
page = 2
command = 2
original = '''
\c[10]Mann\c[0]: Schon seit Wochen haben sie hier im 
Bezirksposten andauernd "wichtige 
Besprechungen".\. Für die kleinen Probleme 
bleibt anscheinend keine Zeit.
'''
patched = '''
\c[10]Man\c[0]: They've been having "important meetings"
here in the district post for weeks now!\.
Apparently there is no time for small
problems.
'''
