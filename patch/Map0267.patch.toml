[[dialogue]]
event = 32
page = 1
command = 2
original = '''
\c[10]Wache\c[0]: Ziemlich tiefer Abgrund oder?\. Solltet ihr 
zu lange zu schlecht Arbeit für uns leisten, kann 
es passieren, dass wir euch eines Tages einfach 
dort rein schmeißen.
'''
patched = '''
\c[10]Guard\c[0]: Pretty deep abyss, right?\. If you work
poorly for us too long, we might just end up
throwing you in there one day.
'''

[[dialogue]]
event = 32
page = 1
command = 6
original = '''
\c[10]Wache\c[0]: Wir müssen ja schließlich ökonomisch 
denken.\. Wäre doch eine Verschwendung, so schlechte 
Arbeitkräfte durchzufüttern.
'''
patched = '''
\c[10]Guard\c[0]: After all, we have to think economically.\.
It'd be quite a waste to feed such bad workers.
'''

[[dialogue]]
event = 32
page = 1
command = 9
original = '''
\c[10]Wache\c[0]: Also macht ja gute Arbeit, es sei denn ihr 
wollt unbedingt erfahren, was sich da unten in der 
Schlucht befindet.
'''
patched = '''
\c[10]Guard\c[0]: So do a good job, unless you really want to
find out what's down there.
'''

[[text]]
event = 27
page = 1
command = 9
original = '''Ja, das interessiert mich jetzt./Nein, danke.'''
patched = '''Yes, that'd be interesting./No thanks.'''

