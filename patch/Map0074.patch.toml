original = '''
\c[2]\n[2]\c[0]: Ich weiß es auch nicht genau. 
Sie können sich ja denken, dass er 
nicht sehr gerne darüber spricht.
'''
patched = '''
\c[2]\n[2]\c[0]: I don't really know either.
You can imagine that he doesn't like
to talk about it very much.
'''

[[dialogue]]
event = 6
page = 2
command = 273
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Jedenfalls wissen fast alle 
hier von seiner Einstellung.\. 
Kento hat das gleich zu Anfang mehr 
als deutlich klar gestellt.
'''
patched = '''
\c[2]\n[2]\c[0]: Anyways, almost everyone here
knows about his feelings toward him.\.
Kento made this very clear from the
start.
'''

[[dialogue]]
event = 6
page = 2
command = 278
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Das war zu dem Zeitpunkt, wo 
wir die Ausbildung zum Soldaten 
begannen. 
'''
patched = '''
\c[2]\n[2]\c[0]: That's when we started our
training as soldiers.
'''

[[dialogue]]
event = 6
page = 2
command = 282
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Es war die erste Versammlung, 
wo die Grundregeln der Ausbildung 
geklärt wurden\....
'''
patched = '''
\c[2]\n[2]\c[0]: It was the first meeting where
the basic rules of training were
clarified...
'''

[[dialogue]]
event = 6
page = 3
command = 12
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: So wurde schnell überall von 
Kentos Einstellung zu seinem Vater 
bekannt.
'''
patched = '''
\c[2]\n[2]\c[0]: So Kento's feelings toward
his father quickly became known
everywhere.
'''

[[dialogue]]
event = 6
page = 3
command = 17
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Die meisten hielten sich 
seitdem von Kento fern. Zumindest 
die nächsten Monate. 
'''
patched = '''
\c[2]\n[2]\c[0]: Most just stayed away from
Kento ever since then. At least
for the next few months.
'''

[[dialogue]]
event = 6
page = 3
command = 21
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ich glaube ich war einer der 
Wenigen, die noch normal mit ihm 
geredet haben.\. Deswegen haben wir 
uns schnell angefreundet.
'''
patched = '''
\c[2]\n[2]\c[0]: I think I was one of the few
people who still talked to him
normally.\. That's why we quickly
became friends.
'''

[[dialogue]]
event = 6
page = 3
command = 26
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ansonsten ist Kento 
eigentlich ein richtig netter Kerl, 
nur manchmal ist er ein bisschen 
komisch drauf.
'''
patched = '''
\c[2]\n[2]\c[0]: Otherwise,\. Kento is actually
a really nice guy, even if he's
sometimes a little weird.
'''

[[dialogue]]
event = 6
page = 3
command = 34
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Hm...\. Ich verstehe. 
Sagen sie ihm bitte, dass es mir 
wirklich Leid tut.\. 
Ich wusste von all dem nichts.
'''
patched = '''
\c[6]\n[6]\c[0]: Hm...\. I see.\. Please tell him
I'm really sorry.\. I didn't know any
of this.
'''

[[dialogue]]
event = 6
page = 3
command = 39
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ach, machen sie sich da 
keinen Kopf drum!\. Er wird ihnen 
schon verzeihen.
'''
patched = '''
\c[2]\n[2]\c[0]: Oh, don't worry!\.
He'll forgive you.
'''

[[dialogue]]
event = 7
page = 1
command = 3
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Oh, hallo.\. Öhm...\.
Haben Sie noch irgendwelche Fragen, 
was Signum-Zauber angeht?
'''
patched = '''
\c[6]\n[6]\c[0]: Oh hello.\. Um...\. Do you have
any questions about Signum magic?
'''

[[dialogue]]
event = 7
page = 1
command = 11
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Sie lernen Signum-Zauber, 
indem Sie Element-Kugeln in die 
Waffe oder in das Armband koppeln 
und damit im Kampf Exp erhalten.
'''
patched = '''
\c[6]\n[6]\c[0]: You learn Signum magic by
coupling elemental orbs into your
weapon or armband and gaining EXP
in combat.
'''

[[dialogue]]
event = 7
page = 1
command = 15
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Dadurch geht ein Teil der 
Erfahrung auf die Level der Elemente 
ein, zu denen man die passende 
Kugeln gekoppelt hat.
'''
patched = '''
\c[6]\n[6]\c[0]: This means that part of the
experience focuses on the level of
the elements you've coupled to the
orbs.
'''

[[dialogue]]
event = 7
page = 1
command = 19
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Das Angriff-Level des Elements 
steigt, wenn man die Kugel in die 
Waffe koppelt.
'''
patched = '''
\c[6]\n[6]\c[0]: The element's attack level
increases when you couple the orb
into a weapon.
'''

[[dialogue]]
event = 7
page = 1
command = 22
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Das Abwehr-Level des 
Elements steigt, wenn man die Kugel 
in das Armband koppelt.
'''
patched = '''
\c[6]\n[6]\c[0]: The element's defense level
increases when you couple the orb
into an armband.
'''

[[dialogue]]
event = 7
page = 1
command = 25
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Ein Beispiel: Koppeln sie eine 
Feuerkugel in die Waffe und ein 
Wasserkugel in das Armband,...
'''
patched = '''
\c[6]\n[6]\c[0]: For example: Couple a fire
orb into a weapon and a water orb
into an armband...
'''

[[dialogue]]
event = 7
page = 1
command = 28
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: ...dann steigt das Feuer-
Angriff-Level und das Wasser-
Abwehr-Level.
'''
patched = '''
\c[6]\n[6]\c[0]: ...then the fire attack level
and the water defense level will
rise.
'''

[[dialogue]]
event = 7
page = 1
command = 31
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Koppeln Sie mehrere gleiche 
Kugeln in die Waffe oder in das 
Armband, stiegt das jeweilige 
Element-Level natürlich schneller.
'''
patched = '''
\c[6]\n[6]\c[0]: If you couple several orbs of
the same type into a weapon or into
an armband, the respective element
level will of course rise faster.
'''

[[dialogue]]
event = 7
page = 1
command = 38
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Beachten Sie, dass die 
Anzahl der Exp, die Sie für ein 
Element-Level bekommen, nicht von 
dem Element-Level selber abhängt.
'''
patched = '''
\c[6]\n[6]\c[0]: Be aware that the amount of
EXP you get for an element level
doesn't depend on the element
level itself.
'''

[[dialogue]]
event = 7
page = 1
command = 42
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Die Anzahl der Exp, die Sie 
erhalten richten sich immer an das 
Level des Charakters im Vergleich 
zum Level der Gegner.
'''
patched = '''
\c[6]\n[6]\c[0]: The amount of EXP you receive
is always based on the level of the
character along with the level of
the opponents.
'''

[[dialogue]]
event = 7
page = 1
command = 46
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Das heißt, mit steigendem 
Charakter-Level bekommen Sie 
immer weniger Exp.
'''
patched = '''
\c[6]\n[6]\c[0]: That means that as your
character level increases, you
gain less and less EXP.
'''

[[dialogue]]
event = 7
page = 1
command = 49
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Wenn Sie also ohne Element-
Kugeln in der Ausrüstung kämpfen, 
haben die EXP keine Wirkung auf die 
Element-Level.
'''
patched = '''
\c[6]\n[6]\c[0]: So if you fight without
elemental orbs in the equipment,
the EXP has no effect on the
element level.
'''

[[dialogue]]
event = 7
page = 1
command = 53
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Und trotzdem bekommen Sie 
immer weniger Exp, wenn das 
Charakter-Level steigt.
'''
patched = '''
\c[6]\n[6]\c[0]: And you still get less EXP
when the character level increases.
'''

[[dialogue]]
event = 7
page = 1
command = 56
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Sie sollten also möglichst 
immer so viele Element-Kugeln 
eingekoppelt haben wie möglich.
'''
patched = '''
\c[6]\n[6]\c[0]: So you should always have as
many elemental orbs coupled in as
possible.
'''

[[dialogue]]
event = 7
page = 1
command = 59
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Achten Sie auch darauf, das ein 
Element-Level nicht mehr steigt, 
wenn es genauso hoch wie das 
Charakter-Level ist. 
'''
patched = '''
\c[6]\n[6]\c[0]: Also, be aware that an element
level no longer increases if it's
as high as the character level.
'''

[[dialogue]]
event = 7
page = 1
command = 66
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Hat man Element-Kugeln in 
der Ausrüstung, zeigen die Elemente 
der Kugeln immer eine kleine Wirkung 
beim Angriff oder bei der Abwehr.
'''
patched = '''
\c[6]\n[6]\c[0]: If you equip elemental orbs,
those elements will always have a
small effect on attack or defense.
'''

[[dialogue]]
event = 7
page = 1
command = 70
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Je mehr Kugeln eines 
Elementes in Waffe oder Rüstung 
eingekoppelt sind, desto größer ist 
die Wirkung dieses Elements.
'''
patched = '''
\c[6]\n[6]\c[0]: The more orbs of an element
are coupled into the weapon or armor,
the greater the effect of this
element.
'''

[[dialogue]]
event = 7
page = 1
command = 74
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Koppelt man in die Waffe, 
zeigen die Elemente Wirkung auf den 
Angriff. Der Angriff bekommt die 
Elemente als "Attribut".
'''
patched = '''
\c[6]\n[6]\c[0]: Coupled into a weapon, the
elements have an effect on the
attack. The attack gets the effects
of these elements as "attributes".
'''

[[dialogue]]
event = 7
page = 1
command = 78
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Beispielweise hat eine Waffe  
mit einigen Feuer-Kugeln, ein 
leichtes Feuer-Attribut und zieht 
bei Eis-Gegnern etwas mehr ab.
'''
patched = '''
\c[6]\n[6]\c[0]: For example, a weapon with
some fire orbs equipped has a fire
attribute and deals a little more
damage on ice-based opponents.
'''

[[dialogue]]
event = 7
page = 1
command = 82
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Koppelt man in das Armband, 
geben die Elemente einen kleinen 
Schutz vor Angriffen ihres 
Elementes.
'''
patched = '''
\c[6]\n[6]\c[0]: Coupled into an armband, the
elements give a little protection
against attacks by that element.
'''

[[dialogue]]
event = 7
page = 1
command = 86
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Ein Armband mit einigen 
Wasser-Kugeln schützt so zum 
Beispiel vor Techniken wie Wasser-
Elementaren Angriffen.
'''
patched = '''
\c[6]\n[6]\c[0]: For example, an armband with
a few water orbs protects against
techniques such as water elemental
attacks.
'''

[[dialogue]]
event = 7
page = 1
command = 99
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Gibt es sonst noch Fragen?
'''
patched = '''
\c[6]\n[6]\c[0]: Do you have any other
questions?
'''

[[dialogue]]
event = 7
page = 1
command = 106
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Am Anfang ist es immer 
Ratsam, die ersten Signum-Techniken 
eines jeden Elementes zu erlernen.
'''
patched = '''
\c[6]\n[6]\c[0]: In the beginning, it's always
advisable to learn the first Signum
techniques of each element.
'''

[[dialogue]]
event = 7
page = 1
command = 109
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Das bedeutet: Haben sie die 1. 
Angriffs-Technik eines Elementes 
erlernt, steigern Sie als nächstes 
am besten ein anderes Angriffs-Level
'''
patched = '''
\c[6]\n[6]\c[0]: That means: If you learned the
first technique of an element, the
next best thing to do is to raise
that element to another level.
'''

[[dialogue]]
event = 7
page = 1
command = 113
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Wenn Sie immer die 1. 
Techniken lernen habt ihr recht 
schnell eine kleine Auswahl von 
verschiedenen Signum-Techniken.
'''
patched = '''
\c[6]\n[6]\c[0]: If you always learn the first
techniques, you'll quickly have a
wide pool of different Signum
techniques to choose from.
'''

[[dialogue]]
event = 7
page = 1
command = 117
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Ansonsten sollten Sie, wenn Sie 
neuen Gegnern begegnen, die viel 
Erfahrung geben, vorzugsweise die 
Ausrüstung so wählen, ...
'''
patched = '''
\c[6]\n[6]\c[0]: Otherwise, if you're
encountering new opponents that gives
lots of experience, you should
preferably choose the equipment...
'''

[[dialogue]]
event = 7
page = 1
command = 121
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: ...dass sie so viele Element-
Kugeln wie möglich einkoppeln 
können. Gerade wenn man gut 
aufstufen kann, ist das ratsam.
'''
patched = '''
\c[6]\n[6]\c[0]: ...that allows you to couple
as many elemental orbs as possible.
It's advisable if you can level up
well.
'''

[[dialogue]]
event = 7
page = 1
command = 128
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Die Verwendung von Signum-
Technken zerrt an ihren Mental-
Punkte-Vorrat, der bei jedem 
Charakter unterschiedlich groß ist.
'''
patched = '''
\c[6]\n[6]\c[0]: The use of Signum techniques
uses up your magic points (MP), and
the amount is different for each
character.
'''

[[dialogue]]
event = 7
page = 1
command = 132
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Mental Punkte regenerieren 
sich, wenn man schläft oder 
Heilitems wie "Mentaltropfen" 
verwendet.
'''
patched = '''
\c[6]\n[6]\c[0]: Magic points regenerate when
you sleep or use healing items like
"mana droplets".
'''

[[dialogue]]
event = 7
page = 1
command = 136
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Ansonsten heilt sich auch ein 
kleiner Teil der Mental-Punkte, wenn 
man am Ende des Kampfes noch ein 
paar SP übrig hat.
'''
patched = '''
\c[6]\n[6]\c[0]: Otherwise, a small part of
your magic points heals if you have
some SP left at the end of a battle.
'''

[[dialogue]]
event = 7
page = 1
command = 149
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Gibt es sonst noch Fragen?
'''
patched = '''
\c[6]\n[6]\c[0]: Do you have any other
questions?
'''

[[dialogue]]
event = 7
page = 1
command = 153
has_portrait = true
character = '''Ileya'''
original = '''
\c[6]\n[6]\c[0]: Ich hoffe, ich konnte 
behilflich sein.
'''
patched = '''
\c[6]\n[6]\c[0]: I hope I helped.
'''

