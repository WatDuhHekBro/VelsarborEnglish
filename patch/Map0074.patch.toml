[[dialogue]]
event = 4
page = 1
command = 2
original = '''
\c[10]Soldat vom Briganten-Orden\c[0]: Ich hab gehört, 
dass man irgendwann recht interessante 
Haltungs-Signum erlernen können soll.
'''
patched = '''
\c[10]Brigantian Soldier\c[0]: I heard that one should
be able to learn quite interesting Auxiliary
Signums at some point.
'''

[[dialogue]]
event = 4
page = 1
command = 5
original = '''
\c[10]Soldat vom Briganten-Orden\c[0]: Es handelt sich 
dabei um Zauber, die hauptsächlich einen 
starken Schutz bieten, oder den Helden sonst 
unterstützen.
'''
patched = '''
\c[10]Brigantian Soldier\c[0]: These are spells that mainly
offer strong protection or otherwise support
the party.
'''

[[dialogue]]
event = 4
page = 1
command = 9
original = '''
\c[10]Soldat vom Briganten-Orden\c[0]: Zum Beispiel 
Ferresschild.\. Dieser Zauber soll einen für eine 
Zeit vor physischen Attacken schützen. ... Wann 
ich wohl diese Zauber erlernen werde?
'''
patched = '''
\c[10]Brigantian Soldier\c[0]: For example, Ferres Shield.\.
This spell is supposed to protect you from
physical attacks for a while. When will I
learn these spells?
'''

[[dialogue]]
event = 5
page = 1
command = 2
original = '''
\c[10]Soldat vom Briganten-Orden\c[0]: Alle Signum-
Techniken verbrauchen MP, Mentalskraft-
Punkte. 
'''
patched = '''
\c[10]Brigantian Soldier\c[0]: All Signum techniques
use MP, Magic Points.
'''

[[dialogue]]
event = 5
page = 1
command = 5
original = '''
\c[10]Soldat vom Briganten-Orden\c[0]: Sind alle MP 
einmal verbraucht, sind wir nicht mehr fähig, 
unsere mentalen Kräfte zu bündeln.\. Man kann
sich halt nicht mehr konzentrieren.
'''
patched = '''
\c[10]Brigantian Soldier\c[0]: Once all of your MP
has been used up, you are no longer able
to use your magic abilities.\. You can't
channel your magic anymore.
'''

[[dialogue]]
event = 5
page = 1
command = 9
original = '''
\c[10]Soldat vom Briganten-Orden\c[0]: Gegenstände wie 
Mentaltropfen regenerieren da zum Glück eine 
bestimmte Anzahl von MP.\. Du solltest so was 
unbedingt mit dir tragen.
'''
patched = '''
\c[10]Brigantian Soldier\c[0]: Fortunately, items such as
mana droplets regenerate a certain amount of MP.\.
You should definitely carry some with you.
'''

