[[dialogue]]
event = 2
page = 1
command = 2
original = '''
\c[10]Postbote\c[0]: Hm...\. die Postboten aus Korzojeno, die 
hier alle 3 Tage regelmäßig ankommen, haben 
diesmal ziemliche Verspätung.\. Irgendwas 
stimmt da nicht.
'''
patched = '''
\c[10]Postman\c[0]: Hm...\. the postmen from Korzojeno who
arrive here regularly every three days are
quite late this time around.\. Something's
wrong.
'''

[[dialogue]]
event = 3
page = 1
command = 2
original = '''
\c[10]Postbote\c[0]: Hmpf,\. als nächstes wartet auf mich ein 
langer Ritt in den hohen Norden von Korzojeno.\. 
Das wird sehr anstrengend werden, also muss 
ich mich seelisch darauf vorbereiten.
'''
patched = '''
\c[10]Postman\c[0]: Hmph,\. next is a long ride to the far
north of Korzojeno.\. It'll be very exhausting,\.
so I have to prepare myself mentally.
'''

[[dialogue]]
event = 4
page = 2
command = 2
original = '''
\c[10]Postbote\c[0]: Mann, wir sind hier schon ein armer 
Verein.\. Wir Postboten können uns in den Pausen 
hier im Lagerraum aufhalten.\. Kein Geld für einen 
speziellen Raum dafür...
'''
patched = '''
\c[10]Postman\c[0]: Man, we're already a poor group here.\.
We postmen can stay here in the storage room
during the breaks.\. No money for a special
lounge for that...
'''

[[dialogue]]
event = 5
page = 1
command = 2
original = '''
\c[10]Postbote\c[0]: Ich wurde ja vor allem deswegen 
Postbote, weil ich unbedingt Uchikos reiten 
wollte.\. Jetzt tut mir ständig mein Hintern davon 
weh... 
'''
patched = '''
\c[10]Postman\c[0]: I became a postman mainly because
I really wanted to ride uchikos.\. Now my butt
hurts all the time...
'''

[[dialogue]]
event = 5
page = 1
command = 6
original = '''
\c[10]Postbote\c[0]: Muss daran liegen, dass ich es einfach 
noch nicht gewohnt bin.\. Das wird schon.
'''
patched = '''
\c[10]Postman\c[0]: Must be because I'm just not used to it.\.
Eh, I'll be fine.
'''
