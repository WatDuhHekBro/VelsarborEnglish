[[dialogue]]
event = 3
page = 2
command = 2
original = '''
\c[10]Händler\c[0]: Soldaten des Briganten-Orden?\. Solltet ihr 
vorhaben nach Korzojeno zu wandern, rechnet damit, 
dass viele Leute nicht gut auf euch zu sprechen 
sein werden.
'''
patched = '''
\c[10]Merchant\c[0]: Soldiers from the Brigantine Order?\.
If you intend to travel to Korzojeno, expect
that many people won't be very friendly
towards you.
'''

[[dialogue]]
event = 3
page = 2
command = 6
original = '''
\c[10]Händler\c[0]: Der Verlauf der Geschichte hat uns zu 
ihren Feinden gemacht,\. so wie es aussieht.
'''
patched = '''
\c[10]Merchant\c[0]: The course of history has made us their
enemies,\. it seems.
'''
