[[dialogue]]
event = 3
page = 1
command = 2
original = '''
\c[10]Gefangener\c[0]: Wenn man mal etwas zu wenig Erz 
schürft, kriegt man hier gleich weniger Essen. \.
Denen ist komplett egal, wie die körperliche 
Verfassung von dir ist.
'''
patched = '''
\c[10]Prisoner\c[0]: If you don't mine enough ore, you get
less and less food here.\. They don't care what
your physical condition is.
'''

[[dialogue]]
event = 3
page = 1
command = 6
original = '''
\c[10]Gefangener\c[0]: Das heißt: wer alt und schwach ist, 
kriegt weniger zu essen und wird noch schwächer.
'''
patched = '''
\c[10]Prisoner\c[0]: That means that those too old and weak
get less to eat and become even weaker.
'''

[[dialogue]]
event = 4
page = 1
command = 2
original = '''
\c[10]Gefangener\c[0]: Das Essen hier schmeckt wirklich 
grausam.\. Aber Hauptsache, man wird satt.
'''
patched = '''
\c[10]Prisoner\c[0]: The food here is horrendous.\. But all
that matters is that you get something in your
stomach.
'''

[[dialogue]]
event = 9
page = 1
command = 2
original = '''
\c[10]Gefangener\c[0]: Dieses Leuchten der Wände irritiert 
mich...\. Ich dachte mit der Zeit würde ich mich 
dran gewöhnen, aber es lässt einfach nicht nach.
'''
patched = '''
\c[10]Prisoner\c[0]: The glow of these walls irritates me...\.
I thought I'd get used to it as time went on, but
it's as irritating as always.
'''

[[dialogue]]
event = 9
page = 1
command = 5
original = '''
\c[10]Gefangener\c[0]: Nachts kann ich deshalb kaum in meiner 
Zelle schlafen...\. Wenn ich doch nur etwas hätte, 
womit ich die Wände abdecken könnte - aber nein, 
Gefangene haben ja keinen Besitz.
'''
patched = '''
\c[10]Prisoner\c[0]: That's why I can hardly sleep in my cell
at night...\. If only I had something to cover the
walls with, but no, prisoners don't get anything.
'''

[[dialogue]]
event = 12
page = 1
command = 2
original = '''
\c[10]Gefangene\c[0]: Seid ihr eigentlich schon diesem 
blonden General über dem Weg gelaufen?\. Sir Dolaros 
ist sein Name.\. Was für ein Mann!
'''
patched = '''
\c[10]Prisoner\c[0]: Did any of you happen to run into this
strapping blond general before?\. Sir Dolaros is
his name.\. What a man!
'''

[[dialogue]]
event = 12
page = 1
command = 5
original = '''
\c[10]Gefangene\c[0]: Ich hab gehört, dass er ab und zu 
bestimmte Gefangene verhört und dabei wirklich 
hart ran geht...
'''
patched = '''
\c[10]Prisoner\c[0]: I heard he interrogates certain
prisoners every now and then and gets
really hard at it...
'''

[[dialogue]]
event = 12
page = 1
command = 8
original = '''
\c[10]Gefangene\c[0]: Hach ja...\. Ich wünschte, ich wäre mal 
die Gefangene, die er verhören würde...
'''
patched = '''
\c[10]Prisoner\c[0]: Oh yeah...\. I wish I were the prisoner
he'd interrogate...
'''

[[dialogue]]
event = 12
page = 1
command = 12
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: D...\. Das...\. Mir fehlen die 
Worte.
'''
patched = '''
\c[1]\n[1]\c[0]: T...\. That...\. I have no words.
'''

[[dialogue]]
event = 12
page = 1
command = 16
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: ...\. I...\. Ich weiß gar nicht 
wo ich anfangen soll....
'''
patched = '''
\c[2]\n[2]\c[0]: I...\. I don't even know where to
begin...
'''

[[dialogue]]
event = 12
page = 1
command = 22
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: So...\. So falsch,\. das ist so 
falsch!
'''
patched = '''
\c[13]\n[3]\c[0]: So...\. So wrong,\. that's so wrong!
'''

[[dialogue]]
event = 14
page = 1
command = 3
original = '''
\c[10]Gefangener\c[0]: Ah, die Ex-Soldaten vom Briganten-
Orden. Mich wundert es recht wenig, dass bei euch 
auch noch eine Frau dabei ist.
'''
patched = '''
\c[10]Prisoner\c[0]: Ah, the ex-soldiers of the Brigantine
Order. Hardly surprised that there's also a
woman with you.
'''

[[dialogue]]
event = 14
page = 1
command = 6
original = '''
\c[10]Gefangener\c[0]: Das kommt davon, wenn man Geschlechter 
in Rollen reinsetzt, wo sie einfach nicht 
reinpassen!\. Ich würde auch verrückt werden, wenn 
ich ständig vor dem Herd stehen würde!
'''
patched = '''
\c[10]Prisoner\c[0]: That's what happens when you put genders
into roles they don't belong!\. I'd also go crazy if
I had to keep standing in front of the stove!
'''

[[dialogue]]
event = 14
page = 1
command = 12
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Also...\. so eine unverschämte 
Frechheit!\. Das ich hier im Gefängnis 
bin, hat in absolut keiner Hinsicht 
auch nur entfernt mit meinem...\.\.\^
'''
patched = '''
\c[13]\n[3]\c[0]: You've got some nerve saying
stuff like that!\. Me being here in
prison isn't even remotely related
to...\.\.\^
'''

[[dialogue]]
event = 14
page = 1
command = 17
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Ist gut, Soko.\. Einfach 
ignorieren, einfach ignorieren.
'''
patched = '''
\c[1]\n[1]\c[0]: It's okay, Soko.\. Ignore him,
ignore him.
'''

[[dialogue]]
event = 14
page = 1
command = 23
original = '''
\c[10]Gefangener\c[0]: Lasst mich in Frieden.
'''
patched = '''
\c[10]Prisoner\c[0]: Leave me alone.
'''

[[dialogue]]
event = 16
page = 1
command = 2
original = '''
\c[10]Gefangener\c[0]: Hab ihr schon mitbekommen, dass sie 
sogar Monster in den Turnierkämpfen teilnehmen 
lassen?\. Das sind dann irgendwelche Pseudo-Teams, 
die von den Wächtern gehalten werden.
'''
patched = '''
\c[10]Prisoner\c[0]: Did you notice that they're already
letting even monsters take part in the tournament?\.
These are the guards' psuedo teams they keep
around.
'''

[[dialogue]]
event = 16
page = 1
command = 6
original = '''
\c[10]Gefangener\c[0]: Was ich mich allerdings frage...\. Wo 
sperren sie die Viecher ein, wenn sie nicht gerade 
in der Arena sind?
'''
patched = '''
\c[10]Prisoner\c[0]: Though I have to wonder...\. Where do they
lock them up when they're not in the arena?
'''

[[dialogue]]
event = 17
page = 1
command = 2
original = '''
\c[10]Gefangene\c[0]: Heute hab ich schon wieder einen dieser 
ekligen, zaubernden Würmer gesehen, da unten in 
der Mine.\. Bei diesem Anblick vergeht mir immer der 
Appetit für den Rest des Tages.
'''
patched = '''
\c[10]Prisoner\c[0]: Today, I saw one of those nasty
magic-using worms down there in the mine.\.
Every time I see them, I always lose my
appetite for the rest of the day.
'''

[[dialogue]]
event = 17
page = 1
command = 9
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Ist dann bei dir noch etwas 
übrig geblieben?
'''
patched = '''
\c[1]\n[1]\c[0]: You still have to have some
appetite left, right?
'''

[[dialogue]]
event = 17
page = 1
command = 12
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Das lässt du schön bleiben, 
Kento!
'''
patched = '''
\c[13]\n[3]\c[0]: Oh no you don't, Kento!
'''

[[dialogue]]
event = 20
page = 1
command = 2
original = '''
\c[10]Gefangener\c[0]: Ich war vorher mal in einem Gefängnis 
in Domarkor -\. Das waren harte Zeiten.\. Dort hatte 
man absolut gar keinen Freilauf und Essen gab es 
alle 2 bis 3 Tage.
'''
patched = '''
\c[10]Prisoner\c[0]: I was in a prison in Domarkor before.\.
Those were tough times.\. There, you had absolutely
no freedom to move and there was only food every
2 to 3 days.
'''

[[dialogue]]
event = 20
page = 1
command = 6
original = '''
\c[10]Gefangener\c[0]: Das hier ist weniger ein Gefängnis als 
ein Arbeitslager, wenn du mich fragst. \.Brigantia 
scheint es wirklich vorrangig um das Eisen zu 
gehen.
'''
patched = '''
\c[10]Prisoner\c[0]: This is less of a prison and more like a
labor camp if you ask me.\. Brigantia really seems
to be primarily concerned with iron rather than
torture.
'''

[[dialogue]]
event = 25
page = 1
command = 2
original = '''
\c[10]Gefangener\c[0]: Ich kann all diese Leute, die am 
Feierabend noch am Turnier teilnehmen oder da 
zuschauen, wirklich nicht verstehen. \.Alles was ich 
will, ist zurück in meine Zelle.
'''
patched = '''
\c[10]Prisoner\c[0]: I really don't get all of these people
who still play or watch the tournament after work.\.
All I want to do is go back into my cell.
'''

[[dialogue]]
event = 26
page = 1
command = 2
original = '''
\c[10]Gefangener\c[0]: Falls ihr euch fragt, wozu dieses 
Podest da oben ist - ab und zu stellen sich 
Wächter dort hin und verkünden irgendwelche Sachen 
an alle Gefangenen in der Kantine.
'''
patched = '''
\c[10]Prisoner\c[0]: If you wonder what that platform up
there is for. Guards sometimes stand there and
announce things to all the prisoners in the cafe.
'''

[[dialogue]]
event = 26
page = 1
command = 6
original = '''
\c[10]Gefangener\c[0]: Kommt besser nicht auf die Idee, euch 
selber dort hinzustellen und irgendwelchen Quatsch 
zu machen.\. Die Wächter sehen das äußerst ungern.
'''
patched = '''
\c[10]Prisoner\c[0]: You'd do well to not put yourself up
there and draw a bunch of attention.\. The
guards really don't like seeing this.
'''

[[dialogue]]
event = 28
page = 1
command = 2
original = '''
\c[10]Gefangener\c[0]: Jetzt bin ich schon 3 Wochen hier... \.
Ich hasse es, wie konnte ich nur hier landen?\. 
Alles was ich getan habe, war etwas 
Taschendiebstahl... 
'''
patched = '''
\c[10]Prisoner\c[0]: I've been here for three weeks now...\.
I hate it, how did I end up here?\. All I did was
pickpocket...
'''

[[dialogue]]
event = 28
page = 1
command = 6
original = '''
\c[10]Gefangener\c[0]: Und nun bin ich hier und schufte mich 
zu Tode.\. Ich vermisse meine Familie...
'''
patched = '''
\c[10]Prisoner\c[0]: And now I'm here to work until my dying
breath.\. I miss my family...
'''

[[dialogue]]
event = 28
page = 1
command = 12
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Verbrechen müssen halt 
bestraft werden...
'''
patched = '''
\c[13]\n[3]\c[0]: Crimes have to be punished...
'''

[[dialogue]]
event = 28
page = 1
command = 15
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ja, aber so etwas wegen ein 
bisschen Taschendiebstahl?\. Findest 
du nicht, dass das etwas zu weit 
geht?
'''
patched = '''
\c[2]\n[2]\c[0]: Yeah, but all of this just
because of a little pickpocketing?\.
Don't you think this went a little
too far?
'''

[[dialogue]]
event = 28
page = 1
command = 20
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Ich denke, das Problem ist, 
dass hier alle Gefangenen das 
gleiche Schicksal erwartet, 
unabhängig davon, wieso.
'''
patched = '''
\c[1]\n[1]\c[0]: I think the problem is that all
prisoners face the same fate here,
regardless of why.
'''

[[dialogue]]
event = 28
page = 1
command = 31
original = '''
\c[10]Gefangene\c[0]: Was ich mich allerdings frage...\. Wo 
sperren sie die Viecher ein, wenn sie nicht gerade 
in der Arena sind?
'''
patched = '''
\c[10]Prisoner\c[0]: There has to be a way out of here...\.
I can't live the rest of my life like this...
'''

[[dialogue]]
event = 34
page = 1
command = 2
original = '''
\c[10]Gefangener\c[0]: Verdammt, ich hab noch Hunger, aber 
Nachschlag gibt es nicht!\. Ich muss härter 
arbeiten, damit meine Portion größer wird...
'''
patched = '''
\c[10]Prisoner\c[0]: Damn, I'm still hungry, but there aren't
any second helpings!\. I'll have to work harder to
make my portion bigger...
'''

[[dialogue]]
event = 34
page = 1
command = 9
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Die Idee, die Gefangen durch 
die Essensrationen zu motivieren, 
scheint ja ausgezeichnet zu 
funktionieren... 
'''
patched = '''
\c[13]\n[3]\c[0]: The idea of motivating prisoners
by controlling how much food they get
seems to work rather well...
'''

[[dialogue]]
event = 34
page = 1
command = 14
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Wie erbärmlich.
'''
patched = '''
\c[13]\n[3]\c[0]: Disgusting.
'''

[[dialogue]]
event = 34
page = 1
command = 16
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Morgen werden wir uns 
besonders ins Zeug legen, 
nicht wahr, Kumpel?
'''
patched = '''
\c[2]\n[2]\c[0]: We're gonna do our best
tomorrow, aren't we, Kento?
'''

[[dialogue]]
event = 34
page = 1
command = 20
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Du sagst es!\. Die Portionen 
müssen größer werden.
'''
patched = '''
\c[1]\n[1]\c[0]: You said it!\. We have to make
our portions bigger.
'''

[[dialogue]]
event = 34
page = 1
command = 23
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: ...\. so erbärmlich...
'''
patched = '''
\c[13]\n[3]\c[0]: Truly reprehensible...
'''

[[dialogue]]
event = 45
page = 1
command = 46
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: ...\.Das war ja fast gar nichts 
zu Essen!
'''
patched = '''
\c[2]\n[2]\c[0]: There's barely anything to eat!
'''

[[dialogue]]
event = 45
page = 1
command = 49
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: ...\.Hunger...
'''
patched = '''
\c[1]\n[1]\c[0]: ...so\. hungry...
'''

[[dialogue]]
event = 45
page = 1
command = 51
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Was sagten sie?\. Wenn wir 
schlechte Arbeit in den Mine 
leisten, kriegen wir kein Essen... \.
Sie meinten das ernst...
'''
patched = '''
\c[13]\n[3]\c[0]: Oh what'd they say again?\. That
if we do badly in the mine, we won't
get any food...\. They really weren't
kidding around...
'''

[[dialogue]]
event = 45
page = 1
command = 59
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Wir müssen uns mehr 
reinhängen, Kumpel, sonst halten wir 
das nicht lange durch!
'''
patched = '''
\c[2]\n[2]\c[0]: We gotta give it our all Kento,
otherwise we won't last much longer!
'''

[[dialogue]]
event = 45
page = 1
command = 63
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: ...Ja...
'''
patched = '''
\c[1]\n[1]\c[0]: Yeah...
'''

[[dialogue]]
event = 45
page = 1
command = 77
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: ...\.Ich bin zwar immer noch 
hungrig...\. aber naja, ich denke, ich 
werd's überleben.
'''
patched = '''
\c[2]\n[2]\c[0]: I'm still hungry...\. But I think
I'll survive.
'''

[[dialogue]]
event = 45
page = 1
command = 81
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: ...\.Ich nicht.\. Heute Abend 
werde ich verhungern.
'''
patched = '''
\c[1]\n[1]\c[0]: I don't.\. I'm gonna starve to
death tonight.
'''

[[dialogue]]
event = 45
page = 1
command = 84
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Reiß dich zusammen, Kumpel!\.
Wenn du unbedingt mehr Essen haben 
willst, müssen wir uns etwas mehr in 
der Mine anstrengen.
'''
patched = '''
\c[2]\n[2]\c[0]: Pull yourself together, Kento!\.
If you really want to have more food,
we have to put a little more effort
down in the mine.
'''

[[dialogue]]
event = 45
page = 1
command = 89
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Ich fand es war genug...\.
wirklich...
'''
patched = '''
\c[13]\n[3]\c[0]: I thought it was enough...\.
really...
'''

[[dialogue]]
event = 45
page = 1
command = 104
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: He, das war mehr als ich 
erwartet habe.\. Also ich bin satt.
'''
patched = '''
\c[2]\n[2]\c[0]: Hey, that was more than I
expected.\. I'm full.
'''

[[dialogue]]
event = 45
page = 1
command = 107
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Naja, es sollte reichen...\.
Zum Überleben...
'''
patched = '''
\c[1]\n[1]\c[0]: Well, this should be enough...\.
to survive at least...
'''

[[dialogue]]
event = 45
page = 1
command = 111
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]:...\.Ja,\. mehr als genug...
'''
patched = '''
\c[13]\n[3]\c[0]: More than enough actually...
'''

[[dialogue]]
event = 45
page = 1
command = 122
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Woa!\. Ich bin voll!\. Hätte mir 
nie erträumen lassen, dass die uns 
soviel zu Essen geben!
'''
patched = '''
\c[2]\n[2]\c[0]: Whoa!\. I'm completely full!\.
I never dreamed that they'd give
us so much food!
'''

[[dialogue]]
event = 45
page = 1
command = 126
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Offensichtlich haben wir sehr 
gute Arbeit in der Mine geleistet... \.
Ja, so geht das!
'''
patched = '''
\c[2]\n[2]\c[0]: Obviously, we did a very good
job in the mine...\. Yep, that's how
it works!
'''

[[dialogue]]
event = 45
page = 1
command = 130
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Ohje, ich schaff das alles gar 
nicht...\. Das ist zuviel für mich... 
'''
patched = '''
\c[13]\n[3]\c[0]: Oh, I can't finish all of
this...\. It's too much for me...
'''

[[dialogue]]
event = 45
page = 1
command = 133
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Kann ich den Rest haben?
'''
patched = '''
\c[1]\n[1]\c[0]: Can I have the rest?
'''

[[dialogue]]
event = 45
page = 1
command = 156
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Was passiert nun eigentlich?\.
Wir haben späten Nachmittag, werden 
wir gleich wieder in unsere Zellen 
eingesperrt und das war es?
'''
patched = '''
\c[13]\n[3]\c[0]: So what happens now?\. It's late
afternoon, so are we just going to
be locked back in our cells and
that's it for the day?
'''

[[dialogue]]
event = 45
page = 1
command = 161
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Hm...\. ist dir nicht 
aufgefallen, wie viele Leute da 
draußen rum standen?\. Anscheinend ist 
noch irgendwas da draußen.
'''
patched = '''
\c[2]\n[2]\c[0]: Hm...\. Didn't you notice how
many people were out there?\.
Apparently, something's
still going on.
'''

[[dialogue]]
event = 45
page = 1
command = 167
original = '''
\c[10]????\c[0]: Sieh mal einer an, wen wir da haben!\.
Was für ein Zufall!
'''
patched = '''
\c[10]????\c[0]: Well,\. well,\. well...\. Take a look
at who we have here!\. What a
coincidence!
'''

[[dialogue]]
event = 45
page = 1
command = 197
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: W...\. Was?!\. Ihr seid auch hier?
'''
patched = '''
\c[2]\n[2]\c[0]: W...\. What?!\. You're here too?
'''

[[dialogue]]
event = 45
page = 1
command = 199
has_portrait = true
original = '''
\c[10]Saion\c[0]: Überrascht euch das?\. Welches 
Gefängnis kann uns, die Zinkar-
Brüder, schon halten, wenn es nicht 
das von Helnovien ist?
'''
patched = '''
\c[10]Saion\c[0]: Are you so surprised?\. Which
prison can we, the dreaded Zinkar
Brothers, hold if it's not that
of Helnovien?
'''

[[dialogue]]
event = 45
page = 1
command = 204
has_portrait = true
original = '''
\c[10]Saion\c[0]: Jede andere Zelle würden wir 
brechen,\. alle anderen Wachen würden 
wir austricksen! 
'''
patched = '''
\c[10]Saion\c[0]: We'd break out of every other
cell, we'd outsmart all the other
guards!
'''

[[dialogue]]
event = 45
page = 1
command = 207
has_portrait = true
original = '''
\c[10]Saion\c[0]: Aber nicht in Helnovien!\.
Dieses Gefängnis ist gerade sicher 
genug, um uns zu festhalten und 
nicht weniger!
'''
patched = '''
\c[10]Saion\c[0]: But not in Helnovien!\. This
prison is just safe enough to
keep us here and nothing less!
'''

[[dialogue]]
event = 45
page = 1
command = 215
has_portrait = true
original = '''
\c[10]Jorn\c[0]: Ihr merkt wahrscheinlich 
schon, wie verzweifelt er ist.\.
Er ist stolz darauf hier \s[3]EINGESPERRT\s[0]
zu sein.
'''
patched = '''
\c[10]Jorn\c[0]: You probably already realize how
desperate he's becoming.\. He's proud to
be \s[3]LOCKED UP\s[0] here.
'''

[[dialogue]]
event = 45
page = 1
command = 221
has_portrait = true
original = '''
\c[10]Saion\c[0]: Ruhe, Jorn!\. Dich hat niemand 
gefragt!
'''
patched = '''
\c[10]Saion\c[0]: Quiet, Jorn!\. Nobody asked you!
'''

[[dialogue]]
event = 45
page = 1
command = 228
has_portrait = true
original = '''
\c[10]Saion\c[0]: Aber ist es nicht ein 
wunderbarer Zufall, dass wir euch 
hier treffen?\. Das Schicksal scheint 
es gut mit uns zu meinen!
'''
patched = '''
\c[10]Saion\c[0]: But isn't it a wonderful
coincidence that we met you here?\.
Fate seems to work well with us!
'''

[[dialogue]]
event = 45
page = 1
command = 233
has_portrait = true
original = '''
\c[10]Jorn\c[0]: Ja genau,\. nachdem das 
Schicksal so gütig war, uns hier 
einzusperren. 
'''
patched = '''
\c[10]Jorn\c[0]: Yes exactly,\. after fate was so
kind enough to lock us up here.
'''

[[dialogue]]
event = 45
page = 1
command = 236
has_portrait = true
original = '''
\c[10]Jorn\c[0]: Das würde ich zumindest sagen, 
wäre es nicht eher die Blödheit 
einer bestimmten Person, die dafür 
verantwortlich zu machen ist.
'''
patched = '''
\c[10]Jorn\c[0]: I'd at least say that, if it
weren't for the stupidity of a certain
person around here who's responsible
for it.
'''

[[dialogue]]
event = 45
page = 1
command = 243
has_portrait = true
original = '''
\c[10]Saion\c[0]: Ich sagte du sollst leise 
sein, Jorn!
'''
patched = '''
\c[10]Saion\c[0]: I told you to be quiet, Jorn!
'''

[[dialogue]]
event = 45
page = 1
command = 250
has_portrait = true
original = '''
\c[10]Saion\c[0]: Ihr habt doch sicher schon 
von dem Kampfturnier gehört, oder?
'''
patched = '''
\c[10]Saion\c[0]: You've probably heard of the
tournament, haven't you?
'''

[[dialogue]]
event = 45
page = 1
command = 255
has_portrait = true
original = '''
\c[10]Saion\c[0]: Nein?\. Oh, so neu und grün 
hinter den Ohren seid ihr also noch?
'''
patched = '''
\c[10]Saion\c[0]: No?\. Still so new and fresh out
of the water are you?
'''

[[dialogue]]
event = 45
page = 1
command = 257
has_portrait = true
original = '''
\c[10]Saion\c[0]: Das Kampfturnier ist für die 
harten Leute hier im Gefängnis!\.
Jeden Feierabend kann jeder 
teilnehmen, wer will.
'''
patched = '''
\c[10]Saion\c[0]: The tournament is for the cool
people here in prison!\. Anyone who
wants to can try their hand at it
when the day's over.
'''

[[dialogue]]
event = 45
page = 1
command = 261
has_portrait = true
original = '''
\c[10]Saion\c[0]: Die Kämpfe werden immer in 
Gruppen ausgetragen.\. Am besten 
bildet ihr die 3er Gruppe, wie wir 
sie kennen!
'''
patched = '''
\c[10]Saion\c[0]: The battles are always fought
in groups.\. The best way is to form a
group of three, which suits us
perfectly!
'''

[[dialogue]]
event = 45
page = 1
command = 265
has_portrait = true
original = '''
\c[10]Saion\c[0]: Jede Gruppe hat ihren Rang,\.
Neulinge fangen immer ganz unten an.\. 
Ihr könnt dann andere Gruppen mit 
ähnlichem Rang herausfordern!
'''
patched = '''
\c[10]Saion\c[0]: Every group has its rank,\. and
newcomers always start at the bottom.\.
You can then challenge other groups
with a similar rank!
'''

[[dialogue]]
event = 45
page = 1
command = 269
has_portrait = true
original = '''
\c[10]Saion\c[0]: Und das ist genau, worauf ich 
hinaus will!
'''
patched = '''
\c[10]Saion\c[0]: And that's exactly what I'm
looking forward to!
'''

[[dialogue]]
event = 45
page = 1
command = 273
has_portrait = true
original = '''
\c[10]Saion\c[0]: Ausgezeichnet!
'''
patched = '''
\c[10]Saion\c[0]: Excellent!
'''

[[dialogue]]
event = 45
page = 1
command = 278
has_portrait = true
original = '''
\c[10]Saion\c[0]: Wir fordern euch heraus!\. 
Das heißt, wir würden es gerne 
machen, allerdings ist euer Rang als 
Neueinsteiger viel zu niedrig dafür!
'''
patched = '''
\c[10]Saion\c[0]: We challenge you to a duel!\.
Although we'd like for it to happen,
your rank as a newcomer is far too
low right now!
'''

[[dialogue]]
event = 45
page = 1
command = 283
has_portrait = true
original = '''
\c[10]Saion\c[0]: Ihr werdet erstmal im 
Turnier euren Rang hoch kämpfen 
müssen, bevor ihr gegen uns antreten 
könnt!
'''
patched = '''
\c[10]Saion\c[0]: You'll have to fight your way
up in the tournament before you can
compete against us!
'''

[[dialogue]]
event = 45
page = 1
command = 287
has_portrait = true
original = '''
\c[10]Saion\c[0]: Also,\. ich zähl' auf euch.
'''
patched = '''
\c[10]Saion\c[0]: So I'll be waiting for you.
'''

[[dialogue]]
event = 45
page = 1
command = 288
has_portrait = true
original = '''
\c[10]Saion\c[0]: Andererseits kann man uns 
gleich als Gewinner betrachten, wenn 
ihr es nicht schafft, unseren Rang 
zu erreichen!
'''
patched = '''
\c[10]Saion\c[0]: On the other hand, you can
consider us the winner if you
can't reach our rank!
'''

[[dialogue]]
event = 45
page = 1
command = 297
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Eine Frage...\. Was...\. habt ihr 
eigentlich von diesen Kämpfen? 
'''
patched = '''
\c[13]\n[3]\c[0]: One question...\. What...\. do you
actually gain from these battles?
'''

[[dialogue]]
event = 45
page = 1
command = 300
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Wie...\. könnt ihr überhaupt 
Lust auf so ein Theater haben, bei 
all der Minenarbeit?
'''
patched = '''
\c[13]\n[3]\c[0]: How...\. How do you still have
enough energy for this kind of
circus with all the mining?
'''

[[dialogue]]
event = 45
page = 1
command = 306
has_portrait = true
original = '''
\c[10]Jorn\c[0]: Glaub mir, ich frag ihn das 
auch immer wieder und trotzdem zerrt 
er mich jedes Mal mit in diese 
Pampe.
'''
patched = '''
\c[10]Jorn\c[0]: You know, I keep asking him the
same question, and yet he always drags
me into this mess.
'''

[[dialogue]]
event = 45
page = 1
command = 315
has_portrait = true
original = '''
\c[10]Saion\c[0]: Frauen wie du werden so etwas 
wahrscheinlich nicht verstehen!\. Es 
geht um Ehre und den Beweis von 
Stärke!
'''
patched = '''
\c[10]Saion\c[0]: Women like you are unlikely to
understand this!\. It's about honor and
proof of strength!
'''

[[dialogue]]
event = 45
page = 1
command = 321
has_portrait = true
original = '''
\c[10]Jorn\c[0]: Es gibt auch noch einen echten 
Vorteil:\. Sie lassen einen sogar hin 
und wieder die Minenarbeit 
schwänzen, wenn man gut genug ist.
'''
patched = '''
\c[10]Jorn\c[0]: There's also a real advantage.\.
They even make you skip mining every
now and then if you're good enough.
'''

[[dialogue]]
event = 45
page = 1
command = 331
has_portrait = true
original = '''
\c[10]Saion\c[0]: ...\.Ja,\. aber das ist 
nebensächlich.\. Wie auch immer.\.
Ich hoffe ich kann auf euch zählen
'''
patched = '''
\c[10]Saion\c[0]: Yes...\. But that's irrelevant!\.
In any case, I hope I can count on
you to show up.
'''

[[dialogue]]
event = 45
page = 1
command = 345
has_portrait = true
original = '''
\c[10]Gurim\c[0]: Eine Frage...\. wie kommt es 
eigentlich, dass ihr hier gelandet 
seit? 
'''
patched = '''
\c[10]Gurim\c[0]: One question...\. How'd you end
up here?
'''

[[dialogue]]
event = 45
page = 1
command = 353
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Das ist eine etwas 
komplizierte Geschichte...
'''
patched = '''
\c[1]\n[1]\c[0]: That's a somewhat complicated
story...
'''

[[dialogue]]
event = 45
page = 1
command = 356
has_portrait = true
original = '''
\c[10]Jorn\c[0]: Ihr wart doch Soldaten, oder 
lieg ich falsch?\. Sagt bloß, ihr seid 
diese Verräter des Landes, von denen 
sie alle sprechen.
'''
patched = '''
\c[10]Jorn\c[0]: Weren't you three soldiers, or
am I wrong?\. You can just say you're
these traitors to the country that
everyone says.
'''

[[dialogue]]
event = 45
page = 1
command = 362
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Wir haben unser Land nicht 
verraten!\. Wir wurden zu unrecht hier 
eingesperrt...
'''
patched = '''
\c[13]\n[3]\c[0]: We didn't betray our country!\.
We were wrongly locked up here...
'''

[[dialogue]]
event = 45
page = 1
command = 366
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ein gewisser alter Sack 
glaubte, in uns bösartige Spione zu 
sehen, die für Korzojeno arbeiten.
'''
patched = '''
\c[2]\n[2]\c[0]: A certain old geezer thought we
were malicious spies working for
Korzojeno.
'''

[[dialogue]]
event = 45
page = 1
command = 370
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Und da dieser "alte Sack" ein 
Ratsmitglied ist, sind wir jetzt 
hier.
'''
patched = '''
\c[1]\n[1]\c[0]: And since this "old geezer" is
a member of the council, you can
easily guess why we're here now.
'''

[[dialogue]]
event = 45
page = 1
command = 377
has_portrait = true
original = '''
\c[10]Jorn\c[0]: Heh.\. Das ist Schicksal.\. Ich 
denke, jeder erlebt mal so etwas.\. 
Ich habe dieses Unglück von Bruder 
und ihr euren alten Sack.
'''
patched = '''
\c[10]Jorn\c[0]: Heh.\. That's fate for ya.\. I think
everyone has this somehow.\. I've had
the misfortune of him as my brother,
you've had yours with that old geezer.
'''

[[dialogue]]
event = 45
page = 1
command = 387
has_portrait = true
original = '''
\c[10]Saion\c[0]: Was trödelt ihr da unten so 
rum? Ihr habt nichts mit unseren 
Erzfeinden zu besprechen!
'''
patched = '''
\c[10]Saion\c[0]: What are you two still doing
loitering around there? We have
nothing to discuss with our
archenemies!
'''

[[dialogue]]
event = 45
page = 1
command = 400
has_portrait = true
original = '''
\c[10]Jorn\c[0]: Nimmt diesen Verrückten bitte 
nicht ernst. Er ist der Einzige, der 
euch als Erzfeinde ansieht. 
'''
patched = '''
\c[10]Jorn\c[0]: Please don't take this lunatic
seriously. He's the only one of us
who actually sees you as archenemies.
'''

[[dialogue]]
event = 45
page = 1
command = 404
has_portrait = true
original = '''
\c[10]Jorn\c[0]: Ihr seid für ihn nichts 
weiter als die Entschuldigung für 
seine eigene Blödheit.
'''
patched = '''
\c[10]Jorn\c[0]: You're just a scapegoat for his
own stupidity.
'''

[[dialogue]]
event = 45
page = 1
command = 415
has_portrait = true
original = '''
\c[10]Saion\c[0]: Jorn!
'''
patched = '''
\c[10]Saion\c[0]: Jorn!
'''

[[dialogue]]
event = 45
page = 1
command = 422
has_portrait = true
original = '''
\c[10]Jorn\c[0]: Jaja! 
'''
patched = '''
\c[10]Jorn\c[0]: Yeah yeah!
'''

[[dialogue]]
event = 45
page = 1
command = 429
has_portrait = true
original = '''
\c[10]Jorn\c[0]: Man sieht sich dann.
'''
patched = '''
\c[10]Jorn\c[0]: Well, see you around.
'''

[[dialogue]]
event = 45
page = 1
command = 443
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Die beiden machen einen 
wirklich unerwartet anständigen 
Eindruck...
'''
patched = '''
\c[13]\n[3]\c[0]: Those two made an unexpectedly
decent impression...
'''

[[dialogue]]
event = 45
page = 1
command = 447
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Das Übel scheint von diesem 
Saion zu kommen...
'''
patched = '''
\c[1]\n[1]\c[0]: Seems like Saion is the one
who's dragging them down...
'''

[[dialogue]]
event = 45
page = 1
command = 453
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Dann frag ich mich aber 
wirklich, wieso die beiden  
permanent mit ihm rumhängen.
'''
patched = '''
\c[2]\n[2]\c[0]: That makes me wonder why those
two always hang around him all the
time then.
'''

[[dialogue]]
event = 45
page = 1
command = 457
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Wer weiß das schon, sie 
werden wohl ihre Gründe haben...
'''
patched = '''
\c[1]\n[1]\c[0]: Who knows, they probably have
their reasons...
'''

[[dialogue]]
event = 45
page = 1
command = 464
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Hm, \.wir sollten uns mal 
dieses Turnier anschauen!
'''
patched = '''
\c[2]\n[2]\c[0]: Hm,\. we should have a look at
this tournament!
'''

[[dialogue]]
event = 45
page = 1
command = 470
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Du willst wirklich darauf 
eingehen...?
'''
patched = '''
\c[13]\n[3]\c[0]: You actually want to go into
that?
'''

[[dialogue]]
event = 45
page = 1
command = 474
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Wir dürfen hier nicht unseren 
Kampfgeist verlieren - \.und das 
Turnier wird uns dabei helfen!
'''
patched = '''
\c[2]\n[2]\c[0]: We can't lose our fighting
spirit here!\. And the tournament
will help us with that!
'''

[[dialogue]]
event = 45
page = 1
command = 478
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Außerdem hab ich das 
Verlangen, diesem Saion eines über 
zu ziehen...
'''
patched = '''
\c[2]\n[2]\c[0]: I also want to show Saion who's
boss...
'''

[[dialogue]]
event = 45
page = 1
command = 482
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ich meine,\. komm.\. DIE und 
einen höheren Kampfrang als WIR?\. Das 
kann doch so nicht bleiben!
'''
patched = '''
\c[2]\n[2]\c[0]: I mean,\. come on.\. THEY have a
higher rank than US?\. I can't sit by
and let that continue!
'''

[[dialogue]]
event = 45
page = 1
command = 486
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Du lässt dich zu leicht 
provozieren, Cibon...
'''
patched = '''
\c[1]\n[1]\c[0]: You let yourself be provoked
too easily, Cibon...
'''

[[dialogue]]
event = 45
page = 1
command = 496
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Da fällt mir ein, heute 
werden sie wahrscheinlich wieder 
jemanden von uns verhören.
'''
patched = '''
\c[1]\n[1]\c[0]: I just realized that today,
they're likely going to interrogate
another one of us again.
'''

[[dialogue]]
event = 45
page = 1
command = 500
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Stimmt ja...
'''
patched = '''
\c[13]\n[3]\c[0]: Right...
'''

[[dialogue]]
event = 45
page = 1
command = 502
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Ich hab denen zuletzt einige 
Geschichten erzählt... 
'''
patched = '''
\c[1]\n[1]\c[0]: I told them some fictitious
tales while I was there...
'''

[[dialogue]]
event = 45
page = 1
command = 505
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Ihr solltest darauf achten, 
dass ihr eure Aussagen darauf 
aufbauen.\. Sonst fliegen unsere Lügen 
auf. 
'''
patched = '''
\c[1]\n[1]\c[0]: You should make sure that
whatever you say is based on this.\.
Otherwise, they'll figure out
we're lying.
'''

[[dialogue]]
event = 45
page = 1
command = 513
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Und was dann?
'''
patched = '''
\c[2]\n[2]\c[0]: And if we don't?
'''

[[dialogue]]
event = 45
page = 1
command = 515
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Dann gibt es Prügel. \.Sogar 
während der Minenarbeit, haben sie 
mir gedroht.
'''
patched = '''
\c[1]\n[1]\c[0]: Then comes a beating.\. They
threatened me that it'd happen
even when we're mining.
'''

[[dialogue]]
event = 45
page = 1
command = 520
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Also, was hast du ihnen 
erzählt?
'''
patched = '''
\c[2]\n[2]\c[0]: So what did you tell them?
'''

[[dialogue]]
event = 45
page = 1
command = 525
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Kento, wenn sie unsere Lügen 
durchschauen, werden sie erst recht 
denken, dass wir Sachen wissen und 
verschweigen wollen, oder?
'''
patched = '''
\c[13]\n[3]\c[0]: Kento, if they see through our
lies, they'll think that we're still
hiding something and will want to
know about it, right?
'''

[[dialogue]]
event = 45
page = 1
command = 534
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: ...\. Da könntest du Recht 
haben...
'''
patched = '''
\c[1]\n[1]\c[0]: You could be right...
'''

[[dialogue]]
event = 45
page = 1
command = 537
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Lügen ist immer nur ein 
temporärer Ausweg.\. Und die können 
uns hier Monate lang verhören, wenn 
sie Lust dazu haben.
'''
patched = '''
\c[13]\n[3]\c[0]: Lying is always only a temporary
way out.\. And they can interrogate us
here for months on end if they feel
like it.
'''

[[dialogue]]
event = 45
page = 1
command = 542
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Ihnen die Wahrheit zu sagen, 
ist vielleicht anfangs härter, aber 
auf Dauer der einzige Weg, die 
Verhörungen enden zu lassen.
'''
patched = '''
\c[13]\n[3]\c[0]: Telling them the truth may sting
more at first, but it's the only way
to end these interrogations in the
long run.
'''

[[dialogue]]
event = 45
page = 1
command = 552
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Großartig,\. jetzt weiß ich 
ganz ehrlich nicht mehr, was ich 
machen soll.
'''
patched = '''
\c[2]\n[2]\c[0]: Great,\. I honestly don't know
what to do now.
'''

[[dialogue]]
event = 45
page = 1
command = 556
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Vielleicht hat Soko recht, es 
könnte sinnvoller sein, einfach 
permanent auszusagen, dass man 
nichts weiß.
'''
patched = '''
\c[1]\n[1]\c[0]: Maybe Soko is right, it might
make more sense to simply say we
don't know anything from now on.
'''

[[dialogue]]
event = 45
page = 1
command = 564
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ich denke ich werde das 
entscheiden, wenn es soweit ist. \.
Erzähl einfach mal, was du ihnen 
gesagt hast.
'''
patched = '''
\c[2]\n[2]\c[0]: I think I'll decide when the
time comes.\. Just tell me what you
told them.
'''

[[dialogue]]
event = 45
page = 1
command = 576
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Ich frag mich, was draußen so 
alles passiert.\. Ob Brigantia 
mittlerweile diese Truppe gefunden 
hat?
'''
patched = '''
\c[13]\n[3]\c[0]: I wonder what's going on
outside.\. Did Brigantia end up
finding this group in the
meantime?
'''

[[dialogue]]
event = 45
page = 1
command = 581
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Solche Neuigkeiten sollten 
sich eigentlich schnell ausbreiten, 
sogar hier im Gefängnis...
'''
patched = '''
\c[1]\n[1]\c[0]: That kind of news would quickly
spread, even down here in the
prison...
'''

[[dialogue]]
event = 45
page = 1
command = 586
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Wenn sie die Truppe entdecken, 
klärt sich wahrscheinlich auf, dass 
wir keine Spione sind!\. Vielleicht 
kommen wir dann hier raus...
'''
patched = '''
\c[13]\n[3]\c[0]: If they discovered the group,
it'll probably be clear to them that
we aren't spies!\. Maybe we'll get out
of here then...
'''

[[dialogue]]
event = 45
page = 1
command = 595
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Naja, wir haben doch gestern 
gehört, das Gefangene hier in der 
Regel nicht freigelassen werden. 
'''
patched = '''
\c[1]\n[1]\c[0]: Well, we heard yesterday that
prisoners are usually never released
from here.
'''

[[dialogue]]
event = 45
page = 1
command = 599
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Da muss uns schon ein hohes 
Tier hier rausziehen.
'''
patched = '''
\c[1]\n[1]\c[0]: Only some high-ranking official
can pull us out of here.
'''

[[dialogue]]
event = 45
page = 1
command = 603
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: ...
'''
patched = '''
\c[13]\n[3]\c[0]: ...
'''

[[dialogue]]
event = 45
page = 1
command = 608
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Du könntest wirklich etwas 
optimistischer sein, Kumpel. \.Unsere 
Lage ist so schon verzweifelt genug.
'''
patched = '''
\c[2]\n[2]\c[0]: You could really use a little
more optimism, Kento.\. Our situation
is desperate enough as it is.
'''

[[dialogue]]
event = 45
page = 1
command = 616
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Wahrscheinlich werden sie 
heute dich verhören, Soko.
'''
patched = '''
\c[2]\n[2]\c[0]: They'll probably be
interrogating you today, Soko.
'''

[[dialogue]]
event = 45
page = 1
command = 620
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Ja...
'''
patched = '''
\c[13]\n[3]\c[0]: Yeah...
'''

[[dialogue]]
event = 45
page = 1
command = 623
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Wie wirst du dich nun 
verhalten?
'''
patched = '''
\c[1]\n[1]\c[0]: So are you going to go along
with the plan?
'''

[[dialogue]]
event = 45
page = 1
command = 626
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Ich weiß es nicht...\. Macht es 
wirklich Sinn, ihnen über die ganze 
Zeit Lügen zu erzählen? 
'''
patched = '''
\c[13]\n[3]\c[0]: I don't know...\. Does it really
make sense to keep telling them lies
for however long we're in here?
'''

[[dialogue]]
event = 45
page = 1
command = 630
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Wir werden das nicht 
durchhalten,\. also zumindest ich 
nicht... 
'''
patched = '''
\c[13]\n[3]\c[0]: We won't be able to keep this
up,\. I mean,\. at least I won't...
'''

[[dialogue]]
event = 45
page = 1
command = 633
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Und so wie es aussieht, werden 
wir hier sobald auch nicht 
rauskommen... 
'''
patched = '''
\c[13]\n[3]\c[0]: And it looks like we won't be
getting out of here anytime soon...
'''

[[dialogue]]
event = 45
page = 1
command = 637
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Also willst du dich auf 
Unschuld berufen?\. Dir ist klar, dass 
unsere ganzen Lügen damit auffliegen 
werden.
'''
patched = '''
\c[1]\n[1]\c[0]: So you want to claim innocence?\.
You know that all of our lies will be
exposed.
'''

[[dialogue]]
event = 45
page = 1
command = 642
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Cibon und ich werden dafür 
Konsequenzen tragen müssen...
'''
patched = '''
\c[1]\n[1]\c[0]: Cibon and I will have to bear
the consequences...
'''

[[dialogue]]
event = 45
page = 1
command = 649
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Ich...\. Das hab ich 
vergessen...
'''
patched = '''
\c[13]\n[3]\c[0]: Right...\. I forgot about that...
'''

[[dialogue]]
event = 45
page = 1
command = 655
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Nimm wegen mir keine 
Rücksicht, Soko.\. Die können mich 
nicht viel mehr verprügeln als 
letztes Mal.
'''
patched = '''
\c[2]\n[2]\c[0]: Don't be considerate of me,
Soko.\. They can't beat me up any
more than last time.
'''

[[dialogue]]
event = 45
page = 1
command = 660
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Naja, mach einfach, was du 
für richtig hältst. Wir werden 
das schon durchstehen.
'''
patched = '''
\c[1]\n[1]\c[0]: Well, just do what you think is
right. We'll get through this one way
or another.
'''

[[dialogue]]
event = 45
page = 1
command = 671
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Ach ja, Felcis, eine Sache 
habe ich noch nicht so ganz 
verstanden.
'''
patched = '''
\c[1]\n[1]\c[0]: By the way Felcis, there's
still one thing I haven't quite
understood yet.
'''

[[dialogue]]
event = 45
page = 1
command = 675
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Was hat jemand wie du 
hierzulande, jenseits der Grenze zu 
suchen?\. Du sagtest, du wärst ein 
Gesandter vom Adelsbund...
'''
patched = '''
\c[1]\n[1]\c[0]: What's someone like you doing
across the border into this country?\.
You said you were an envoy from the
aristocracy...
'''

[[dialogue]]
event = 45
page = 1
command = 687
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Oh,\. nun ja,\. ich hatte einen 
Untersuchungsauftrag an der Grenze. 
'''
patched = '''
\c[5]\n[5]\c[0]: Oh,\. well,\. I had an order to
investigate the border.
'''

[[dialogue]]
event = 45
page = 1
command = 689
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Es gab in letzter Zeit viele 
Gerüchte über eine Untergrund-
passage, die unter die Grenze 
hindurch führt.
'''
patched = '''
\c[5]\n[5]\c[0]: There've been a lot of rumors
lately about an underground passage
under the border.
'''

[[dialogue]]
event = 45
page = 1
command = 693
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Laut diesen Gerüchten ist 
diese Passage auf die hier 
herumstreunenden Räuberbanden 
zurückzuführen.
'''
patched = '''
\c[5]\n[5]\c[0]: According to these rumors,
this passage can be attributed to
the gangs of robbers roaming
around here.
'''

[[dialogue]]
event = 45
page = 1
command = 700
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Ich denke, es ist 
selbstredend, dass so etwas weder im 
Interesse von Korzojeno noch von 
Brigantia ist.
'''
patched = '''
\c[5]\n[5]\c[0]: I think it goes without saying
that this is neither in the interests
of Korzojeno or Brigantia.
'''

[[dialogue]]
event = 45
page = 1
command = 705
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Grenzen werden schließlich 
nicht gebaut, damit man frei drunter 
durch wandern kann.
'''
patched = '''
\c[5]\n[5]\c[0]: After all, borders aren't
built so that you can freely walk
under them.
'''

[[dialogue]]
event = 45
page = 1
command = 710
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Also wurde mir ein kleiner 
Trupp von Soldaten zugeteilt, mit 
dem ich der Sache auf den Grund 
gehen sollte.
'''
patched = '''
\c[5]\n[5]\c[0]: So I was assigned a small
group of soldiers to get to the
bottom of it.
'''

[[dialogue]]
event = 45
page = 1
command = 714
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Und in der Tat. Da war eine 
Passage.\. Und ihre Ausmaße 
überstiegen meine Erwartungen um 
Weiten.
'''
patched = '''
\c[5]\n[5]\c[0]: And there was a passage
indeed.\. Their dimensions far
exceeded my expectations.
'''

[[dialogue]]
event = 45
page = 1
command = 718
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Es ist mehr als nur ein 
kleiner Tunnel. Eher ist es ein 
großes Höhlensystem, das sich unter 
der Grenze durchzieht.
'''
patched = '''
\c[5]\n[5]\c[0]: It's more than just a small
tunnel. Rather, it's a large cave
system that runs through the
entire border.
'''

[[dialogue]]
event = 45
page = 1
command = 726
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Groß genug, um dort seine 
Leute zu verlieren. \.Genau das 
passierte mir nämlich, als wir von 
einer Räuberbande verfolgt wurden.
'''
patched = '''
\c[5]\n[5]\c[0]: Big enough to lose everyone
down there.\. This is exactly what
happened to me when we were
chased by a gang of robbers.
'''

[[dialogue]]
event = 45
page = 1
command = 731
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Ich hatte das Glück, am Ende 
wieder raus zu finden, bin dann 
allerdings in Brigantia gelandet.
'''
patched = '''
\c[5]\n[5]\c[0]: I was lucky enough to find my
way back in the end, but I ended up
in Brigantia.
'''

[[dialogue]]
event = 45
page = 1
command = 734
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Meine Leute waren weiterhin 
verschollen und da ich nicht der Typ 
bin, der seine Leute im Stich lässt, 
wollte ich hier um Hilfe bitten.
'''
patched = '''
\c[5]\n[5]\c[0]: My people were still missing,
and since I'm not the type to let
their people down so easily, I
wanted to ask for help there.
'''

[[dialogue]]
event = 45
page = 1
command = 742
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Und jetzt sitze ich hier.\. 
Und alles was ich tun kann, ist 
hoffen, dass meine Leute von selbst 
davon gekommen sind.
'''
patched = '''
\c[5]\n[5]\c[0]: And now I'm sitting here.\.
All I can do now is hope that my
people got away on their own.
'''

[[dialogue]]
event = 45
page = 1
command = 751
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Okay...\. Das ist ziemlich 
übel...
'''
patched = '''
\c[2]\n[2]\c[0]: Oh...\. That's pretty bad...
'''

[[dialogue]]
event = 45
page = 1
command = 756
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Was denken die sich hier 
eigentlich?\. Die können doch nicht 
jemanden vom Adelsbund einfach so 
hier einsperren!
'''
patched = '''
\c[13]\n[3]\c[0]: Seriously, what were they
thinking?\. They can't just lock
someone up here with no trial
whatsoever!
'''

[[dialogue]]
event = 45
page = 1
command = 760
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Dafür muss man doch eine 
Bestätigung von dem Rat bekommen, 
oder von einem höheren General im 
Westen, mindestens!
'''
patched = '''
\c[13]\n[3]\c[0]: They have to get confirmation
from the council, or from a higher
general in the west at the very
least!
'''

[[dialogue]]
event = 45
page = 1
command = 764
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Das ist Wahnsinn!
'''
patched = '''
\c[13]\n[3]\c[0]: This is absolute insanity!
'''

[[dialogue]]
event = 45
page = 1
command = 769
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Nun ja, \^
'''
patched = '''
\c[5]\n[5]\c[0]: Well yes,\^
'''

[[dialogue]]
event = 45
page = 1
command = 771
has_portrait = true
character = '''Felcis'''
original = '''
\>\c[5]\n[5]\c[0]: Nun ja,\.\. \<DAS \.\.IST\.\. HELNOVIA!!!\.\.\^
'''
patched = '''
\>\c[5]\n[5]\c[0]: Well yes,\.\. \<THIS\.\. IS\.\. HELNOVIEN!!!\.\.\^
'''

[[dialogue]]
event = 45
page = 1
command = 773
has_portrait = true
character = '''Felcis'''
original = '''
\>\c[5]\n[5]\c[0]: Nun ja, DAS IST HELNOVIEN\<,
wie mir darüber erzählt wurde. 
'''
patched = '''
\>\c[5]\n[5]\c[0]: Well yes, THIS IS HELNOVIEN!!!\<
...as I've been told.
'''

[[dialogue]]
event = 45
page = 1
command = 776
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Das Land von Brigantia mit 
Eigeninitiative!\. Hier sind die Leute 
noch voller frischer Ideen!
'''
patched = '''
\c[5]\n[5]\c[0]: Now Brigantia's territory
acting on their own!\. The land with
people full of ideas on how THEY
think things should be.
'''

[[dialogue]]
event = 45
page = 1
command = 780
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Hier, wo dieser 
Spielverderber von Rat dank der 
Blockade des Torasgebirges nicht 
permanent rummeckern kann.
'''
patched = '''
\c[5]\n[5]\c[0]: Here, where its killjoy
council no longer has to complain to
get what they want, thanks to their
barrier that is Mount Toras.
'''

[[dialogue]]
event = 45
page = 1
command = 788
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Hätte ich gewusst, dass 
Korzojeno im Moment so unter 
Verdacht steht, hätte ich mich 
keineswegs hier hingewagt.
'''
patched = '''
\c[5]\n[5]\c[0]: If I had known that Korzojeno
was currently under suspicion,
I wouldn't have dared to go here.
'''

[[dialogue]]
event = 45
page = 1
command = 799
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Nun ja, so ist halt das 
Leben.\. Wenn ihr mich entschuldigt, 
ich werde mich hier mal etwas 
umsehen...
'''
patched = '''
\c[5]\n[5]\c[0]: Well, that's life.\. Now if
you'll excuse me, I'll have a
look around here...
'''

[[dialogue]]
event = 45
page = 1
command = 811
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Schon ein merkwürdiger Zufall, 
dass wir auf einmal so eine Person 
treffen...
'''
patched = '''
\c[13]\n[3]\c[0]: It's a rather strange
coincidence that we suddenly
met such a person...
'''

[[dialogue]]
event = 45
page = 1
command = 817
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Was meint ihr?\. Glaubt ihr 
ihm, dass Korzojeno nichts mit 
dieser Truppe zu tun hat, sondern 
Brigantia dahinter steckt?
'''
patched = '''
\c[2]\n[2]\c[0]: What do you think of all this?\.
Do you believe what he's saying, that
Korzojeno has nothing to do with this
group, that it's actually Brigantia?
'''

[[dialogue]]
event = 45
page = 1
command = 823
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Ich kann mir nicht vorstellen, 
dass jemand im Rat so etwas planen 
würde...
'''
patched = '''
\c[13]\n[3]\c[0]: I can't imagine someone in the
council planning something like
this...
'''

[[dialogue]]
event = 45
page = 1
command = 827
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Es ist natürlich im Sinne von 
diesem Felcis, den Adelsbund von dem 
Verdacht zu befreien... 
'''
patched = '''
\c[1]\n[1]\c[0]: He has every reason to free the
aristocracy of suspicion...
'''

[[dialogue]]
event = 45
page = 1
command = 831
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: So gesehen ist es gut 
möglich, dass er uns falsche 
Tatsachen auftischt...
'''
patched = '''
\c[1]\n[1]\c[0]: Speaking from this point of
view, it's quite possible that he
might be lying to us...
'''

[[dialogue]]
event = 45
page = 1
command = 838
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Naja, selbst wenn -\. macht das 
für uns einen Unterschied?\. Wir 
sitzen hier ja nicht im Rat, sondern 
in einem Gefängnis.
'''
patched = '''
\c[2]\n[2]\c[0]: Well, even so,\. does it make
a difference for us?\. We're not in
the council, we're in a prison.
'''

[[dialogue]]
event = 45
page = 1
command = 844
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Wo du recht hast...
'''
patched = '''
\c[13]\n[3]\c[0]: Well, you're right...
'''

[[dialogue]]
event = 45
page = 1
command = 862
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ich fass es nicht!\. Wie hast 
du bitte so eine Portion zusammen 
bekommen, ohne richtig Erz zu 
schürfen?
'''
patched = '''
\c[2]\n[2]\c[0]: I can't believe it!\. How'd you
get such a big portion without
actually mining ore?
'''

[[dialogue]]
event = 45
page = 1
command = 868
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Och na ja.\. Ich hab etwas 
Erzträger gespielt. 
'''
patched = '''
\c[5]\n[5]\c[0]: Oh,\. well...\. I became an ore
carrier.
'''

[[dialogue]]
event = 45
page = 1
command = 871
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Da ich eh hauptsächlich mit 
Leuten geredet habe, hab ich ihnen 
angeboten, das Erz für sie zur 
Sammelstelle zu bringen.
'''
patched = '''
\c[5]\n[5]\c[0]: Since I was mainly talking to
people anyway, I offered to take
their ore to the railways for them.
'''

[[dialogue]]
event = 45
page = 1
command = 875
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Für nur 10% Abzug, der an 
mich ging, mussten die Leute das Erz 
nicht selber schleppen. 
'''
patched = '''
\c[5]\n[5]\c[0]: For just 10% deduction that
went to me, people didn't have to
drag the ore themselves.
'''

[[dialogue]]
event = 45
page = 1
command = 879
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Da sind schon erstaunlich 
viele darauf eingegangen.\. Vor allem 
diese Pauamainer-Kollegen, für die 
Erzhacken ja der Lebenssinn ist.
'''
patched = '''
\c[5]\n[5]\c[0]: A surprising amount of them
already accepted this deal.\. Above all,
these Pauamainers were the most eager,
since ore mining is life for them.
'''

[[dialogue]]
event = 45
page = 1
command = 885
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Nicht schlecht.
'''
patched = '''
\c[1]\n[1]\c[0]: Not bad.
'''

[[dialogue]]
event = 45
page = 1
command = 889
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Pah!\. So etwas nennt man 
Schnorren!
'''
patched = '''
\c[2]\n[2]\c[0]: Pah!\. Now that's what I call
scavenging!
'''

[[dialogue]]
event = 45
page = 1
command = 895
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Aber zu etwas anderem.\. Ich 
bräuchte gleich mal eure Hilfe, wenn 
möglich. 
'''
patched = '''
\c[5]\n[5]\c[0]: But onto another topic.\. I need
your help as soon as possible if
you're willing to help out.
'''

[[dialogue]]
event = 45
page = 1
command = 899
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Worum geht es?
'''
patched = '''
\c[1]\n[1]\c[0]: What's it about?
'''

[[dialogue]]
event = 45
page = 1
command = 901
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Für unseren "Plan" benötigen 
wir noch einen weiteren Gegenstand. 
'''
patched = '''
\c[5]\n[5]\c[0]: For our "plan", we need
another item.
'''

[[dialogue]]
event = 45
page = 1
command = 904
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Ich hatte diesen Gegenstand 
noch bei mir, die Wachen hatten ihn 
glücklicherweise nicht entdeckt. 
'''
patched = '''
\c[5]\n[5]\c[0]: I still had this item with me,
and fortunately, the guards didn't
spot it.
'''

[[dialogue]]
event = 45
page = 1
command = 908
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Nur musste ich mein Glück 
durch ein dummes Ungeschick 
verderben.\. Ich habe das Ding 
verloren.
'''
patched = '''
\c[5]\n[5]\c[0]: But I just had to ruin my luck
