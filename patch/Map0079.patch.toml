[[dialogue]]
event = 33
page = 1
command = 10
original = '''
\c[10]Reiter\c[0]: Was ich hier mache?\. Ich warte, bis mein 
Kollege endlich mit den Vorbereitungen fertig 
wird.\. Wir beide müssen Pakete nach Buronia 
bringen. Wird ein recht langer Weg...
'''
patched = '''
\c[10]Rider\c[0]: What am I doing here?\. I'm waiting for
my colleague to finishes his preparations.\.
We both have to bring packages to Buronia.\.
Now that'll take a while...
'''

