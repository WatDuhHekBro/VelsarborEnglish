'''
patched = '''
\c[1]\n[1]\c[0]: Hm... the post office.\.
What are we doing here?
'''

[[dialogue]]
event = 47
page = 3
command = 25
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Soweit ich mich erinnere, 
sollten wir doch ein Paket hier 
abgeben,\. richtig?
'''
patched = '''
\c[13]\n[3]\c[0]: If I recall correctly, we
should be leaving a package here,\.
right?
'''

[[dialogue]]
event = 47
page = 3
command = 32
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Seit wann biste denn so 
