[[dialogue]]
event = 4
page = 1
command = 2
original = '''
\c[10]Frau\c[0]: Liebling, die Gerüchte stimmen!\. Ich hab sie 
letztens selber gesehen.
'''
patched = '''
\c[10]Woman\c[0]: Darling, the rumors are true!\. I saw them
myself recently.
'''

[[dialogue]]
event = 4
page = 1
command = 4
original = '''
\c[10]Mann\c[0]: Was denn, mein Schatz?
'''
patched = '''
\c[10]Man\c[0]: What is it, honey?
'''

[[dialogue]]
event = 4
page = 1
command = 5
original = '''
\c[10]Frau\c[0]: Diese Leute in Rüstung,\. jenseits der 
Grenze...!
'''
patched = '''
\c[10]Woman\c[0]: Those people in armor across the border!
'''

[[dialogue]]
event = 4
page = 1
command = 7
original = '''
\c[10]Mann\c[0]: Schatz, wir haben hier eine Grenze.\. An 
einer Grenze sind Soldaten, die nun mal Wache 
halten.\. Und ja: Auch in Korzojeno haben sie 
Soldaten dafür.
'''
patched = '''
\c[10]Man\c[0]: Honey, we have a border here.\. There are
soldiers on the border who are constantly on
guard.\. And yes, they also have soldiers from
Korzojeno.
'''

[[dialogue]]
event = 4
page = 1
command = 12
original = '''
\c[10]Frau\c[0]: Sie sehen aber nicht wie normale 
Korzojenische Soldaten aus...!
'''
patched = '''
\c[10]Woman\c[0]: But they don't look like normal
Korzojenish soldiers!
'''

[[dialogue]]
event = 4
page = 1
command = 14
original = '''
\c[10]Mann\c[0]: Ach was. Vielleicht haben sie nur eine neue 
Ausrüstung bekommen oder so was in der Richtung.\.
Mach doch nicht gleich aus einer Fliege einen 
Elefanten.
'''
patched = '''
\c[10]Man\c[0]: Hmph.\. Maybe they just got new equipment or
something.\. Don't make mountains out of molehills.
'''
