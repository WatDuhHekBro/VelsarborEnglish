[[dialogue]]
event = 15
page = 2
command = 4
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Wir sollten uns besser nicht 
zu weit von Nomerea entfernen.
'''
patched = '''
\c[1]\n[1]\c[0]: We'd better not get too
far away from Nomerea.
'''

[[dialogue]]
event = 15
page = 2
command = 13
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Erst die Eskorte im Gasthof 
abfangen, DANN zum Torasgebirge, 
Kumpel.
'''
patched = '''
\c[2]\n[2]\c[0]: First, meet up with the
ambassador in the inn, THEN
go to Mount Toras, Kento.
'''

[[dialogue]]
event = 15
page = 2
command = 23
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Wir sollten uns nicht zu weit 
von Gencorin entfernen.
'''
patched = '''
\c[1]\n[1]\c[0]: We shouldn't get too far
from Gencorin.
'''

[[dialogue]]
event = 15
page = 2
command = 41
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Es ist zu spät, heute 
nicht mehr.
'''
patched = '''
\c[1]\n[1]\c[0]: It's too late, not today.
'''

[[dialogue]]
event = 15
page = 2
command = 50
has_portrait = true
character = '''Kento'''
original = '''
(\c[1]\n[1]\c[0]: Bin ich denn verrückt?\. Ich 
werde doch nicht alleine 
fortschreiten!)
'''
patched = '''
(\c[1]\n[1]\c[0]: Am I crazy?\. I'm not
going to go alone!)
'''

