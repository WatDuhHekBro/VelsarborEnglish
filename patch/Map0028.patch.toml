$u - Süd Brigantia
'''
patched = '''
$z - Nomerea
$v - The Sink-Lohne Pass, Sinkholm
$t - Mount Toras
$u - Southern Brigantia
'''

[[dialogue]]
event = 52
page = 1
command = 4
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Unser Weg führt nach Osten. 
Wir müssen durch das Torasgebirge, 
nicht nach Süd-Brigantia.
'''
patched = '''
\c[13]\n[3]\c[0]: Our mission leads to the
east. We have to go through Mount
Toras, not to Southern Brigantia.
'''

[[dialogue]]
event = 52
page = 1
command = 10
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Wir müssen doch zu den 
Gasthof nördlich von hier gehen, 
Kumpel.\. Wir sollten keine Zeit 
verschwenden.
'''
patched = '''
\c[2]\n[2]\c[0]: We have to go to
the inn north of here, Kento.\.
Let's not waste time.
'''

[[dialogue]]
event = 52
page = 1
command = 20
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ich glaub dem Vorento wär's 
gar nicht recht, wenn wir einen 
Abstecher in den Süden Brigantias 
machen würden, Kumpel.
'''
patched = '''
\c[2]\n[2]\c[0]: I don't think Vorento would
be happy if we made a detour to
Southern Brigantia.
'''

[[dialogue]]
event = 52
page = 1
command = 25
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Lass uns lieber zurück 
nach Nomerea gehen.
'''
patched = '''
\c[2]\n[2]\c[0]: Let's go back
to Nomerea first.
'''

[[dialogue]]
event = 52
page = 1
command = 30
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Ich sollte im Moment besser
nicht nach Süd-Brigantia gehen.
'''
patched = '''
\c[1]\n[1]\c[0]: I better not go to
Southern Brigantia right now.
'''

[[dialogue]]
event = 84
page = 1
command = 2
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Es gibt keinen Grund, das 
Gebiet nördlich Nomereas zu 
durchstreifen.
'''
patched = '''
\c[1]\n[1]\c[0]: There's no reason to roam
the area to the north of
Nomerea.
'''

[[dialogue]]
event = 88
page = 1
command = 4
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Kento,\. hier geht es immer noch 
nach Helnovien,\. da wo wir nicht hin 
müssen,\. erinnerst du dich?
'''
patched = '''
\c[13]\n[3]\c[0]: Kento,\. you're still going to
Helnovien,\. where we don't have to
go.\. Remember?
'''

[[dialogue]]
event = 88
page = 1
command = 8
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Mann, es muss ernster sein, 
als wir anfangs annahmen.\. Jetzt 
lässt auch schon sein Gedächnis 
nach...\. Armer Kento
'''
patched = '''
\c[2]\n[2]\c[0]: Man, it must be more serious
than we initially thought.\. Now his
memory is already diminishing.\.
Poor thing...
'''

[[dialogue]]
event = 88
page = 1
command = 13
has_portrait = true
character = '''Kento'''
original = '''
(\c[1]\n[1]\c[0]: ...Langsam zweifle ich 
daran, ob diese ganze Tour überhaupt
ernst gemeint ist.)
'''
patched = '''
(\c[1]\n[1]\c[0]: I'm slowly beginning to
doubt whether this whole journey
is really serious or not.)
'''

[[dialogue]]
event = 88
page = 1
command = 19
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Hier geht es nach Helnovien. \.
Unsere Reise geht nach Osten.
'''
patched = '''
\c[13]\n[3]\c[0]: Here lies Helnovien.\.
Our journey is in the east.
'''

[[dialogue]]
event = 88
page = 1
command = 26
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Wir sollten uns nicht zu weit 
von Gencorin entfernen.
'''
patched = '''
\c[1]\n[1]\c[0]: We shouldn't get too far
from Gencorin.
'''

[[dialogue]]
event = 107
page = 1
command = 4
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Wir müssen nach Osten in den 
Silvanwald, nicht hier entlang.
'''
patched = '''
\c[13]\n[3]\c[0]: We have to go east into the
Silvan Forest, not here.
'''
