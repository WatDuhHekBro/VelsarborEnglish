\c[1]Seldan\c[0]:\s[7] AHHHHHHHHHHHHHHHHHHHHHHHH!!!\.\.\.\.\.\^
'''

[[dialogue]]
event = 45
page = 4
command = 27
original = '''
\c[10]Funkdurchsage\c[0]:\s[2] VEL03!!\. WAS IST LOS?!\.
Wie lautet Ihr Status?!
'''
patched = '''
\c[10]Radio\c[0]:\s[2] VEL03!!\. WHAT'S WRONG?!\.
What's your status?!
'''

[[dialogue]]
