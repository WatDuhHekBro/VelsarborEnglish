\c[1]Vel03\c[0]:\s[9] .......\.\.\^
'''

[[dialogue]]
event = 45
page = 3
command = 9
original = '''
\c[10]Funkdurchsage\c[0]:\s[2] Vel03!\. Antworten Sie!\.
Vel03!\. Ziehen Sie sich zurück!\. SOFORT!!\.
Antworten Sie!\. Geben Sie uns ein 
Zeichen!!\.\.\.\^
'''
patched = '''
\c[10]Radio\c[0]:\s[2] Vel03!\. Answer!\. Vel03!\. Withdraw yourself!\.
IMMEDIATELY!!\. Answer us!\. Give us confirmation!!\.\.\.\^
'''

