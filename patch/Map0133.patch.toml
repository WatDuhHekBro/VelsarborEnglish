[[dialogue]]
event = 45
page = 1
command = 21
original = '''
\c[10]Funkdurchsage\c[0]:\s[4] An alle Einheiten der Birkon,
die Mission ist fehlgeschlagen!\.\.\^
'''
patched = '''
\c[10]Radio\c[0]:\s[4] Attention all Brigantian troops,
the mission has been compromised!\.\.\^
'''

[[dialogue]]
event = 45
page = 1
command = 31
original = '''
\c[10]Funkdurchsage\c[0]:\s[4] Sofortiger Rückzug!\. 
An alle Einheiten der Birkon,\.
umgehend den Rückzug antreten!\.\.\^
'''
patched = '''
\c[10]Radio\c[0]:\s[4] Retreat immediately!\.
Attention all Brigantian troops,\.
I repeat,\. retreat immediately!\.\.\^
'''

[[dialogue]]
event = 45
