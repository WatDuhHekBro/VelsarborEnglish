has_portrait = true
original = '''
\c[1]Seldan\c[0]:\s[5] .......
'''
patched = '''
\c[1]Seldan\c[0]:\s[5] .......
'''

[[dialogue]]
event = 45
page = 4
command = 32
has_portrait = true
original = '''
\c[1]Seldan\c[0]:\s[4] Statusbericht:\. Keine 
körperlichen Verletzungen,\.
keine Beschädigung des Vel-Systems.
'''
patched = '''
\c[1]Seldan\c[0]:\s[4] Status report...\.
No physical injuries,\.
no damage to the Vel-System.
'''

[[dialogue]]
event = 45
page = 4
command = 38
original = '''
\c[10]Funkdurchsage\c[0]:\s[3] ...Gut...\. 
Treten Sie umgehend Ihren Rückzug an!
'''
patched = '''
\c[10]Radio\c[0]:\s[3] Good...\. Now get out of there immediately!
'''

