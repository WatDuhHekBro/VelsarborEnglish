'''

[[dialogue]]
event = 45
page = 2
command = 9
original = '''
\c[10]Funkdurchsage\c[0]:\s[4] Spezialeinheit Vel03!\. 
Treten Sie umgehend Ihren Rückzug an!\.
Ihre Rückkehr ist von äußerster Priorität!\.\.\^
'''
patched = '''
\c[10]Radio\c[0]:\s[4] Special-Ops Vel03!\. Begin your retreat
immediately!\. Your safe return is top priority!\.\.\^
'''

[[dialogue]]
