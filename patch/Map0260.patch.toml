[[dialogue]]
event = 32
page = 1
command = 2
original = '''
\c[10]Gefangener\c[0]: Seht ihr diese etwas bröckelige 
Felswand dort links von mir?\. Früher war da mal ein 
Durchgang, aber er ist zusammengefallen.
'''
patched = '''
\c[10]Prisoner\c[0]: Do you see that crumbling wall there to
my left?\. There used to be a passage, but it
collapsed.
'''

[[dialogue]]
event = 32
page = 1
command = 5
original = '''
\c[10]Gefangener\c[0]: Und niemand kommt dazu, es 
aufzusprengen.\. Die Gefangenen haben nicht das 
Dynamit und für die Wachen ist Minenarbeit ein 
Fremdwort.
'''
patched = '''
\c[10]Prisoner\c[0]: And nobody gets to blow it up.\. Us
prisoners don't have the dynamite and trying
to reason with the guards is like talking to
a brick wall.
'''

[[dialogue]]
event = 32
page = 1
command = 9
original = '''
\c[10]Gefangener\c[0]: Dabei befanden sich reiche Erz-
Vorkommen in dem Bereich, wenn ich mich recht 
erinnere.
'''
patched = '''
\c[10]Prisoner\c[0]: There were rich ore deposits in the area
if I remember correctly.
'''

[[dialogue]]
event = 34
page = 1
command = 2
original = '''
\c[10]Gefangener\c[0]: Ohje, diese Arbeit...\. Junge, lass mich
dir einen Tipp geben.\. Überanstrenge dich nicht. \.
Das Einzige, was du davon hast ist Kreuzweh am 
Abend.
'''
patched = '''
\c[10]Prisoner\c[0]: Oh my, this work...\. Let me give you a
tip.\. Don't overexert yourself.\. The only thing you
get from it is a bunch of pain in the evening.
'''

[[dialogue]]
event = 35
page = 1
command = 2
original = '''
\c[10]Gefangener\c[0]: Ihr solltet euch nicht zu weit von den 
anderen Minenarbeiten entfernen.\. In den 
Randgebieten, wo weniger Leute arbeiten, tauchen 
immer wieder diese nervigen Biester auf.
'''
patched = '''
\c[10]Prisoner\c[0]: You shouldn't go too far from the other
miners.\. Out there, where fewer people work, these
annoying monsters keep showing up.
'''

[[dialogue]]
event = 40
page = 1
command = 16
has_portrait = true
character = '''Kento'''
original = '''
(\c[1]\n[1]\c[0]: Die Felswand scheint hier 
brüchig zu sein.)
'''
patched = '''
(\c[1]\n[1]\c[0]: This part of the wall looks
like it's crumbling.)
'''

[[dialogue]]
event = 40
page = 1
command = 20
has_portrait = true
original = '''
Dynamit verwenden?
'''
patched = '''
Use your dynamite here?
'''

[[dialogue]]
event = 40
page = 1
command = 89
original = '''
\^
'''
patched = '''
\^
'''

[[dialogue]]
event = 44
page = 1
command = 3
original = '''
\c[10]Gefangener\c[0]: ...\. ...\. oh?\. Tut mir Leid, wenn ich Erz 
hacke verfalle ich manchmal in Gedanken und 
bekomme gar nichts von meiner Umgebung mit...
'''
patched = '''
\c[10]Prisoner\c[0]: .\..\..\.Huh?\. I'm sorry, when I'm mining ore,
I sometimes get lost in my thoughts and don't
even notice my surroundings...
'''

[[dialogue]]
event = 45
page = 1
command = 3
has_portrait = true
character = '''Kento'''
original = '''
(\c[1]\n[1]\c[0]: An der Stelle arbeitet 
bereits jemand. Es würde nur stören, 
wenn wir hier mithelfen.)
'''
patched = '''
(\c[1]\n[1]\c[0]: Looks like someone's already
working here. We'd only be disturbing
them if we tried to help out.)
'''

[[dialogue]]
event = 46
page = 1
command = 2
original = '''
\c[10]Gefangene\c[0]: Seid ihr schon mal diesen ekligen, 
bläulichen Würmern übern Weg gelaufen?\. Diese 
Viecher beherrschen Signum wie die Erzmagier aus 
Domarkor, sag'sch dir.
'''
patched = '''
\c[10]Prisoner\c[0]: Have you ever run into these nasty,
bluish worms?\. These monsters wield Signum like
the archmages from Domarkor I tell you.
'''

[[dialogue]]
event = 46
page = 1
command = 6
original = '''
\c[10]Gefangene\c[0]: Ihr solltet euch besser nicht mit 
ihnen anlegen...
'''
patched = '''
\c[10]Prisoner\c[0]: You'd better not mess with them...
'''

[[dialogue]]
event = 46
page = 1
command = 11
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Würmer, die so stark zaubern 
wie unsere Erzmagier?\. Das sind 
Neuigkeiten! 
'''
patched = '''
\c[5]\n[5]\c[0]: Worms that wield magic like
our archmages?\. That's news to me!
'''

[[dialogue]]
event = 46
page = 1
command = 15
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Unsere Patricia des Signums 
wird das mit Sicherheit 
interessieren.
'''
patched = '''
\c[5]\n[5]\c[0]: Our Patrician of Signums will
certainly be interested in that.
'''

[[dialogue]]
event = 46
page = 1
command = 19
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Solche Würmer sind mit 
Sicherheit kostengünstiger zu 
halten als dieses anspruchsvolle 
Pack von Zauberern.
'''
patched = '''
\c[5]\n[5]\c[0]: Such worms are definitely
cheaper to keep than this
sophisticated pack of wizards.
'''

[[dialogue]]
event = 46
page = 1
command = 25
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Da denkt jemand sehr lukrativ.
'''
patched = '''
\c[13]\n[3]\c[0]: Someone's thinking very
lucratively.
'''

[[dialogue]]
event = 46
page = 1
command = 27
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Tja, ja. Unser Reichtum ist 
nicht mehr das, was er vor 10 Jahren 
zu sein pflegte, Fräulein Filaja.
'''
patched = '''
\c[5]\n[5]\c[0]: Well, yes. Our wealth is no
longer what it used to be 10 years
ago, Ms. Filaja.
'''

[[dialogue]]
event = 47
page = 1
command = 2
original = '''
\c[10]Gefangener\c[0]: Sprich gefälligst jemand anderen an, 
ich bin beschäftigt.
'''
patched = '''
\c[10]Prisoner\c[0]: Go talk to someone else, I'm busy.
'''

[[dialogue]]
event = 48
page = 2
command = 2
original = '''
\c[10]Wache\c[0]: Macht eure Arbeit ja gut. Falls nicht, 
haben wir genug Methoden, euch entsprechend zu 
"motivieren".
'''
patched = '''
\c[10]Guard\c[0]: Do your job well. If not, we have enough
methods to "motivate" you accordingly.
'''

