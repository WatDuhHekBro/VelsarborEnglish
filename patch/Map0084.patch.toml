\c[1]\n[1]\c[0]: Come,\. I'll talk to her
if you're too scared to.
'''

[[dialogue]]
event = 15
page = 1
command = 180
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Hey, das hab ich nicht gesagt!
'''
patched = '''
\c[2]\n[2]\c[0]: Hey, I didn't say that!
'''

[[dialogue]]
event = 15
page = 1
command = 182
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: ...\. Aber mach ruhig du,\. 
sicher ist sicher.
'''
patched = '''
\c[2]\n[2]\c[0]: But do as you will,\.
safe is safe after all.
'''

[[dialogue]]
event = 22
page = 1
command = 2
original = '''
\c[10]Junger Mann\c[0]: Ich weiß nicht, ob ihr schon mal 
auf den Sinke-Lohne-Pass gewesen seid,\. aber ihr 
kennt doch sicher diese grünen Schleimhaufen, 
die einen immer angreifen müssen,\. oder?
'''
patched = '''
\c[10]Young Man\c[0]: I don't know if you've ever been to
the Sink-Lohne Pass,\. but you surely know about
these green piles of slime that always attack
you,\. right?
'''

[[dialogue]]
event = 22
page = 1
command = 6
original = '''
\c[10]Junger Mann\c[0]: Es kann aber auch sein, dass ihr 
sie schon in andere Farben gesehen habt.\. Hier 
im Torasgebirge zum Beispiel gibt solch blaue 
Viecher...
'''
patched = '''
\c[10]Young Man\c[0]: It may also be that you've already
seen them in other colors.\. Here in Mount Toras
for example, there are blue versions of this
slime...
'''

[[dialogue]]
event = 22
page = 1
command = 10
original = '''
\c[10]Junger Mann\c[0]: Die sind ein ganzes Stück 
hartnäckiger als ihre grünen Verwandten.\. Ich 
hab aber gehört sie sollen gegen 
Feuer empfindlich sein...
'''
patched = '''
\c[10]Young Man\c[0]: They're a lot more stubborn
than their green relatives.\. But I heard
they should be sensitive to fire...
'''

[[dialogue]]
event = 22
page = 2
command = 2
original = '''
\c[10]Junger Mann\c[0]: Ich hab ihm ja geraten, er solle es 
lieber sein lassen,\. aber es war klar,\. dass ich ihn 
nicht davon abhalten konnte....
'''
patched = '''
\c[10]Young Man\c[0]: I told him to knock it off,\. but
it was clear that I couldn't stop him...
'''

[[dialogue]]
event = 23
page = 1
command = 2
character = '''Port Retisa'''
original = '''
\c[10]Mann\c[0]: Ich und meine Familie sind auf der 
Durchreise nach Sinkholm und machen hier 
Pause.\. Wir kommen von \n[22]. Wir haben also 
jetzt ungefähr die Hälfte des Weges geschafft.
'''
patched = '''
\c[10]Man\c[0]: My family and I are currently travelling
to Sinkholm and are taking a break here.\.
We come from \n[22]. And we're now
about half the way there.
'''

[[dialogue]]
event = 23
page = 1
command = 9
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Was?\. Nach Sinkholm?\. Hät' 
nicht gedacht,\. dass diese Kleinstadt 
Besuch von weit her bekommt.
'''
patched = '''
\c[2]\n[2]\c[0]: What?\. To Sinkholm?\. Didn't
think that this small town would
get visitors from far away.
'''

[[dialogue]]
event = 23
page = 1
command = 13
original = '''
\c[10]Mann\c[0]: Naja, wir besuchen dort ja auch nur ein 
paar Verwandte...\. In der Stadt ist wirklich kaum 
was los... 
'''
patched = '''
\c[10]Man\c[0]: Well, we only visit a few relatives there...\.
There's hardly anything going on in that town...
'''

[[dialogue]]
event = 23
page = 2
command = 2
original = '''
\c[10]Mann\c[0]: Tsk, das geschah diesem Säufer nur zu 
Recht.\. Mit seinem Gegröle ist er allen hier schon 
die ganze Zeit auf die Nerven gegangen....
'''
patched = '''
\c[10]Man\c[0]: Tsk, that drunkard got what he deserved.\.
With his loud voice, he always annoyed
everyone here...
'''

[[dialogue]]
event = 24
page = 1
command = 2
original = '''
\c[10]Frau\c[0]: Das wandern ist ziemlich anstrengend, vor 
allem da sich derzeit sehr viele Wesen in der 
Natur sehr aggressiv verhalten.\. Es ist schon sehr 
riskant in kleinen Gruppen zu reisen...
'''
patched = '''
\c[10]Woman\c[0]: Hiking is quite exhausting, especially
since many creatures there are very aggressive
in nature.\. It's very risky to travel in small
groups...
'''

# If I'm not wrong, it's the same exact person, only with a different title.
[[dialogue]]
event = 25
page = 1
command = 2
original = '''
\c[10]Kleiner Junge\c[0]: Wäh...\. Ich will nicht nach 
Sinkholm.\. Da ist es immer so stinklangweilig.
'''
patched = '''
\c[10]Boy\c[0]: Ugh...\. I don't wanna go back
to Sinkholm.\. It's always so boring.
'''

[[dialogue]]
event = 25
page = 2
command = 2
original = '''
\c[10]Junge\c[0]: Wahnsinn!\.\. Das Fass hat keinen Schaden 
genommen.\. Was für ein stabiles Fass!
'''
patched = '''
\c[10]Boy\c[0]: Wicked!\.\. The barrel wasn't damaged at all.\.
What a stable barrel!
'''

[[dialogue]]
event = 26
page = 1
command = 3
original = '''
\c[10]Händler\c[0]: Ohje...\. wieder durch das Torasgebirge. 
Ich bin diese Route schon duzend Mal entlang 
gereist und trotzdem ist der Weg durch das 
Torasgebirge jedes Mal eine Qual.
'''
patched = '''
\c[10]Merchant\c[0]: Oh man...\. Again through Mount Toras.
I've travelled this route a dozen times and yet
the path through Mount Toras is always a pain.
'''

[[dialogue]]
event = 26
page = 1
command = 7
original = '''
\c[10]Händler\c[0]: Aber es gibt bisher keine alternative 
Route,\. also bleibt mir nichts anderes übrig...
'''
patched = '''
\c[10]Merchant\c[0]: But, there's no alternative route so
far,\. so I have no other choice...
'''

[[dialogue]]
event = 26
page = 2
command = 2
original = '''
\c[10]Händler\c[0]: Weibliche Soldaten vom Briganten-
Orden sieht man nicht oft. Zwar ist es Frauen 
erlaubt, dem Orden beizutreten, doch ist es 
einfach unüblich, dass so was geschieht.
'''
patched = '''
\c[10]Merchant\c[0]: Female soldiers from the Brigantine
Order aren't seen very often. Women are allowed
to join the order, but it isn't super common
for something like that to happen.
'''

[[dialogue]]
event = 26
page = 2
command = 6
original = '''
\c[10]Händler\c[0]: Ich denke Frauen erhalten einfach 
noch nicht genug Respekt, wenn es ums Militär 
geht.\. Ich glaube in den Kasernen werden sie wie
Außenseiter behandelt.\. Hm...\. Wie ich das sehe? 
'''
patched = '''
\c[10]Merchant\c[0]: I think women just don't get enough
respect when it comes to the military.\. I think
they're treated like outsiders in the barracks.\.
Hm...\. What do I think of that?
'''

[[dialogue]]
event = 26
page = 2
command = 10
original = '''
\c[10]Händler\c[0]: Ohje, wenn ich da an meine Ehefrau 
denke...  Man sollte Frauen nicht unterschätzen. 
Glaub mir, ich sprech' aus Erfahrung.
'''
patched = '''
\c[10]Merchant\c[0]: Well, when I think of my wife...
You shouldn't underestimate women. Trust me,
I speak from experience.
'''

[[dialogue]]
event = 28
page = 1
command = 2
original = '''
\c[10]Händler\c[0]: Als ich Gestern durch das Torasgebirge 
gewandert bin, hab ich ein leichtes Erdbeben 
wahrgenommen... 
'''
patched = '''
\c[10]Merchant\c[0]: When I hiked through Mount Toras
yesterday, I noticed a slight earthquake...
'''

[[dialogue]]
event = 28
page = 1
command = 6
original = '''
\c[10]Glatzköpfiger Händler\c[0]: Erdbeben?\. Das ist sehr 
ungewöhnlich.\. Immerhin gibt es im 
Torasgebirge keine Vulkane oder so was...
'''
patched = '''
\c[10]Bald Merchant\c[0]: Earthquake?\. That's rather unusual.\.
After all, there aren't any volcanoes or
anything in Mount Toras...
'''

[[dialogue]]
event = 28
page = 1
command = 9
original = '''
\c[10]Händler\c[0]: Hm, vielleicht hab ich es mir auch nur 
eingebildet...
'''
patched = '''
\c[10]Merchant\c[0]: Hm, maybe I was just hearing things...
'''

[[dialogue]]
event = 30
page = 1
command = 3
original = '''
\c[10]Händler\c[0]: Nach Osten reisen und an der Grenze 
günstig Metall und Rüstungsteile kaufen und 
dann hier im Westen verkaufen...\. Das ist immer 
eine gute Methode um Geld zu machen.
'''
patched = '''
\c[10]Merchant\c[0]: Travel east, buy cheap metal and armor
at the border, then sell it here in the west...\.
It's always a good way to make money.
'''

# Redundant name? - port town of Port Retisa
[[dialogue]]
event = 30
page = 1
command = 7
character = '''Port Retisa'''
original = '''
\c[10]Händler\c[0]: Im Westen kann man eventuell noch einen 
kleinen Umweg zur Hafenstadt \n[22] machen, 
um dort kostbare, konservierte Seefische für 
einen recht günstigen Preis zu erwerben.
'''
patched = '''
\c[10]Merchant\c[0]: In the west you can make a small detour
to the port town of \n[22] to buy precious,
preserved saltwater fish for a fairly low price.
'''

[[dialogue]]
event = 30
page = 1
command = 11
original = '''
\c[10]Händler\c[0]: Diese Fische verkaufen sich wiederum 
im Osten für einen sehr guten Preis.\. Sie gelten 
dort als Delikatesse.\. Aber man muss schon auf 
genug Nachfrage stoßen...
'''
patched = '''
\c[10]Merchant\c[0]: These fish in turn sell in the east
for a very good price.\. They're considered a
delicacy there.\. But you have to meet
enough demand...
'''

[[dialogue]]
event = 30
page = 1
command = 15
original = '''
\c[10]Händler\c[0]: Denn sonst lohnt es sich nicht für den 
Umweg, den man geht.
'''
patched = '''
\c[10]Merchant\c[0]: Otherwise it's not worth the detour
that you take.
'''

[[dialogue]]
event = 30
page = 2
command = 2
original = '''
\c[10]Händler\c[0]: Immer diese Prügeleien in der Kneipe!\.
So kann man sich hier ja nicht mal richtig 
entspannen.
'''
patched = '''
\c[10]Merchant\c[0]: Always with the fights in the pub!\.
You really can't relax here.
'''

[[dialogue]]
event = 32
page = 1
command = 2
original = '''
\c[10]Gasthofbesitzer\c[0]: Der Geschäft boomt!\. Die Idee, 
einen Gasthof an dieser Kreuzung zu bauen, war 
einfach genial.\. Jeden Tag kommen hier hunderte  
von Händlern und Reisenden vorbei.
'''
patched = '''
\c[10]Inn Owner\c[0]: Business is booming!\. The idea of
building an inn at this intersection was just
brilliant.\. Hundreds of traders and travelers
come here every day.
'''

[[dialogue]]
event = 32
page = 1
command = 6
original = '''
\c[10]Gasthofbesitzer\c[0]: Ich hoffe nur das sich hier nicht 
allzu bald Konkurrenz dazu gesellt...
'''
patched = '''
\c[10]Inn Owner\c[0]: I just hope that a competitor
doesn't come here too soon...
'''

[[dialogue]]
event = 32
page = 1
command = 8
original = '''
\c[10]Gasthofbesitzer\c[0]: Achja... 
'''
patched = '''
\c[10]Inn Owner\c[0]: Oh right... 
'''

[[dialogue]]
event = 32
page = 1
command = 13
original = '''
\c[10]Gasthofbesitzer\c[0]: Ihnen gehört das mittlere Zimmer.
Wünsche ihnen einen erholsamen Schlaf.
'''
patched = '''
\c[10]Inn Owner\c[0]: Your room is in the middle.
Have a good night.
'''

# Same reason as above.
[[dialogue]]
event = 32
page = 2
command = 2
original = '''
\c[10]Hotelbesitzer\c[0]: Na endlich ist dieser Trottel aus 
meinem Laden raus.\. Ich sah schon, wie er die 
einsten Kunden vertrieben hat.\.
Er war nicht gut fürs Geschäft.
'''
patched = '''
\c[10]Inn Owner\c[0]: Finally, this idiot is finally out
of my shop.\. I saw how he drove out the first
customers.\. It wasn't good for business.
'''
