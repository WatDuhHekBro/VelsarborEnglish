[[dialogue]]
event = 42
page = 1
command = 3
original = '''
\c[10]Wache\c[0]: Hey, ihr habt es echt da durch geschafft, 
nicht schlecht, nicht schlecht.\. War bestimmt 
ordentlich Erz da drüben, oder?
'''
patched = '''
\c[10]Guard\c[0]: Hey, you actually made it through, not bad
I'll give you that.\. It was the ore over there,
wasn't it?
'''

[[dialogue]]
event = 42
page = 1
command = 8
original = '''
\c[10]Wache\c[0]: Hm...\. interessant, interessant. \.Ich frage 
mich, wie man da unten durch kommt, bei all dem 
Gestein. \.Einer hat es ja anscheinend geschafft.
'''
patched = '''
\c[10]Guard\c[0]: Hm...\. Interesting, interesting.\. I wondered
how one would get over there with all the rocks
around.\. Apparently someone did it.
'''
