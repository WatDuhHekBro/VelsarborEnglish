[[dialogue]]
event = 3
page = 2
command = 2
original = '''
\c[10]Adelsmann\c[0]: Guten Tag, die Herren.
Was würden Sie von einer Schiffsroute entlang 
der Lohne halten?
'''
patched = '''
\c[10]Nobleman\c[0]: Good afternoon, gentlemen.
What would you think of a shipping
route across the Lohne?
'''

[[dialogue]]
event = 3
page = 2
command = 7
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Hm?
'''
patched = '''
\c[1]\n[1]\c[0]: Hm?
'''

[[dialogue]]
event = 3
page = 2
command = 9
original = '''
\c[10]Adelsmann\c[0]: Nun... Seit wir den Handel mit den 
östlichen Städten Brigantias verstärkt haben, 
läuft es auf finanzieller Ebene wieder 
erstklassig.
'''
patched = '''
\c[10]Nobleman\c[0]: Well... Since we have increased trade
eastern cities of Brigantia, things have been
going well on a financial level.
'''

[[dialogue]]
event = 3
page = 2
command = 13
original = '''
\c[10]Adelsmann\c[0]: Trotzdem stellt das Torasgebirge 
südöstlich von hier noch eine Blockade für uns 
dar. Es ist ziemlich mühselig, die Handelswaren 
durch dieses Gebiet zu schleppen...
'''
patched = '''
\c[10]Nobleman\c[0]: Nevertheless, Mount Toras southeast
of here is still an obstacle for us. It's rather
tedious to transport the supplies through this
area...
'''

[[dialogue]]
event = 3
page = 2
command = 17
original = '''
\c[10]Adelsmann\c[0]: Ich setze mich nun dafür ein, 
Schiffsrouten über die Lohne zu erstellen. Über 
Wasser würde man weitaus einfacher in den 
Osten des Landes gelangen.
'''
patched = '''
\c[10]Nobleman\c[0]: I am now committed to creating
shipping routes across the Lohne. It'd be much
easier to get to the east of the country
by water.
'''

[[dialogue]]
event = 3
page = 2
command = 23
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Interessant.\.
Wäre sicherlich keine schlechte Idee.
'''
patched = '''
\c[1]\n[1]\c[0]: Interesting.\.
Not a bad idea.
'''

[[dialogue]]
event = 3
page = 2
command = 27
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Wenn's soweit ist, würd's 
dann auch stinknormale 
Passagierschiffe geben? 
'''
patched = '''
\c[2]\n[2]\c[0]: When the time comes, wouldn't
there just be regular old
passenger ships?
'''

[[dialogue]]
event = 3
page = 2
command = 31
character = '''Fejar'''
original = '''
\c[10]Adelsmann\c[0]: Ja, das wäre gut möglich.
Man muss abwarten, ob genug \n[19] dafür übrig 
bleiben.
'''
patched = '''
\c[10]Nobleman\c[0]: Yes, that might be possible.
We'll have to wait and see if there's
enough \n[19] left.
'''

[[dialogue]]
event = 5
page = 1
command = 2
original = '''
\c[10]Ingenieur\c[0]: Die Problematik an der ganzen Sache ist 
die, dass ein permanenter, starker Wind entlang 
der Lohne weht, von Korzojeno Richtung Brigantia.
'''
patched = '''
\c[10]Engineer\c[0]: The problem with the whole thing is
that a permanent, strong wind blows along the
Lohne, from Korzojeno towards Brigantia.
'''

[[dialogue]]
event = 5
page = 1
command = 5
original = '''
\c[10]Ingenieur\c[0]: Segelschiffe stehen deswegen außer 
Frage. 
'''
patched = '''
\c[10]Engineer\c[0]: Sailing is therefore out of
the question.
'''

[[dialogue]]
event = 6
page = 1
command = 2
original = '''
\c[10]Ingenieur\c[0]: Wenn wir keine Segelschiffe verwenden 
können, was dann?\. Ruderboote wären sicherlich eine 
Möglichkeit. 
'''
patched = '''
\c[10]Engineer\c[0]: If we can't use sailing ships, what
then?\. Rowing boats certainly isn't an
option.
'''

[[dialogue]]
event = 6
page = 1
command = 5
original = '''
\c[10]Ingenieur\c[0]: Aber auch hier hätte man mit dem 
Gegenwind zu kämpfen.\. Sehr viel einfacher als der 
Wanderweg durch das Torasgebirge wäre es 
jedenfalls nicht.
'''
patched = '''
\c[10]Engineer\c[0]: But here as well you'd have to fight
the headwind.\. In any case, it wouldn't be much
easier than the trail through Mount Toras.
'''
