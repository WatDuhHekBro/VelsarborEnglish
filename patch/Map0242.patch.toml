[[dialogue]]
event = 24
page = 1
command = 3
original = '''
\c[10]Wächter\c[0]: Na? Ordentlich Erz abgebaut?\. Dann geht 
zurück zu euren Zellen.
'''
patched = '''
\c[10]Guard\c[0]: Well?\. Mining ore like you should?\. Then get
back to your cells.
'''

[[dialogue]]
event = 24
page = 1
command = 7
original = '''
\c[10]Wächter\c[0]: Was, wollt ihr hier durch?\. Ach ja, zur 
Mine ohne Ausrüstung, um eine Ausrede zu haben, 
nicht arbeiten zu müssen?\. Träumt weiter.
'''
patched = '''
\c[10]Guard\c[0]: What?\. You want to go through here?\. Why of
course, to the mine without any equipment
whatsoever, so that you can have an excuse
to not have to work?\. Keep dreaming.
'''

[[dialogue]]
event = 25
page = 1
command = 3
original = '''
\c[10]Wächter\c[0]: Ich hoffe, ihr habt auch all eure 
Ausrüstung abgegeben. 
'''
patched = '''
\c[10]Guard\c[0]: I hope you submitted all of your equipment
too.
'''

[[dialogue]]
event = 25
page = 1
command = 5
original = '''
\c[10]Wächter\c[0]: Sollten wir irgendetwas Anderes bemerken, 
dürft ihr euch an eine Felswand stellen und euch 
einmal genauso wohl fühlen wie das Erz - wenn ihr 
es von der Wand hackt.
'''
patched = '''
\c[10]Guard\c[0]: If we notice that you still have something
else, be prepared to feel what a vein of ore feels
when you take a swing at it.
'''

[[dialogue]]
event = 25
page = 1
command = 11
original = '''
\c[10]Wächter\c[0]: Ihr sollt durch das Haus links von hier. 
Dort bekommt ihr eure Ausrüstung.
'''
patched = '''
\c[10]Guard\c[0]: You should go to the building left of here.
You can get your equipment there.
'''

[[dialogue]]
event = 26
