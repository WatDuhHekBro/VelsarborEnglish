[[text]]
event = 76
page = 1
command = 4
original = '''Vor der Mine'''
patched = '''Mine Entrance'''

# I decided to block off the register because there are quite the number of problems with letting the player go back there. There are two guards in the register which don't have any dialogue. The guard giving you equipment may as well have some easter egg dialogue as the original doesn't really make sense. In the building, there's an invisible wall too. Outside, the two guards there repeat the same dialogue as the third guard by the barrels. There's also no door back into the register. In the mine, if you go to any stop at the railways, the game effectively crashes. The only problem now is the move event, which doesn't make the player walk away from the door. Other than that though, a lot of problems are avoided with this.

