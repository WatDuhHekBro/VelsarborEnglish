[[dialogue]]
event = 1
page = 1
command = 6
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]:\c[0] Ich will sicher nicht 
erfahren, wie wir da draußen 
empfangen werden, wenn wir einfach 
so die Mine verlassen.
'''
patched = '''
\c[1]\n[1]\c[0]: I'm definitely not looking
forward to seeing how they'd react
to us just leaving the mine like
that.
'''

[[dialogue]]
event = 8
page = 1
command = 18
original = '''

Info: Während der Lorenfahrt kannst du bei \c[11]Weichen\c[0] 
entscheiden, welche \c[11]Richtung\c[0] du einschlägst.
'''
patched = '''

Info: While travelling through the railways,
you can \c[11]decide which direction to go\c[0].
'''

[[dialogue]]
event = 8
page = 1
command = 21
original = '''

Liegt eine Weiche bevor, erscheint folgende 
Anzeige.
'''
patched = '''

If there's a junction, the following display
appears.
'''

[[dialogue]]
event = 8
page = 1
command = 51
original = '''

Der \c[11]Pfeil\c[0] gibt dabei die \c[11]aktuelle Richtung\c[0] ein, 
die die Lore entlang fahren wird.
'''
patched = '''

The \c[11]arrow\c[0] shows you the \c[11]current direction\c[0] that the
minecart will move along.
'''

[[dialogue]]
event = 8
page = 1
command = 54
original = '''

Drücke \c[11]rechtzeitig Enter\c[0] um die \c[11]Richtung zu 
ändern\c[0].
'''
patched = '''

\c[11]Press Enter in time\c[0] to change directions.
'''

[[dialogue]]
event = 8
page = 1
command = 57
original = '''

Du kannst nur \c[11]einmal die Richtung ändern\c[0], also 
überleg genau.
'''
patched = '''

You can \c[11]only change directions once\c[0], so think
carefully about where you want to go.
'''

