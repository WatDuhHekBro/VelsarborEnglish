original = '''
\c[1]\n[1]\c[0]: Oha!\. Das hier sieht gut aus.
'''
patched = '''
\c[1]\n[1]\c[0]: Oh!\. This looks like it.
'''

[[dialogue]]
event = 18
page = 2
command = 22
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Bitte achtet unbedingt 
darauf, dass wir das Pulver auch 
rausgeschmuggelt bekommen!
'''
patched = '''
\c[5]\n[5]\c[0]: Please make sure that we
actually can get the powder
smuggled out of here!
'''

[[dialogue]]
event = 18
page = 2
