'''
patched = '''
\c[10]Short-Haired Girl\c[0]: Oh, it's you again...
What is it this time?
'''

[[dialogue]]
event = 147
page = 1
command = 49
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Mein Kamerad und ich 
kommen von Nomerea und wollten 
heute den Rückweg antreten. 
'''
patched = '''
\c[2]\n[2]\c[0]: My fellow teammate and I hail
from Nomerea and are returning today.
'''

[[dialogue]]
event = 147
page = 1
command = 52
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ich wollte fragen, ob es Ihnen 
recht wäre, uns zu begleiten.
'''
patched = '''
\c[2]\n[2]\c[0]: Care to join us?
'''

[[dialogue]]
event = 147
page = 1
command = 56
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: .....
'''
patched = '''
\c[1]\n[1]\c[0]: .....
'''

[[dialogue]]
event = 147
page = 1
command = 58
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Auf den Weg nach Nomerea 
treibt sich so einiges Ungetüm rum,
vor dem wir Sie dann natürlich 
beschützen würden.
'''
patched = '''
\c[2]\n[2]\c[0]: On the way to Nomerea, there
are some monsters that we'd gladly
protect you from of course!
'''

[[dialogue]]
event = 147
page = 1
command = 63
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Nicht zuletzt, da es sich um  
eine so hübsche Dame handelt, wäre 
es uns eine große Ehre, würden Sie 
uns auf unseren Wegen begleiten.
'''
patched = '''
\c[2]\n[2]\c[0]: And last, but certainly not
with such a fine-looking gal you are,
it'd be an honor for us if you would
accompany us along the way.
'''

[[dialogue]]
event = 147
page = 1
command = 68
original = '''
\c[10]Kurzhaariges Mädchen\c[0]: Ach weißt du, seit ich 
weiß, dass du aus Nomerea kommst, habe ich meine 
Meinung geändert.\.
Ich bleibe doch lieber erstmal hier....
'''
patched = '''
\c[10]Short-Haired Girl\c[0]: You know...\. Since I know that
you're from Nomerea, I've changed my mind.\.
I'd rather stay here first...
'''

[[dialogue]]
event = 147
page = 1
command = 74
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: ...Wenn das Ihnen lieber ist...
(VERDAMMT!)
'''
patched = '''
\c[2]\n[2]\c[0]: Well if that's what you
prefer... (DAMN!)
'''

[[dialogue]]
event = 147
page = 1
command = 96
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Du kannst es einfach nicht 
lassen.
'''
patched = '''
\c[1]\n[1]\c[0]: You simply can't leave it at
that, can you?
'''

[[dialogue]]
event = 147
page = 1
command = 99
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ich dacht' mit der etwas 
feineren Art würd's klappen, aber 
ich denk' dafür war's zu spät\.,
oder?
'''
patched = '''
\c[2]\n[2]\c[0]: I thought it'd work with the
more gentle one, but I think I was
too late,\. isn't that right?
'''

[[dialogue]]
event = 147
page = 1
command = 104
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Zu spät? Das war jetzt das 5. 
Mal, wo du mit ihr rumgeflirtet hast, 
seit wir hier sind. Und vorher immer
mit altüblicher Gossensprache.
'''
patched = '''
\c[1]\n[1]\c[0]: Too late?! This is the fifth
time you've tried to flirt with her
since we got here! And always with
the usual dirty talk beforehand.
'''

[[dialogue]]
event = 147
page = 1
command = 109
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Jaja, schon gut. Es war halt 
der letzte hoffnungslose Versuch...
'''
patched = '''
\c[2]\n[2]\c[0]: Okay, fine. It was a last-ditch
attempt anyways...
'''

[[dialogue]]
event = 147
page = 1
command = 121
original = '''
\c[10]Kurzhaariges Mädchen\c[0]: Ich sterbe hier noch 
vor Langeweile! Spätestens in 2 Monaten 
verschwinde ich von hier und ziehe nach Nomerea!
'''
patched = '''
\c[10]Short-Haired Girl\c[0]: I'm dying of boredom here!
I'm moving to Nomerea in two months at the latest!
'''

