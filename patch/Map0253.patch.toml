[[dialogue]]
event = 56
page = 2
command = 2
original = '''
\c[10]Wache\c[0]: Wieso müssen wir die Gefangenen eigentlich 
immer so streng und rücksichtslos behandeln? 
'''
patched = '''
\c[10]Guard\c[0]: Why do we always have to treat prisoners so
rigorously and ruthlessly?
'''

[[dialogue]]
event = 56
page = 2
command = 4
original = '''
\c[10]Wache\c[0]: Ich meine, würde es nicht mal motivierend 
wirken, wenn man sie ab und zu mal für ihre gute 
Arbeit loben würde?
'''
patched = '''
\c[10]Guard\c[0]: I mean, wouldn't it even be motivating to
praise them for their efforts every now and then?
'''

[[dialogue]]
event = 56
page = 2
command = 10
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Das hier IST ein Gefängnis, 
oder?
'''
patched = '''
\c[13]\n[3]\c[0]: This IS a prison after all,
isn't it?
'''

[[dialogue]]
event = 56
page = 2
command = 13
original = '''
\c[10]Wache\c[0]: Ja... stimmt.
'''
patched = '''
\c[10]Guard\c[0]: Well... yeah...
'''

[[dialogue]]
event = 56
page = 2
command = 16
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Die Leute sollen für ihre 
Taten bestraft werden.\. Also wieso 
sollte man sie für irgend etwas 
loben?
'''
patched = '''
\c[13]\n[3]\c[0]: And prisoners should be punished
for their crimes.\. So why would you
praise them for anything?
'''

[[dialogue]]
event = 56
page = 2
command = 21
original = '''
\c[10]Wache\c[0]: Ja, eigentlich hast du Recht!\. In dem 
Fall...\. Steht hier nicht wie angewurzelt da!\. Geht 
sofort wieder an die Arbeit!
'''
patched = '''
\c[10]Guard\c[0]: Yeah...\. Actually,\. you're right!\. In that
case...\. Don't just stand there!\. Get back to
work immediately!
'''

[[dialogue]]
event = 56
page = 2
command = 26
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Schön gemacht, Soko.
'''
patched = '''
\c[1]\n[1]\c[0]: Way to go, Soko.
'''

[[dialogue]]
event = 56
