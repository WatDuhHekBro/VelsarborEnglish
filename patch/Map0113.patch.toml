[[dialogue]]
event = 5
page = 1
command = 2
original = '''
\c[10]Mann\c[0]: Seit den letzten Jahren hat sich der Zahl 
der Reisenden in dieser Gegend drastisch 
erhöht. 
'''
patched = '''
\c[10]Man\c[0]: The number of travellers to this area has
increased dramatically in recent years.
'''

[[dialogue]]
event = 5
page = 1
command = 5
original = '''
\c[10]Mann\c[0]: Dies alles ist, seit Brigantia vor 6 Jahren 
freien Eintritt ins Land für Händler und 
Reisende gewährte, die nur für eine gewisse Zeit 
im Land bleiben wollen.
'''
patched = '''
\c[10]Man\c[0]: This has been ever since Brigantia granted
free entry to the country six years ago for
traders and travellers who only want to stay
in the country for a certain period of time.
'''

[[dialogue]]
event = 5
page = 1
command = 9
original = '''
\c[10]Mann\c[0]: Eine erfreuliche Entwicklung, finde ich, 
so wird der Handel zwischen den beiden Ländern 
doch stark verbessert und auch die beiden 
Völker finden allgemein mehr Kontakt.
'''
patched = '''
\c[10]Man\c[0]: I think the development is encouraging, as
trade between the two countries has greatly
improved and the two peoples generally
meet each other more often.
'''

[[dialogue]]
event = 5
page = 1
command = 13
original = '''
\c[10]Mann\c[0]: Nur leider lockt diese Entwicklung auch 
eine ganze Zahl von Banditen und Räubern ins 
Corine Plateau. In letzter Zeit wurden viele 
Reisende überfallen.
'''
patched = '''
\c[10]Man\c[0]: Unfortunately, this development also
attracts a large number of bandits and robbers
to the Corine Plateau. Lots of travellers
there have been ambushed recently.
'''

[[dialogue]]
event = 5
page = 1
command = 17
original = '''
\c[10]Mann\c[0]: Brigantia sollte dagegen ziemlich bald 
was unternehmen, bevor das Problem ins 
Unkontrollierbare eskaliert.
'''
patched = '''
\c[10]Man\c[0]: Brigantia, on the other hand, should do
something pretty soon before the problem
escalates and becomes uncontrollable.
'''

[[dialogue]]
event = 6
page = 3
command = 18
has_portrait = true
original = '''
\c[10]?????\c[0]: Ja, was ist?\. Oho!\.
Wie ich sehe, gehört auch ihr zu uns 
Kriegern und Kämpfern!\. Und Waffen 
habt ihr auch.
'''
patched = '''
\c[10]?????\c[0]: Yeah, what's up?\. Oh!\. I see
you're one of us warriors and
fighters!\. And you have
weapons too.
'''

[[dialogue]]
event = 6
page = 3
command = 24
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Öhm, ja...\. Das gehört nun mal 
dazu, wenn man kämpft...
'''
patched = '''
\c[1]\n[1]\c[0]: Um, yes...\. that's part of the
being a fighter...
'''

[[dialogue]]
event = 6
page = 3
command = 27
has_portrait = true
original = '''
\c[10]?????\c[0]: Natürlich.\. 
Mein Name ist Yahenru Hartenso.\. 
Meines Zeichens Waffensammler!
'''
patched = '''
\c[10]?????\c[0]: Of course.\. My name is Yahenru
Hartenso.\. I'm a weapons collector!
'''

[[dialogue]]
event = 6
page = 3
command = 32
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Das sieht man mehr als 
deutlich, dass du Waffen sammelst...
'''
patched = '''
\c[1]\n[1]\c[0]: It's pretty clear to me that
you collect weapons...
'''

[[dialogue]]
event = 6
page = 3
command = 35
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Ja, und ich bin ständig auf 
der Suche nach neuen, mächtigen 
Waffen,\. um schließlich ein mächtiger 
Kämpfer zu werden.
'''
patched = '''
\c[10]Yahenru\c[0]: Yep, and I'm constantly
looking for new, powerful weapons
to eventually become a powerful
fighter.
'''

[[dialogue]]
event = 6
page = 3
command = 40
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Wie...\. du willst durch Waffen- 
sammeln ein mächtiger Kämpfer 
werden?
'''
patched = '''
\c[1]\n[1]\c[0]: How...\. are you going to become
a powerful fighter by collecting
weapons?
'''

[[dialogue]]
event = 6
page = 3
command = 45
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: So ist es! 
'''
patched = '''
\c[10]Yahenru\c[0]: I'm glad you asked!
'''

[[dialogue]]
event = 6
page = 3
command = 56
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Die Fähigkeiten 
alleine bestimmen nicht die Stärke 
eines Kämpfers.
'''
patched = '''
\c[10]Yahenru\c[0]: Abilities alone don't
determine a fighter's strength.
'''

[[dialogue]]
event = 6
page = 3
command = 59
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Die richtige Waffe, sowie 
die perfekte Beherrschung dieser 
Waffe, zeichnen einen wahren 
Kämpfer aus!
'''
patched = '''
\c[10]Yahenru\c[0]: The right weapon, as well as
the perfect mastery of said weapon,
characterize a real fighter!
'''

[[dialogue]]
event = 6
page = 3
command = 63
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Und solange ich nicht die 
perfekten Waffen gefunden habe, 
möchte ich meine Zeit nicht mit 
unnötigen Training vergeuden.
'''
patched = '''
\c[10]Yahenru\c[0]: And until I find the perfect
weapon, I don't want to waste my time
on unnecessary training.
'''

[[dialogue]]
event = 6
page = 3
command = 68
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: So ist das also...
'''
patched = '''
\c[1]\n[1]\c[0]: So that's it then...
'''

[[dialogue]]
event = 6
page = 3
command = 70
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Nun,\. durch meine Suche 
habe ich viel Erfahrung mit Waffen 
gesammelt.\. Ich kann dir vieles dazu 
erklären, wenn du willst.
'''
patched = '''
\c[10]Yahenru\c[0]: Well,\. my search has given me
a lot of experience with weapons.\. I
can explain a lot to you if you want.
'''

[[dialogue]]
event = 6
page = 3
command = 78
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Gut, dann fang ich 
mal an.
'''
patched = '''
\c[10]Yahenru\c[0]: Good, then let's get
started.
'''

[[dialogue]]
event = 6
page = 3
command = 80
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Waffen zeichnen sich
nicht nur durch ihre Angriffsstärke 
aus.
'''
patched = '''
\c[10]Yahenru\c[0]: Weapons are not only
characterized by their attack.
'''

[[dialogue]]
event = 6
page = 3
command = 83
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Einige Waffen haben auch 
Einfluss auf Abwehr, mentale Kraft 
und Agilität. Aber nicht nur das.
'''
patched = '''
\c[10]Yahenru\c[0]: Some weapons also have an
impact on defense, wisdom, and
agility. But not only that.
'''

[[dialogue]]
event = 6
page = 3
command = 86
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Es gibt auch Waffen die 
ganz besondere Eigenschaften 
haben. Ich werde dir mal ein paar 
Beispiele geben.
'''
patched = '''
\c[10]Yahenru\c[0]: There are also weapons that
have very special properties.
I'll give you a few examples.
'''

[[dialogue]]
event = 6
page = 3
command = 90
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Einige Waffen machen 
\c[11]Element-Schaden\c[0] und sind damit 
gegen bestimmte Gegner besonders 
wirkungsvoll.
'''
patched = '''
\c[10]Yahenru\c[0]: Some weapons do \c[11]element
damage\c[0] and are particularly
effective against certain
enemies.
'''

[[dialogue]]
event = 6
page = 3
command = 96
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Solche Waffen haben 
diese Symbole in ihrer Beschreibung.
'''
patched = '''
\c[10]Yahenru\c[0]: Such weapons have these
symbols in their description.
'''

[[dialogue]]
event = 6
page = 3
command = 99
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Andere Waffen wiederum 
können \c[11]Zustände verursachen\c[0], wenn 
man mit ihnen angreift.
'''
patched = '''
\c[10]Yahenru\c[0]: Other weapons may \c[11]inflict
status effects\c[0] if you attack with
them.
'''

[[dialogue]]
event = 6
page = 3
command = 104
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Du erkennst sie an diesen 
Symbolen.
'''
patched = '''
\c[10]Yahenru\c[0]: You can recognize them by
these symbols.
'''

[[dialogue]]
event = 6
page = 3
command = 106
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: So ein Schwert, das Schlaf 
verursacht ist schon was feines, 
glaub' mir. 
'''
patched = '''
\c[10]Yahenru\c[0]: A sword that inflicts sleep
is an excellent thing, believe me.
'''

[[dialogue]]
event = 6
page = 3
command = 110
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Ich hab auch schon Waffen 
gesehen, die den Träger die Fähigkeit 
geben sollen, \c[11]einige Zauber gegen 
alle Ziele aussprechen zu können\c[0].
'''
patched = '''
\c[10]Yahenru\c[0]: I've also seen weapons that
should give the user \c[11]the ability to
cast some spells against all targets\c[0].
'''

[[dialogue]]
event = 6
page = 3
command = 116
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Das ganze nennt sich 
\c[11]Zauber-Streuer\c[0] und ist durch solch 
ein Symbol gekennzeichnet.
'''
patched = '''
\c[10]Yahenru\c[0]: The whole thing is called
\c[11]Signum Scatter\c[0] and is marked by such
a symbol.
'''

[[dialogue]]
event = 6
page = 3
command = 120
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Eine meiner Lieblings- 
Eigenschaften von Waffen ist 
zweifellos der \c[11]Konter\c[0]!
'''
patched = '''
\c[10]Yahenru\c[0]: One of my favorite features
of weapons is undoubtedly the
\c[11]counterattack\c[0]!
'''

[[dialogue]]
event = 6
page = 3
command = 125
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: An diesem Symbolen 
erkennst du Konter-Waffen. 
Dabei gibt es 2 verschiedene Arten 
von Konterangriffen.
'''
patched = '''
\c[10]Yahenru\c[0]: You can recognize
counterattacking weapons by this
symbol. There are two different
types of counterattacks.
'''

[[dialogue]]
event = 6
page = 3
command = 129
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Beim \c[11]Angriff-Konter\c[0] wird 
nach einem physischen Treffer 
gekontert, bei \c[11]Signum-Konter\c[0] nach 
einem magischen Treffer.
'''
patched = '''
\c[10]Yahenru\c[0]: The \c[11]Attack Counter\c[0]
counterattacks after a physical hit
while the \c[11]Signum Counter\c[0]
counterattacks after a magic hit.
'''

[[dialogue]]
event = 6
page = 3
command = 133
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Das Level (lv) gibt übrigens 
an, mit welcher Wahrscheinlichkeit 
der Konterangriff eintritt.
'''
patched = '''
\c[10]Yahenru\c[0]: Furthermore, the level (lv)
indicates the probability of the
counterattack occurring.
'''

[[dialogue]]
event = 6
page = 3
command = 137
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Schließlich können Waffen 
noch bestimmte \c[11]Verzauberungen\c[0] mit 
sich ziehen.
'''
patched = '''
\c[10]Yahenru\c[0]: Finally, weapons can still
have certain \c[11]enchantments\c[0].
'''

[[dialogue]]
event = 6
page = 3
command = 142
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Das ganze wird mit diesen 
Symbolen verdeutlicht.\. Eine Waffe 
mit Auto-Sprint oder Auto-Ferres 
kann äußerst praktisch sein.
'''
patched = '''
\c[10]Yahenru\c[0]: They're illustrated by these
symbols.\. A weapon with Auto Sprint or
Auto Ferres can be extremely
practical.
'''

[[dialogue]]
event = 6
page = 3
command = 147
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Das sind ein paar der 
Eigenschaften, die Waffen haben 
können. 
'''
patched = '''
\c[10]Yahenru\c[0]: These are just a few of the
qualities that weapons can have.
'''

[[dialogue]]
event = 6
page = 3
command = 150
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Natürlich haben nur 
besondere Waffen solche 
Eigenschaften. 
'''
patched = '''
\c[10]Yahenru\c[0]: Of course, only special
weapons have such properties.
'''

[[dialogue]]
event = 6
page = 3
command = 153
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Im Waffenladen von 
Nebenan findest du so was sicherlich 
nicht.
'''
patched = '''
\c[10]Yahenru\c[0]: You won't find anything like
that in the weapons shop next door.
'''

[[dialogue]]
event = 6
page = 3
command = 157
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Soso,\. äußerst interessant.
'''
patched = '''
\c[1]\n[1]\c[0]: Well then,\. quite interesting.
'''

[[dialogue]]
event = 6
page = 3
command = 159
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Übrigens...
'''
patched = '''
\c[10]Yahenru\c[0]: Anyways...
'''

[[dialogue]]
event = 6
page = 3
command = 164
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Für solches Wissen sollte 
man sich aber schon Zeit nehmen!\.
Wie auch immer...
'''
patched = '''
\c[10]Yahenru\c[0]: But you should take the
time for such knowledge!\. Anyways...
'''

[[dialogue]]
event = 6
page = 3
command = 169
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Ihr scheint mir starke 
Kämpfer zu sein, wer weiß, vielleicht 
habt ihr euch ja eine meiner Waffe 
verdient.
'''
patched = '''
\c[10]Yahenru\c[0]: You three seem to be strong
fighters to me,\. who knows,\. maybe you
might earn one of my weapons.
'''

[[dialogue]]
event = 6
page = 3
command = 175
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Wie?\. Willst du uns eine Waffe 
schenken?
'''
patched = '''
\c[1]\n[1]\c[0]: Why?\. Do you want to give us a
weapon?
'''

[[dialogue]]
event = 6
page = 3
command = 178
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Hehe,\. schenken sicher 
nicht.\. Ihr müsst mir schon beweisen, 
dass ihr stark genug seid -  in einem 
Kampf!
'''
patched = '''
\c[10]Yahenru\c[0]: Hehe,\. don't be so sure of
yourself.\. You still have to prove to
me that you are strong enough - in
a battle!
'''

[[dialogue]]
event = 6
page = 3
command = 182
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Wenn ihr euch gut schlägt 
bekommt ihr die Waffe, aber ich 
warne euch:\. Ich bin kein leichter 
Gegner.
'''
patched = '''
\c[10]Yahenru\c[0]: If you do well, you'll get
the weapon, but I warn you:\. I am
not an easy opponent.
'''

[[dialogue]]
event = 6
page = 3
command = 186
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Im Übrigen gebe ich euch 
nur einen Versuch, mich zu 
schlagen, denn ich möchte schon 
bald wieder weiter ziehen.
'''
patched = '''
\c[10]Yahenru\c[0]: Furthermore, I'm just giving
you one try to defeat me because I
want to move on again soon.
'''

[[dialogue]]
event = 6
page = 3
command = 190
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Wenn ihr die 
Herausforderung annehmt und 
bereit seid, dann kommt nach 
draußen.\. Ich warte dort auf euch!
'''
patched = '''
\c[10]Yahenru\c[0]: If you accept the challenge
and are ready, come outside.\. I'll be
waiting for you out there!
'''

[[dialogue]]
event = 6
page = 3
command = 202
has_portrait = true
character = '''Kento'''
original = '''
(\c[1]\n[1]\c[0]: Ein komischer Kerl...)
'''
patched = '''
(\c[1]\n[1]\c[0]: Weird guy...)
'''

[[dialogue]]
event = 8
page = 1
command = 2
original = '''
\c[10]Mann\c[0]: Vor 9 Jahren noch lag hier die Grenze zu 
Korzojeno.\. Aber nachdem der Krieg beendet war 
hat Brigantia das gesamte Corine-Plateau sowie 
Helnovien im Norden für sich beansprucht.
'''
patched = '''
\c[10]Man\c[0]: Nine years ago, the border with Korzojeno
was located here.\. But after the war ended,
Brigantia claimed the all of the Corine
Plateau and Helnovien in the north.
'''

[[dialogue]]
event = 8
page = 1
command = 6
original = '''
\c[10]Mann\c[0]: Das Corine-Plateau war im Endeffekt kein 
großer Verlust für Korzojeno.\. Es war seit dem 
türkisen Inferno total verwüstet und kein 
fruchtbares Land mehr.
'''
patched = '''
\c[10]Man\c[0]: In the end, the Corine Plateau was not a big
loss for Korzojeno.\. It was totally devastated
ever since the turquoise inferno and is no
longer a fertile land.
'''

[[dialogue]]
event = 8
page = 1
command = 10
original = '''
\c[10]Mann\c[0]: Aber in den letzen Jahren hat sich das 
Gebiet gut erholt, Fauna und Flora regenerieren 
sich und erste Menschen haben sich hier erneut 
niedergelassen.
'''
patched = '''
\c[10]Man\c[0]: But in the last few years, the area has
recovered well. Flora and fauna are regenerating
and the first people have settled here again.
'''

[[dialogue]]
event = 8
page = 1
command = 14
original = '''
\c[10]Mann\c[0]: Aber es wird sicher noch Jahrzehnte, 
dauern bis sich der einst so mächtige Wald von 
damals erneut gebildet hat.
'''
patched = '''
\c[10]Man\c[0]: But it'll surely be decades before the once
mighty forest of that time is rebuilt.
'''

[[dialogue]]
event = 10
page = 1
command = 3
original = '''
\c[10]Junger Mann\c[0]: Es ist kaum zu glauben, wie ihr 
hier in Brigantia das Leben genießen könnt, 
während wir uns in Korzojeno mit einem 
Problem nach dem anderen rumschlagen.
'''
patched = '''
\c[10]Young Man\c[0]: It's hard to believe how you can enjoy
life here in Brigantia while we're grappling with
one problem after another in Korzojeno.
'''

[[dialogue]]
event = 10
page = 1
command = 7
original = '''
\c[10]Junger Mann\c[0]: Ich bin auf der Reise nach 
Buronia. Ich habe meine Freunde und Familie in 
Korzojeno zurück gelassen, um nun dort ein 
Studium über Signum anzufangen.
'''
patched = '''
\c[10]Young Man\c[0]: I'm on my way to Buronia. I left my
friends and family in Korzojeno to start
studying Signums there.
'''

[[dialogue]]
event = 10
page = 1
command = 11
original = '''
\c[10]Junger Mann\c[0]: Und je mehr ich mich hier 
aufhalte, desto mehr schmerzt mich die 
derzeitige Situation in unserem Land.
'''
patched = '''
\c[10]Young Man\c[0]: And the more I stay here, the more the
current situation in our country gets worse.
'''

[[dialogue]]
event = 10
page = 1
command = 14
original = '''
\c[10]Junger Mann\c[0]: Korzojeno hat in der Tat seinen 
Stolz verloren.
'''
patched = '''
\c[10]Young Man\c[0]: Korzojeno has indeed lost its pride.
'''

[[dialogue]]
event = 10
page = 1
command = 18
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: ....
'''
patched = '''
\c[1]\n[1]\c[0]: ...
'''

[[dialogue]]
event = 12
page = 1
command = 29
has_portrait = true
original = '''
\c[10]Royko\c[0]: Ohje...\.!
'''
patched = '''
\c[10]Royko\c[0]: You gotta be kidding me!
'''

[[dialogue]]
event = 12
page = 1
command = 31
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Meine Güte,\. wieso ist hier 
noch soviel los,\. so spät am Abend?
'''
patched = '''
\c[2]\n[2]\c[0]: Gee,\. why is there so much
going on here so late in the
evening?
'''

[[dialogue]]
event = 12
page = 1
command = 35
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Das sind all die Leute die mit 
uns an der Brücke gewartet haben...\. 
Wir sind ja nicht die Einzigen, die 
aufgehalten wurden...
'''
patched = '''
\c[13]\n[3]\c[0]: These are all the people who
were waiting with us at the bridge...\.
We aren't the only ones who were
stopped...
'''

[[dialogue]]
event = 12
page = 1
command = 40
has_portrait = true
original = '''
\c[10]Herr Uroto\c[0]: Hoffentlich haben sie 
noch ein Zimmer frei...
'''
patched = '''
\c[10]Mr. Uroto\c[0]: Hopefully they still have
a room available...
'''

[[dialogue]]
event = 12
page = 1
command = 43
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Ich glaube, das wird knapp...
'''
patched = '''
\c[1]\n[1]\c[0]: I'm not sure if they'll still
have one...
'''

[[dialogue]]
event = 12
page = 1
command = 55
original = '''
\c[10]Gasthofbesitzer\c[0]: Oh, Sie kommen aber noch spät 
hinter her.\. Wollen Sie hier etwa auch 
übernachten?
'''
patched = '''
\c[10]Inn Owner\c[0]: Oh, you've arrived here but quite late
at that.\. Do you want to spend the night here too?
'''

[[dialogue]]
event = 12
page = 1
