has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: W..\.W..\.W..\.W..\.\^
'''
patched = '''
\c[13]\n[3]\c[0]: W-\.W-\.W-\.W-\.\^
'''

[[dialogue]]
event = 58
page = 2
command = 219
has_portrait = true
character = '''Soko'''
original = '''
\>\c[13]\n[3]\c[0]: W..W..W..W..\<WIE BITTE?!
'''
patched = '''
\>\c[13]\n[3]\c[0]: W-W-W-W-\<WHAT DID YOU JUST SAY?!
'''

[[dialogue]]
event = 58
page = 2
command = 222
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ah...\.\s[3] Ahahahahahahahahahahah!\.
Seid ihr euch da GANZ sicher?
'''
patched = '''
\c[2]\n[2]\c[0]: Ah...\.\s[3] Ahahahahahahahahahahah!\.
Are you SURE about that?
'''

[[dialogue]]
event = 58
page = 2
command = 227
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: In Ordnung!\. Die Wette gilt!
'''
patched = '''
\c[5]\n[5]\c[0]: Deal!\. It's on!
'''

[[dialogue]]
event = 58
page = 2
command = 233
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: W...\.WAS?!?!\. Seid ihr noch 
ganz...\.\^
'''
patched = '''
\c[13]\n[3]\c[0]: W...\. WHAT?!?!\. Are you completely
out of your...\.\^
'''

[[dialogue]]
event = 58
page = 2
command = 245
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Bitte, Soko...\. halte dich 
eben etwas zurück...
'''
patched = '''
\c[1]\n[1]\c[0]: Please, Soko...\. just this one
time...
'''

[[dialogue]]
event = 58
page = 2
command = 250
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Damit wäre dann wohl alles 
geregelt.\. Wir sehen uns in der 
Arena!
'''
patched = '''
\c[5]\n[5]\c[0]: It's settled then.\. See you in
the arena!
'''

[[dialogue]]
event = 58
page = 2
command = 254
original = '''
\c[10]Robin\c[0]: Haha,\. mit Freude!
'''
patched = '''
\c[10]Robin\c[0]: Haha,\. with pleasure!
'''

[[dialogue]]
event = 58
page = 2
command = 292
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: SAGT MAL,\. SEID IHR NOCH GANZ 
DICHT?!?!
'''
patched = '''
\c[13]\n[3]\c[0]: ARE YOU COMPLETELY OUT OF YOUR
MIND?!?!
'''

[[dialogue]]
event = 58
page = 2
command = 297
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Woha!\. Was für ein 
Temperament,\. unheimlich!
'''
patched = '''
\c[5]\n[5]\c[0]: Woah!\. What a temper,\. scary!
'''

[[dialogue]]
event = 58
page = 2
command = 303
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Du hast auch allen Grund, dich 
zu fürchten. 
'''
patched = '''
\c[13]\n[3]\c[0]: YOU also have every reason to be
terrified.
'''

[[dialogue]]
event = 58
page = 2
command = 312
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Beruhig dich, Soko, beruhig 
dich!\. Es wird schon alles gut gehen!\. 
Vertrau mir...\.\.
'''
patched = '''
\c[5]\n[5]\c[0]: Calm down, Soko, calm down!\.
Everything will be just fine!\.
Trust me...
'''

[[dialogue]]
event = 58
page = 2
command = 318
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Wie soll hier bitte alles gut 
gehen?\. Was passiert, wenn wir 
verlieren?!
'''
patched = '''
\c[13]\n[3]\c[0]: How can we be so sure?\.
What about if we lose?!
'''

[[dialogue]]
event = 58
page = 2
command = 322
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Komm Soko, gegen die werden 
wir nicht verlieren!\. Dafür wirst du 
ja wohl schon selber sorgen...
'''
patched = '''
\c[2]\n[2]\c[0]: Come on Soko, we're not gonna
lose against them!\. You'll probably
take care of that yourself anyways...
'''

[[dialogue]]
event = 58
page = 2
command = 327
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Tut mir Leid, aber ich habe 
in dieser Wette die einzige 
Möglichkeit gesehen, diesen Stein 
wieder zu bekommen...
'''
patched = '''
\c[5]\n[5]\c[0]: I really am sorry, but this is
the only opportunity we have to get
that stone back and get ourselves
out of here...
'''

[[dialogue]]
event = 58
page = 2
command = 332
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Wer weiß, ob wir sie nochmal 
soweit bekommen hätten, wenn wir 
wegen dir abgelehnt hätten...
'''
patched = '''
\c[5]\n[5]\c[0]: Who knows what would've
happened if we refused this deal...\.
how long we would've been stuck
here...
'''

[[dialogue]]
event = 58
page = 2
command = 338
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]:\s[2] G...\. Genau...\.  Außerdem...\. 
selbst wenn wir verlieren sollten, 
ist alles was die bekommen werden, 
eine große Menge an...\.\s[4] Schmerzen...
'''
patched = '''
\c[1]\n[1]\c[0]: E...\. Exactly...\. Besides...\. even
if we lose, all they're going to get
from us is a lot of...\.\s[4] pain...
'''

[[dialogue]]
event = 58
page = 2
command = 345
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Du sagst es, Kumpel!
'''
patched = '''
\c[2]\n[2]\c[0]: You said it, Kento!
'''

[[dialogue]]
event = 58
page = 2
command = 347
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Wie?\. Ah... 
'''
patched = '''
\c[13]\n[3]\c[0]: How?\. Oh...
'''

[[dialogue]]
event = 58
page = 2
command = 353
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Entschuldigung Kento, aber ich 
konnte das gerade nicht 
zurückhalten...
'''
patched = '''
\c[13]\n[3]\c[0]: Sorry Kento, I just couldn't
hold back...
'''

[[dialogue]]
event = 58
page = 2
command = 362
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Na gut.\. Wir werden einfach 
nicht verlieren.\. Alles wird gut...
'''
patched = '''
\c[13]\n[3]\c[0]: Okay.\. We just won't lose then.\.
Everything will be just fine...
'''

[[dialogue]]
event = 58
page = 2
command = 372
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Übrigens, Felcis, was für ein 
Stein ist das überhaupt?
'''
patched = '''
\c[1]\n[1]\c[0]: By the way Felcis, what kind of
stone is that anyway?
'''

[[dialogue]]
event = 58
page = 2
command = 378
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Dieser Stein enthält 
besondere Signum-Kräfte.\. Keine 
Kräfte, mit denen die etwas 
anzufangen wüssten...
'''
patched = '''
\c[5]\n[5]\c[0]: This void stone contains
special Signum powers.\. Powers
they wouldn't even begin to
know what to do with...
'''

[[dialogue]]
event = 58
page = 2
command = 383
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Aber für uns ist dieser 
Stein absolut notwendig.\. Ohne diesen 
werden wir die Barriere nicht 
brechen können.
'''
patched = '''
\c[5]\n[5]\c[0]: But for us, this stone is
absolutely critical.\. Without this,
we won't be able to break the barrier.
'''

[[dialogue]]
event = 58
page = 2
command = 388
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Sagt aber bitte bloß 
niemanden etwas davon.\. Das Ding soll 
nichts weiter als ein schön 
funkelnder Stein bleiben.
'''
patched = '''
\c[5]\n[5]\c[0]: But please don't tell anyone
about it.\. To everyone else, it should
remain nothing more than a beautiful
sparkling stone.
'''

[[dialogue]]
event = 58
page = 2
