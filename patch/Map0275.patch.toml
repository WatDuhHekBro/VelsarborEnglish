[[dialogue]]
event = 58
page = 1
command = 2
original = '''
\c[10]Gefangener\c[0]: Wir starren hier gerade mit höchstem 
Interesse jene Wand an, die du gerade zu verdecken 
vermagst. \.Verschwinde.
'''
patched = '''
\c[10]Prisoner\c[0]: We're staring at the wall that you're
currently blocking with particular interest.\.
Get lost.
'''

[[dialogue]]
event = 58
page = 2
command = 15
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Hallo ihr, ich bin noch mal 
da wegen des Steinchens...
'''
patched = '''
\c[5]\n[5]\c[0]: Hello again, I'm back for the
stone...
'''

[[dialogue]]
event = 58
page = 2
command = 19
original = '''
\c[10]Gefangener\c[0]: Ich hab dir doch bereits gesagt, 
dass du den nicht wieder bekommen wirst.\.
Blaublütigem Pack wie dir geben wir mit Sicherheit 
nichts!\. Du kennst doch unser Motto!
'''
patched = '''
\c[10]Prisoner\c[0]: I already told you that you won't get it
back.\. We're definitely not handing anything back
on a silver platter to someone who reeks of
nobility like you!\. You know our motto!
'''

[[dialogue]]
event = 58
page = 2
command = 26
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Ja, wir alle kennen es.\. Wir 
alle wollen es nicht wieder hö...\.\.\^
'''
patched = '''
\c[5]\n[5]\c[0]: Yes, yes, we all know about
it.\. And we all don't want to hear
it yet again...\.\.\^
'''

[[dialogue]]
event = 58
page = 2
command = 33
original = '''
\c[10]Gefangener\c[0]:\s[2] WIR STEHLEN VON DEN REICHEN UND 
GEBEN ES DEN ARMEN!\. \s[0]Wir bringen Gerechtigkeit in 
diese verdorbene Welt, oh ja!
'''
patched = '''
\c[10]Prisoner\c[0]:\s[2] WE STEAL FROM THE RICH AND GIVE IT TO
THE POOR!\. \s[0]We bring justice to this corrupt world,
oh yes we do!
'''

[[dialogue]]
event = 58
page = 2
command = 41
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Was zum Henker?
'''
patched = '''
\c[2]\n[2]\c[0]: What the hell?
'''

[[dialogue]]
event = 58
page = 2
command = 43
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Ich möchte euch daran 
erinnern, dass ihr hier in einem 
Gefängnis seid und herzlich wenig 
mit diesem Motto anfangen könnt.
'''
patched = '''
\c[5]\n[5]\c[0]: I'd like to remind you that
you're in a prison here where there's
hardly anything you can do with this
motto.
'''

[[dialogue]]
event = 58
page = 2
command = 49
original = '''
\c[10]Gefangener\c[0]: Wieso?\. Ich sehe hier doch gerade einen 
wunderbaren Anfang dafür!\. DU bist Adel, bist 
reich.\. WIR dagegen sind arm!\. Also behalten wir 
deinen Klunker, so einfach ist das!
'''
patched = '''
\c[10]Prisoner\c[0]: Why?\. I see it as a wonderful start to
something greater!\. YOU are from the nobility,
you are rich.\. WE are poor!\. So we're keeping
your stone, it's that simple!
'''

[[dialogue]]
event = 58
page = 2
command = 57
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Ihr seid doch nicht ganz 
richtig am Kopf?\. Ihr haltet euren 
Diebstahl wegen so einer Statusfrage 
für gerecht?\. Das ich nicht lache! 
'''
patched = '''
\c[13]\n[3]\c[0]: Are you even hearing yourself?\.
You think that theft is fair as long
as it's based on status?\. Don't make
me laugh!
'''

[[dialogue]]
event = 58
page = 2
command = 67
original = '''
\c[10]Gefangener\c[0]: Aber hallo!\. Eine hübsche Dame haben 
wir hier.\. Darf ich mich vorstellen?\. Robin 
Llewlynus mein Name.
'''
patched = '''
\c[10]Prisoner\c[0]: Well hello there!\. We have quite the
pretty lady here.\. May I introduce myself?\.
Robin Llewlynus is the name.
'''

[[dialogue]]
event = 58
page = 2
command = 73
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Soko Filaja.\. Was auch immer.\. 
Was ist nun mit diesem Stein?
'''
patched = '''
\c[13]\n[3]\c[0]: Soko Filaja.\. Whatever.\. Now how
about the stone?
'''

[[dialogue]]
event = 58
page = 2
command = 76
original = '''
\c[10]Robin\c[0]: Ich würde ihn euch herzlich gerne schenken,
wenn ich nicht wüsste, dass Ihr mit diesem 
verkorksten Bonzen rumhängt!
'''
patched = '''
\c[10]Robin\c[0]: I would've loved to give it to you if
I didn't know you were hanging out with this
capitalistic pig!
'''

[[dialogue]]
event = 58
page = 2
command = 85
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Beim farbigen Pfau von 
Farenia \.- hier im Gefängnis gibt es 
keinen Besitz!
'''
patched = '''
\c[5]\n[5]\c[0]: Oh for the last time already,\.
there's no property here in prison!
'''

[[dialogue]]
event = 58
page = 2
command = 89
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Ganz abgesehen davon ist 
euer Motto sowieso nur eine Farce, 
damit ihr nicht die Wut der 
Kleinbevölkerung auf euch lastet.
'''
patched = '''
\c[5]\n[5]\c[0]: And in any case, your motto
is just a charade anyway, so free
yourself from bearing the weight
of the small population here.
'''

[[dialogue]]
event = 58
page = 2
command = 95
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Denkt nicht, dass ich nicht 
schon von euch gehört habe.\. Ihr 
teilt das Besitztum auf?\. Mit 
Sicherheit.
'''
patched = '''
\c[5]\n[5]\c[0]: Don't think I haven't already
heard what you said.\. What property
are you redistributing?\. I thought so.
'''

[[dialogue]]
event = 58
page = 2
command = 100
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Das erklärt vor allem auch 
all die Reichtümer, die in eurem 
Stützpunkt gefunden wurden, als ihr 
geschnappt wurdet.
'''
patched = '''
\c[5]\n[5]\c[0]: Above all else, that'd explain
what all those riches discovered in
your cell were doing there.
'''

[[dialogue]]
event = 58
page = 2
command = 105
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Ihr gebt vielleicht eine 
Münze von der Schatzkiste an die 
ansässigen Bauern, die müssen ja 
nicht wissen, was ihr habt.
'''
patched = '''
\c[5]\n[5]\c[0]: You might give a coin or two
from your treasure chest to the local
farmers, but they have no idea what
else you have.
'''

[[dialogue]]
event = 58
page = 2
command = 113
original = '''
\c[10]Robin\c[0]: Erzähl du ruhig deine Geschichten!
'''
patched = '''
\c[10]Robin\c[0]: Keep telling your made-up stories!
'''

[[dialogue]]
event = 58
page = 2
command = 117
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Aber an sich keine schlechte 
Idee. \.So kriegt man Unterstützung 
von den dort ansässigen Leuten, wenn 
man sie braucht.
'''
patched = '''
\c[1]\n[1]\c[0]: But it's not a bad idea in and
of itself.\. You get support from the
people when you need it.
'''

[[dialogue]]
event = 58
page = 2
command = 122
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Haha, was für Schwächlinge!\.
Wahrscheinlich haben sie die Bauern 
benutzt, um sich bei ihnen vor den 
Soldaten zu verstecken.
'''
patched = '''
\c[2]\n[2]\c[0]: Haha, weaklings!\. You probably
used those same peasants to hide
from the soldiers.
'''

[[dialogue]]
event = 58
page = 2
command = 130
original = '''
\c[10]Robin\c[0]: Jetzt kommt nicht auf falsche Gedanken!\.
Wenn ihr wüsstet, welche adeligen Truppen wir 
schon alle überfallen und ausgeraubt haben!\. Die 
hatten alle ihre Eskorte. 
'''
patched = '''
\c[10]Robin\c[0]: Now don't get any wrong ideas!\. If only you
knew the kind of aristocrats we all attacked and
robbed!\. They all even had their soldiers
protecting them.
'''

[[dialogue]]
event = 58
page = 2
command = 139
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ja ja, man kann ja viel 
erzählen. Ich wette, selbst wir drei 
Neuzugänge des Briganten-Orden 
könnten euch locker wegfegen!
'''
patched = '''
\c[2]\n[2]\c[0]: Yeah yeah, you're all talk.
I bet even us three new soldiers of
the Brigantine Order could easily
knock you out!
'''

[[dialogue]]
event = 58
page = 2
command = 144
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: In einem Turnierkampf zum 
Beispiel.
'''
patched = '''
\c[2]\n[2]\c[0]: In the tournament, for example.
'''

[[dialogue]]
event = 58
page = 2
command = 149
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ja ja, man kann ja viel 
erzählen.\. Ihr könnt es ja nicht 
mal mit uns drei Neuzugängen des 
Briganten-Orden aufnehmen!
'''
patched = '''
\c[2]\n[2]\c[0]: Yeah yeah, you're all talk.\.
You couldn't even take on three new
soldiers of the Brigantine Order!
'''

[[dialogue]]
event = 58
page = 2
command = 154
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ihr erinnert euch noch an den 
Turnierkampf, oder?
'''
patched = '''
\c[2]\n[2]\c[0]: You do remember what happened
after all, don't you?
'''

[[dialogue]]
event = 58
page = 2
command = 162
original = '''
\c[10]Robin\c[0]: Ach ja?\. Versucht es doch!\. Ihr könnt ja 
schauen, wo wir im Turnier stehen, die "Rächer der 
Gerechten"!\. Ich wette, ihr werdet nicht einen 
einzigen von uns Dreien besiegen können!
'''
patched = '''
\c[10]Robin\c[0]: Oh yeah?\. Try us!\. You can see where we are
in the tournament, the "Avengers of the Just"!\.
I bet you won't be able to take down any of
us at all!
'''

[[dialogue]]
event = 58
page = 2
command = 168
original = '''
\c[10]Robin\c[0]: Ach ja?\. Bildet euch bloß nichts ein, nur 
weil ihr zuletzt Erfolg hattet!\. Wir haben uns 
lediglich zurückgehalten!\. Euch können wir 
jederzeit fertig machen,\. wetten wir?
'''
patched = '''
\c[10]Robin\c[0]: Oh yeah?\. Don't get cocky just because
you won last time!\. We were holding back!\. We
can obviously defeat you anytime we want!
'''

[[dialogue]]
event = 58
page = 2
command = 177
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Mit dem Stein, nehme ich an?\.
Ihr hab ja sonst nicht viel.
'''
patched = '''
\c[5]\n[5]\c[0]: So how about the stone?\. There
isn't much else to talk about.
'''

[[dialogue]]
event = 58
page = 2
command = 182
original = '''
\c[10]Robin\c[0]: Wie?\. Stein?\. Moment!
'''
patched = '''
\c[10]Robin\c[0]: What?\. What stone?\. Wait a minute!
'''

[[dialogue]]
event = 58
page = 2
command = 185
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Euer Einsatz.\. Wir wetten um 
den Stein.\. Sollten unsere 3 
Ex-Soldaten hier gewinnen, kriegen 
wir ihn, sonst behaltet ihr ihn.
'''
patched = '''
\c[5]\n[5]\c[0]: The deal.\. We bet on the stone.\.
If our three ex-soldiers here win,
we'll get it back, otherwise, you
can keep it.
'''

[[dialogue]]
event = 58
page = 2
command = 191
original = '''
\c[10]Robin\c[0]: Ha!\. Davon träumt ihr wohl!\. Auf so etwas 
lassen wir uns nicht ein.
'''
patched = '''
\c[10]Robin\c[0]: Ha!\. Keep dreaming!\. We're not going to play
around with an idea like that.
'''

[[dialogue]]
event = 58
page = 2
command = 196
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Wie?\. Habt ihr etwa auf einmal 
Angst, dass ihr gegen uns verlieren 
könntet?
'''
patched = '''
\c[2]\n[2]\c[0]: Why?\. Too afraid all of a sudden
to lose to us?
'''

[[dialogue]]
event = 58
page = 2
command = 203
original = '''
\c[10]Robin\c[0]: Ha...\. Ha!\. Das hättet ihr wohl gerne!\. In 
Ordnung, auf die Wette gehen wir ein.\. Unter einer 
Bedingung!
'''
patched = '''
\c[10]Robin\c[0]: Ha...\. Ha!\. You wish!\. Alright, we'll go over
the deal.\. Under one condition!
'''

[[dialogue]]
event = 58
page = 2
command = 206
original = '''
\c[10]Robin\c[0]: Sollten WIR \.- wie zu erwarten ist -\. 
gewinnen, dann behalten wir den Stein UND eure 
hübsche Freundin hier, wird uns abends nach der 
Arbeit \s[3]"besuchen kommen". 
'''
patched = '''
\c[10]Robin\c[0]: If WE win,\. as we expect to happen,\. we'll
keep the stone AND your pretty friend here will
\s[3]"visit us"\s[0] in the evening after work.
'''

# Pseudo-scrolling
[[dialogue]]
event = 58
