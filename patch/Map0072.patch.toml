[[dialogue]]
event = 7
page = 1
command = 2
original = '''
\c[10]Soldat vom Briganten-Orden\c[0]: Was da unten im 
Keller ist?\. Ich hab keine Ahnung.\. Ich darf da 
genauso wenig runter wie ihr.
'''
patched = '''
\c[10]Brigantian Soldier\c[0]: What's down there in the
basement, you might ask?\. No clue.\. I can't
go down any further than you can.
'''

[[dialogue]]
event = 8
page = 1
command = 24
original = '''
\c[10]Soldat vom Briganten-Orden\c[0]: Tut mir Leid. 
Soldaten dürfen hier nicht passieren.
'''
patched = '''
\c[10]Brigantian Soldier\c[0]: Sorry. Soldiers are not
allowed to pass through here.
'''

[[dialogue]]
event = 11
page = 1
command = 12
has_portrait = true
character = '''Ileya'''
original = '''
(\c[6]\n[6]\c[0]: Ein Ausbilder wie Vorento ist 
daran interessiert,\. dass einer 
seiner Schüler seinem Vater 
vergibt...?)
'''
patched = '''
(\c[6]\n[6]\c[0]: An instructor like Vorento is
interested in having one of his
students forgive his father...?)
'''

[[dialogue]]
event = 11
page = 1
command = 17
has_portrait = true
character = '''Ileya'''
original = '''
(\c[6]\n[6]\c[0]: Das hört sich für mich eher 
nach einer Ausrede an.\. Aber was 
würde er sonst mit dieser 
Entscheidung bewirken wollen?)
'''
patched = '''
(\c[6]\n[6]\c[0]: Seems like more of an excuse.\.
But why else might he want to
influence that decision?)
'''

[[dialogue]]
event = 11
page = 1
command = 22
has_portrait = true
character = '''Ileya'''
original = '''
(\c[6]\n[6]\c[0]: Egal...\. Ich hätte nicht 
gedacht,\. dass sich diese Situation 
so schnell ergeben würde. )
'''
patched = '''
(\c[6]\n[6]\c[0]: Regardless...\. I never
thought that this situation
would arise so quickly.)
'''
