command = 10
original = '''
\c[10]Pauamainer-Miglied\c[0]: BESUCHT UNS BALD WIEDER!
'''
patched = '''
\c[10]Pauamainer Member\c[0]: VISIT US SOON!
'''

[[dialogue]]
