page = 1
command = 56
original = '''
\>\c[10]Pauamainer-Miglied\c[0]: IHR DÜRFT PASSIEREN!
'''
patched = '''
\c[10]Pauamainer Member\c[0]: YOU MAY PASS!
'''

[[dialogue]]
event = 88
page = 1
command = 83
original = '''
\c[10]Pauamainer-Miglied\c[0]: Wenn ihr Mitglieder werden 
wollt, BRINGT MIR 8 MINEN-ORDEN!!
'''
patched = '''
\c[10]Pauamainer Member\c[0]: If you want to become a member,
BRING ME EIGHT MINER MEDALLIONS!!
'''

[[dialogue]]
event = 88
page = 1
command = 88
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Minen-Orden?\. Ehm...\. 
Und wo bekommt man die her?
'''
patched = '''
\c[1]\n[1]\c[0]: Miner medallions?\. Um...\.
Where do we find these?
'''

[[dialogue]]
event = 88
page = 1
command = 92
original = '''
\c[10]Pauamainer-Miglied\c[0]: 8 PAUAMAINER-MITGLIEDER, die 
in den hintersten Ecken der Mine arbeiten, werden 
euch die Orden überreichen,\. WENN IHR SIE 
ERREICHT!!!
'''
patched = '''
\c[10]Pauamainer Member\c[0]: EIGHT PAUAMAINER MEMBERS\. who
work in the far corners of the mine will award
you the medallions\. WHEN YOU REACH THEM!!!
'''

[[dialogue]]
event = 88
page = 1
command = 99
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Muss der Typ immer so laut 
schreien?
'''
patched = '''
\c[13]\n[3]\c[0]: Does this guy always have to
scream so loud?
'''

[[dialogue]]
event = 88
page = 1
command = 103
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Glaubst du wirklich, der Typ 
kann normal reden?
'''
patched = '''
\c[2]\n[2]\c[0]: Do you really think the guy can
speak normally?
'''

[[dialogue]]
event = 88
