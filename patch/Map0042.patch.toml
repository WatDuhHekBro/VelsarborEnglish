[[dialogue]]
event = 7
page = 1
command = 16
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Tag, Silkia.
'''
patched = '''
\c[2]\n[2]\c[0]: Sup, Silkia.
'''

[[dialogue]]
event = 7
page = 1
command = 18
has_portrait = true
original = '''
\c[10]Silkia\c[0]: Oh!\.
Hallo Cibon, Hallo Kento.\.
Seid ihr endlich wieder zurück?\.
Wie war es denn so in Sinkholm, na?
'''
patched = '''
\c[10]Silkia\c[0]: Oh!\. Hey Cibon. Hey Kento.\.
You're finally back?\. So how was it
in Sinkholm?
'''

[[dialogue]]
event = 7
page = 1
command = 23
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Sterbens-Langweilig war's!\.
Wir saßen die ganze Zeit in dem Kaff 
fest bis die Diebe aufgetaucht sind.
'''
patched = '''
\c[2]\n[2]\c[0]: We were bored to death!\.
Being stuck in that dump for so
long until the thieves finally
showed up and all.
'''

[[dialogue]]
event = 7
page = 1
command = 27
has_portrait = true
original = '''
\c[10]Silkia\c[0]: Und?\. Habt ihr sie gefangen?
'''
patched = '''
\c[10]Silkia\c[0]: And?\. Did you catch them?
'''

[[dialogue]]
event = 7
page = 1
command = 29
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ja...\. Die Trottel sind uns 
direkt vor die Füße gelaufen.
'''
patched = '''
\c[2]\n[2]\c[0]: Yep...\. The fools ran right
at our feet.
'''

[[dialogue]]
event = 7
page = 1
command = 32
has_portrait = true
original = '''
\c[10]Silkia\c[0]: Schön, das zu hören.\. 
...\. So...\. Aber was ist nun der Grund, 
warum du dich hier blicken lässt, 
\s[9]Bruderherz?
'''
patched = '''
\c[10]Silkia\c[0]: Good to hear that.\. So...\.
What you need me to do this time,
\s[9]dear brother?
'''

[[dialogue]]
event = 7
page = 1
command = 38
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: .....\.Öh?
'''
patched = '''
\c[2]\n[2]\c[0]: Huh?
'''

[[dialogue]]
event = 7
page = 1
command = 40
has_portrait = true
original = '''
\c[10]Silkia\c[0]: Nur um mir zu erzählen, wie es 
in Sinkholm war, ganz sicher nicht.\.
Na?\. Brauchst du wieder Geld, oder 
wie?
'''
patched = '''
\c[10]Silkia\c[0]: You're definitely not here
just to tell me about your adventure
in Sinkholm.\. So?\. Do you need money
again?
'''

[[dialogue]]
event = 7
page = 1
command = 45
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ähhh...\. Nee...\. Is' nicht wegen 
Geld.\. Es geht um was anderes.
'''
patched = '''
\c[2]\n[2]\c[0]: Uhhh...\. No...\. It's not about
money.\. It's about something else.
'''

[[dialogue]]
event = 7
page = 1
command = 48
has_portrait = true
original = '''
\c[10]Silkia\c[0]: Ach stimmt ja...\. Für die 
Geldsorgen kannst du dich ja seit 
neustem an Kento wenden.
'''
patched = '''
\c[10]Silkia\c[0]: Oh right...\. You can just go
to Kento now for anything
money-related.
'''

[[dialogue]]
event = 7
page = 1
command = 52
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Traurig, aber wahr.\. Da fällt 
mir ein...\. Du schuldest mir noch 25 
\n[19], Cibon.
'''
patched = '''
\c[1]\n[1]\c[0]: Sad, but true.\. That reminds
me...\. You still owe me 25 \n[19],
Cibon.
'''

[[dialogue]]
event = 7
page = 1
command = 60
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Jajaja...\. Ich weiß, Kumpel.
'''
patched = '''
\c[2]\n[2]\c[0]: I know, I know.
'''

[[dialogue]]
event = 7
page = 1
command = 63
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Danke, dass du ihn dran 
erinnert hast, \s[9]Schwesterherz.
'''
patched = '''
\c[2]\n[2]\c[0]: Thanks for reminding him,
\s[9]dear sister.
'''

[[dialogue]]
event = 7
page = 1
command = 66
has_portrait = true
original = '''
\c[10]Silkia\c[0]: Na,\. wieso bist du denn nun 
gekommen?
'''
patched = '''
\c[10]Silkia\c[0]: So,\. why'd you come this time?
'''

[[dialogue]]
event = 7
page = 1
command = 69
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Nun, die Sache ist die:\. Kento 
und ich haben auf unserer Rückkehr 
von Sinkholm ein Ei gekauf..\. ähhh...\.
gesehen...
'''
patched = '''
\c[2]\n[2]\c[0]: Well, the thing is...\. Kento
and I bought an egg on our way back
from Sinkholm...\. Uhh...\. Saw...
'''

[[dialogue]]
event = 7
page = 1
command = 74
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Na ja\.... und kaum haben wir es 
gesehen,\. ...\. ist ein Vogel draus 
geschlüpft...
'''
patched = '''
\c[2]\n[2]\c[0]: And um...\. and as soon as we
saw it...\. a bird hatched from it...
'''

[[dialogue]]
event = 7
page = 1
command = 78
has_portrait = true
original = '''
\c[10]Silkia\c[0]: Aha.\. Wo ist das Problem?
'''
patched = '''
\c[10]Silkia\c[0]: Ah.\. So what's the problem?
'''

[[dialogue]]
event = 7
page = 1
command = 80
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Öhm....\. Na ja...\.
...\.Äh... das Ei lag da einfach so 
rum.\. Da war kein Nest oder so was!
'''
patched = '''
\c[2]\n[2]\c[0]: Um...\. Well...\. Uh...\. The egg
was just sitting there.\. There wasn't
any nest or anything!
'''

[[dialogue]]
event = 7
page = 1
command = 84
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Wir wollten den Piepmatz 
nicht einfach seinem Schicksal 
überlassen...\. und haben ihn deshalb 
mitgenommen...
'''
patched = '''
\c[2]\n[2]\c[0]: We didn't just want to leave
the bird to its fate...\. So we took
it with us...
'''

[[dialogue]]
event = 7
page = 1
command = 89
has_portrait = true
original = '''
\c[10]Silkia\c[0]: Wie bitte?!\. Zeig sofort her!
'''
patched = '''
\c[10]Silkia\c[0]: Really?!\. Show it to me!
'''

[[dialogue]]
event = 7
page = 1
command = 105
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Und?\. Haste eine Ahnung, was 
für'n Vogel das sein kann?
'''
patched = '''
\c[2]\n[2]\c[0]: So?\. Do you have any idea
what type of bird it is?
'''

[[dialogue]]
event = 7
page = 1
command = 109
has_portrait = true
original = '''
\c[10]Silkia\c[0]: Nein, ich weiß es leider 
nicht.\. Wo genau habt ihr den Vogel 
denn genau gefunden?
'''
patched = '''
\c[10]Silkia\c[0]: No, unfortunately I don't
know.\. Where exactly did you find
the bird?
'''

[[dialogue]]
event = 7
page = 1
command = 113
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Öhm,\. auf der Brü...\|\^
'''
patched = '''
\c[1]\n[1]\c[0]: Um,\. on the br...\|\^
'''

[[dialogue]]
event = 7
page = 1
command = 116
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Auf einer WIESE im Sinke-
Lohne-Pass,\. ....\. in der Nähe von 
diesem kleinen See, du weißt schon, 
oder?
'''
patched = '''
\c[2]\n[2]\c[0]: On a MEADOW in the Sink-Lohne
Pass,\. ...\.near the small lake, the
one you know about, right?
'''

[[dialogue]]
event = 7
page = 1
command = 122
has_portrait = true
original = '''
\c[10]Silkia\c[0]: Soso...\. Mir fällt nur auf, 
dass das Küken ziemlich groß ist.\.
Vielleicht handelt es sich um einen 
Raubvogel.
'''
patched = '''
\c[10]Silkia\c[0]: Well then...\. I just noticed
that the chick is quite big.\. Maybe
it's a bird of prey.
'''

[[dialogue]]
event = 7
page = 1
command = 127
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ich hab keinen blassen 
Schimmer. Jedenfalls können wir uns 
nicht um den Piepmatz kümmern...
Wir haben dazu einfach nicht die Zeit.
'''
patched = '''
\c[2]\n[2]\c[0]: I have no idea. Anyways, we
can't take care of the bird... We
just don't have the time.
'''

[[dialogue]]
event = 7
page = 1
command = 132
has_portrait = true
original = '''
\c[10]Silkia\c[0]: Und jetzt hofft ihr, dass ich 
mich darum kümmern könnte,\. na?
'''
patched = '''
\c[10]Silkia\c[0]: And now you hope that I can
take care of it,\. right?
'''

[[dialogue]]
event = 7
page = 1
command = 135
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: \s[9]Bitte....
'''
patched = '''
\c[2]\n[2]\c[0]: \s[9]Please...
'''

[[dialogue]]
event = 7
page = 1
command = 137
has_portrait = true
original = '''
\c[10]Silkia\c[0]: Hmpf...\. So ein Vogel kann 
einem eine Menge Arbeit bereiten.
'''
patched = '''
\c[10]Silkia\c[0]: Hmph...\. These kinds of birds
can be a lot of work to take care of.
'''

[[dialogue]]
event = 7
page = 1
command = 139
has_portrait = true
original = '''
\c[10]Silkia\c[0]: Außerdem wird es schwer, es 
so hinzubekommen, dass er später
wieder in seine natürliche Umwelt 
zurückkehren kann.
'''
patched = '''
\c[10]Silkia\c[0]: In addition, it'll be quite
difficult to get it so that it can
later return to its natural habitat.
'''

[[dialogue]]
event = 7
page = 1
command = 144
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: \s[9]Bitte!!
'''
patched = '''
\c[2]\n[2]\c[0]: \s[9]Pleeease!!
'''

[[dialogue]]
event = 7
page = 1
command = 146
has_portrait = true
original = '''
\c[10]Silkia\c[0]: \s[9]Na gut...\s[0] Ich denke, ich 
werde damit schon klar kommen. 
\.Besser das, als wenn ihr den Kleinen 
noch irgendwo anders abgebt.
'''
patched = '''
\c[10]Silkia\c[0]: \s[9]Well...\s[0] I think I'll be fine
with that.\. Better than if you gave
it to someone else.
'''

[[dialogue]]
event = 7
page = 1
command = 150
has_portrait = true
original = '''
\c[10]Silkia\c[0]: Wer weiß, was dort mit ihm 
angestellt werden würde.
'''
patched = '''
\c[10]Silkia\c[0]: Who knows what would've
happened to it in that case.
'''

[[dialogue]]
event = 7
page = 1
command = 154
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Vielen Dank, Silkia!\.
Dafür bin ich dir was schuldig.
'''
patched = '''
\c[2]\n[2]\c[0]: Thank you so much, Silkia!\.
I owe you one.
'''

[[dialogue]]
event = 7
page = 1
command = 157
has_portrait = true
original = '''
\c[10]Silkia\c[0]: Tu mir einfach nur den 
Gefallen und gewöhn dir an, besser 
auf dein Geld aufzupassen.\.\. Und lass 
dich hier mal öfters bei uns blicken.
'''
patched = '''
\c[10]Silkia\c[0]: Just do me a favor and get
used to taking better care of your
money.\.\. And come visit us more often.
'''

[[dialogue]]
event = 7
page = 1
command = 162
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ja. geht klar.
'''
patched = '''
\c[2]\n[2]\c[0]: Will do.
'''

[[dialogue]]
event = 7
page = 1
command = 164
has_portrait = true
original = '''
\c[10]Silkia\c[0]: Nicht, dass ihr den Vogel 
hier einfach wieder vergesst.
'''
patched = '''
\c[10]Silkia\c[0]: Not like you'll just forget
about the bird here.
'''

[[dialogue]]
event = 7
page = 1
command = 168
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Wir werden ihn schon nicht 
vergessen,\. nicht wahr, Kumpel?
'''
patched = '''
\c[2]\n[2]\c[0]: We won't forget him,\.
right Kento?
'''

[[dialogue]]
event = 7
page = 1
command = 171
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: D-\.Denke schon.
'''
patched = '''
\c[1]\n[1]\c[0]: I-\.I think so.
'''

[[dialogue]]
event = 7
page = 1
command = 175
has_portrait = true
original = '''
\c[10]Silkia\c[0]: Gut...\. Na?\. Wollt ihr 
vielleicht noch etwas bleiben?
'''
patched = '''
\c[10]Silkia\c[0]: Good...\. Well?\. Do you want
to stay here a little longer?
'''

[[dialogue]]
event = 7
page = 1
command = 178
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ähhh...\. Nein, wir müssen zur 
Kaserne, um den Bericht von unserem 
Auftrag abzugeben, stimmt's, Kumpel?
'''
patched = '''
\c[2]\n[2]\c[0]: Uhhh...\. No, we have to go
to the barracks and report on our
assignment, right Kento?
'''

[[dialogue]]
event = 7
page = 1
command = 182
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]:  Ja?\. Öhm......\. ja.
'''
patched = '''
\c[1]\n[1]\c[0]: Huh?\. Um......\. yeah.
'''

[[dialogue]]
event = 7
page = 1
command = 184
has_portrait = true
original = '''
\c[10]Silkia\c[0]: Na gut...\. Man sieht sich dann.
Ach ja,\. Mutter geht gerade draußen 
spazieren.\. Sie würde sich sicher mal 
wieder freuen, dich zu sehen.
'''
patched = '''
\c[10]Silkia\c[0]: Alright...\. See you then.
Oh right,\. mom's walking outside.\.
She'd be happy to see you again.
'''

[[dialogue]]
event = 7
page = 1
command = 190
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Gut... ich werd' bei 
Gelegenheit mal vorbei schauen.\.
Wir gehen dann mal.\.
Tschau! 
'''
patched = '''
\c[2]\n[2]\c[0]: Well... I'll see if I can
find her.\. We'll be gone in the
meantime.\. Later!
'''

[[dialogue]]
event = 10
page = 1
command = 3
has_portrait = true
original = '''
\c[10]Silkia\c[0]: Oh, hallo.\. Eurem Vogel geht 
es gut.\. Er lässt sich ohne Probleme 
füttern.\. Ich denke, dass ist 
ein gutes Zeichen.
'''
patched = '''
\c[10]Silkia\c[0]: Oh, hello.\. Your bird's doing
fine.\. It can be fed without problems.\.
I think that's a good sign.
'''

[[dialogue]]
event = 10
page = 2
command = 20
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Silkia? Die nächsten paar 
Wochen wirste mich leider nicht zu 
Gesicht bekommen.
'''
patched = '''
\c[2]\n[2]\c[0]: Silkia? For the next few
weeks, you unfortunately won't
be able to see me.
'''

[[dialogue]]
event = 10
page = 2
command = 24
has_portrait = true
original = '''
\c[10]Silkia\c[0]: Wie? Habt ihr etwa schon 
wieder nen Auftrag bekommen?\. Und 
diesmal zieht sich das über ganze 
Wochen?
'''
patched = '''
\c[10]Silkia\c[0]: How come? You already got
another task?\. And this time it
lasts for several weeks?
'''

[[dialogue]]
event = 10
page = 2
command = 29
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ja, genau so ist es und zudem 
müssen wir gleich losgehen.
'''
patched = '''
\c[2]\n[2]\c[0]: Yes, you heard that right, and
we also have to start right away.
'''

[[dialogue]]
event = 10
page = 2
command = 32
has_portrait = true
original = '''
\c[10]Silkia\c[0]: Worum geht es denn diesmal?\.
3 Wochen lang Wache stehen?
'''
patched = '''
\c[10]Silkia\c[0]: What's it about this time?\.
Standing guard for three whole weeks?
'''

[[dialogue]]
event = 10
page = 2
command = 38
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Bloß nicht! Diesmal wartet ne 
anständige Aufgabe auf uns.\. Wir 
werden als Eskorte dienen um einen 
Politiker zu beschützen!
'''
patched = '''
\c[2]\n[2]\c[0]: Oh stop! This time, we got a
decent task.\. We'll be serving as
escorts to protect an ambassador!
'''

[[dialogue]]
event = 10
page = 2
command = 43
has_portrait = true
original = '''
\c[10]Silkia\c[0]: Was?\. So eine wichtige 
Aufgabe habt ihr beiden bekommen?
'''
patched = '''
\c[10]Silkia\c[0]: What?\. You both got such
an important task?
'''

[[dialogue]]
event = 10
page = 2
command = 45
has_portrait = true
original = '''
\c[10]Silkia\c[0]: Entweder macht ihr euch als 
Soldaten besser als ich dachte, oder 
euer Vorgesetzter hat nen...\. 
na ja...
'''
patched = '''
\c[10]Silkia\c[0]: Either you're a better
soldier than I thought, or your
supervisor has a...\. well...
'''

[[dialogue]]
event = 10
page = 2
command = 49
has_portrait = true
original = '''
\c[10]Silkia\c[0]: Wie auch immer.\. Kommt ja 
heil zurück,\. der Auftrag wird 
diesmal sicher nicht so einfach wie 
vorher.
'''
patched = '''
\c[10]Silkia\c[0]: Anyways.\. Come back
safely,\. this time the assignment certainly
won't be as easy as before.
'''

[[dialogue]]
event = 10
page = 2
command = 54
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Is' mir schon klar.
'''
patched = '''
\c[2]\n[2]\c[0]: I understand.
'''

[[dialogue]]
event = 10
page = 2
command = 56
has_portrait = true
original = '''
\c[10]Silkia\c[0]: Es war doch ne gute Idee von 
euch, mir den Vogel zu geben. Ihr 
würdet jetzt jedenfalls keine Zeit 
für ihn haben.
'''
patched = '''
\c[10]Silkia\c[0]: It was a good idea of yours
to give me the bird. In any case,
you wouldn't have time for him now.
'''

[[dialogue]]
event = 10
page = 2
command = 61
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ja, stimmt.\. Wenn wir zurück 
sind, bin ich gespannt, was aus ihm 
geworden ist, unserem Piepmatz.
'''
patched = '''
\c[2]\n[2]\c[0]: Yeah, that's right.\. When we
get back, I'm excited to see what
happens to him, our little bird.
'''

[[dialogue]]
event = 10
page = 2
command = 65
has_portrait = true
original = '''
\c[10]Silkia\c[0]: Ich werd' schon gut auf ihn 
aufpassen.
'''
patched = '''
\c[10]Silkia\c[0]: I'll take good care of him.
'''

[[dialogue]]
event = 10
page = 2
command = 68
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Na gut,\. man sieht sich,\. 
Schwesterherz.
'''
patched = '''
\c[2]\n[2]\c[0]: Alright,\. see ya,\. sis.
'''

[[dialogue]]
event = 10
page = 2
command = 71
has_portrait = true
original = '''
\c[10]Silkia\c[0]: Mach's gut, Cibon.\. Und du 
auch Kento.
'''
patched = '''
\c[10]Silkia\c[0]: Take care, Cibon.\. And you
too Kento.
'''

[[dialogue]]
event = 10
page = 2
command = 74
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Ja, auf Wiedersehen.
'''
patched = '''
\c[1]\n[1]\c[0]: Yeah, goodbye.
'''

[[dialogue]]
event = 10
page = 2
command = 85
has_portrait = true
original = '''
\c[10]Silkia\c[0]: Da ich mich ja um den Vogel 
kümmere, hab ich ja auch das Recht, 
ihm einen Namen zu geben, nicht 
wahr?
'''
patched = '''
\c[10]Silkia\c[0]: Since I'm taking care of the
bird, I have the right to give it a
name, don't I?
'''

[[dialogue]]
event = 10
page = 2
command = 90
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Hmpf,\. okay,\. meinetwegen.\.
Haste schon einen?
'''
patched = '''
\c[2]\n[2]\c[0]: Hmph,\. okay,\. alright.\. Do you
already have a name in mind?
'''

[[dialogue]]
event = 10
page = 2
command = 93
has_portrait = true
original = '''
\c[10]Silkia\c[0]: Nein, aber mir wird schon 
einer einfallen,\. keine Sorge.
'''
patched = '''
\c[10]Silkia\c[0]: No, but I'll think of one,\.
don't worry.
'''

[[dialogue]]
event = 10
page = 2
command = 96
has_portrait = true
character = '''Cibon'''
