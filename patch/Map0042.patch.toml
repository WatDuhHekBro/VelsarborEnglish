Wann geht es nun los? 
'''
patched = '''
\c[10]Mrs. Tirunel\c[0]: To Domarkor?\. So far away?\. \s[8]Ohhh...\s[0]
Just take care of yourself. Who knows what the
conditions are like over there...
When does it start?
'''

[[dialogue]]
