[[dialogue]]
event = 49
page = 1
command = 20
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Das ist es also... Ziemlich 
verwachsen...
'''
patched = '''
\c[2]\n[2]\c[0]: So this is it...\. Rather
overgrown...
'''

[[dialogue]]
event = 49
page = 1
command = 23
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Es wurde halt in dieser Gegend 
erbaut,\. zu weit entfernt von 
Siedlungen.\. So etwas gerät schnell 
in Vergessenheit.
'''
patched = '''
\c[13]\n[3]\c[0]: It was built in this area,\. too
far from civilization.\. Must've been
quickly forgotten.
'''

[[dialogue]]
event = 49
page = 1
command = 28
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: \s[3]Dabei soll doch gerade das 
nicht passieren...
'''
patched = '''
\c[2]\n[2]\c[0]: \s[3]That wasn't supposed to
happen...
'''

[[dialogue]]
event = 49
page = 1
command = 32
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: ...
'''
patched = '''
\c[13]\n[3]\c[0]: ...
'''

[[dialogue]]
event = 49
page = 1
command = 44
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: ... Ich kannte meinen Vater 
nie wirklich....
'''
patched = '''
\c[2]\n[2]\c[0]: I never really knew my
father...
'''

[[dialogue]]
event = 49
page = 1
command = 52
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Hm?
'''
patched = '''
\c[13]\n[3]\c[0]: Hm?
'''

[[dialogue]]
event = 49
page = 1
command = 57
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ich habe nur wenige 
Erinnerungen an ihn aus meiner 
Kindheit.\. Er war meistens in der 
Kaserne oder irgendwo anders...
'''
patched = '''
\c[2]\n[2]\c[0]: I don't have a lot of memories
of him from my childhood.\. He was
mostly in the barracks or
somewhere else...
'''

[[dialogue]]
event = 49
page = 1
command = 65
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: ... Er hatte viel zu tun als 
Soldat.
'''
patched = '''
\c[2]\n[2]\c[0]: He had a lot to do as a
soldier.
'''

[[dialogue]]
event = 49
page = 1
command = 68
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Und dann ist er hier 
gestorben?
'''
patched = '''
\c[13]\n[3]\c[0]: And then he died here?
'''

[[dialogue]]
event = 49
page = 1
command = 71
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ja...\. Ich hatte nie die 
Gelegenheit ihn richtig kennen zu 
lernen. 
'''
patched = '''
\c[2]\n[2]\c[0]: Yeah...\. I never had the
opportunity to really get to
know him.
'''

[[dialogue]]
event = 49
page = 1
command = 75
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: ...
'''
patched = '''
\c[13]\n[3]\c[0]: ...
'''

[[dialogue]]
event = 49
page = 1
command = 81
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Was ich aber weiß, ist,\. dass 
mein Vater anscheinend ein guter 
Freund von Genyu Daikon gewesen ist.
'''
patched = '''
\c[2]\n[2]\c[0]: What I do know is that my
father apparently was a good
friend of Genyu Daikon.
'''

[[dialogue]]
event = 49
page = 1
command = 85
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Huh?\. Von Genyu Daikon?
'''
patched = '''
\c[13]\n[3]\c[0]: Huh?\. Genyu Daikon?
'''

[[dialogue]]
event = 49
page = 1
command = 87
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ja,\. meine Mutter hat mir 
erzählt wie er früher,\. als ich noch 
sehr jung war,\. sogar Gast zuhause 
gewesen ist. 
'''
patched = '''
\c[2]\n[2]\c[0]: Yeah,\. my mom told me how he
used to be a guest at home when
I was very young.
'''

[[dialogue]]
event = 49
page = 1
command = 95
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: ...\. Bist du deshalb mit Kento 
befreundet?
'''
patched = '''
\c[13]\n[3]\c[0]: Is that why you're friends with
Kento?
'''

[[dialogue]]
event = 49
page = 1
command = 103
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: ... Also weißte schon,\. dass 
Genyu sein Vater ist...
'''
patched = '''
\c[2]\n[2]\c[0]: Well you already know that
Genyu is his father...
'''

[[dialogue]]
event = 49
page = 1
command = 106
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: ...\.
Ja, kann sein,\. dass ich mich deshalb  
mit Kento angefreundet habe.
'''
patched = '''
\c[2]\n[2]\c[0]: Yeah,\. maybe that's why I
became friends with Kento.
'''

[[dialogue]]
event = 49
page = 1
command = 111
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Zumindest war das mein Grund 
zu Beginn.\. Ich dachte vielleicht 
würde Kento etwas über meinen Vater 
wissen,\.\. irgendwas.
'''
patched = '''
\c[2]\n[2]\c[0]: At least, that was my reason
at the beginning.\. I thought maybe
Kento would know something about
my father,\.\. anything.
'''

[[dialogue]]
event = 49
page = 1
command = 116
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Doch es hat keinen Sinn ihn 
deswegen anzusprechen. 
'''
patched = '''
\c[2]\n[2]\c[0]: But there's no point in asking
him about it now.
'''

[[dialogue]]
event = 49
page = 1
command = 120
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Sobald man ein Thema 
anschneidet,\. was auch nur im 
Entferntesten mit seinen Vater zu 
tun hat...
'''
patched = '''
\c[2]\n[2]\c[0]: As soon as you touch a topic
that's even remotely related to his
father...
'''

[[dialogue]]
event = 49
page = 1
command = 126
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Ich habe es selber gemerkt...\. 
Aber wie kommt das?\. Hasst Kento 
seinen Vater?
'''
patched = '''
\c[13]\n[3]\c[0]: I've noticed it myself...\. But
how did that happen?\. Does Kento
hate his father?
'''

[[dialogue]]
event = 49
page = 1
command = 130
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ja,\. aber frag mich nich 
wieso.\. Wie soll ich auch den Grund 
wissen, wenn Kento nie darüber 
redet.
'''
patched = '''
\c[2]\n[2]\c[0]: Yes,\. but don't ask me why.\. How
am I supposed to know if Kento never
even talks about it?
'''

[[dialogue]]
event = 49
page = 1
command = 139
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Irgendwie bezweifle ich,\. dass 
er von der Beziehung eurer Väter 
wusste.
'''
patched = '''
\c[13]\n[3]\c[0]: Somehow,\. I doubt he knew about
your fathers' relationship.
'''

[[dialogue]]
event = 49
page = 1
command = 142
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Ansonsten hätte er deinen 
Nachnamen gemieden wie seinen 
eigenen.
'''
patched = '''
\c[13]\n[3]\c[0]: Otherwise, he would've avoided
your last name like his own.
'''

[[dialogue]]
event = 49
page = 1
command = 151
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Das ist schon wahr...\. Der 
Gedanke kam mir auch nach ner Weile.
'''
patched = '''
\c[2]\n[2]\c[0]: That's true...\. That thought
came to me after a while.
'''

[[dialogue]]
event = 49
page = 1
command = 155
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Aber nun ja,\. jetzt sind wir 
bereits Kumpels,\. also was 
interessiert mich das noch?
'''
patched = '''
\c[2]\n[2]\c[0]: But well,\. since we're already
friends,\. what do I care?
'''

[[dialogue]]
event = 49
page = 1
command = 160
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Und wer weiß.\. Vielleicht 
treffe ich durch Kento ja doch noch 
irgendwann auf ne Person,\. die seinen 
und meinen Vater kannte.
'''
patched = '''
\c[2]\n[2]\c[0]: And who knows?\. Maybe I'll
eventually meet a person who knew
our fathers through Kento.
'''
