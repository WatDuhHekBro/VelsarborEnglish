[[dialogue]]
event = 18
page = 1
command = 2
original = '''
\c[10]Gefangener\c[0]: Hier ist so ziemlich jede Stelle mit 
Erz besetzt.\. Du solltest nach unten gehen, dort 
sollte noch was frei sein.
'''
patched = '''
\c[10]Prisoner\c[0]: Pretty much every place here is filled
with ore.\. You should go further down, there
should still be some spots left.
'''

[[dialogue]]
event = 19
page = 1
command = 2
original = '''
\c[10]Gefangener\c[0]: ...\. Dies ist kein Ort zum Plaudern, 
dafür sind zu viele Wachen hier.\. Siehst du das 
nicht?
'''
patched = '''
\c[10]Prisoner\c[0]: This isn't the place to chat, there are
too many guards around here.\. Don't you see them?
'''

[[dialogue]]
event = 20
page = 1
command = 2
original = '''
\c[10]Gefangene\c[0]: Argh!\. So anstrengend! \.Ich bin 
bereits fix und fertig.\. Wann ist endlich 
Feierabend?
'''
patched = '''
\c[10]Prisoner\c[0]: Argh!\. So exhausting!\. I'm already done
for.\. When will the end of the day finally come?
'''

[[dialogue]]
event = 21
page = 1
command = 3
has_portrait = true
character = '''Kento'''
original = '''
(\c[1]\n[1]\c[0]: An der Stelle arbeitet 
bereits jemand. Es würde nur stören, 
wenn wir hier mithelfen.)
'''
patched = '''
(\c[1]\n[1]\c[0]: Looks like someone's already
working here. We'd only be disturbing
them if we tried to help out.)
'''

