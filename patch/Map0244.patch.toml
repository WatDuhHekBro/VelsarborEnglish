[[dialogue]]
event = 26
page = 2
command = 2
original = '''
\c[10]Wache\c[0]: Nicht soviel rumlungern hier!\. Arbeitet oder 
wir werden euch zum Arbeiten treiben!
'''
patched = '''
\c[10]Guard\c[0]: Quit loitering around here!\. Work or we'll
make you work!
'''

[[dialogue]]
event = 28
page = 1
command = 2
original = '''
\c[10]Wache\c[0]: Alles Heil geblieben bei der Fahrt? Wir 
können von Glück reden, dass sich die Biester von 
den Schienen fern halten, wenn da eine 
Lore entlang fährt.
'''
patched = '''
\c[10]Guard\c[0]: Were you safe while driving through the
railways? We're lucky that the monsters stay
away from the railways when there's a minecart.
'''

[[dialogue]]
event = 29
page = 1
command = 11
original = '''

Dies ist ein \c[11]Speicherpunkt\c[0].
'''
patched = '''

This is a \c[11]save point\c[0].
'''

[[dialogue]]
event = 29
page = 1
command = 13
original = '''

Wenn man auf solch einen steht, kann man \c[11]den
Spielstand speichern\c[0].
'''
patched = '''

When you stand on one of these, you can
\c[11]save the game\c[0].
'''

[[dialogue]]
event = 29
page = 1
command = 16
original = '''

Öffne dazu das \c[11]Menu\c[0] mit \c[11]Esc\c[0] und wähle
dann \c[11]Speichern\c[0].
'''
patched = '''

To do this, open the \c[11]menu\c[0] using \c[11]Esc\c[0] and
then select \c[11]Save\c[0].
'''

[[dialogue]]
event = 29
page = 1
command = 19
original = '''

