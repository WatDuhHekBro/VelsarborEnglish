command = 29
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Das war wirklich knapp.
'''
patched = '''
\c[2]\n[2]\c[0]: That was really close.
'''

[[dialogue]]
event = 155
page = 1
command = 32
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Wir dürfen keine Zeit 
verschwenden.\. Sofort zur Grenze!\. Wir 
müssen den Wachleuten bescheid 
geben.
'''
patched = '''
\c[1]\n[1]\c[0]: We can't waste time.\. To the
border,\. immediately!\. We have to let
the guards know about what we found.
'''

