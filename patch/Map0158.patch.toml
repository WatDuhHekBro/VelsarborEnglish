[[dialogue]]
event = 37
page = 1
command = 2
original = '''
\c[10]Händler\c[0]: Holen Sie sich den Habilisring und jeder 
Gegner wird es sich zweimal überlegen bevor er Sie 
angreift! Wieso? Weil Sie mit Sicherheit zurück 
schlagen werden!
'''
patched = '''
\c[10]Trader\c[0]: Get this habilis ring and every opponent
will think twice before attacking you! How, you
might ask? Because you'll definitely strike back!
'''

[[dialogue]]
event = 106
page = 2
command = 8
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Verschlossen.\. Kein Wunder, 
bei der Uhrzeit.
'''
patched = '''
\c[1]\n[1]\c[0]: Locked.\. No wonder, considering
the time of day.
'''

