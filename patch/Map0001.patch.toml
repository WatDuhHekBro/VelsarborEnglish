[[dialogue]]
event = 191
page = 14
command = 7
original = '''
ADDIERE!
'''
patched = '''
ADDIERE!
'''

[[dialogue]]
event = 196
page = 11
command = 59
character = '''Kento'''
original = '''
\s[1]\c[1]\n[1]\c[0]: War das alles? 
Ich hab wirklich mehr erwartet!\|\.\.\^
'''
patched = '''
\s[1]\c[1]\n[1]\c[0]: Was that all? I really expected more!\|\.\.\^
'''

[[dialogue]]
event = 196
page = 11
command = 64
character = '''Kento'''
original = '''
\s[1]\c[1]\n[1]\c[0]: Siegreich!\|\.\.\^
'''
patched = '''
\s[1]\c[1]\n[1]\c[0]: Victory!\|\.\.\^
'''

[[dialogue]]
event = 196
page = 11
command = 67
character = '''Kento'''
original = '''
\s[1]\c[1]\n[1]\c[0]: Das wäre geschafft!\|\.\.\^
'''
patched = '''
\s[1]\c[1]\n[1]\c[0]: And that's that!\|\.\.\^
'''

[[dialogue]]
event = 196
page = 11
command = 76
character = '''Kento'''
original = '''
\s[1]\c[1]\n[1]\c[0]: Tsk...\. Ein Kinderspiel!\|\.\.\^
'''
patched = '''
\s[1]\c[1]\n[1]\c[0]: Tsk...\. child's play!\|\.\.\^
'''

[[dialogue]]
event = 196
page = 11
command = 80
character = '''Kento'''
original = '''
\s[1]\c[1]\n[1]\c[0]: Das ging ja schnell...\|\.\.\^
'''
patched = '''
\s[1]\c[1]\n[1]\c[0]: That was rather quick...\|\.\.\^
'''

[[dialogue]]
event = 196
page = 11
command = 83
character = '''Kento'''
original = '''
\s[1]\c[1]\n[1]\c[0]: Ohje! Zum Glück war der Kampf 
schnell vorbei!\|\.\.\^
'''
patched = '''
\s[1]\c[1]\n[1]\c[0]: Oh man!\. Luckily that fight was over
quickly!\|\.\.\^
'''

[[dialogue]]
event = 196
page = 11
command = 93
character = '''Kento'''
original = '''
\s[1]\c[1]\n[1]\c[0]: Keine Herausforderung...\|\.\.\^
'''
patched = '''
\s[1]\c[1]\n[1]\c[0]: No challenge...\|\.\.\^
'''

[[dialogue]]
event = 196
page = 11
command = 97
character = '''Kento'''
original = '''
\s[1]\c[1]\n[1]\c[0]: Und weg waren sie...\|\.\.\^
'''
