Namens ihre Entscheidung.
'''
patched = '''
\c[10]Instructor\c[0]: I'll go through your names
now.\. Tell me your decision after I call
your name.
'''

[[dialogue]]
event = 101
page = 1
command = 55
original = '''
\c[10]Ausbilder\c[0]: \s[12]...\s[3]Erim Akiro!
'''
patched = '''
\c[10]Instructor\c[0]: \s[12]...\s[3]Erim Akiro!
'''

[[dialogue]]
