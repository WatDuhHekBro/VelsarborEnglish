# This section is a repeat of Map0061.

[[dialogue]]
event = 93
page = 1
command = 3
original = '''
\c[10]Soldat vom Briganten-Orden\c[0]: Hat man die 
Rüstung einmal an, ist alles okay.\. Das schlimme 
ist das an- und ausziehen dieses Blechhaufens!
'''
patched = '''
\c[10]Brigantian Soldier\c[0]: Once you have your armor,
everything will be just fine.\. The tedious
part is putting this hunk of metal on
and taking it off!
'''

[[dialogue]]
event = 93
page = 1
command = 13
original = '''
\c[10]Soldat vom Briganten-Orden\c[0]: Oi, Cibon.\. Du 
läufst immer noch in diesem Aufzug hier rum?\. 
Bist du immer noch nicht fertig ausgebildet?
'''
patched = '''
\c[10]Brigantian Soldier\c[0]: Oi, Cibon.\. Are you still
walking around in that armor?\. You're still
not done with training?
'''

[[dialogue]]
event = 93
page = 1
command = 18
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Doch schon, aber es standen 
komischer Weise keine Rüstungen 
bereit.\. Für Kento ebenfalls nicht.
'''
patched = '''
\c[2]\n[2]\c[0]: We're done, but strangely no
armor was available.\. Neither for Kento.
'''

[[dialogue]]
event = 93
page = 1
command = 22
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Man hat uns zwar ein paar 
andere Rüstungsteile gegeben, aber 
die waren wirklich mies...
'''
patched = '''
\c[2]\n[2]\c[0]: We were given a few other pieces
of armor, but they were so bad...
'''

[[dialogue]]
event = 93
page = 1
command = 26
original = '''
\c[10]Soldat vom Briganten-Orden\c[0]: Ach, das 
passiert immer wieder.\. Die Schmiede kommt einfach 
nicht mit der wachsenden Anzahl von Soldaten mit. 
'''
patched = '''
\c[10]Brigantian Soldier\c[0]: Oh, that's been happening
again and again.\. The blacksmith simply can't
keep up with the growing number of soldiers.
'''

[[dialogue]]
event = 93
page = 1
command = 31
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Na ja, so schlimm is' es auch 
nicht. So eine Rüstung ist doch 
bestimmt sehr umständlich, oder?
'''
patched = '''
\c[2]\n[2]\c[0]: Well, it's not that bad either.
Your armor must be very cumbersome,
right?
'''

[[dialogue]]
event = 93
page = 1
command = 35
original = '''
\c[10]Soldat vom Briganten-Orden\c[0]: Sagen wir, man 
gewöhnt sich dran.
'''
patched = '''
\c[10]Brigantian Soldier\c[0]: Let's say that you get
used to it.
'''

[[dialogue]]
event = 93
page = 1
command = 44
original = '''
\c[10]Soldat vom Briganten-Orden\c[0]: Wache halten ist 
tot langweilig.
'''
patched = '''
\c[10]Brigantian Soldier\c[0]: Keeping watch makes me bored
to the death.
'''

[[dialogue]]
event = 93
page = 1
command = 48
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Kann ich ein Lied von singen.
'''
patched = '''
\c[1]\n[1]\c[0]: I can sing a song about it
if you want.
'''

[[dialogue]]
event = 94
page = 1
command = 2
original = '''
\c[10]Soldat vom Briganten-Orden\c[0]: Immer diese 
monotonen Trainingseinheiten. Da wird man ja 
verrückt, allein schon vom zusehen.
'''
patched = '''
\c[10]Brigantian Soldier\c[0]: Always with these
monotonous training sessions. You'd go
crazy just by watching them.
'''

# End of section.

[[dialogue]]
event = 101
page = 1
command = 7
original = '''
\c[10]Ausbilder\c[0]: Es ist sehr erfreulich, dass Sie alle 
so zahlreich erschienen sind. 
'''
patched = '''
\c[10]Instructor\c[0]: It is very delightful that you have
all appeared in such large numbers.
'''

[[dialogue]]
event = 101
page = 1
command = 9
original = '''
\c[10]Ausbilder\c[0]: Ab nächster Woche beginnt Ihre 
Ausbildung zum Soldaten des Briganten Ordens.
'''
patched = '''
\c[10]Instructor\c[0]: Your training as a soldier in
the Brigantine Order will begin next week.
'''

[[dialogue]]
event = 101
page = 1
command = 11
original = '''
\c[10]Ausbilder\c[0]: Wie üblich muss hierzu vorher eine 
Wahl getroffen werden.\.\. Es geht um die Wahl der 
Waffe, auf der Sie sich während der 
Ausbildung spezialisieren wollen.
'''
patched = '''
\c[10]Instructor\c[0]: As usual, a choice must be made
beforehand.\.\. It is about choosing the weapon
you want to specialize in during your training.
'''

[[dialogue]]
event = 101
page = 1
command = 15
original = '''
\c[10]Ausbilder\c[0]: Denn wir brauchen in unserer Armee 
keine Allround-Talente. Wir brauchen Spezialisten. 
'''
patched = '''
\c[10]Instructor\c[0]: Because we don't need jacks of all
trades in our army. We need masters of one,
specialists!
'''

[[dialogue]]
event = 101
page = 1
command = 17
original = '''
\c[10]Ausbilder\c[0]: Jede Waffe bringt eine spezielle 
Ausbildung und eine andere Rolle in der 
Schlacht mit sich.
'''
patched = '''
\c[10]Instructor\c[0]: Each weapon has their own
special training and a different role
in battle.
'''

[[dialogue]]
event = 101
page = 1
command = 20
original = '''
\c[10]Ausbilder\c[0]: Sie hatten schon vorher Zeit über 
diese Entscheidung nachzudenken.
Also wählen Sie jetzt.
'''
patched = '''
\c[10]Instructor\c[0]: You've had time to think
about this decision before.
So choose wisely now.
'''

[[dialogue]]
event = 101
page = 1
command = 23
original = '''
\c[10]Ausbilder\c[0]: Zur Wahl stehen...\. 
Schwert\.\., Axt\.\. und Lanze.
'''
patched = '''
\c[10]Instructor\c[0]: You may choose one
of the following...\. the sword,\.\.
the axe,\.\. or the lance.
'''

[[dialogue]]
event = 101
page = 1
command = 33
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Jau, ich werde ganz klar die 
Axt nehmen.
'''
patched = '''
\c[2]\n[2]\c[0]: Yeah, I'm definitely gonna
take the axe.
'''

[[dialogue]]
event = 101
page = 1
command = 36
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Die Axt?\. Ich hab gehört, das 
sei die Unbeliebteste unter den 
drei Waffe.
'''
patched = '''
\c[1]\n[1]\c[0]: The axe?\. I heard it was the
least popular of the three.
'''

[[dialogue]]
event = 101
page = 1
command = 41
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Ja, aber ich kann mit ihr nun 
mal am besten umgehen.\. Ich hab 
schon vorher alle drei Waffen 
ausprobiert.
'''
patched = '''
\c[2]\n[2]\c[0]: Yeah, but I can wield it the
best.\. I've tried all three weapons
before.
'''

[[dialogue]]
event = 101
page = 1
command = 51
original = '''
\c[10]Ausbilder\c[0]: Ich werde jetzt ihre Namen 
