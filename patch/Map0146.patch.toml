[[dialogue]]
event = 78
page = 1
command = 27
has_portrait = true
original = '''
\c[10]?????:\c[0] Wer hätte je gedacht, dass 
der begehrte Junge ganz von selbst 
zu uns kommt?
'''
patched = '''
\c[10]?????:\c[0] Who would have ever thought
that the boy we've been looking
for would come to us on his own?
'''

[[dialogue]]
event = 78
page = 1
command = 41
has_portrait = true
original = '''
\c[10]?????:\c[0] Hach ja...\. So wie es 
aussieht, wird der Stress nun bald 
