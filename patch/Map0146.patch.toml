'''

[[dialogue]]
event = 78
page = 1
command = 66
has_portrait = true
original = '''
\c[10]?????:\c[0] Tut mir schrecklich Leid, 
Cieoly, aber du wirst erneut 
die unendliche Last eines Briefes 
mit dir schleppen müssen.
'''
patched = '''
\c[10]?????:\c[0] I'm terribly sorry, Cieoly,
but you'll have to carry the
infinite burden of a letter
with you again.
'''

[[dialogue]]
event = 78
page = 1
command = 75
has_portrait = true
original = '''
\c[10]?????:\c[0] Ja,\. ich weiß, dass es unfair 
ist.\. Ich kann gemütlich durchs Leben 
gehen, während du von einem Punkt 
zum nächsten saust, nicht wahr?
'''
patched = '''
\c[10]?????:\c[0] Yes,\. I know it's unfair.\. I can
go through life comfortably as you
whiz from one point to the next,
can't I?
'''

[[dialogue]]
event = 78
page = 1
command = 80
has_portrait = true
original = '''
\c[10]?????:\c[0] Komm schon, diese Nachricht 
