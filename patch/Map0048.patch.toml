[[dialogue]]
event = 5
page = 1
command = 3
original = '''
\c[10]Grünhaarige Frau\c[0]: Das ist ja nicht zum 
Aushalten... Als ich letztens im Geschäft war, 
hatten sie doch tatsächlich keine Repskerne 
mehr. 
'''
patched = '''
\c[10]Green-Haired Woman\c[0]: I can't stand it...
When I was in the shop recently, they
were actually out of sunflour.
'''

[[dialogue]]
event = 5
page = 1
command = 7
original = '''
\c[10]Grünhaarige Frau\c[0]: Angeblich soll erst in ein 
paar Monaten eine Nachlieferung eintreffen.
'''
patched = '''
\c[10]Green-Haired Woman\c[0]: Apparently, a delivery
should arrive in just a couple of months.
'''

[[dialogue]]
event = 5
page = 1
command = 9
original = '''
\c[10]Lilahaarige Frau\c[0]: Das liegt sicher an den 
Schwierigkeiten, die sie unten bei den Häfen an 
der Südküste haben. Die See muss derzeit 
richtige Probleme da unten bereiten.
'''
patched = '''
\c[10]Purple-Haired Woman\c[0]: This is probably due to
the difficulties they have at the ports on the
south coast. The sea must be causing some
real problems down there at the moment.
'''

[[dialogue]]
event = 5
page = 1
command = 14
original = '''
\c[10]Grünhaarige Frau\c[0]: Ach wirklich? Und deswegen 
haben wir keine Repskerne hier?
'''
patched = '''
\c[10]Green-Haired Woman\c[0]: Really? And that's why we
don't have sunflour here?
'''

[[dialogue]]
event = 5
page = 1
command = 16
original = '''
\c[10]Lilahaarige Frau\c[0]: Ich glaube schon. Repskerne 
kommen aus dem Süden und werden mit 
Schiffen zu uns nach Norden verfrachtet.
'''
patched = '''
\c[10]Purple-Haired Woman\c[0]: I think so. Sunflour comes
from the south and is shipped to us north by ship.
'''

[[dialogue]]
event = 5
page = 1
command = 19
original = '''
\c[10]Blauhaarige Frau\c[0]: Doch wegen den Problemen
läuft das wohl nicht so gut im Moment.
'''
patched = '''
\c[10]Blue-Haired Woman\c[0]: But because of the problems,
it's probably not going so well at the moment.
'''

[[dialogue]]
event = 5
page = 1
command = 21
original = '''
\c[10]Grünhaarige Frau\c[0]: So ist das also. 
Was du so alles weißt...
'''
patched = '''
\c[10]Green-Haired Woman\c[0]: So that's it then.
What do you know...
'''

[[dialogue]]
event = 5
page = 1
command = 24
original = '''
\c[10]Lilahaarige Frau\c[0]: Ach,\. mein Mann erzählt mir 
ständig davon. Das ist sein Fachgebiet.
'''
patched = '''
\c[10]Purple-Haired Woman\c[0]: Oh,\. my husband keeps telling
me about it. That's his area of expertise.
'''

[[dialogue]]
event = 5
page = 1
command = 26
original = '''
\c[10]Grünhaarige Frau\c[0]: Ach so....
'''
patched = '''
\c[10]Green-Haired Woman\c[0]: Oh...
'''
