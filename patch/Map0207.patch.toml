[[dialogue]]
event = 17
page = 4
command = 15
has_portrait = true
original = '''
\c[10]Herr Uroto\c[0]: Ich wusste nicht genau 
wo ich war oder wieso man uns 
gefangen genommen hat...
'''
patched = '''
\c[10]Mr. Uroto\c[0]: I didn't know exactly
where I was or why we were
captured...
'''

[[dialogue]]
event = 17
page = 4
command = 18
has_portrait = true
original = '''
\c[10]Herr Uroto\c[0]: Aber als ich in meiner 
Zelle saß,\. habe ich einige 
Unterhaltungen der Wachleute 
mitlauschen können...
'''
patched = '''
\c[10]Mr. Uroto\c[0]: But when I was sitting in
my cell,\. I could hear some of the
guards' conversations...
'''

[[dialogue]]
event = 17
page = 4
command = 31
original = '''
\c[10]Untere Wache\c[0]: Hey, kommt mal kurz rüber.
'''
patched = '''
\c[10]Guard\c[0]: Hm...\. This prisoner is still here,\.
but what happened to the other three?
'''

[[dialogue]]
event = 17
page = 4
command = 44
original = '''
\c[10]Linke Wache\c[0]: Sag mal...\. was haben sie nun mit 
den anderen Gefangenen gemacht?\. Ich seh' sie nicht 
mehr in ihren Zellen.
'''
patched = '''
\c[10]Right Guard\c[0]: Tell me...\. What have they done with
the others?\. I can't seem to find them in their
cells.
'''

[[dialogue]]
event = 17
page = 4
command = 47
original = '''
\c[10]Rechte Wache\c[0]: So wie ich gehört habe, haben sich 
die 3 bereit erklärt, für uns jenseits der Grenze 
aktiv zu sein.
'''
patched = '''
\c[10]Left Guard\c[0]: From what I heard, the three agreed
to be active for us across the border.
'''

[[dialogue]]
event = 17
page = 4
command = 51
original = '''
\c[10]LinkeWache\c[0]: Ah...\. also 3 weitere Spione auf 
unserer Seite.
'''
patched = '''
\c[10]Right Guard\c[0]: Ah...\. So three more spies on our
side.
'''

[[dialogue]]
event = 17
page = 4
command = 53
original = '''
\c[10]Rechte Wache\c[0]: Ja, sie sollen die ganzen Gerüchte 
über uns aus der Welt schaffen.
'''
patched = '''
\c[10]Left Guard\c[0]: Yep, they're supposed to get rid of
all the rumors about us.
'''

[[dialogue]]
event = 17
page = 4
command = 56
original = '''
\c[10]Linke Wache\c[0]: Wie wollen sie das den schaffen.
'''
patched = '''
\c[10]Right Guard\c[0]: How are they going to do that?
'''

[[dialogue]]
event = 17
page = 4
command = 57
original = '''
\c[10]Rechte Wache\c[0]: Der Plan ist eigentlich ganz 
interessant...
'''
patched = '''
\c[10]Left Guard\c[0]: The plan is actually quite
interesting...
'''

[[dialogue]]
event = 17
page = 5
command = 13
has_portrait = true
original = '''
\c[10]Herr Uroto\c[0]: Ich saß in meiner Zelle, 
als plötzlich irgendwas außerhalb 
geschah. 
'''
patched = '''
\c[10]Mr. Uroto\c[0]: I was sitting in my cell
when something suddenly happened
outside.
'''

[[dialogue]]
event = 17
page = 5
command = 44
has_portrait = true
original = '''
\c[10]Herr Uroto\c[0]: Dann flog irgendetwas 
ins Gefängnis.\. Es wurde Hell und ich 
verlor mein Bewusstsein.
'''
patched = '''
\c[10]Mr. Uroto\c[0]: Then, something was thrown
near my cell.\. It got very bright and
I lost consciousness.
'''

[[dialogue]]
event = 17
page = 5
command = 48
has_portrait = true
original = '''
\c[10]Herr Uroto\c[0]: Als ich wieder 
