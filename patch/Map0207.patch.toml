Hütte im Wald.
'''
patched = '''
\c[10]Mr. Uroto\c[0]: The next thing I knew,\.
I was in a hut in the forest.
'''

[[dialogue]]
event = 18
page = 1
command = 14
has_portrait = true
original = '''
(\c[10]Herr Uroto\c[0]: Verdammt...)
'''
patched = '''
(\c[10]Mr. Uroto\c[0]: Damn...)
'''

[[dialogue]]
event = 18
page = 1
command = 15
has_portrait = true
original = '''
