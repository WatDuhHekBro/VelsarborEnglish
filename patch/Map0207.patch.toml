'''
patched = '''
(\c[10]Mr. Uroto\c[0]: Could it really be?\.
Has such a powerful military unit
formed entirely underground?)
'''

[[dialogue]]
event = 18
page = 1
command = 40
has_portrait = true
original = '''
(\c[10]Herr Uroto\c[0]: Was...\. Was wird jetzt 
mit mir geschehen...)
'''
patched = '''
(\c[10]Mr. Uroto\c[0]: What...\. What'll happen to
me now...)
'''
