'''
patched = '''
(\c[10]Mr. Uroto\c[0]: Who would've thought that
the situation was already so
serious.)
'''

[[dialogue]]
event = 18
page = 1
command = 18
has_portrait = true
original = '''
(\c[10]Herr Uroto\c[0]: Hätte man diese ganzen 
Gerüchte doch bloß ernster 
genommen...) 
'''
patched = '''
(\c[10]Mr. Uroto\c[0]: If only all these rumors
had been taken more seriously...)
'''

[[dialogue]]
event = 18
page = 1
command = 26
has_portrait = true
original = '''
