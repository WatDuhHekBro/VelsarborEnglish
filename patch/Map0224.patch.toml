dem Weg zu ihnen und erscheint schier 
unaufhaltsam!
'''
patched = '''
\c[10]Announcer\c[0]: They want to see Zinkar blood spilt!\.
Those brothers better be careful!\. Their
archenemies are on the way to challenge them
and they seem almost unstoppable at that!
'''

