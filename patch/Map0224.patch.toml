'''
patched = '''
\c[2]\n[2]\c[0]: Hehe,\. quite some losers,\. AREN'T
THEY, Kento?
'''

[[dialogue]]
event = 156
page = 1
command = 258
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Sei leise.
'''
patched = '''
\c[1]\n[1]\c[0]: Be quiet.
'''

[[dialogue]]
event = 156
page = 1
