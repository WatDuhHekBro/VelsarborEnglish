steht...
'''
patched = '''
\c[2]\n[2]\c[0]: The guy better be glad he's up
there and not down here...
'''

[[dialogue]]
event = 156
page = 1
command = 227
original = '''
\c[10]Ansager:\c[0] Und hier kommt ihr Gegner!
'''
patched = '''
\c[10]Announcer\c[0]: And here comes their opponent!
'''

[[dialogue]]
event = 156
page = 1
command = 241
original = '''
\c[10]Ansager:\c[0] Und hier kommt der nächste Gegner!
'''
patched = '''
\c[10]Announcer\c[0]: And here comes their next opponent!
'''

[[dialogue]]
event = 156
page = 1
command = 245
original = '''
