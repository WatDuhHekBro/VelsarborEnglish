'''
patched = '''
\c[10]Announcer\c[0]: We found them in the darkest stretches
of the Silvan Forest and it wasn't easy to bring
them here to the arena!
'''

[[dialogue]]
event = 156
page = 1
command = 272
original = '''
\c[10]Ansager:\c[0] Doch nun sind sie hier und ihren Gegnern 
werden sie zeigen, wie die Regeln der Wildnis aussehen!
'''
patched = '''
\c[10]Announcer\c[0]: But now that they're here, they'll show
their opponents what the rules of the wild look
like!
'''

[[dialogue]]
event = 156
page = 1
command = 276
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Es sind verdammt noch mal nur 
ein paar Wölfe.
'''
patched = '''
\c[2]\n[2]\c[0]: Damn, just a few wolves.
'''

[[dialogue]]
event = 156
page = 1
command = 284
original = '''
\c[10]Ansager:\c[0] \s[3]DIE BÄRENBRÜDER!
'''
patched = '''
\c[10]Announcer\c[0]: \s[3]THE BEAR BROTHERS!
'''

[[dialogue]]
event = 156
page = 1
command = 285
original = '''
\c[10]Ansager:\c[0] Sie sind groß, pelzig und kräftig!\. Schon  
viele Waffen sind an ihrem dichten Fell 
gescheitert.\. Und sie wissen, wie man zurück 
