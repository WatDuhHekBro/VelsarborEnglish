hoffen, dass sie nur für das Brot kämpfen und 
nicht WIE das Brot!
'''
patched = '''
\c[10]Announcer\c[0]: That'd make them the first group
fighting for baked goods to enter this arena!\.
Let's just hope that they only fight FOR the
bread and not LIKE the bread!
'''

[[dialogue]]
event = 156
page = 1
command = 83
original = '''
\c[10]Ansager:\c[0] Sie können kämpfen, besser als man von 
Brot erwarten würde!\. Doch lasst uns abwarten!\. 
Vielleicht findet sich der Gegner mit dem 
Brotmesser, der ihrem Weg ein Ende setzt!
'''
patched = '''
\c[10]Announcer\c[0]: They can fight better than you'd expect
from bread!\. And hey, maybe their vision isn't so
grainy after all.\. We'll just have to wheat and
seed what happens!
'''

[[dialogue]]
event = 156
