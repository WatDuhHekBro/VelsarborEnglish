'''
patched = '''
\c[10]Announcer\c[0]: They're big, hairy, and strong!\. Many
weapons have failed to do anything because of
their thick fur.\. And they know how to hit back!
'''

[[dialogue]]
event = 156
page = 1
command = 294
original = '''
\c[10]Ansager:\c[0] \s[3]DIE FEJARSCHLITZER!
'''
patched = '''
\c[10]Announcer\c[0]: \s[3]THE FEJAR SLITTERS!
'''

[[dialogue]]
event = 156
page = 1
command = 295
original = '''
\c[10]Ansager:\c[0] Zu schade, dass die Teilnehmer hier keine 
Fejar haben, die sie ihnen abschlitzen könnten.\.
Dennoch sind sie schnell, gewandt und wissen, wie 
man ihren Gegner einengen kann!
'''
patched = '''
\c[10]Announcer\c[0]: Too bad they don't have any Fejar to
slit.\. Regardless, they're quick, agile, and
know how to whittle down their opponents!
'''

[[dialogue]]
event = 156
page = 1
command = 304
original = '''
\c[10]Ansager:\c[0] \s[3]DER UNTERTAGE-SCHRECK!
'''
patched = '''
\c[10]Announcer\c[0]: \s[3]THE TERROR FROM BELOW!
'''

[[dialogue]]
event = 156
page = 1
command = 305
original = '''
\c[10]Ansager:\c[0] Richtig, es sind genau die Biester, die 
von allen Minenarbeitern hier gefürchtet werden!\.
Nun gehen sie sogar so weit, die Turnierkämpfer zu 
bedrohen!
'''
patched = '''
\c[10]Announcer\c[0]: Yep, they're the very creatures that
haunt all the miners here!\. Now they'd even go
so far as to intimidate these fighters!
'''

[[dialogue]]
event = 156
page = 1
command = 314
original = '''
\c[10]Ansager:\c[0] \s[3]DIE SCHATTENSCHLEICHER!
'''
patched = '''
\c[10]Announcer\c[0]: \s[3]THE SHADOW CRAWLERS!
'''

[[dialogue]]
event = 156
page = 1
command = 315
original = '''
\c[10]Ansager:\c[0] Sie wissen, wie sie ihren Gegner in den 
Rücken fallen. Ihre tödliche Technik bringt das 
Opfer um, bevor dieses irgendetwas bemerkt!
'''
patched = '''
\c[10]Announcer\c[0]: They know how to stab their opponents
in the back. Their deadly technique kills the
victim before they even notice anything!
'''

[[dialogue]]
event = 156
page = 1
command = 318
original = '''
\c[10]Ansager:\c[0] Aber schätzt sie nicht falsch ein!\. Ihre 
Kampftechnik ist auf offenem Feld genauso tödlich 
wie in der dunklen Nacht!
'''
patched = '''
\c[10]Announcer\c[0]: But don't underestimate them now!\. Their
technique is as deadly in the open air as it is in
a shrouded night!
'''

[[dialogue]]
event = 156
page = 1
command = 326
original = '''
\c[10]Ansager:\c[0] \s[3]DIE EXOTEN!
'''
patched = '''
\c[10]Announcer\c[0]: \s[3]THE EXOTICS!
'''

[[dialogue]]
event = 156
page = 1
command = 327
original = '''
\c[10]Ansager:\c[0] Woher sie genau kommen, weiß niemand, 
aber ihre Kampftechnik sucht ihresgleichen auf 
dem Kontinent Toras!\. Ihr Gegner wird sich auf 
etwas ganz neues Einstellen müssen!
'''
patched = '''
\c[10]Announcer\c[0]: Nobody knows where exactly they came
from, but their combat techniques are second to
none on the continent of Tora!\. Their opponent will
have to adjust to something completely different!
'''

[[dialogue]]
event = 156
page = 1
command = 336
original = '''
\c[10]Ansager:\c[0] \s[3]DIE RITTER DER NACHT!
'''
patched = '''
\c[10]Announcer\c[0]: \s[3]THE KNIGHTS OF NIGHT!
'''

[[dialogue]]
event = 156
page = 1
command = 337
original = '''
\c[10]Ansager:\c[0] Ihr mächtiges Auftreten in dunkler 
Rüstung hat schon so manchen Gegner erzittern 
lassen!\. Doch ihre Erscheinung ist kein Schauspiel!
'''
patched = '''
\c[10]Announcer\c[0]: Their mighty appearance in dark armor
has made many opponents tremble at the sight of
them right before battle!\. But their appearance
isn't merely for show!
'''

[[dialogue]]
event = 156
page = 1
command = 340
original = '''
\c[10]Ansager:\c[0] Schon viele Gegner sind an ihrer 
Defensive gescheitert!
'''
patched = '''
\c[10]Announcer\c[0]: Many opponents have failed on their
defense!
'''

[[dialogue]]
event = 156
page = 1
command = 347
original = '''
\c[10]Ansager:\c[0] \s[3]DIE RÄCHER DER GERECHTEN!
'''
patched = '''
\c[10]Announcer\c[0]: \s[3]THE AVENGERS OF THE JUST!
'''

[[dialogue]]
event = 156
page = 1
command = 348
original = '''
\c[10]Ansager:\c[0] Sie stehlen von den Reichen und geben es 
den Armen, so sagen sie.\. Zu dumm, dass das es hier 
im Gefängnis für die Gefangenen kein Besitz gibt!
'''
patched = '''
\c[10]Announcer\c[0]: They steal from the rich and give it
to the poor, or so they say.\. Too bad there's no
property for the prisoners of this prison!
'''

[[dialogue]]
event = 156
page = 1
command = 351
original = '''
\c[10]Ansager:\c[0] Doch ihr Anführer weiß in der Tat, wie 
man mit den Bogen umzugehen hat!\. Ihr Gegner sollte 
sich in Acht nehmen!
'''
patched = '''
\c[10]Announcer\c[0]: But their leader actually knows how to
handle bows!\. Their opponent should be cautious!
'''

[[dialogue]]
event = 156
page = 1
command = 366
original = '''
\c[10]Ansager:\c[0] \s[3]DIE ZINKAR-BRÜDER!
'''
patched = '''
\c[10]Announcer\c[0]: \s[3]THE ZINKAR BROTHERS!
'''

[[dialogue]]
event = 156
page = 1
command = 367
original = '''
\c[10]Ansager:\c[0] Diese Truppe ist wahrhaftig schnell nach 
oben gekommen!\. Mit ihrer außergewöhnlichen 
Teamarbeit haben sie es weit gebracht! 
'''
patched = '''
\c[10]Announcer\c[0]: This group really rose through the
ranks quickly!\. With their extraordinary teamwork,
they were able to make it this far!
'''

[[dialogue]]
event = 156
page = 1
command = 370
original = '''
\c[10]Ansager:\c[0] Mit Dolch, Klaue und Kampfstab haben sie 
schon vielen Gegnern eine Lektion erteilt! 
'''
patched = '''
\c[10]Announcer\c[0]: With some daggers, a claw, and a
fighting stick, they've already taught many
opponents a lesson they won't forget!
'''

[[dialogue]]
event = 156
page = 1
command = 382
original = '''
\c[10]Ansager:\c[0] \s[3]DIE PAUAMAINER-VETERANEN!
'''
patched = '''
\c[10]Announcer\c[0]: \s[3]THE PAUAMAINER VETERANS!
'''

[[dialogue]]
event = 156
page = 1
command = 383
original = '''
