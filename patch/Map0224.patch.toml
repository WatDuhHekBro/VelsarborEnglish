'''
patched = '''
\c[10]Announcer\c[0]: \s[3]THE PACK!
'''

[[dialogue]]
event = 156
page = 1
command = 269
original = '''
\c[10]Ansager:\c[0] In der düstersten Region des Silvanwaldes 
haben wir sie gefunden und es war kein Leichtes, 
