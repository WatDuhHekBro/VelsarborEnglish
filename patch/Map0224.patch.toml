'''
patched = '''
\c[10]Announcer\c[0]: Although they rarely make it out of
last place, there are people nonetheless who
were taken down under their magical flames
and water torrents!
'''

[[dialogue]]
event = 156
page = 1
command = 255
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Hehe,\. was für Verlierer,\. 
