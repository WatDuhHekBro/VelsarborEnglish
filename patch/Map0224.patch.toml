[[dialogue]]
event = 107
page = 1
command = 2
original = '''
\c[10]Wächter\c[0]: Zur Mine geht es in die andere Richtung.
'''
patched = '''
\c[10]Guard\c[0]: The mine is that way.
'''

[[dialogue]]
event = 108
page = 1
command = 2
original = '''
\c[10]Wächter\c[0]: Ihr geht dorthin, wo alle anderen 
hingehen.\. Mit anderen Worten: Genau in die 
entgegengesetzte Richtung!\.
Was ist daran so schwer zu verstehen?
'''
patched = '''
\c[10]Guard\c[0]: Go where everyone else is headed.\. In other
words, exactly in the opposite direction!\. What's
so hard to understand about that?
'''

[[dialogue]]
event = 109
page = 1
command = 2
original = '''
\c[10]Wächter\c[0]: Ihr sollt zur Mine,\. nicht hier lang.
'''
patched = '''
\c[10]Guard\c[0]: You should go to the mine,\. not here.
'''

[[dialogue]]
event = 110
page = 1
command = 2
original = '''
\c[10]Wächter\c[0]: Bitte habt etwas gnade und bereitet mir 
am Morgen nicht unnötig Kopfschmerzen.\. In die 
andere Richtung, verstanden?
'''
patched = '''
\c[10]Guard\c[0]: Please have a little mercy and don't give
me an unneeded headache in the morning.\. Just go
in the other direction, okay?
'''

[[dialogue]]
event = 111
page = 1
command = 21
original = '''
\c[10]Wächter\c[0]: Hier geht es nicht durch! 
'''
patched = '''
\c[10]Guard\c[0]: You're not getting past me!
'''

[[dialogue]]
event = 112
page = 1
command = 21
original = '''
\c[10]Wächter\c[0]: Hier geht es nicht durch! 
'''
patched = '''
\c[10]Guard\c[0]: You're not getting past me!
'''

[[dialogue]]
event = 113
page = 1
command = 21
original = '''
\c[10]Wächter\c[0]: Hier geht es nicht durch! 
'''
patched = '''
\c[10]Guard\c[0]: You're not getting past me!
'''

[[dialogue]]
event = 114
page = 3
command = 6
original = '''
\c[10]Gefangener:\c[0] ...
'''
patched = '''
\c[10]Prisoner\c[0]: ...
'''

[[dialogue]]
event = 115
page = 3
command = 6
original = '''
\c[10]Gefangene\c[0]: Nicht jetzt!
'''
patched = '''
\c[10]Prisoner\c[0]: Not now!
'''

[[dialogue]]
event = 116
page = 3
command = 6
original = '''
\c[10]Nicht ganz eingelebter Gefangener\c[0]: Nicht schon 
wieder...\. Minenarbeit...\. Ich hasse es...
'''
patched = '''
\c[10]New Prisoner\c[0]: Not again...\. mining...\.
I hate it...
'''

[[dialogue]]
event = 117
page = 3
command = 6
original = '''
\c[10]Gefangene\c[0]: Geht mir aus dem Weg.
'''
patched = '''
\c[10]Prisoner\c[0]: Get out of my way.
'''

[[dialogue]]
event = 120
page = 1
command = 2
original = '''
\c[10]Wächter\c[0]: Zur Kantine geht den Flur vom 
Erdgeschoss des Zellengebäudes ganz durch und dann 
nach rechts.
'''
patched = '''
\c[10]Guard\c[0]: To get to the cafe, go through this
corridor past all the cells while staying on
the ground floor, then turn right.
'''

[[dialogue]]
event = 121
page = 1
command = 2
original = '''
\c[10]Gefangener\c[0]: Manchmal hab ich wirklich das Gefühl, 
dass eine bessere Ausrüstung im Turnier mehr 
bringt als Kampftalent. 
'''
patched = '''
\c[10]Prisoner\c[0]: Sometimes, I have this feeling that
better equipment in the tournament brings you
more than your ability to fight does.
'''

[[dialogue]]
event = 121
page = 1
command = 5
original = '''
\c[10]Gefangener\c[0]: Wie sonst soll man mir erklären, dass 
diese Pauamainer Veteranen immer soweit oben sind?\.
Natürlich weil sie verdammt viel Erz schürfen und 
deshalb viele Turnier-Münzen erhalten!
'''
patched = '''
\c[10]Prisoner\c[0]: How else can you explain to me that
these Pauamainer Veterans are always up there?\.
Of course, it's because they dig up a lot of
ore and get a lot of tournament coins in turn!
'''

[[dialogue]]
event = 121
page = 1
command = 9
original = '''
\c[10]Gefangener\c[0]: Und viele Turnier-Münzen bedeuten 
bessere Ausrüstung, wie ihr ja wahrscheinlich 
schon wisst.
'''
patched = '''
\c[10]Prisoner\c[0]: And a lot of tournament coins mean
better equipment, as you probably already know.
'''

[[dialogue]]
event = 122
page = 1
command = 2
original = '''
\c[10]Wächter\c[0]: Dieser Bereich darf nur von 
Turnierkampfteilnehmern betreten werden!
'''
patched = '''
\c[10]Guard\c[0]: This area is only to be entered by those
fighting in the tournament!
'''

[[dialogue]]
event = 123
page = 1
command = 2
original = '''
\c[10]Wächter\c[0]: Wenn ihr auf den Platz wollt, um zu 
kämpfen, müsst ihr euch anmelden.\. Die Anmeldung 
ist in der Kantine.
'''
patched = '''
\c[10]Guard\c[0]: If you want to get into the arena
and fight, you'll have to register first.\.
Registration is in the cafe.
'''

[[dialogue]]
event = 124
page = 1
command = 21
original = '''
\c[10]Wächter\c[0]: Zurück mit euch!
'''
patched = '''
\c[10]Guard\c[0]: Back off!
'''

[[dialogue]]
event = 125
page = 1
command = 2
original = '''
\c[10]Gefangene\c[0]: Irgendwie hab ich Mitleid mit "Den 
Schleimigen".\. Ständig werden sie von x-beliebigen 
Neueinsteigern nieder geprügelt.
'''
patched = '''
\c[10]Prisoner\c[0]: I feel sorry for "The Slimealgamation".\.
They've got it rough, being constantly being
beaten up by newcomers.
'''

[[dialogue]]
event = 125
page = 1
command = 5
original = '''
\c[10]Gefangene\c[0]: Es gibt sogar einige untere Plätze, die 
so dreist sind, sie einfach so zu bekämpfen und zu 
schlagen, obwohl sie im Rang unter ihnen sind!\. Nur 
aus Frust, weil sie nicht weiter kommen!
'''
patched = '''
\c[10]Prisoner\c[0]: There are even some low-ranking teams
that have the audacity to beat them up again and
again, despite being ranked above them!\. Just out
of frustration that they can't get anywhere!
'''

[[dialogue]]
event = 125
page = 1
command = 9
original = '''
\c[10]Gefangene\c[0]: Ich für meinen Teil freu mich über 
jeden Sieg der Schleimigen, selbst wenn es nur 
selten passiert!
'''
patched = '''
\c[10]Prisoner\c[0]: If you ask me, I'm happy every time "The
Slimealgamation" wins, even if it happens very
rarely!
'''

[[dialogue]]
event = 126
page = 1
command = 2
original = '''
\c[10]Gefangener\c[0]: Ich bin ja mal gespannt, wer sich 
diesmal durchschlagen wird.
'''
patched = '''
\c[10]Prisoner\c[0]: I'm curious to see who'll make it
through this time.
'''

[[dialogue]]
event = 127
page = 1
command = 2
original = '''
\c[10]Älterer Gefangener\c[0]: Es ist immer wieder gut zu 
sehen, dass es Gefangene gibt, die gegen den 
Untertage-Schreck ankommen.\. Das sind nämlich genau 
die Biester, die auch unten in der Mine lauern.
'''
patched = '''
\c[10]Old Prisoner\c[0]: It's always good to see that there
are prisoners who are brave enough to stand up
against "The Terror from Below".\. They're the
very monsters that haunt us down in the mine.
'''

[[dialogue]]
event = 127
page = 1
command = 6
original = '''
\c[10]Älterer Gefangener\c[0]: So kann man immer hoffen, da 
unten auch Hilfe zu bekommen, wenn man mal 
wirklich von so etwas verfolgt wird.
'''
patched = '''
\c[10]Old Prisoner\c[0]: So you can always hope that you
might get help down there if you're really
being chased by something like that.
'''

[[dialogue]]
event = 127
page = 1
command = 9
original = '''
\c[10]Älterer Gefangener\c[0]: Am Tageslicht sehen diese Wesen 
so oder so gleich viel harmloser aus!
'''
patched = '''
\c[10]Old Prisoner\c[0]: In broad daylight, these beings look
much less dangerous anyway!
'''

[[dialogue]]
event = 128
page = 1
command = 2
original = '''
\c[10]Gefangener\c[0]: Die Exoten sind mein persönliche 
Favorit hier!\. Die haben einen so toll 
überraschenden Kampfstil.
'''
patched = '''
\c[10]Prisoner\c[0]: The Exotics are my personal favorite
here!\. They have such an intriguing fighting style.
'''

[[dialogue]]
event = 128
page = 1
command = 5
original = '''
\c[10]Gefangener\c[0]: Am Anfang macht es den Anschein, dass 
sie nichts drauf haben und der Gegner gewinnen 
wird, aber nach ein paar Runden legen sie dann 
richtig los!
'''
patched = '''
\c[10]Prisoner\c[0]: In the beginning, it doesn't seem like
they're up to the task and that the opponent
will win, but after a few rounds, they
really get going!
'''

[[dialogue]]
event = 128
page = 1
command = 9
original = '''
\c[10]Gefangener\c[0]: Viele Gegner sind schon auf diese 
Taktik reingefallen!
'''
patched = '''
\c[10]Prisoner\c[0]: So many opponents have already fallen
for their tactic!
'''

[[dialogue]]
event = 129
page = 1
command = 2
original = '''
\c[10]Gefangener\c[0]: Diese Rächer der Gerechten sind schon 
ein komischer Verein.\. Die reden permanent von 
irgendwelchen gerechten Umverteilungen von 
Besitztümern. 
'''
patched = '''
\c[10]Prisoner\c[0]: These Avengers of the Just are a strange
group.\. They're constantly talking about their
"righteous redistribution of property".
'''

[[dialogue]]
event = 129
page = 1
command = 6
original = '''
\c[10]Gefangener\c[0]: Diese Typen kamen hier aus Helnovien.\.
Hier gibt es nicht viel umzuverteilen.\. Seit dem 
Krieg gibt es hier bis auf sehr wenige Ausnahmen 
nur arme Menschen.
'''
patched = '''
\c[10]Prisoner\c[0]: These guys are in Helnovien.\. There isn't
much to redistribute.\. Ever since the war, there've
only been a bunch of poor people with very few
exceptions.
'''

[[dialogue]]
event = 129
page = 1
command = 10
original = '''
\c[10]Gefangener\c[0]: Aber ihr Bogenschütze hat es drauf,
das muss man ihnen lassen.\. Hab selten so viele 
Pfeile auf einmal fliegen sehen!
'''
patched = '''
\c[10]Prisoner\c[0]: But their archer has what it takes, you
have to give them that.\. I've rarely seen so many
arrows fly at once!
'''

[[dialogue]]
event = 130
page = 1
command = 2
original = '''
\c[10]Gefangener\c[0]: Es kommt nicht sonderlich oft vor, 
dass "Der Chef" herausgefordert wird, aber wenn es 
passiert, ist es immer wieder ein Spektakel.
'''
patched = '''
\c[10]Prisoner\c[0]: It doesn't happen very often that "The
Boss" is challenged, but when he is, it's always
quite the battle to watch.
'''

[[dialogue]]
event = 130
page = 1
command = 5
original = '''
\c[10]Gefangener\c[0]: Der Chef kämpft alleine und hat es 
bisher mit jeder Gruppe locker aufgenommen, die 
ihn Platz runter bringen wollte.
'''
patched = '''
\c[10]Prisoner\c[0]: The Boss fights alone, and so far, has
easily taken on any group that tried to bring
him down.
'''

[[dialogue]]
event = 130
page = 1
command = 8
original = '''
\c[10]Gefangener\c[0]: Zu schade, dass die Pauamainer 
Veteranen es mittlerweile aufgegeben haben, ihm 
vom 1. Platz zu jagen. 
'''
patched = '''
\c[10]Prisoner\c[0]: Too bad the Pauamainer Veterans have
since given up trying to dethrone him from 1st
place.
'''

[[dialogue]]
event = 130
page = 1
command = 11
original = '''
\c[10]Gefangener\c[0]: Aber diese Neuen da, diese 
Zinkar-Brüder, die versuchen es öfters in letzter 
Zeit.\. Die Neueinsteiger bringen wirklich 
frischen Wind in dieses Turnier!
'''
patched = '''
\c[10]Prisoner\c[0]: But those newcomers, the Zinkar
Brothers, have been trying their hand at it
lately.\. They're really bringing a breath of
fresh air to this tournament!
'''

[[dialogue]]
event = 131
page = 1
command = 2
original = '''
\c[10]Gefangener\c[0]: Diese Schattenschleicher sind wirklich 
eine Gruppe, denen ich nachts nicht über den Weg 
laufen will.\. Die sind schon tagsüber unheimlich 
und grausam genug!
'''
patched = '''
\c[10]Prisoner\c[0]: These Shadow Crawlers are a group that
I really don't want to run into late at night.\.
They're scary and cruel enough during the day!
'''

[[dialogue]]
event = 131
page = 1
command = 6
original = '''
\c[10]Gefangener\c[0]: Und wenn sie mal ihr Nebelgewand auf 
sich ausführen, sieht ihr Gegner sie so schlecht, 
als ob es tatsächlich Nacht wäre.
'''
patched = '''
\c[10]Prisoner\c[0]: And if they do their foggy clothing on
themselves, their opponent sees them as badly as
if it were actually night.
'''

[[dialogue]]
event = 132
page = 1
command = 3
original = '''
\c[10]Gefangener\c[0]: Hehe!\. Die bisherigen Kämpfe waren 
ziemlich toll!\. Es lohnt sich doch immer wieder, 
dabei zu sein.
'''
patched = '''
\c[10]Prisoner\c[0]: Hehe!\. The fights so far have been pretty
great!\. It's always worth being here.
'''

[[dialogue]]
event = 132
page = 1
command = 8
original = '''
\c[10]Gefangener\c[0]: Wann geht es endlich los? Ich will 
nicht noch länger warten...
'''
patched = '''
\c[10]Prisoner\c[0]: When is it finally starting?
I don't want to wait any longer...
'''

[[dialogue]]
event = 132
page = 1
command = 12
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Was ist das hier für ein 
offener Platz?\. Und was machen die 
ganzen Leute hier?
'''
patched = '''
\c[1]\n[1]\c[0]: What kind of area is this?\. And
what are all these people doing here?
'''

[[dialogue]]
event = 132
page = 1
command = 16
original = '''
\c[10]Gefangener\c[0]: Das wisst ihr nicht?\. Hier finden 
gleich einige Turnierkämpfe statt.\. Die gibt es 
fast täglich.\. Jeder Gefangene kann dran 
teilnehmen.
'''
patched = '''
\c[10]Prisoner\c[0]: You don't know?\. Here is where the
tournament battles take place.\. They happen
almost every day.\. Any prisoner can participate.
'''

[[dialogue]]
event = 132
page = 1
command = 22
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Aber was soll man bitte davon 
haben?
'''
patched = '''
\c[13]\n[3]\c[0]: But what do you get from it?
'''

[[dialogue]]
event = 132
page = 1
command = 25
original = '''
\c[10]Gefangener\c[0]: Einen Ruf hier im Gefängnis. Leute, 
die sich gut um Turnier schlagen, werden von den 
anderen Gefangenen mit höherem Respekt behandelt.
'''
patched = '''
\c[10]Prisoner\c[0]: Fame and recognition. People who do well
at the tournament are treated with more respect by
the other prisoners.
'''

[[dialogue]]
event = 132
page = 1
command = 28
original = '''
\c[10]Gefangener\c[0]: Gleichzeitig ist es eine Unterhaltung 
für die anderen Gefangenen, die zusehen.
'''
patched = '''
\c[10]Prisoner\c[0]: At the same time, it brings
entertainment for all the other
prisoners watching.
'''

[[dialogue]]
event = 132
page = 1
command = 30
original = '''
\c[10]Gefangener\c[0]: Ich hab' gehört, bevor die 
Turnierkämpfe eingeführt worden sind, gab es 
deutlich mehr Aufstände und Probleme mit den 
Gefangenen.
'''
patched = '''
\c[10]Prisoner\c[0]: I heard that before the tournament was
introduced, there were significantly more
uprisings and problems with prisoners.
'''

[[dialogue]]
event = 134
page = 1
command = 2
original = '''
\c[10]Gefangener\c[0]: Diese Turnierkämpfe sind wirklich so 
ziemlich der einzige Spaß, der uns in diesem 
Gefängnis bleibt. 
'''
patched = '''
\c[10]Prisoner\c[0]: These tournament battles are really
pretty much the only fun thing we have left
in this prison.
'''

[[dialogue]]
event = 134
page = 1
command = 5
original = '''
\c[10]Gefangener\c[0]: Zum Glück gibt es genug Freiwillige, 
die tatsächlich Lust haben, sich am Feierabend die 
Köpfe einzuschlagen...
'''
patched = '''
\c[10]Prisoner\c[0]: Fortunately, there are enough volunteers
who actually want to knock themselves out at the
end of the day...
'''

[[dialogue]]
event = 136
page = 1
command = 2
original = '''
\c[10]Wächter\c[0]: Gefangene haben hier nichts zu suchen!
'''
patched = '''
\c[10]Guard\c[0]: Prisoners have no business here!
'''

[[dialogue]]
event = 137
page = 1
command = 21
original = '''
\c[10]Wächter\c[0]: Hier geht es nicht durch! 
'''
patched = '''
\c[10]Guard\c[0]: You're not getting past me!
'''

[[dialogue]]
event = 140
page = 2
command = 2
original = '''
\c[10]Gefangener\c[0]: Wie man da drüben sieht, gibt es auch 
reichlich Wächter, die bei den Turnierkämpfen 
zusehen.
'''
patched = '''
\c[10]Prisoner\c[0]: As you can see over there, plenty of
guards also watch these tournament battles.
'''

[[dialogue]]
event = 140
page = 2
command = 14
original = '''
\c[10]Gefangener\c[0]: Einige von uns fragen sich wirklich, 
ob die das Turnier hauptsächlich für ihre eigene 
Unterhaltung eingeführt haben...
'''
patched = '''
\c[10]Prisoner\c[0]: Some of us are really starting to wonder
if they introduced the tournament mainly for their
own entertainment...
'''

[[dialogue]]
event = 141
page = 2
command = 2
original = '''
\c[10]Gefangener\c[0]: Ziemlich gute Aussicht von hier oder?\.
Ich würde mich aber nicht zu nah an die Brüstung 
wagen.\. Wir hatten schon Fälle, wo Gefangene von 
hier runter gefallen sind...
'''
patched = '''
\c[10]Prisoner\c[0]: Pretty good view from here, right?\. But I
wouldn't dare to get too close to the rails.\. We've
had cases where prisoners fell down from here...
'''

[[dialogue]]
event = 142
page = 2
command = 2
original = '''
\c[10]Gefangene\c[0]: Wenn hier mal der Chef kämpft, müsst 
ihr unbedingt hier oben sein!\. Wenn der einmal 
seine Geheimattacke verwendet, spürt man den Wind 
sogar noch hier oben!
'''
patched = '''
\c[10]Prisoner\c[0]: If the boss decides to fight, you have
to stay up here!\. If he uses his secret attack,
you'll still be able to feel the wind even up
here!
'''

[[dialogue]]
event = 143
page = 2
command = 4
original = '''
\c[10]Gefangener\c[0]: Der Typ da sieht ja sehr edel aus. \.Wie 
kommt so etwas hier bitte ins Gefängnis?\. Und wieso 
versperrt mir so etwas hier die Sicht?
'''
patched = '''
\c[10]Prisoner\c[0]: This guy here looks like a noble.\. How'd
someone like him end up in this prison?\. And why
is he blocking my view?
'''

[[dialogue]]
event = 143
page = 2
command = 12
original = '''
\c[10]Gefangener\c[0]: Wenn hier einmal die Kämpfe richtig 
losgehen, ist es hier oben oft stark überfüllt.\. Da 
bekommt man wirklich Angst, dass man runter fallen 
könnte...
'''
patched = '''
\c[10]Prisoner\c[0]: If it's the first match of the day, it's
often very crowded up here.\. And you'd quickly be
afraid that you could fall down...
'''

[[dialogue]]
event = 145
page = 2
command = 2
original = '''
\c[10]Gefangener\c[0]: Diese "Ritter der Nacht" sind ganz 
schön gerissen, sag ich dir. 
'''
patched = '''
\c[10]Prisoner\c[0]: These "Knights of Night" are pretty
smart, I tell you.
'''

[[dialogue]]
event = 145
page = 2
command = 4
original = '''
\c[10]Gefangener\c[0]: Als die meisten Kämpfer dahinter 
gekommen sind, dass sie sehr anfällig gegen Magie 
sind, haben sie ihre Taktik geändert. 
'''
patched = '''
\c[10]Prisoner\c[0]: When most of the fighters figured out
that they were very vulnerable to magic, they
changed their tactics.
'''

[[dialogue]]
event = 145
page = 2
command = 7
original = '''
\c[10]Gefangener\c[0]: Jetzt zaubern sie "Spiegelung" auf 
sich selber!\. Es ist immer wieder toll anzusehen, 
wie verdutzt die Zauberer blicken, wenn die ihren 
Spruch zurückgeschleudert bekommen!
'''
patched = '''
\c[10]Prisoner\c[0]: Now they cast "Reflect" on themselves!\.
It's always a joy to see how stunned aspiring
mages look when they get their spell thrown
right back!
'''

[[dialogue]]
event = 156
page = 1
command = 27
original = '''
\c[10]Ansager:\c[0] \s[5]Unser nächster Kampf steht kurz bevor!\.
Der erste Teilnehmer betritt die Arena!\.\.\^
'''
patched = '''
\c[10]Announcer\c[0]: \s[5]Our next battle is just around the
corner!\. The first combatant enters the arena!\.\.\^
'''

[[dialogue]]
event = 156
page = 1
command = 33
original = '''
\c[10]Ansager:\c[0] \s[5] Die ZINKAR-SCHLÄCHTER!
'''
patched = '''
\c[10]Announcer\c[0]: \s[5]THE ZINKAR BUTCHERS!
'''

[[dialogue]]
event = 156
page = 1
command = 39
original = '''
\c[10]Ansager:\c[0] Oha!\. Diese Truppe hat sich ein Ziel 
gesetzt!\. Doch dieses ist noch weit entfernt, 
ein langer Weg durch die Rangliste wartet auf sie!
'''
patched = '''
\c[10]Announcer\c[0]: Oh!\. This group set a goal for
themselves!\. But this goal is still quite
a ways away, and thus, a long journey
through the ranks lies ahead of them!
'''

[[dialogue]]
event = 156
page = 1
command = 42
original = '''
\c[10]Ansager:\c[0] Hoffen wir, dass ihr Name Programm ist!
'''
patched = '''
\c[10]Announcer\c[0]: Let's hope that their name says it all!
'''

[[dialogue]]
event = 156
page = 1
command = 47
original = '''
\c[10]Ansager:\c[0] Langsam aber sicher kommen sie ihrem Ziel 
näher!\. Werden sie bis zum bitteren Ende 
durchhalten?\. Und sind sie ihrem Erzfeind wirklich 
gewachsen, wenn es mal soweit ist?
'''
patched = '''
\c[10]Announcer\c[0]: Slowly but surely, they're getting
closer to their ultimate goal!\. Will they hold out
until the bitter end?\. Will they be up to the task
to face their archenemies when the time comes?
'''

[[dialogue]]
event = 156
page = 1
