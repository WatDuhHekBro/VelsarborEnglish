[[dialogue]]
event = 156
page = 1
command = 110
original = '''
\c[10]Ansager:\c[0] \s[5]Der BRIGANTEN-STOLZ!
'''
patched = '''
\c[10]Announcer\c[0]: \s[5]THE BRIGANTINE PRIDE!
'''

[[dialogue]]
event = 156
page = 1
command = 116
original = '''
\c[10]Ansager:\c[0] ... Briganten\. ... Stolz? 
'''
patched = '''
\c[10]Announcer\c[0]: Brigantine...\. Pride?
'''

[[dialogue]]
event = 156
page = 1
command = 117
original = '''
\c[10]Ansager:\c[0] Natürlich!\. Der Stolz unserer Nation!\. Hier
in unserem Gefängnis!\. Unsere Vorbildsgefangenen! \.
Wenn doch nur jeder in Brigantia sich so verhalten 
würde wie unsere bescheidenen Freunde hier!
'''
patched = '''
\c[10]Announcer\c[0]: Of course!\. The pride of our nation!\.
Here in our prison!\. Our model prisoners!\. If
only everyone in Brigantia behaved like our
humble friends here!
'''

[[dialogue]]
event = 156
page = 1
command = 121
original = '''
\c[10]Ansager:\c[0] Ohja\....\.WIR WÜRDEN DEN GESAMTEN 
BRIGANTEN-ORDEN ZU UNSEREN TEILNEHMERN ZÄHLEN!\. 
Wäre das nicht großartig?
'''
# "We could attribute the honor of every Brigantian soldier to be exactly like these three!"
patched = '''
\c[10]Announcer\c[0]: Oh yeah...\. IF WE WERE TO PICK ANY
SOLDIER FROM THE BRIGANTINE ORDER, THE
RESEMBLANCE WOULD OBVIOUSLY BE DAY AND NIGHT!\.
Wouldn't that be great?
'''

[[dialogue]]
event = 156
page = 1
command = 131
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Das war so klar, dass das so 
ausging...
'''
patched = '''
\c[2]\n[2]\c[0]: I saw this coming miles away...
'''

[[dialogue]]
event = 156
page = 1
command = 134
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Wir werden sehen, wer hier am 
Ende lacht!
'''
patched = '''
\c[13]\n[3]\c[0]: We'll see who gets the last
laugh!
'''

[[dialogue]]
event = 156
page = 1
command = 140
original = '''
\c[10]Ansager:\c[0] Ohja!\. Unsere Vorbildgefangenen wieder! \.
Sicherlich können wir Stolz sein auf unsere 
Verräter.\. Wenn ich es mir recht überlege...\.
sollte es nicht eher KORZOJENOS STOLZ heißen?!
'''
patched = '''
\c[10]Announcer\c[0]: Oh yeah!\. Our model prisoners again!\.
We can definitely be proud of our traitors.\.
Now I think about it...\. shouldn't it be
THE KORZOJENISH PRIDE instead?!
'''

[[dialogue]]
event = 156
page = 1
command = 146
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: ... Verdammt...
'''
patched = '''
\c[13]\n[3]\c[0]: Damn...
'''

[[dialogue]]
event = 156
page = 1
command = 148
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Wirklich eine ausgezeichnete 
Namenswahl.
'''
patched = '''
\c[2]\n[2]\c[0]: Truly an amazing name.
'''

[[dialogue]]
event = 156
page = 1
command = 153
original = '''
\c[10]Ansager:\c[0] Sie mögen uns an Korzojeno verkauft haben 
und unter uns Gefangenen verweilen, aber sie haben 
uns bewiesen, dass ihre Kampfkunst in der Tat eine 
Sache ist, auf die man stolz sein kann!
'''
patched = '''
\c[10]Announcer\c[0]: They may have sold us to Korzojeno and
stayed with us as prisoners, but they've shown us
that their prowess is something to be proud of
indeed!
'''

[[dialogue]]
event = 156
page = 1
command = 157
original = '''
\c[10]Ansager:\c[0] Ja,\. vielleicht sogar ganz Brigantia!
'''
patched = '''
\c[10]Announcer\c[0]: Yes,\. maybe even to all of Brigantia!
'''

[[dialogue]]
event = 156
page = 1
command = 160
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Wir haben nichts an 
Korzojeno verkauft, sie wollen es 
einfach nicht verstehen...
'''
patched = '''
\c[13]\n[3]\c[0]: We didn't sell anyone out to
Korzojeno, they just don't want to
understand...
'''

[[dialogue]]
event = 156
page = 1
command = 164
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Wenigstens scheinen sie uns 
so langsam ernst zu nehmen.
'''
patched = '''
\c[1]\n[1]\c[0]: At least they're starting to
take us seriously.
'''

[[dialogue]]
event = 156
page = 1
command = 174
original = '''
\c[10]Ansager:\c[0] \s[5]Die VERRÄTER!
'''
patched = '''
\c[10]Announcer\c[0]: \s[5]THE TRAITORS!
'''

[[dialogue]]
event = 156
page = 1
command = 180
original = '''
\c[10]Ansager:\c[0] Wenn das nicht unsere Kollegen vom 
Briganten-Orden sind, die dann doch lieber für 
unser tückisches Nachbarland arbeiten wollten!
'''
patched = '''
\c[10]Announcer\c[0]: Well,\. well,\. well,\. if it isn't our
colleagues from the Brigantine Order who'd rather
work for our treacherous neighboring country!
'''

[[dialogue]]
event = 156
page = 1
command = 183
original = '''
\c[10]Ansager:\c[0] Jetzt sind sie hier, in Brigantia, doch 
ihrem Auftraggeber werden sie nicht mehr helfen 
können!\. Das einzige was ihnen bleib, ist zu 
kämpfen!
'''
patched = '''
\c[10]Announcer\c[0]: Now that they're stuck here in
Brigantia, they won't be able to help out
their client any longer!\. The only thing
left for them do to is fight!
'''

[[dialogue]]
event = 156
page = 1
command = 192
original = '''
\c[10]Ansager:\c[0] Und wieder sind sie hier, um zu kämpfen!\.
Offensichtlich gibt es hier nichts interessantes, 
was es Korzojeno zu berichten gilt!
'''
patched = '''
\c[10]Announcer\c[0]: And they're here to fight again!
Obviously, there's nothing interesting to
write to Korzojeno about here!
'''

[[dialogue]]
event = 156
page = 1
command = 197
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: ... wie oft wollen sie noch 
darauf rumhacken?
'''
patched = '''
\c[13]\n[3]\c[0]: How often are they going to keep
singling us out?
'''

[[dialogue]]
event = 156
page = 1
command = 202
original = '''
\c[10]Ansager:\c[0] Sie kämpfen, oh ja und wie sie kämpfen!\.
Wir können froh sein, dass sie es hier tun und 
nicht in einer Schlacht mit unserem Nachbarland 
unter der Führung Farenias!
'''
patched = '''
\c[10]Announcer\c[0]: They fight, oh how they keep fighting!\.
We can be glad that they're doing it here and not
in a battle for our neighboring country under the
leadership of Farenia!
'''

[[dialogue]]
event = 156
page = 1
command = 208
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Der Typ kann auch mächtig 
