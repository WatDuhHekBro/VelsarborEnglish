[[dialogue]]
event = 77
page = 1
command = 2
original = '''
\c[10]Wächter:\c[0] Wollt ihr ne Erklärung zur Rüstungswahl?
'''
patched = '''
\c[10]Guard\c[0]: Do you want an explanation on choosing
equipment?
'''

[[dialogue]]
event = 77
page = 1
command = 5
original = '''
\c[10]Wächter:\c[0] Wie ihr sicher schon bemerkt habt, 
bekommt ihr einige Turniermünzen von uns. 
'''
patched = '''
\c[10]Guard\c[0]: As you've probably already noticed, you'll
get some tournament coins from us.
'''

[[dialogue]]
event = 77
page = 1
command = 7
original = '''
\c[10]Wächter:\c[0] Diese könnt ihr hier gegen Rüstungsteile 
und sonstige Gegenstände eintauschen, die ihr dann 
im Kampf verwenden könnt.
'''
patched = '''
\c[10]Guard\c[0]: You can then exchange them here for
equipment and other items that you can use
in combat.
'''

[[dialogue]]
event = 77
page = 1
command = 10
original = '''
\c[10]Wächter:\c[0] Ihr wählt eure Ausrüstung übrigens nur 
einmal pro Tag. Ihr könnt die Ausrüstung nicht 
zwischen den Kämpfen mal eben umändern. Also plant 
gut im Voraus, wenn ihr mehrmals kämpfen wollt.
'''
patched = '''
\c[10]Guard\c[0]: You can only choose your equipment once per
day. You cannot change your equipment in-between
fights. So plan accordingly if you plan on
fighting more than once.
'''

[[dialogue]]
event = 77
page = 1
command = 14
original = '''
\c[10]Wächter:\c[0] Natürlich werdet ihr weder die Rüstung, 
noch die Münzen behalten, wenn eure Kämpfe 
vorbei sind.
'''
patched = '''
\c[10]Guard\c[0]: Of course, you won't keep your armor or
coins when these battles are over.
'''

[[dialogue]]
event = 77
page = 1
command = 21
original = '''
\c[10]Wächter:\c[0] Wie? Habt ihr euch anders entschieden?\.
Dann halt noch mal von vorne.\. Beeilt euch!
'''
patched = '''
\c[10]Guard\c[0]: Why?\. Are you choosing something different?\.
Then let's start again from the beginning.\.
Hurry up already!
'''

[[dialogue]]
event = 77
page = 1
command = 30
original = '''
\c[10]Wächter:\c[0] Dann redet mich nicht an, sondern wählt 
eure Rüstung und kämpft.
'''
patched = '''
\c[10]Guard\c[0]: Then don't speak to me, choose your
equipment and fight.
'''

[[dialogue]]
event = 78
page = 3
command = 16
original = '''
\c[10]Wächter:\c[0] Oha, ein neuer Teilnehmer.\. Hier habt ihr 
eure Minen-Standardausrüstung und Turniermünzen.
'''
patched = '''
\c[10]Guard\c[0]: Oh, a new participant.\. Here's your standard
mining equipment and tournament coins.
'''

[[dialogue]]
event = 78
page = 3
command = 21
original = '''
\c[10]Wächter:\c[0] Hier eure Turniermünzen.
'''
patched = '''
\c[10]Guard\c[0]: Here are your tournament coins.
'''

[[dialogue]]
event = 78
page = 3
command = 45
original = '''
\c[10]Wächter:\c[0] Die Anzahl eurer Turniermünzen hängt 
übrigens davon ab, wie viel Erz ihr heute 
gesammelt habt.
'''
patched = '''
\c[10]Guard\c[0]: By the way, the amount of tournament coins
you get depends on how much ore you've collected
today.
'''

[[dialogue]]
event = 78
page = 3
command = 48
original = '''
\c[10]Wächter:\c[0] Ihr könnt hier nun eure Turniermünzen in 
bessere Ausrüstung umtauschen, falls ihr denkt, 
dass Spitzhacke und Arbeiterkleidung nicht gut 
genug für euch sind.
'''
patched = '''
\c[10]Guard\c[0]: You can now exchange your tournament coins
for better equipment here if you think that those
pickaxes and work clothes aren't good enough for
you.
'''

[[dialogue]]
event = 78
page = 3
command = 52
original = '''
\c[10]Wächter:\c[0] Solltet ihr Fragen zur Rüstungswahl 
haben, stellt sie mir ruhig.
'''
patched = '''
\c[10]Guard\c[0]: If you have any questions about choosing
equipment, feel free to ask me.
'''

[[dialogue]]
event = 78
page = 3
command = 58
original = '''
\c[10]Wächter:\c[0] Macht schnell bei eurer Auswahl, lasst 
die Anderen nicht warten.
'''
patched = '''
\c[10]Guard\c[0]: Hurry up and get your equipment, don't keep
the others waiting.
'''

[[dialogue]]
event = 81
page = 1
command = 11
original = '''

Dies ist ein \c[11]Speicherpunkt\c[0].
'''
patched = '''

This is a \c[11]save point\c[0].
'''

[[dialogue]]
event = 81
page = 1
command = 13
original = '''

Wenn man auf solch einen steht, kann man \c[11]den
Spielstand speichern\c[0].
'''
patched = '''

When you stand on one of these, you can
\c[11]save the game\c[0].
'''

[[dialogue]]
event = 81
page = 1
command = 16
original = '''

Öffne dazu das \c[11]Menu\c[0] mit \c[11]Esc\c[0] und wähle
dann \c[11]Speichern\c[0].
'''
patched = '''

To do this, open the \c[11]menu\c[0] using \c[11]Esc\c[0] and
then select \c[11]Save\c[0].
'''

[[dialogue]]
event = 81
page = 1
command = 19
original = '''

Auf der \c[11]Weltkarte\c[0] kann man übigens
immer speichern.
'''
patched = '''

Additionally, you can always save on
the \c[11]world map\c[0].
'''

[[dialogue]]
event = 82
page = 1
command = 2
original = '''
\c[10]Wächter:\c[0] Geht raus, wenn ihr soweit seid.
'''
patched = '''
\c[10]Guard\c[0]: Get out when you're ready.
'''

[[dialogue]]
event = 83
page = 1
command = 2
original = '''
\c[10]Wächter:\c[0] Eine ganz schöne Sammlung an 
Ausrüstungsgegenständen haben wir hier, nicht?\.
Wäre ja auch langweilig, wenn ihr euch die ganze 
Zeit nur mit Spitzhacken bekämpfen würdet.
'''
patched = '''
\c[10]Guard\c[0]: We have a very nice collection of equipment
here, don't we?\. Would also be quite boring if
prisoners could only fight with pickaxes all
the time.
'''

[[dialogue]]
event = 84
page = 1
command = 4
original = '''
\c[10]Wächter\c[0]: Seid ihr bereit für das Gefecht?
'''
patched = '''
\c[10]Guard\c[0]: Are you ready for the battle?
'''

[[dialogue]]
event = 86
page = 1
command = 5
original = '''
\c[10]Wächter\c[0]: Hey, was soll das?\. Wollt ihr jetzt etwa
den Kürzeren ziehen?\. Einmal drin gibt es kein 
Zurück.\. Ihr macht jetzt eurem Kampf, ob ihr wollt 
oder nicht!
'''
patched = '''
\c[10]Guard\c[0]: Hey, what's this all about?\. Are you trying
to back out now?\. Once you're in, there's no going
back.\. You're going into the arena whether you
like it or not!
'''

[[text]]
