has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]:\c[0] Hier lang geht es nach 
Helnovien, Kento.\. Wir müssen nach 
Osten,\. nicht hier lang.
'''
patched = '''
\c[13]\n[3]\c[0]: This is the way to Helnovien,
Kento.\. We have to continue going
east,\. not this way.
'''

