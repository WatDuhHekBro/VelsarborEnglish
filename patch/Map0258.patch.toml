[[dialogue]]
event = 24
page = 1
command = 3
original = '''
\c[10]Gefangener\c[0]: Ab und zu findet man hier in der Mine 
ja altes Gerümpel, worunter sich sogar der ein 
oder andere brauchbare Gegenstand befindet...
'''
patched = '''
\c[10]Prisoner\c[0]: You can find old junk in the mine from
time to time, as well as some useful items...
'''

[[dialogue]]
event = 24
page = 1
command = 6
original = '''
\c[10]Gefangener\c[0]: Es gab und gibt Gefangene, die 
versuchen, diesen Kram raus zu schmuggeln, was 
auch immer das denen bringen soll. 
'''
patched = '''
\c[10]Prisoner\c[0]: There have been, and still are,
prisoners trying to smuggle that stuff out,
whatever luck that brings them.
'''

[[dialogue]]
event = 24
page = 1
command = 9
original = '''
\c[10]Gefangener\c[0]: Aber wehe, die Wachen merken das. Die 
verstehen da keinen Spaß, glaubt mir. 
'''
patched = '''
\c[10]Prisoner\c[0]: But woe to them, because the guards
always notice. They just don't get it.
'''

[[dialogue]]
event = 24
page = 1
command = 11
original = '''
\c[10]Gefangener\c[0]: Kam schon oft genug vor, dass die 
einen aufgedeckten Schmuggler mehrere Minuten lang 
durchgeprügelt haben...
'''
patched = '''
\c[10]Prisoner\c[0]: It's happened often enough that those
smugglers were beaten up for several minutes...
'''

[[dialogue]]
event = 26
page = 1
command = 2
original = '''
\c[10]Gefangener\c[0]: Ihr solltet euch nicht zu weit von den 
anderen Minenarbeiten entfernen.\. In den 
Randgebieten, wo weniger Leute arbeiten, tauchen 
immer wieder diese nervigen Biester auf.
'''
patched = '''
\c[10]Prisoner\c[0]: You shouldn't go too far from the other
miners.\. Out there, where fewer people work, these
annoying monsters keep showing up.
'''

[[dialogue]]
event = 27
page = 1
command = 3
original = '''
\c[10]Gefangene\c[0]: Die Heilmittel, die diese Wachenleute 
einem geben reichen nicht wirklich aus, wenn man 
sich in den gefährlichen Gebieten aufhält.
'''
patched = '''
\c[10]Prisoner\c[0]: The supplies these guards give you
really aren't enough if you're in the
dangerous areas.
'''

[[dialogue]]
event = 27
page = 1
command = 6
original = '''
\c[10]Gefangene\c[0]: Zwar geben sie einem noch ein paar 
Heilmittel, wenn du bei der Sammelstelle eine 
gewissen Menge Erz abgegeben hast, aber soviel 
musste erstmal zusammen bekommen...
'''
patched = '''
\c[10]Prisoner\c[0]: They'll give you some more supplies if
you bring a certain amount of ore to the railways,
but that much still has to be collected first...
'''

[[dialogue]]
event = 28
page = 1
command = 3
has_portrait = true
character = '''Kento'''
original = '''
(\c[1]\n[1]\c[0]: An der Stelle arbeitet 
bereits jemand. Es würde nur stören, 
wenn wir hier mithelfen.)
'''
patched = '''
(\c[1]\n[1]\c[0]: Looks like someone's already
working here. We'd only be disturbing
them if we tried to help out.)
'''

[[dialogue]]
event = 29
page = 1
command = 3
has_portrait = true
character = '''Kento'''
original = '''
(\c[1]\n[1]\c[0]: An der Stelle arbeitet 
bereits jemand. Es würde nur stören, 
wenn wir hier mithelfen.)
'''
patched = '''
(\c[1]\n[1]\c[0]: Looks like someone's already
working here. We'd only be disturbing
them if we tried to help out.)
'''

[[dialogue]]
event = 30
page = 1
command = 2
original = '''
\c[10]Wache\c[0]: Der Weg zum nächst-nahen Erz-Bereich wäre 
diesen Gang runter zu folgen und dann bei der 
nächsten Möglichkeit nach Osten zu gehen.\. Achtet 
auf die Monster.
'''
patched = '''
\c[10]Guard\c[0]: The way to the closest ore deposit would be
to follow this tunnel and then go straight at the
next opportunity.\. Watch out for monsters.
'''

[[dialogue]]
event = 31
page = 2
command = 3
original = '''
\c[10]Wache\c[0]: He, süße, rothaarige Begleitung habt ihr 
da, muss schon sagen.\. Aber ihr seid halt noch neu 
hier, das sieht man euch an. \.Der Zahn der Zeit 
nagt dieser Orts besonders stark. 
'''
patched = '''
\c[10]Guard\c[0]: Now ain't that a sweet red-haired companion
you've got there.\. But you're still new here,
anyone can see that.\. The claws of time will
sink into everyone in due time.
'''

[[dialogue]]
event = 31
page = 2
command = 7
original = '''
\c[10]Wache\c[0]: Am Ende sind sie alle nicht mehr schön 
anzusehen...
'''
patched = '''
\c[10]Guard\c[0]: In the end, all of them lose the beauty
they once had...
'''

[[dialogue]]
event = 31
page = 2
command = 11
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: Irgendwie beunruhigt mich 
diese Aussage mehr als ich erwartet 
hätte...
'''
patched = '''
\c[13]\n[3]\c[0]: Somehow, this worries me more
than I expected...
'''

[[dialogue]]
event = 31
page = 2
command = 16
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Wahrhaftig eine Hölle!\. Wie 
kann man so etwas nur den 
zierlichen Damen antun!
'''
patched = '''
\c[2]\n[2]\c[0]: This place is truly a hell!\. How
could this happen to such fragile
ladies?!
'''

[[dialogue]]
event = 31
page = 2
command = 20
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: "zierlichen"?
'''
patched = '''
\c[13]\n[3]\c[0]: "Fragile?"
'''

[[dialogue]]
event = 31
page = 2
command = 22
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Ich glaube Anwesende müssen 
sich nicht angesprochen fühlen...
'''
patched = '''
\c[1]\n[1]\c[0]: I don't think you need to feel
praised...
'''

[[dialogue]]
event = 31
page = 2
command = 25
has_portrait = true
character = '''Soko'''
original = '''
\c[13]\n[3]\c[0]: ...
'''
patched = '''
\c[13]\n[3]\c[0]: ...
'''

[[dialogue]]
event = 31
page = 2
command = 28
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Ich fühl mich aber 
angesprochen.\. Ich bin \.-viel-\. zu 
zierlich für diese Arbeit.
'''
patched = '''
\c[5]\n[5]\c[0]: I feel praised.\. I'm \.*soooo*\.
fragile for this work.
'''

[[dialogue]]
event = 31
page = 2
command = 32
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Du bringst mich total 
aus dem Konzept, Junge!
'''
patched = '''
\c[2]\n[2]\c[0]: You keep messing with my head!
'''

[[dialogue]]
event = 31
page = 2
command = 42
original = '''
\c[10]Wache\c[0]: Steht hier nicht so rum und arbeitet!
'''
patched = '''
\c[10]Guard\c[0]: Don't just stand around here, get back to
work!
'''

[[dialogue]]
event = 54
page = 1
command = 11
original = '''

Dies ist ein \c[11]Speicherpunkt\c[0].
'''
patched = '''

This is a \c[11]save point\c[0].
'''

[[dialogue]]
event = 54
page = 1
command = 13
original = '''

Wenn man auf solch einen steht, kann man \c[11]den
Spielstand speichern\c[0].
'''
patched = '''

When you stand on one of these, you can
\c[11]save the game\c[0].
'''

[[dialogue]]
event = 54
page = 1
command = 16
original = '''

Öffne dazu das \c[11]Menu\c[0] mit \c[11]Esc\c[0] und wähle
dann \c[11]Speichern\c[0].
'''
patched = '''

To do this, open the \c[11]menu\c[0] using \c[11]Esc\c[0] and
then select \c[11]Save\c[0].
'''

[[dialogue]]
event = 54
page = 1
command = 19
original = '''

Auf der \c[11]Weltkarte\c[0] kann man übigens
immer speichern.
'''
patched = '''

Additionally, you can always save on
the \c[11]world map\c[0].
'''

