[[dialogue]]
event = 5
page = 1
command = 2
original = '''
\c[10]Junger Mann\c[0]: Wenn ihr auch hier seid, um zu 
handeln, kann ich euch nur empfehlen die 
ganzen Angebote im Überblick zu behalten. 
'''
patched = '''
\c[10]Young Man\c[0]: If you're here to trade, I can
only recommend that you keep an overview
of all the offers.
'''

[[dialogue]]
event = 5
page = 1
command = 5
original = '''
\c[10]Junger Mann\c[0]: Bei mir war es letztens so...\.
Ich habe mir etwas Salz besorgt, für ein paar 
Grünperlen, wovon ich nicht viel hatte. 
'''
patched = '''
\c[10]Young Man\c[0]: For me, it went something like this...\.
I got some salt for some green pearls, which I
didn't have much of.
'''

[[dialogue]]
event = 5
page = 1
command = 8
original = '''
\c[10]Junger Mann\c[0]: Darauf sah ich dann einen Stand, 
wo es ebenfalls Salz gab, aber hier für raues Fell 
und das hatte ich in Massen! Ihr könnt euch ja 
vorstellen, wie ich mich da geärgert habe.
'''
patched = '''
\c[10]Young Man\c[0]: Then I saw a stall where there was
also salt but was traded for rough fur, and I
had it in abundance! You can imagine how
annoyed I was.
'''

[[dialogue]]
event = 8
page = 1
command = 3
original = '''
\c[10]Junger Mann\c[0]: Args, wo ist hier das Salz?\. 
Ohje!\. Ich glaube, der Braten ist schon zu lange 
im Ofen!\.\s[11] Huh?\s[0]\. Verflucht, wieso geht das Ding 
nicht aus?!
'''
patched = '''
\c[10]Young Man\c[0]: Argh, where's the salt here?\.
Oh no!\. I think the roast has been in the
oven too long!\.\s[11] Huh?\s[0]\. Damn, why doesn't this
thing go out?!
'''

[[dialogue]]
event = 8
page = 1
command = 12
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Kumpel, wir sollten 
schnellstens abhauen! Hier scheint 
es mir nicht ganz so sicher zu sein.
'''
patched = '''
\c[2]\n[2]\c[0]: Hey, we should get out
of here as soon as possible!
It doesn't seem so safe to me.
'''

[[dialogue]]
event = 9
page = 1
command = 3
original = '''
\c[10]Junge Frau\c[0]: Jeden Tag muss ich das Essen 
zubereiten.\. Jetzt hab ich es mal geschafft, ihn zu 
überreden, dass er es macht, und schon geht 
alles schief.
'''
patched = '''
\c[10]Young Woman\c[0]: I have to prepare the food
every day.\. So I managed to persuade him
to do it and everything goes wrong.
'''
