has_portrait = true
original = '''
\c[10]Yahenru\c[0]: An diesem Symbolen 
erkennst du Konter-Waffen. 
Dabei gibt es 2 verschiedene Arten 
von Konterangriffen.
'''
patched = '''
\c[10]Yahenru\c[0]: You can recognize
counterattacking weapons by this
symbol. There are two different
types of counterattacks.
'''

[[dialogue]]
event = 130
page = 3
command = 113
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Beim \c[11]Angriff-Konter\c[0] wird 
nach einem physischen Treffer 
gekontert, bei \c[11]Signum-Konter\c[0] nach 
einem magischen Treffer.
'''
patched = '''
\c[10]Yahenru\c[0]: The \c[11]Attack Counter\c[0]
counterattacks after a physical hit
while the \c[11]Signum Counter\c[0]
counterattacks after a magic hit.
'''

[[dialogue]]
event = 130
page = 3
command = 117
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Das Level (lv) gibt übrigens 
an, mit welcher Wahrscheinlichkeit 
der Konterangriff eintritt.
'''
patched = '''
\c[10]Yahenru\c[0]: Furthermore, the level (lv)
indicates the probability of the
counterattack occurring.
'''

[[dialogue]]
event = 130
page = 3
command = 121
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Schließlich können Waffen 
noch bestimmte \c[11]Verzauberungen\c[0] mit 
sich ziehen.
'''
patched = '''
\c[10]Yahenru\c[0]: Finally, weapons can still
have certain \c[11]enchantments\c[0].
'''

[[dialogue]]
event = 130
page = 3
command = 126
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Das ganze wird mit diesen 
Symbolen verdeutlicht.\. Eine Waffe 
mit Auto-Sprint oder Auto-Ferres 
kann äußerst praktisch sein.
'''
patched = '''
\c[10]Yahenru\c[0]: They're illustrated by these
symbols.\. A weapon with Auto Sprint or
Auto Ferres can be extremely
practical.
'''

[[dialogue]]
event = 130
page = 3
command = 131
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Das sind ein paar der 
Eigenschaften, die Waffen haben 
können. 
'''
patched = '''
\c[10]Yahenru\c[0]: These are just a few of the
qualities that weapons can have.
'''

[[dialogue]]
event = 130
page = 3
command = 134
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Natürlich haben nur 
besondere Waffen solche 
Eigenschaften. 
'''
patched = '''
\c[10]Yahenru\c[0]: Of course, only special
weapons have such properties.
'''

[[dialogue]]
event = 130
page = 3
command = 137
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Im Waffenladen von 
Nebenan findest du so was sicherlich 
nicht.
'''
patched = '''
\c[10]Yahenru\c[0]: You won't find anything like
that in the weapons shop next door.
'''

[[dialogue]]
event = 130
page = 3
command = 140
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Das war's auch schon.
Und nun nehmt die Herausforderung 
an und kämpft!
'''
patched = '''
\c[10]Yahenru\c[0]: That's it.\. Now take on the
challenge and let's battle!
'''

[[dialogue]]
event = 130
page = 3
command = 156
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Seid keine Feiglinge und 
zeigt mir, dass ihr es drauf habt!\. 
Ich warte meinetwegen auch noch 
etwas...
'''
patched = '''
\c[10]Yahenru\c[0]: Don't be cowards and show me
you have what it takes!\. I'm waiting
a little for my own sake...
'''

[[dialogue]]
event = 130
page = 4
command = 5
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Na, das war wirklich
enttäuschend.\. Ihr solltet euch nach 
besseren Waffen umsehen, sonst 
werdet ihr mich nie schlagen...
'''
patched = '''
\c[10]Yahenru\c[0]: Well, that was rather
disappointing.\. You should look
for better weapons, otherwise
you'll never defeat me...
'''

[[dialogue]]
event = 130
page = 4
command = 9
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Nun gut... Ich werde dann 
weiter ziehen.\. Vielleicht sehen wir 
uns irgendwann wieder. 
'''
patched = '''
\c[10]Yahenru\c[0]: Alright... I'll be moving on
then.\. Maybe we'll see each other
again eventually.
'''

[[dialogue]]
event = 130
page = 4
command = 12
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Ich hoffe bis dahin habt ihr 
euch zu ebenbürtigen Gegner 
aufgerüstet!
'''
patched = '''
\c[10]Yahenru\c[0]: I hope that by then you will
have upgraded yourself to match my
strength!
'''

[[dialogue]]
event = 130
page = 4
command = 15
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Also, bis dann!
'''
patched = '''
\c[10]Yahenru\c[0]: See you then!
'''

[[dialogue]]
event = 130
page = 4
command = 21
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Sehr schön!\. Ihr scheint 
wirklich das richtige Maß an Stärke 
zu besitzen um die Ehre zu haben, 
einer meiner Waffen zu bekommen.
'''
patched = '''
\c[10]Yahenru\c[0]: Very nice!\. You really seem
to have the right amount of strength
to have the honor of getting one of
my weapons.
'''

[[dialogue]]
event = 130
page = 4
command = 25
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Ich gebe euch diese Lanze 
hier - \c[11]die Ultioslanze\c[0]!
Ein sehr schönes Teil.
'''
patched = '''
\c[10]Yahenru\c[0]: I'm giving you this lance
here - \c[11]the ultimate lance\c[0]! A
beautiful thing.
'''

[[dialogue]]
event = 130
page = 4
command = 39
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Zwar ist ihre Angriffskraft 
nicht die Allerbeste, aber für eure 
Verhältnisse müsste es mehr als 
genug sein.
'''
patched = '''
\c[10]Yahenru\c[0]: Although its attack power
isn't the best, it should be more
than enough for you.
'''

[[dialogue]]
event = 130
page = 4
command = 43
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Das besondere an dieser 
Waffe ist aber, dass sie eine 
Konter-Eigenschaft hat.\. 
Und zwar"Lv.1-Angriff-Konter"
'''
patched = '''
\c[10]Yahenru\c[0]: The special thing about this
weapon is that it has a
counterattack. Namely, the
"Lv.1 Attack Counter".
'''

[[dialogue]]
event = 130
page = 4
command = 47
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Vor allem in Verbindung 
mit einem erhöhten Reflex-Wert, 
kann diese Waffe sehr wirkungsvoll 
sein.
'''
patched = '''
\c[10]Yahenru\c[0]: Combined with a high evasion
stat, this weapon can become an
unstoppable force.
'''

[[dialogue]]
event = 130
page = 4
command = 51
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Denn wenn man
einem Angriff ausweicht, wird die 
Konter-Wahrscheinlichkeit 
verdoppelt!
'''
patched = '''
\c[10]Yahenru\c[0]: Because if you dodge an
attack, the counterattack's
probability is doubled!
'''

[[dialogue]]
event = 130
page = 4
command = 56
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Oh...\. Das ist in der Tat eine 
interessante Waffe...\. Vielen Dank!
'''
patched = '''
\c[1]\n[1]\c[0]: Ooo...\. This is quite the
interesting weapon...\.
Thank you very much!
'''

[[dialogue]]
event = 130
page = 4
command = 59
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Keine Ursache, Kämpfer 
wie ihr habt es verdient solche 
Waffen zu führen!\. 
Gut,\. ich muss dann weiter!
'''
patched = '''
\c[10]Yahenru\c[0]: No need,\. fighters like you
deserve to use such weapons!\. Well,\.
I have to go then!
'''

[[dialogue]]
event = 130
page = 4
command = 63
has_portrait = true
original = '''
\c[10]Yahenru\c[0]: Viele starke Waffen in 
dieser Welt warten auf mich.\.
Man sieht sich!
'''
patched = '''
\c[10]Yahenru\c[0]: Many powerful weapons in
this world are waiting for me.\.
See you!
'''

[[dialogue]]
event = 130
page = 4
command = 88
has_portrait = true
character = '''Kento'''
original = '''
(\c[1]\n[1]\c[0]: Ein wirklich komischer Kerl, 
aber er ist unheimlich stark....)
'''
patched = '''
(\c[1]\n[1]\c[0]: A really weird guy, but he's
incredibly strong...)
'''

[[dialogue]]
event = 130
page = 4
command = 93
has_portrait = true
character = '''Kento'''
original = '''
(\c[1]\n[1]\c[0]: Ein komischer Kerl... 
Schenkt uns eine Waffe, nur weil wir 
ihn in einem Kampf besiegt haben...)
'''
patched = '''
(\c[1]\n[1]\c[0]: A weird guy... gives us a
weapon just because we beat him
in a fight...)
'''

[[dialogue]]
event = 134
page = 1
command = 2
original = '''
\c[10]Händler\c[0]: Diese Gegend wird zunehmend 
von Händler und Reisenden durchquert, es ist 
nur eine Frage der Zeit, bis sich hier eine kleine 
Siedlung bilden wird.
'''
patched = '''
\c[10]Merchant\c[0]: This area is increasingly being crossed
by traders and travellers alike, so it's only a
matter of time before a small settlement will
be built here.
'''

[[dialogue]]
event = 134
page = 1
command = 6
original = '''
\c[10]Händler\c[0]: Im Moment ist es einfach der 
perfekte Ort um mit Reisenden ein Geschäft zu 
machen.\. Wie sieht's aus?\. Braucht ihr ein paar 
Heilutensilien?
'''
patched = '''
\c[10]Merchant\c[0]: Right now, it's just the perfect place
to do business with travellers.\. How are you
doing?\. Do you need some supplies?
'''

[[dialogue]]
event = 147
page = 1
command = 2
original = '''
\c[10]Händler\c[0]: Ich habe hier Heilessenz im Angebot.\.
Sie heilt doppelt so stark wie Heilsirub und ist 
im Moment ziemlich knapp!
'''
patched = '''
\c[10]Trader\c[0]: I have some heal essence on offer here.\.
It heals twice as much as some heal syrup and
is pretty scarce at the moment!
'''

[[dialogue]]
event = 150
page = 1
command = 2
original = '''
\c[10]Händler\c[0]: Ich habe hier einen wertvolle 
Flügelhelm im Sonderangebot. So günstig werdet 
ihr ihn sonst nirgends ertauschen können!
'''
patched = '''
\c[10]Trader\c[0]: I have a valuable winged helmet on sale
here. Nowhere else will you be able to get it
so cheaply!
'''

[[dialogue]]
event = 154
page = 1
command = 2
original = '''
\c[10]Händlerin\c[0]: Ich habe hier kostbaren Pfeffer im 
Angebot. Interessiert?

'''
patched = '''
\c[10]Trader\c[0]: I have some precious pepper on offer
here. Interested?
'''

[[text]]
event = 130
page = 3
command = 38
has_portrait = true
original = '''Ich nehme die Herausforderung an/Erzähl uns was über Waffen./Nein, jetzt noch nicht...'''
patched = '''I accept your challenge./Tell us about weapons./No, not yet...'''

[[text]]
event = 130
page = 3
command = 39
has_portrait = true
original = '''Ich nehme die Herausforderung an'''
patched = '''I accept your challenge.'''

[[text]]
event = 130
page = 3
command = 60
original = '''Erzähl uns was über Waffen.'''
patched = '''Tell us about weapons.'''

[[text]]
event = 130
page = 3
command = 154
original = '''Nein, jetzt noch nicht...'''
patched = '''No, not yet...'''
