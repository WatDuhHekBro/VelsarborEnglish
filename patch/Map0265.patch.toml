[[dialogue]]
event = 56
page = 2
command = 2
original = '''
\c[10]Wache\c[0]: Es gab tatsächlich Gefangene, die dachten, 
sie könnten sich zusammentun, sich in der Mine 
verschanzen und sich uns widersetzen.\. Nun, die
Vergangenheit hat gezeigt, dass das nicht hinhaut
'''
patched = '''
\c[10]Guard\c[0]: There were prisoners who actually thought
they could team up, stand together in the mine,
and oppose us.\. Well, the past has shown that
it doesn't work too well.
'''

[[dialogue]]
event = 56
page = 2
command = 6
original = '''
\c[10]Wache\c[0]: Im Endeffekt konnte keine Widerstandsgruppe 
standhalten, wenn wir vereint die Mine stürmten, 
um ihre Verschanzung zu brechen. Spitzhacke hält 
nicht gegen Langschwert, Speer und Bogen.
'''
patched = '''
\c[10]Guard\c[0]: Ultimately, no resistance group could stand
up to us if we stormed the mine together to break
their defense. Pickaxes don't hold out against
swords, spears, and bows.
'''

[[dialogue]]
event = 56
page = 2
command = 10
original = '''
\c[10]Wache\c[0]: Aber was red ich mit euch darüber?\. Geht 
sofort zurück zur Arbeit!
'''
patched = '''
\c[10]Guard\c[0]: But why am I even talking to you?\. Get back
to work immediately!
'''
