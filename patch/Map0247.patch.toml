[[dialogue]]
event = 87
page = 2
command = 3
original = '''
\c[10]Wache\c[0]: Hey! Ihr habt Feierabend, also was sucht 
hier noch alleine in der Mine bei all den 
Monstern!\. Wenn ihr zu spät oben ankommt verpasst 
ihr das Essen, wollt ihr das?
'''
patched = '''
\c[10]Guard\c[0]: Hey! You're finished, so what are you still
doing here with all these monsters out and about?\.
You'll miss the food if you arrive back too late,
and you don't want that to happen, right?
'''

[[dialogue]]
event = 87
page = 2
command = 7
original = '''
\c[10]Wache\c[0]: Geht von hier aus nach Süden, um wieder 
zurück zu kommen.
'''
patched = '''
\c[10]Guard\c[0]: Go down from here to get back.
'''

[[dialogue]]
event = 87
page = 2
command = 11
original = '''
\c[10]Wache\c[0]: Wir hatten früher oft Fälle, wo sich 
Minenarbeiter hier in der Nähe der Schienen 
versteckt haben, um sich vor der Arbeit zu 
drücken. 
'''
patched = '''
\c[10]Guard\c[0]: In the past, we often had incidents where
miners hid near the rails to avoid working.
'''

[[dialogue]]
event = 87
page = 2
command = 15
original = '''
\c[10]Wache\c[0]: So ähnlich wie ihr es gerade zu versuchen 
scheint, oder?!\. Zurück mit euch zur 
Erzschürfstelle!
'''
patched = '''
\c[10]Guard\c[0]: Similarly to what you seem to be trying to
do, right?!\. Get back to mining ore over there!
'''
