[[dialogue]]
event = 149
page = 1
command = 1
original = '''
\c[10]Händler\c[0]: Hallo!\. 
Was halten sie hiervon?
'''
patched = '''
\c[10]Trader\c[0]: Hello!\. What do
you think of this?
'''

[[dialogue]]
event = 157
page = 1
command = 2
original = '''
\c[10]Händler\c[0]: Guten Tag der Herr!\.
Sind sie auf der Suche nach edlen Blauperlen, 
sind sie hier richtig!
'''
patched = '''
\c[10]Trader\c[0]: Good day, sir!\. If you're
looking for some fine blue pearls,
then this is the place for you!
'''

[[dialogue]]
event = 158
page = 1
command = 2
original = '''
\c[10]Händler\c[0]: Schauen Sie sich dieses 
Prachtexemplar von Silberring an!\.
Dieses Angebot dürfen Sie sich nicht entgehen 
lassen!
'''
patched = '''
\c[10]Trader\c[0]: Feast your eyes on these
magnificent silver rings!\. Don't
miss out on this offer!
'''

[[dialogue]]
event = 159
page = 1
command = 2
original = '''
\c[10]Händlerin\c[0]: Diese Lokri-Knollen machen jedes 
Gericht zu einem Genuss.
'''
patched = '''
\c[10]Trader\c[0]: These Lokri potatoes make
every meal a delicious one.
'''

[[dialogue]]
event = 160
page = 2
command = 2
original = '''
\c[10]Mann\c[0]: Seid ihr schon in der Post-Versand-Stelle 
hier in der Nähe gewesen? 
'''
patched = '''
\c[10]Man\c[0]: Have you been to the post office around here?
'''

[[dialogue]]
event = 160
page = 2
command = 4
original = '''
\c[10]Mann\c[0]: Möchte man Briefe oder dergleichen 
versenden, genügt es, wenn man sie in die 
grünen Briefkästen am Eingang der Stadt 
steckt.
'''
patched = '''
\c[10]Man\c[0]: If you want to send letters, you just have
to put them in the green mailboxes at the
entrance to this city.
'''

[[dialogue]]
event = 160
page = 2
command = 8
original = '''
\c[10]Mann\c[0]: Aber wenn es um ein Paket geht, dann 
muss man zur Post-Versand-Stelle, um es dort 
abzugeben.\. Außerdem sind dann recht hohe 
Gebühren fällig.
'''
patched = '''
\c[10]Man\c[0]: But if you want to send a package instead,
you have to go to the post office and drop it
off there.\. In addition, the fees are quite high.
'''

[[dialogue]]
event = 160
page = 2
command = 12
original = '''
\c[10]Mann\c[0]: Nun ja, die Arbeit, die die Post-Versender 
täglich leisten, ist ja auch ziemlich hart.\. So was 
muss auch entlohnt werden.
'''
patched = '''
\c[10]Man\c[0]: Well, the work that the couriers do every day
is also pretty hard.\. Something like that has to be
paid for.
'''

[[dialogue]]
event = 165
page = 2
command = 3
original = '''
\c[10]Alter Mann\c[0]: Dieser Teil der Stadt\. ist ja noch 
relativ ruhig. Aber im nördlichen Teil,\. da halte 
ich mich bei meinem Alter nicht mehr auf.\. Da ist 
mir viel zu viel los.\. Viel zu laut ist es dort...
'''
patched = '''
\c[10]Old Man\c[0]: This part of the city\. is still
pretty quiet. But in the northern area,\.
I can't keep up at my age.\. There is far too much\.
going on for me.\. It's too loud there...
'''

[[dialogue]]
event = 167
page = 1
command = 2
original = '''
\c[10]Frau\c[0]: Diese Silberringe sehen wirklich toll aus...
'''
patched = '''
\c[10]Woman\c[0]: These silver rings look really pretty...
'''

[[dialogue]]
event = 168
page = 1
command = 2
original = '''
\c[10]Junge\c[0]: Psst...\. bitte sagt niemanden, dass ich 
mich hier verstecke, ja? 
'''
patched = '''
\c[10]Boy\c[0]: Psst...\. please don't tell anyone I'm
hiding here, okay?
'''

[[dialogue]]
event = 169
page = 2
command = 2
original = '''
\c[10]Junges Mädchen\c[0]: Uchikos sind so~ süß!\. Habt 
ihr sie auch schon bei der Post-Stelle gesehen?\. 
Ich wünschte, ich hätte selber eines.
'''
patched = '''
\c[10]Girl\c[0]: Uchikos are sooo cute!\. Have you
seen them at the post office?\.
I wish I had one myself.
'''
