[[dialogue]]
event = 29
page = 2
command = 21
original = '''
\c[10]Händler:\c[0] Guten Tag, meine Herren.\.
Sind Sie vielleicht an ein paar Rieseneiern
interessiert?
'''
patched = '''
\c[10]Merchant:\c[0] Good afternoon, gentlemen.\.
May I interest you in some giant eggs?
'''

[[dialogue]]
event = 29
page = 2
command = 28
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]:\c[0] Rieseneier?\. Von welchem Tier 
sind denn die?
'''
patched = '''
\c[1]\n[1]:\c[0] Giant eggs?\. What animal are
they from?
'''

[[dialogue]]
event = 29
page = 2
command = 31
original = '''
\c[10]Händler:\c[0] Es sind Eier von großen Raubvögeln 
aus dem Gebirge.
'''
patched = '''
\c[10]Merchant:\c[0] They're from large, mountainous
birds of prey.
'''

[[dialogue]]
event = 29
page = 2
command = 35
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]:\c[0] Hui! Die Dinger sind ja 
wirklich riesig.\. Das würd' sicherlich 
ein großartiges Omelett geben!
'''
patched = '''
\c[2]\n[2]:\c[0] Whoa! These things are
really huge.\. This'll make for
a great omelette!
'''

[[dialogue]]
event = 29
page = 2
command = 40
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]:\c[0] Ein Omelett?\. Woran du wieder 
gleich denkst, Cibon...
'''
patched = '''
\c[1]\n[1]:\c[0] An omelette?\. What are you
thinking about this time, Cibon...
'''

[[dialogue]]
event = 29
page = 2
command = 44
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]:\c[0] Was sollt' man damit denn 
sonst anfangen?\. Und ich hab wirklich 
Hunger, du etwa nicht?
'''
patched = '''
\c[2]\n[2]:\c[0] What else should you
do with it?\. And I'm really hungry,
aren't you?
'''

[[dialogue]]
event = 29
page = 2
command = 48
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]:\c[0] Doch\. schon\s[7]...\.\^
'''
patched = '''
\c[1]\n[1]:\c[0] Well\. yeah\s[7]...\.\^
'''

[[dialogue]]
event = 29
page = 2
command = 51
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]:\c[0] Na bitte!\. Wo liegt dann das 
Problem?\. ...\. 
Wie viel kostet ein Ei denn so?
'''
patched = '''
\c[2]\n[2]:\c[0] See?\. Then what's the big
problem?\. How much does one
of them cost?
'''

[[dialogue]]
event = 29
page = 2
command = 64
character = '''Fejar'''
original = '''
\c[10]Händler:\c[0] Ein Ei kostet \v[328] \n[19].
'''
patched = '''
\c[10]Merchant:\c[0] An egg costs \v[328] \n[19].
'''

[[dialogue]]
event = 29
page = 2
command = 67
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]:\c[0] Na gut... dann nehmen wir 
eines.
'''
patched = '''
\c[1]\n[1]:\c[0] Well... we'll take one.
'''

[[dialogue]]
event = 29
page = 2
command = 70
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]:\c[0] Wir nehmen 3!
'''
patched = '''
\c[2]\n[2]:\c[0] We take three!
'''

[[dialogue]]
event = 29
page = 2
command = 74
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]:\c[0] Wa..?
'''
patched = '''
\c[1]\n[1]:\c[0] Wh...
'''

[[dialogue]]
event = 29
page = 2
command = 77
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]:\c[0] Denk' an das Omelett, 
Kumpel!
'''
patched = '''
\c[2]\n[2]:\c[0] Think of the omelet,
Kento!
'''

[[dialogue]]
event = 29
page = 2
command = 85
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]:\c[0] Na schön,\. dann halt 3.
'''
patched = '''
\c[1]\n[1]:\c[0] Okay,\. then we'll take three.
'''

[[dialogue]]
event = 29
page = 2
command = 88
character = '''Fejar'''
original = '''
\c[10]Händler:\c[0] \$Okay.. 3 Eier.\. 
Das macht dann \v[328] \n[19].
'''
patched = '''
\c[10]Merchant:\c[0] \$Okay.. three eggs.\.
This comes to \v[328] \n[19].
'''

[[dialogue]]
event = 29
page = 2
command = 104
original = '''
\c[10]Händler:\c[0] Vielen Dank für Ihren Kauf. Einen 
guten Appetit wünsche ich Ihnen dann 
noch.
'''
patched = '''
\c[10]Merchant:\c[0] Thank you for your purchase.
Enjoy your meal.
'''

[[dialogue]]
event = 29
page = 2
command = 117
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]:\c[0] Wir braten uns das Omelett 
dann in Nomerea, in Ordnung?
'''
patched = '''
\c[1]\n[1]:\c[0] We'll fry the omelet
in Nomerea, okay?
'''

[[dialogue]]
event = 29
page = 2
command = 120
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]:\c[0] Joa. Dann lass uns mal schnell 
weitergehen. Ich verhungere!
'''
patched = '''
\c[2]\n[2]:\c[0] Yeah. So let's move on quickly.
I'm starving!
'''
