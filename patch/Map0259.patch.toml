[[dialogue]]
event = 19
page = 1
command = 2
original = '''
\c[10]Gefangener\c[0]: Hacken...\. und hacken...\. und noch mal 
hacken...\. und wieder hacken...
'''
patched = '''
\c[10]Prisoner\c[0]: Swing...\. swing...\. and swing...\.
and swing again...
'''

[[dialogue]]
event = 19
page = 1
command = 7
has_portrait = true
character = '''Felcis'''
original = '''
\c[5]\n[5]\c[0]: Ich glaube, zusammengefasst 
nennt man das "Erzschürfen".
'''
patched = '''
\c[5]\n[5]\c[0]: To summarize, I believe it's
called "ore mining".
'''

[[dialogue]]
event = 19
page = 1
command = 10
original = '''
\c[10]Gefangener\c[0]: Hey,\. dich hat niemand gefragt!
'''
patched = '''
\c[10]Prisoner\c[0]: Hey,\. nobody asked you!
'''

[[dialogue]]
event = 20
page = 1
command = 2
original = '''
\c[10]Gefangener\c[0]: Wenn du dir wirklich Mühe geben 
willst, sollteste versuchen, in die hinteren 
Bereiche der Mine zu gelangen. 
'''
patched = '''
\c[10]Prisoner\c[0]: If you actually want to put effort into
this ore mining thing, try to get to the back of
the mine.
'''

[[dialogue]]
event = 20
page = 1
command = 5
original = '''
\c[10]Gefangener\c[0]: Dort findest'e dann reichere Erz-
Vorkommen...\. neben mehr Monstern,\. Schluchten und 
anderen Gefahren.
'''
patched = '''
\c[10]Prisoner\c[0]: There, you'll find richer ore
deposits...\. along with more monsters,
ravines, and other dangers.
'''

[[dialogue]]
event = 21
page = 1
command = 3
original = '''
\c[10]Gefangene\c[0]: ...\. bitte nicht jetzt...
'''
patched = '''
\c[10]Prisoner\c[0]: ...not now please...
'''

[[dialogue]]
event = 22
page = 1
command = 3
has_portrait = true
character = '''Kento'''
original = '''
(\c[1]\n[1]\c[0]: An der Stelle arbeitet 
bereits jemand. Es würde nur stören, 
wenn wir hier mithelfen.)
'''
patched = '''
(\c[1]\n[1]\c[0]: Looks like someone's already
working here. We'd only be disturbing
them if we tried to help out.)
'''

[[dialogue]]
event = 53
page = 1
command = 3
original = '''
\c[10]Wache\c[0]: Na, wie war die Lorenfahrt?\. Jetzt aber auf 
zur Arbeit!
'''
patched = '''
\c[10]Guard\c[0]: How was it travelling through the railways?\.
Now get to work!
'''

[[dialogue]]
event = 53
page = 1
command = 7
original = '''
\c[10]Wache\c[0]: Was habt ihr hier zu suchen? Ihr sollt Erz 
schürfen, also los, los!
'''
patched = '''
\c[10]Guard\c[0]: What are you doing here? You should be
mining ore, so move it already!
'''

[[dialogue]]
event = 54
page = 1
command = 2
original = '''
\c[10]Wache\c[0]: Wenn ihr zu einem anderen Bereich wollt, 
müsst ihr zu Fuß latschen.\. Aber passt auf, die 
Lorenbahn-Strecke ist nicht sonderlich sicher zu 
Fuß, wegen den Biestern, ihr wisst schon.
'''
patched = '''
\c[10]Guard\c[0]: If you want to go to another area, you'll
have to walk on foot.\. But be careful, the railways
aren't particularly safe on foot, because of the
monsters, you know.
'''

[[dialogue]]
event = 55
page = 1
command = 2
original = '''
\c[10]Wache\c[0]: Wenn ihr Konfrontationen mit den Biestern 
dieser Höhle vermeiden wollt, solltet ihr euch 
nicht zu weit von den anderen Minenarbeitern 
entfernen.
'''
patched = '''
\c[10]Guard\c[0]: If you want to avoid confrontation with the
monsters in this cave, don't get too far away from
the other miners.
'''

[[dialogue]]
event = 56
page = 1
command = 11
original = '''

Dies ist ein \c[11]Speicherpunkt\c[0].
'''
patched = '''

This is a \c[11]save point\c[0].
'''

[[dialogue]]
event = 56
page = 1
command = 13
original = '''

Wenn man auf solch einen steht, kann man \c[11]den
Spielstand speichern\c[0].
'''
patched = '''

When you stand on one of these, you can
\c[11]save the game\c[0].
'''

[[dialogue]]
event = 56
page = 1
command = 16
original = '''

Öffne dazu das \c[11]Menu\c[0] mit \c[11]Esc\c[0] und wähle
dann \c[11]Speichern\c[0].
'''
patched = '''

To do this, open the \c[11]menu\c[0] using \c[11]Esc\c[0] and
then select \c[11]Save\c[0].
'''

[[dialogue]]
event = 56
page = 1
command = 19
original = '''

Auf der \c[11]Weltkarte\c[0] kann man übigens
immer speichern.
'''
patched = '''

Additionally, you can always save on
the \c[11]world map\c[0].
'''

