[[dialogue]]
event = 3
page = 2
command = 23
original = '''
\c[10]Soldat\c[0]: Noch alles da, anscheinend ist er 
tatsächlich ohne Ausrüstung in den Wald geflohen.
'''
patched = '''
\c[10]Soldier\c[0]: Everything's still there, looks like he
actually fled into the forest without grabbing
any equipment.
'''

[[dialogue]]
event = 3
page = 2
command = 28
has_portrait = true
original = '''
\c[10]Rothaariger Soldat\c[0]: Hm, der Typ muss 
ganz schön was von sich halten, wenn 
er denkt, dass er es ohne Ausrüstung 
lebend davon schafft.
'''
patched = '''
\c[10]Red-Haired Soldier\c[0]: Hm, the guy must
be insane if he thinks he can make
it out alive without any equipment.
'''

[[dialogue]]
event = 3
page = 2
command = 33
original = '''
\c[10]Soldat\c[0]: So würde ich das jetzt direkt nicht 
sehen.\. Ich denke mehr es ist das Risiko, an die 
Ausrüstung überhaupt erst ran zu kommen.
'''
patched = '''
\c[10]Soldier\c[0]: Well, I wouldn't see it as a waste of
time.\. I think it was more about the risk of
him getting the equipment in the first place.
'''

[[dialogue]]
event = 3
page = 2
command = 40
has_portrait = true
original = '''
\c[10]Rothaariger Soldat\c[0]: Wie auch immer. \.
Tu mir den Gefallen und bring den 
Lagerschlüssel zurück in das 
Schlafquartier.
'''
patched = '''
\c[10]Red-Haired Soldier\c[0]: Anyways,\. do me
a favor and bring the storage key
back to the sleeping quarters.
'''

[[dialogue]]
event = 3
page = 2
command = 44
has_portrait = true
original = '''
\c[10]Rothaariger Soldat\c[0]: Ich mach mich 
auf die Suche nach diesem 
Flüchtling!
'''
patched = '''
\c[10]Red-Haired Soldier\c[0]: I'll be looking
for this escapee!
'''

[[dialogue]]
event = 3
page = 2
command = 49
original = '''
\c[10]Soldat\c[0]: Man hat uns nicht befehligt nach ihm zu 
suchen...
'''
patched = '''
\c[10]Soldier\c[0]: We weren't ordered to look for him...
'''

[[dialogue]]
event = 3
page = 2
command = 53
has_portrait = true
original = '''
\c[10]Rothaariger Soldat\c[0]: Tsk, was tut das 
schon zur Sache?\. Womit soll ich denn 
sonst meine Zeit verschwenden? 
'''
patched = '''
\c[10]Red-Haired Soldier\c[0]: Tsk, does that
matter?\. How else am I gonna pass
the time?
'''

[[dialogue]]
event = 3
page = 2
command = 56
has_portrait = true
original = '''
\c[10]Rothaariger Soldat\c[0]: Außerdem haben 
sie mich schon beim Hinterhalt 
zurückgelassen!\. So etwas lass ich 
kein zweites mal zu...
'''
patched = '''
\c[10]Red-Haired Soldier\c[0]: They also left me
behind in the ambush!\. I won't allow
that a second time...
'''

[[dialogue]]
event = 3
page = 2
command = 60
has_portrait = true
original = '''
\c[10]Rothaariger Soldat\c[0]: Ich bin dann 
weg.\. Denk an den Schlüssel!
'''
patched = '''
\c[10]Red-Haired Soldier\c[0]: I'll be gone
then.\. Don't forget about the key!
'''

[[dialogue]]
event = 3
page = 2
command = 73
has_portrait = true
character = '''Kento'''
original = '''
(\c[1]\n[1]\c[0]: ...\. Jetzt muss ich an den 
Schlüssel für den Lagerraum 
rankommen...)
'''
patched = '''
(\c[1]\n[1]\c[0]: Now I have to get the key for
the storage room...)
'''

[[dialogue]]
event = 3
page = 2
command = 77
has_portrait = true
character = '''Kento'''
original = '''
(\c[1]\n[1]\c[0]: Der eine Soldat hat ihn in 
das Schlafquartier gebracht...\. Das 
kann ja heiter werden.)
'''
patched = '''
(\c[1]\n[1]\c[0]: One soldier brought it with
him to the sleeping quarters...\.
That'll be fun.)
'''

[[dialogue]]
event = 14
page = 3
command = 11
has_portrait = true
character = '''Kento'''
original = '''
(\c[1]\n[1]\c[0]: Der Schlüssel passt!)
'''
patched = '''
(\c[1]\n[1]\c[0]: The key fits!)
'''

[[dialogue]]
event = 14
page = 3
command = 90
has_portrait = true
character = '''Kento'''
original = '''
(\c[1]\n[1]\c[0]: Abgeschlossen)
'''
patched = '''
(\c[1]\n[1]\c[0]: Done.)
'''

[[dialogue]]
event = 26
page = 3
command = 6
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Ich sollte besser hier unten 
bleiben, oben dürften mehr 
Patrouillen sein.
'''
patched = '''
\c[1]\n[1]\c[0]: I better stay down here, there
could be more guards up ahead.
'''
