[[dialogue]]
event = 12
page = 2
command = 2
original = '''
\c[10]Köchin\c[0]: Es ist noch genug zu Essen da.\. Bedienen 
Sie sich.\. Wenn Sie einen speziellen Wunsch 
haben, sagen Sie mir Bescheid.
'''
patched = '''
\c[10]Cook\c[0]: There's still enough food for everyone.\.
Help yourself.\. If you have a special request,
please let me know.
'''

[[dialogue]]
event = 12
page = 2
command = 5
original = '''
\c[10]Köchin\c[0]: Bier ist allerdings derzeit alle...
'''
patched = '''
\c[10]Cook\c[0]: However, the beer is currently all gone...
'''

[[dialogue]]
event = 25
page = 2
command = 17
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Morgen Kumpel.\. Haste also 
doch wieder so lang geschlafen?
'''
patched = '''
\c[2]\n[2]\c[0]: Mornin'.\. You slept
so long again?
'''

[[dialogue]]
event = 25
page = 2
command = 20
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Ja...\. und jetzt verhungere ich 
fast.
'''
patched = '''
\c[1]\n[1]\c[0]: Yeah...\. and now I'm almost
starving.
'''

[[dialogue]]
event = 25
page = 2
command = 23
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Dacht' ich mir schon.\. Mir 
ging's genauso.\. Ich hab schon etwas 
für dich bestellt, nur leider hast 
du länger geschlafen als ich dachte.
'''
patched = '''
\c[2]\n[2]\c[0]: I thought so.\. I felt the same
way.\. I've already ordered something
for you, but unfortunately, you
slept longer than I expected.
'''

[[dialogue]]
event = 25
page = 2
command = 28
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Deswegen steht das Zeug hier 
schon ne ganze Weile und ist schon 
kalt geworden...
'''
patched = '''
\c[2]\n[2]\c[0]: That's why the stuff has been
here for quite a while and has gotten
cold...
'''

[[dialogue]]
event = 25
page = 2
command = 32
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Egal,\. Hauptsache es ist was zu 
Essen.
'''
patched = '''
\c[1]\n[1]\c[0]: No problem,\. as long as there's
something to eat.
'''

[[dialogue]]
event = 25
page = 2
command = 42
original = '''
\c[10]Soldat vom Briganten-Orden\c[0]: Kento, Cibon?\.
Sir Vorento fragt nach euch.\. 
Ihr sollt bitte sofort zu ihm kommen.\. 
Er wartet wieder im 1. Lehrraum.\.
'''
patched = '''
\c[10]Brigantian Soldier\c[0]: Kento, Cibon?\.
Sir Vorento requests you.\.
You should come to him immediately.\.
He is waiting in the 1st classroom again.\.
'''

[[dialogue]]
event = 25
page = 2
command = 46
original = '''
\c[10]Soldat vom Briganten-Orden\c[0]: Ihr solltet eure 
Mahlzeit lieber auf später verschieben...\.
Ich geh dann wieder.
'''
patched = '''
\c[10]Brigantian Soldier\c[0]: You should postpone your
meal until later...\. Well,\. I'm off again.
'''

