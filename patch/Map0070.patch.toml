[[dialogue]]
event = 5
page = 1
command = 2
original = '''
\c[10]Soldat vom Briganten-Orden\c[0]: *mampf*\. Diescher 
Nudelschalat ischt vortrefflisch!\. Wirklisch.
'''
patched = '''
\c[10]Brigantian Soldier\c[0]: *nom*\. This pasta salad
is delicious!
'''

[[dialogue]]
event = 5
page = 1
command = 7
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Öhm, ich möchte dich ja 
ungern beim Essen stören\., aber 
hattest du nicht zu diesem Zeitpunkt 
ein Treffen?
'''
patched = '''
\c[1]\n[1]\c[0]: Um, I don't mean to disturb
you from your meal,\. but don't you
have a meeting right about now?
'''

[[dialogue]]
event = 5
page = 1
command = 13
original = '''
\c[10]Soldat vom Briganten-Orden\c[0]: Oh ja, schtimmt...\.
Moment...\. OH! ischt es schon so schpät?\.
*schluck*\. Ohje, ich komme zu spät!
'''
patched = '''
\c[10]Brigantian Soldier\c[0]: Oh yeah, that's right...\.
Wait...\. OH! Is it already so late?\.
*swallow*\. Oh no, I'm late!
'''

[[dialogue]]
event = 6
page = 1
command = 3
original = '''
\c[10]Soldat vom Briganten-Orden\c[0]: Hey!\. Wann 
kommt endlich mein Nachschub?
'''
patched = '''
\c[10]Brigantian Soldier\c[0]: Hey!\. When will my
order finally get here?
'''

[[dialogue]]
event = 7
page = 1
command = 2
original = '''
\c[10]Soldat vom Briganten-Orden\c[0]: Hm?\. Stör mich 
nicht beim Essen...
'''
patched = '''
\c[10]Brigantian Soldier\c[0]: Hm?\. Don't bother me
while I'm eating...
'''

[[dialogue]]
event = 8
page = 1
command = 2
original = '''
\c[10]Soldat vom Briganten-Orden\c[0]: Hm...\. ob es heute 
etwas Besonderes zum Nachtisch gibt?
'''
patched = '''
\c[10]Brigantian Soldier\c[0]: Hm...\. I wonder if there's
anything special for dessert today?
'''

[[dialogue]]
event = 9
page = 1
command = 2
original = '''
\c[10]Soldat vom Briganten-Orden\c[0]: Kein Bier...\. Wieso 
gibt es hier kein Bier zu trinken?\. Args!
'''
patched = '''
\c[10]Brigantian Soldier\c[0]: No beer...\. Why is there no
beer to drink here?\. Argh!
'''

[[dialogue]]
event = 9
page = 1
command = 7
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Bier macht träge, wenn man 
es zu oft trinkt.
'''
patched = '''
\c[1]\n[1]\c[0]: Beer makes you sluggish if
you drink it too often.
'''

[[dialogue]]
event = 9
page = 1
command = 10
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Hör nicht auf ihn, er hat keine 
Ahnung, wie es ist, ein kühles, 
frisches Bier zu trinken.
'''
patched = '''
\c[2]\n[2]\c[0]: Don't listen to him, he has
no idea what it's like to drink
a cool, fresh beer.
'''

[[dialogue]]
event = 9
page = 1
command = 14
has_portrait = true
character = '''Cibon'''
original = '''
\c[2]\n[2]\c[0]: Außerdem ist das Bier hier 
nur vorübergehend alle.
'''
patched = '''
\c[2]\n[2]\c[0]: Besides, the beer is only
temporarily gone here.
'''

[[dialogue]]
event = 10
page = 1
command = 2
original = '''
\c[10]Soldat vom Briganten-Orden\c[0]: In letzter Zeit 
haben manche Soldaten immer öfter Essens-
wünsche an die Köche, die dann sogar erfüllt 
werden.
'''
patched = '''
\c[10]Brigantian Soldier\c[0]: Recently, some soldiers have
made more and more requests to the cooks,
which are somehow fulfilled.
'''

[[dialogue]]
event = 10
page = 1
command = 6
original = '''
\c[10]Soldat vom Briganten-Orden\c[0]: Und es werden 
immer mehr hier, die ihren speziellen Wunsch 
als Mahlzeit haben wollen.\. Das halten die Köche 
sicher nicht mehr lange aus. 
'''
patched = '''
\c[10]Brigantian Soldier\c[0]: And there are more and more
people here who want their special request
fulfilled.\. The cooks definitely won't be
able to keep up with this for much longer.
'''

[[dialogue]]
event = 10
page = 3
command = 2
original = '''
\c[10]Soldat vom Briganten-Orden\c[0]: In letzter Zeit 
haben manche Soldaten immer öfter Essens-
