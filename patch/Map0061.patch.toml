'''
patched = '''
\c[10]Brigantian Soldier\c[0]: Ah! Please don't tell
anyone that I'm hiding here!\. I've had
enough of this training...
'''

[[dialogue]]
event = 95
page = 1
command = 9
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Ich soll dir Bescheid sagen, 
