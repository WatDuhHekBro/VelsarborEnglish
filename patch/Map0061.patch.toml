'''
patched = '''
\c[10]Brigantian Soldier\c[0]: Um, I watch the others
training to see what I could do better.
'''

[[dialogue]]
event = 96
page = 1
command = 11
has_portrait = true
character = '''Kento'''
original = '''
\c[1]\n[1]\c[0]: Hm, vom reinen Zusehen wird 
