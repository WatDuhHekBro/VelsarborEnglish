'''
patched = '''
\c[1]\n[1]\c[0]: Say... Why are you standing
here alone in the yard?
'''

[[dialogue]]
event = 96
page = 1
command = 6
original = '''
\c[10]Soldat vom Briganten-Orden\c[0]: Öhm, ich schaue 
