'''
patched = '''
\c[10]Brigantian Soldier\c[0]: Always with these
monotonous training sessions. You'd go
crazy just by watching them.
'''

[[dialogue]]
event = 95
page = 1
command = 3
original = '''
\c[10]Soldat vom Briganten-Orden\c[0]: Ah! Sag bitte 
niemandem, dass ich mich hier verstecke!\. Ich 
