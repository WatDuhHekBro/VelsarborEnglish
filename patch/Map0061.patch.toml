Schloss auf dich wartet.
'''
patched = '''
\c[1]\n[1]\c[0]: I should let you know that
someone's waiting for you in the
entrance hall of the castle.
'''

[[dialogue]]
event = 95
page = 1
command = 13
original = '''
\c[10]Soldat vom Briganten-Orden\c[0]: Wie?\. Wer wartet 
