<!DOCTYPE html>
<html>
	<head>
		<title>Velsarbor Text Generator</title>
		<link rel="icon" type="image/png" href="icon.png" sizes="48x48">
		<meta charset="utf-8">
		<script src="canvas.js" defer></script>
		<link rel="stylesheet" type="text/css" href="style.css">
	</head>
	<body>
		<h1>Graphical Text Generator</h1>
		<div><canvas id="canvas" width="750" height="500" style="border: black 1px solid"></canvas></div>
		<div><textarea id="text" rows="10" cols="50"></textarea></div>
		<div><button onclick="generateText()">Generate Text</button></div>
	</body>
</html>
